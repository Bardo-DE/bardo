# Exports beyond the ones pack.sh derives from the staged tree (everything under share/wayland-sessions,
# share/xdg-desktop-portal, share/dbus-1/services, lib/systemd/user, share/applications and
# share/polkit-1/actions maps to the same path under /usr). A link may only go under one of those
# directories or /usr/local/bin; the target is a path relative to /opt/bardo/current and must be in the bundle.
# Commands a person or a unit starts by name.

[[export]]
link = "/usr/local/bin/bardo-compositor"
target = "bin/bardo-compositor"

[[export]]
link = "/usr/local/bin/bardo-compositorctl"
target = "bin/bardo-compositorctl"

[[export]]
link = "/usr/local/bin/bardo-shell"
target = "bin/bardo-shell"

[[export]]
link = "/usr/local/bin/bardo-session"
target = "bin/bardo-session"

[[export]]
link = "/usr/local/bin/bardo-settings"
target = "bin/bardo-settings"

[[export]]
link = "/usr/local/bin/bardo-key-remap"
target = "bin/bardo-key-remap"

# The input service's unit starts this link (bardo-input-broker.service: ExecStart=/usr/local/bin/bardo-input-broker).
[[export]]
link = "/usr/local/bin/bardo-input-broker"
target = "bin/bardo-input-broker"

[[export]]
link = "/usr/local/bin/bardo-mouse-gestures"
target = "bin/bardo-mouse-gestures"

[[export]]
link = "/usr/local/bin/anyview"
target = "bin/anyview"

[[export]]
link = "/usr/local/bin/mailo"
target = "bin/mailo"

[[export]]
link = "/usr/local/bin/bardo-files"
target = "bin/bardo-files"

[[export]]
link = "/usr/local/bin/bardo-updater"
target = "bin/bardo-updater"

[[export]]
link = "/usr/local/bin/xwayland-satellite"
target = "bin/xwayland-satellite"
