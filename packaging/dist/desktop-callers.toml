[[peer]]
app  = "org.bardo.Updates"
unit = "bardo-updater.service"
exe  = [
  "/opt/bardo/releases/*/bin/bardo-updater",
  "/opt/bardo/current/bin/bardo-updater",
  "/usr/local/bin/bardo-updater",
  "/usr/bin/bardo-updater",
]
role = "updater"

# The bardo-updater command line. A program: it has no unit, so its ceiling is Exe.
[[peer]]
app  = "org.bardo.Updater"
exe  = [
  "/opt/bardo/releases/*/bin/bardo-updater",
  "/opt/bardo/current/bin/bardo-updater",
  "/usr/local/bin/bardo-updater",
  "/usr/bin/bardo-updater",
]
role = "updater_cli"

