# The desktop's own processes: which program is which, and the role it plays.
#
# Installed root-owned as /etc/bardo/desktop-callers.toml (root:root 0644, in a root-owned folder) by the
# desktop's installer and by every release (a system file bardo-updater places). An administrator or a developer
# adds rows in /etc/bardo/desktop-callers.d/*.toml; nobody's own folder is read. Without this file the update
# service, the portal backend and the input service refuse every caller.
#
# A row with a `unit` is a service: the process must sit in that unit's cgroup and run one of the `exe`
# images (root-owned all the way up). A consumer that asks for `Full` also needs the unit manager to confirm
# the unit, and that its ExecStart is one of the `exe` paths, which is why most lists hold four places:
#   /opt/bardo/releases/*/...   where a release puts the program (the image a running process shows)
#   /opt/bardo/current/...      the name the release's units start (a link to the release in use)
#   /usr/local/...              a build from source with the default prefix, and the release's export links
#   /usr/...                    a distribution's package
# A unit named here must be a plain root-owned file (and any drop-in too): the unit manager's judge reads a symlink, whose mode
# is 0777, as a file anyone could change, and such a unit never proves `Full`. A release therefore places these units as system
# files (release/build.sh `plain_units`) and install/install.sh copies them to /etc/systemd/user; the system units
# (bardo-mouse-gestures, bardo-key-remap, bardo-input-broker) are copied to /usr/lib/systemd/system.
# A row with no `unit` is a program known by its image alone; its ceiling is `Exe`. Only `settings` (a second
# row, for Settings started by a launcher), `updater_cli`, `sandbox_launcher` and `manager` have such a row.
# `exe` is required, every path is absolute, and a `*` stands for any run of characters inside one path segment.
#
# Role names are constants in the crate of the service that owns each role (the `roles` modules named in
# crates/identity/ARCHITECTURE.md, and `caller-roles`); a test in each checks that its constants have a row in
# this file. A test in caller-identity-core (tests/it/desktop_files.rs) checks this table
# against the unit files. One row per role is the rule; `settings` has two on purpose.

# The shell: draws the desktop and asks the person on behalf of other programs.
[[peer]]
app  = "org.bardo.Shell"
unit = "bardo-shell.service"
exe  = [
  "/opt/bardo/releases/*/bin/bardo-shell",
  "/opt/bardo/current/bin/bardo-shell",
  "/usr/local/bin/bardo-shell",
  "/usr/bin/bardo-shell",
]
role = "shell"

# The portal backend: asks the shell, is handed an input socket, captures the screen. The release puts it in
# libexec; a build from source with the default prefix puts it in /usr/local/libexec.
[[peer]]
app  = "org.bardo.Portal"
unit = "bardo-portal.service"
exe  = [
  "/opt/bardo/releases/*/libexec/bardo/bardo-portal",
  "/opt/bardo/current/libexec/bardo/bardo-portal",
  "/usr/local/libexec/bardo/bardo-portal",
  "/usr/libexec/bardo/bardo-portal",
]
role = "portal"

# The portal frontend, the only caller of the backend. Its path differs by distribution: Ubuntu and Fedora
# /usr/libexec, Arch /usr/lib (not checked on each; see FINDINGS).
[[peer]]
app  = "org.freedesktop.portal.Desktop"
unit = "xdg-desktop-portal.service"
exe  = [
  "/usr/libexec/xdg-desktop-portal",
  "/usr/lib/xdg-desktop-portal",
]
role = "portal_frontend"

# The compositor.
[[peer]]
app  = "org.bardo.Compositor"
unit = "bardo-compositor.service"
exe  = [
  "/opt/bardo/releases/*/bin/bardo-compositor",
  "/opt/bardo/current/bin/bardo-compositor",
  "/usr/local/bin/bardo-compositor",
  "/usr/bin/bardo-compositor",
]
role = "compositor"

# The agent tier.
[[peer]]
app  = "org.bardo.Agent"
unit = "bardo-computer-use.service"
exe  = [
  "/opt/bardo/releases/*/libexec/bardo/bardo-computer-use",
  "/opt/bardo/current/libexec/bardo/bardo-computer-use",
  "/usr/local/libexec/bardo/bardo-computer-use",
  "/usr/libexec/bardo/bardo-computer-use",
]
role = "agent_tier"

# The Settings app, as the update service sees it. Started by D-Bus activation as org.bardo.Settings.service...
[[peer]]
app  = "org.bardo.Settings"
unit = "org.bardo.Settings.service"
exe  = [
  "/opt/bardo/releases/*/bin/bardo-settings",
  "/opt/bardo/current/bin/bardo-settings",
  "/usr/local/bin/bardo-settings",
  "/usr/bin/bardo-settings",
]
role = "settings"

# ...and also by a launcher, outside any unit of ours, so there is a second row with no unit: the program is
# known by its image alone (the update service asks for Settings at that level, never more).
[[peer]]
app  = "org.bardo.Settings"
exe  = [
  "/opt/bardo/releases/*/bin/bardo-settings",
  "/opt/bardo/current/bin/bardo-settings",
  "/usr/local/bin/bardo-settings",
  "/usr/bin/bardo-settings",
]
role = "settings"

