# xdg-desktop-portal's per-desktop choice for XDG_CURRENT_DESKTOP=bardo (read as
# <desktop>-portals.conf from $XDG_DATA_DIRS/xdg-desktop-portal/). transom (the `quire` portal
# implementation, transom/dist/bardo.portal) answers screen sharing, screenshots, remote desktop,
# settings, the keep-awake inhibit and the Access question screenshots ask first; it has no file chooser, so the GTK implementation keeps that and
# anything else transom does not serve (the default line is tried in order).
# The explicit lines repeat the interfaces transom lists in its portal file; scenarios/portal-bardo.sh
# checks the two agree.
[preferred]
default=bardo;gtk
org.freedesktop.impl.portal.ScreenCast=bardo
org.freedesktop.impl.portal.Screenshot=bardo
org.freedesktop.impl.portal.RemoteDesktop=bardo
org.freedesktop.impl.portal.Settings=bardo
org.freedesktop.impl.portal.Inhibit=bardo
# Screenshot and colour picking ask Access first; without an Access backend the frontend does not offer them.
org.freedesktop.impl.portal.Access=bardo
org.freedesktop.impl.portal.FileChooser=gtk
