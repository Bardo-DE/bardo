# Tiers: P pure (no I/O, no clock, no runtime, no UI words), C client/IO (no UI words), A app/daemon (wiring only).
# A crate depends on its own tier or a lower one, never up. The old table also held the excluded
# speech-host-sherpa (A), which is not a workspace member.

[[tiers]]
name = "models"
tiers = [
  ["computer-use-action", "model-vision-prep", "computer-use-parse", "computer-use-vendors", "computer-use-session", "model-genai-names", "model-provider", "model-extract", "model-catalog", "engine-supervisor", "model-wire", "model-openai-compat", "model-replay", "speech-provider", "speech-vad", "model-http", "engine-spec", "engine-manifest"],
  ["speech-host-client", "speech-host", "engine-probe", "engine-install"],
  ["computer-use-parse-fuzz"],
]
why = "pure crates, then client crates, then programs: a crate depends on its own tier or a lower one, never up"

