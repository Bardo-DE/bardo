# --- the rest of the script, in the new fields

# Dependencies a crate may reach only THROUGH another, never name in its own manifest. anyview-peek
# links wgpu, pdfrum and tokio because ui-blitz does; it must not depend on them itself, so a texture
# is made through ui-blitz's TextureLayer, a page through its PdfFileThumb cache, and nothing here spawns.
[[direct]]
crate = "anyview-peek"
features = "all"
forbid = ["wgpu", "pdfrum", "pdfrum-anyrender", "pdfrum-edit", "tokio", "mpv-wgpu-player", "rsmpv", "ffmpeg-next", "ffmpeg-sys-next", "anyrender", "anyrender_vello_hybrid", "vello_hybrid", "blitz-dom", "blitz-paint", "blitz-html", "blitz-shell", "dioxus-native"]
why = "reach these through ui-blitz, never name them in the peek's own manifest"

# The most distinct packages (name and version) the tree may list, normal and build dependencies only. The
# launcher links anyview-peek, so growth here is growth of its binary: raise a budget in the change that
# adds the dependency, with the reason (FINDINGS).
[[budget]]
crate = "anyview-peek"
features = ["media", "pane"]
# 581 in the script; 605 since the monorepo moves (the base-* split, ui-components), which raised no
# budget. Set to today's count so it stops growing; trimming it back is a review item.
max = 605
why = "the launcher links the peek, so growth here is growth of its binary"

[[budget]]
crate = "anyview-peek"
features = "none"
# 202 in the script; 212 since the monorepo moves, as above.
max = 212
why = "the headless peek is what a mail client or a terminal links to look at a file"

# The lock file holds none of the libmpv, libav and picture-codec bindings at all, so a dev-dependency cannot
# bring them back either.
[[absent]]
names = ["rsmpv", "rsmpv-sys", "ffmpeg-next", "ffmpeg-sys-next", "libheif-rs", "libheif-sys", "libheif-rs-sys", "libraw-rs", "libraw-sys", "rsraw", "rsraw-sys", "rawloader", "rawler"]
why = "codecs and copyleft libraries run as separate plugin processes and are never linked"

# action-dbus reads callers from a fixture /proc only with `fixture-callers`, a test build's feature: a shipped
# viewer must never turn it on, or a fake /proc could name actiond. The script checked the viewer binary (in the
# anyview repository); the crate that turns action-dbus on in this repository is anyview-platform's desktop feature.
[[reach]]
crate = "anyview-platform"
features = ["desktop"]
forbid = []
forbid-features = ["action-dbus/fixture-callers"]
why = "fixture callers are a test build's feature: a fake /proc must never be able to name the actions service"

# --- blitz-embed (from crates/blitz-embed/scripts/check-boundary.sh)
# The old script matched package-name prefixes (`^(ds|dioxus|wayland|smithay|bardo|bardo-shell|layer-shell-host|mouse_gestures)(-|_|$)`),
# so `forbid` here uses `name` (exact) and `name-*` / `name_*` (a family). It walked the tree with
# --no-dedupe and --prune wgpu: wgpu's own backends link wayland-sys for their own windows, which is the
# GPU driver's business. `prune` lists packages whose subtrees are not walked (the package itself still counts).

[[reach]]
crate = "blitz-embed"
features = "all"
prune = ["wgpu"]
forbid = ["ds", "ds-*", "ds_*", "dioxus", "dioxus-*", "dioxus_*", "wayland", "wayland-*", "wayland_*", "smithay", "smithay-*", "smithay_*", "bardo", "bardo-*", "bardo_*", "bardo-shell", "layer-shell-host", "layer-shell-host-*", "layer-shell-host_*", "mouse_gestures", "mouse_gestures-*", "mouse_gestures_*"]
why = "the Blitz kit stands below every consumer: no design system, no Dioxus, no Wayland, no shell"

