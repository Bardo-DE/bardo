# Layers inside ui-components: host < (focus edit file_drop keys machine spell window) < stack < root <
# components < assembly. A file in a layer names (`crate::<module>`) only its own layer and the ones below
# it. The script read every line, doc links and test code included, so these rules set comments and tests;
# each layer's module root file (host.rs beside host/, since `foo.rs` beside `foo/` replaced `foo/mod.rs`)
# has a rule of its own. `machine` is a file (machine.rs), not a directory.

[[source]]
path = "crates/ui/ui-components/src/host"
pattern = 'crate::(focus|edit|file_drop|keys|machine|spell|window|stack|root|components|assembly)\b'
why = "a layer names only itself and the layers below it"
comments = true
tests = true

