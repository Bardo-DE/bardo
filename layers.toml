pattern = 'PROC_ROOT|BARDO_ACTIONS_MODEL_TRACE|test-model-trace|^[^f].*test-proc-root|[^/]test-proc-root|^test-proc-root'
files = "all"
comments = true
tests = true
why = "action-dbus may forward the fixture switch in its one fixture-callers line and nowhere else"

# action-trace writes prompts to disk: only the harness lists it as a dependency.
