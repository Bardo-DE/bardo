# Tiers P < C < A (the script's LAYERS table): a crate depends, directly, on its own tier or a lower one.
# P is pure; C may do IO but has no UI words; A is wiring: its libraries read no environment variable
# outside main.rs and src/bin. (The script ran this on direct dependencies, all features, normal and
# build kinds, which is what [[tiers]] does.)

[[tiers]]
