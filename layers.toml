# DIRECT fence: what the window may not NAME in its own [dependencies] though it reaches them through the
# crate under it. It reaches the computer only through settings-app-client, so the compiler refuses a use
# of the files, the services, the accounts service, the memory service, the actions service or the bus
# in a view (ARCHITECTURE.md "The fence"). account-ids is now base-ids, base-time and base-url.

