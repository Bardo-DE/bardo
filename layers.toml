dev = true
forbid = ["action-core", "action-router", "action-daemon", "computer-use-run", "computer-use-bus", "computer-use-daemon", "companion-wire"]
why = "the memory service stores other areas' payloads opaquely: none of their crates enters its trees"

# model-provider comes in under inference-core; a memory crate must not name it directly (a manifest line, dev-dependencies included).
[[source]]
path = "crates/memory/*/Cargo.toml"
pattern = '^model-provider\s*[=.]'
files = "all"
tests = true
why = "the memory service never names a model payload: no memory crate depends on model-provider directly"

# The test-only switches are never on in a default build of the daemon, and the file-backed key store never links.
[[reach]]
crate = "memory-daemon"
forbid = ["memory-keyfile"]
forbid-features = ["memory-daemon/test-keys", "memory-daemon/test-proc-root"]
why = "test-keys and test-proc-root are TEST ONLY: off in a default build, and memory-keyfile (FileKeys) never links"


