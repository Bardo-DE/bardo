# Where every crate sits and what it may reach; `cargo xtask check layers` reads this file.

# The domain folders under crates/, lowest first. A crate's layer is its domain's place here: a
# library depends only on its own domain or a lower one; programs may depend on any.
domains = [
    "base",
    "bus",
    "sandbox",
    "identity",
    "platform",
    "network",
    "wayland",
    "settings",
    "keymap",
    "blitz-embed",
    "plugin",
    "ui",
    "accounts",
    "provenance",
    "models",
    "engines",
    "inference",
    "memory",
    "actions",
    "speech",
    "compositor",
    "computer-use",
    "anyview",
    "input",
    "layer-shell",
    "sync",
    "portal",
    "updater",
    "files",
    "shell",
    "settings-app",
]

# What a crate of each kind may not reach. Applied only to crates whose kind is set; an
# `unclassified` crate is checked for layer order and its own rules below, nothing else.
[kind.core]
forbid = ["tokio", "async-std", "smol", "zbus", "wayland-client", "wayland-server", "smithay",
          "reqwest", "hyper", "rusqlite", "notify", "evdev", "nix", "rustix", "libc", "pipewire"]
forbid-src = ['\bstd::fs\b', '\bstd::net\b', '\bstd::process\b', '\bstd::thread\b',
              '\bstd::env::var', 'SystemTime::now', 'Instant::now']

# Every workspace crate, by folder. kind: types, core, proto, io, client, service, ui,
# test-support or unclassified (until its domain is refactored).

