# The daemon's `fixture-callers` is a security switch: with it on, the daemon takes who is calling from a
# process tree and callers file the harness names. Built as the installer builds it (normal and build
# edges, no dev-dependencies), no shipped package turns it on.

[[reach]]
crate = "computer-use-daemon"
features = "default"
build = true
forbid = []
forbid-features = ["computer-use-daemon/fixture-callers", "action-dbus/fixture-callers",
  "account-callers/test-proc-root", "account-daemon/test-proc-root", "inference-daemon/test-proc-root",
  "memory-daemon/test-proc-root", "sync-daemon/test-proc-root"]
why = "the daemon's build does not turn on the fixture tree"

# No shipped source names the harness's variables. The script allowed three constants in
# computer-use-daemon/src/callers.rs, each behind `#[cfg(feature = "fixture-callers")]` on the line
# before; that file is exempt here and its own lines are not checked (not translated). The script
# read comment lines too and skipped only tests/ folders; the checker also skips test.rs-like files.

[[source]]
path = "crates/computer-use"
except = ["crates/computer-use/computer-use-daemon/src/callers.rs"]
pattern = 'BARDO_COMPUTER_USE_TEST_|PROC_ROOT'
why = "no shipped crate names a harness switch outside its cfg-gated constants"
comments = true

