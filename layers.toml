# --- updater (from crates/updater/scripts/check-boundary.sh)

[[reach]]
crate = "updater-core"
build = false
forbid = ["ureq", "zbus", "tokio", "tar", "zstd", "rustls"]
why = "pure: no network, bus, async runtime or archive I/O"

# `*` ends a name prefix (the script matched `name[a-z0-9_-]*`); names without `*` are exact.
[[reach]]
crate = "updater-root"
forbid = ["bardo-updater", "caller_identity*", "ureq*", "rustls*", "webpki*", "native-tls", "openssl*", "ring",
          "hyper*", "h2", "http", "reqwest", "zbus*", "zvariant*", "dbus*",
          "tokio*", "mio", "async-*", "futures*", "smol", "tracing*"]
why = "what runs as root holds no user-level program, caller-identity library, network client, TLS, bus, async runtime or logging framework"

# The script checked the direct dependencies (normal and build) including outside crates, not only workspace crates.
[[edges]]
scope = "all"
crate = "updater-root"
build = true
exactly = ["updater-core", "thiserror", "semver", "toml", "rustix", "tar", "zstd"]
why = "a new direct dependency of the privileged programs is a decision, so it is made here"

# --- wayland (from crates/wayland/scripts/check-boundary.sh)

# 1. Default features: the vocabulary crate is pure. It reaches no Wayland crate, event loop, compositor
# toolkit, bus or runtime through any path.

[[reach]]
crate = "desktop-protocols"
forbid = ["wayland-client", "wayland-server", "wayland-backend", "wayland-scanner", "wayland-protocols",
  "wayland-sys", "calloop", "smithay", "zbus", "tokio"]
why = "pure vocabulary: no Wayland crate, event loop, compositor toolkit, bus or runtime"

# 6. desktop-client: its core reaches no Wayland crate and no I/O (default features).

[[reach]]
crate = "desktop-client"
forbid = ["wayland-client", "wayland-server", "wayland-backend", "wayland-scanner", "wayland-protocols",
  "wayland-sys", "calloop", "smithay", "zbus", "tokio", "rustix"]
why = "the client's core reaches no Wayland crate, event loop, toolkit, bus, runtime or system-call layer"

# 3. The vocabulary names no Wayland crate in source (src/vocab and src/lib.rs). The script scanned
# comments too; the schema skips them. The second path is a single file.

[[source]]
path = "crates/wayland/desktop-protocols/src/vocab"
pattern = '\bwayland_(client|server|backend|scanner|protocols)\b'
why = "the vocabulary names no wayland crate"

[[source]]
path = "crates/wayland/desktop-protocols/src/lib.rs"
pattern = '\bwayland_(client|server|backend|scanner|protocols)\b'
why = "the vocabulary names no wayland crate"

# 4. No unsafe in our own source (the generated bindings' unsafe comes from wayland-scanner at build time).

[[source]]
path = "crates/wayland/desktop-protocols/src"
pattern = '\bunsafe\b'
why = "no unsafe in our own source"

# 6. desktop-client names a wayland crate only under src/client/ (everything else in src/ is scanned).

[[source]]
path = "crates/wayland/desktop-client/src"
except = ["crates/wayland/desktop-client/src/client", "crates/wayland/desktop-client/src/client.rs"]
pattern = '\bwayland_(client|server|backend|scanner|protocols|protocols_wlr)\b'
why = "desktop-client names a wayland crate only in src/client/ (the wire layer, now client.rs beside client/)"

[[source]]
path = "crates/wayland/desktop-client/src"
pattern = '\bunsafe\b'
why = "no unsafe in desktop-client"

# 2 and 7. Exact direct dependencies (ours and outside crates; normal and build kinds).

[[edges]]
scope = "all"
crate = "desktop-protocols"
features = "default"
exactly = ["serde", "thiserror"]
why = "the vocabulary's direct dependencies by default are exactly these two"

[[edges]]
scope = "all"
crate = "desktop-protocols"
features = "all"
exactly = ["serde", "thiserror", "wayland-scanner", "wayland-backend", "wayland-client", "wayland-server", "wayland-protocols", "bitflags"]
why = "with every feature: the wayland crates the bindings need and bitflags (named by wayland-scanner's bitfield code)"

[[edges]]
scope = "all"
crate = "shell-verbs"
exactly = []
why = "shell-verbs depends on nothing at all"

# 7. shell-verbs: no unsafe.

[[source]]
path = "crates/wayland/shell-verbs/src"
pattern = '\bunsafe\b'
why = "no unsafe in shell-verbs"

