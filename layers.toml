  "inference-tailnet", "account-tailscale", "action-vocab", "action-manifest", "action-wire",
  "action-gate-wire", "permission-core", "companion-model", "zbus"]
why = "the window reaches the computer only through settings-app-client: no files, services, accounts, memory, actions or bus crate named directly"

