# Computer use sits above the actions service and below the shell in the repo order, and the GPL
# compositors are separate processes: nothing of the shell's, and nothing of theirs (smithay itself), may
# enter any tree of this domain. The script checked the whole workspace tree, dev-dependencies included;
# smithay is checked per crate (dev-dependencies included; the compositor is in this workspace), and
# the shell crates per crate (without dev-dependencies). The four model-layer crates the script left out (computer-use-action, -parse,
# -session, -vendors) are not covered.

