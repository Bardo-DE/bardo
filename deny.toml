# cargo-deny gate for the whole workspace. Run: cargo xtask check deny (or cargo deny check).
#
# Starter file, merged on 2026-11-15 from the 28 per-repo deny.toml files under crates/ (find crates -name deny.toml).
# Licence lists are the union; advisory ignores are the union (anyview, the shell, airwaves, the caller-identity library, the updater);
# bans are only the ones every repo that had them agreed on (openssl). Per-repo bans that guarded one
# library (the plugin host: no codec bindings, zbus, tokio) are NOT merged here; they belong to the layers check in phase 2.
# GPL, AGPL and EUPL are not allowed for linked code: a dependency under one would change what the desktop may be
# distributed as and should stop the build.

[graph]
# Union of the per-repo targets (airwaves listed both).
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "CC0-1.0",
    "Unicode-3.0",
    "Zlib",
    # Weak, file-level copyleft: fine to depend on, never to paste source from (stylo, app_units, cssparser,
    # selectors, option-ext, freedesktop-desktop-entry arrive under it). Reviewers check the paste rule.
    "MPL-2.0",
    # bzip2-1.0.6: the bzip2 library's own permissive licence (anyview-archive's bzip2 crate).
    "bzip2-1.0.6",
    # webpki-roots: the Mozilla CA list as data, attribution only (the accounts service, the inference service, the sync service had this as a
    # per-crate exception; the updater and the others allowed it globally).
    "CDLA-Permissive-2.0",
]
# SQLCipher's sources: SQLite's public-domain blessing and libtomcrypt's WTFPL, for this crate only.
exceptions = [
    { crate = "sqlcipher-src", allow = ["blessing", "WTFPL"] },
    # libFuzzer (LLVM's, BSD-style), in the fuzz targets only; nothing shipped links it.
    { crate = "libfuzzer-sys", allow = ["NCSA"] },
    # The xxHash port dioxus-core 0.8 hashes templates with: the Boost licence, permissive, attribution only.
    { crate = "xxhash-rust", allow = ["BSL-1.0"] },
]
confidence-threshold = 0.9

[advisories]
version = 2
yanked = "deny"
# Each ignore says why it is safe to carry and what would end it.
ignore = [
    # From anyview.
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained but complete; syntect reads only its own built-in dump with it" },
    { id = "RUSTSEC-2024-0320", reason = "yaml-rust unmaintained; only syntax-dump (a dev tool, never shipped) uses it, through syntect's yaml-load, to read our own .sublime-syntax files. Ends when syntect moves off it" },
    # chrono, announced unmaintained 2026-11-17. None of our crates names it any more (they use
    # jiff); it stays in the tree through cedar-policy-core, rmcp, schemars and trash. No known
    # flaw. Remove when those upstreams have moved.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, no known flaw; reached only through cedar-policy-core, rmcp, schemars and trash" },
    { id = "RUSTSEC-2024-0436", reason = "paste: compile-time proc macro only, no runtime exposure; arrives through rav1e and pulp" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained, no known flaw; reached only through the window frame's own font" },
    # From airwaves, anyview, the caller-identity library, the updater: zbus 5's companion crates are folded into zbus 6. Remove when the desktop moves to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant folded into zbus 6; no known flaw" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names folded into zbus 6; no known flaw" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive folded into zbus 6; no known flaw" },
]

[bans]
# Two versions of one crate are a size and noise cost, not a fault.
multiple-versions = "warn"
# anyview allowed wildcards; airwaves and the plugin host denied them with allow-wildcard-paths. Lenient until the root
# [workspace.dependencies] table lands (step 1.2 follow-up).
wildcards = "allow"
# Present in airwaves, the accounts service, the inference service: TLS goes through rustls. The memory service's encrypted store is SQLCipher, which
# links a vendored OpenSSL for its crypto only (rusqlite's bundled-sqlcipher-vendored-openssl), so libsqlite3-sys
# may wrap it; nothing else may.
deny = [
    { name = "openssl" },
    { name = "openssl-sys", wrappers = ["libsqlite3-sys"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The git sources in Cargo.lock today (root [patch] forks and what they pull in). Shrinks as fork patches land upstream.
allow-git = [
    "https://github.com/Bardo-DE/anyrender",
    "https://github.com/Bardo-DE/blitz",
    "https://github.com/Bardo-DE/smithay",
    "https://github.com/Bardo-DE/vello",
    "https://github.com/pop-os/dbus-settings-bindings",
]
