[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"
repository = "https://github.com/Bardo-DE/bardo"
publish = false

# Microsoft Pragmatic Rust Guidelines, M-STATIC-VERIFICATION. Opt-outs are `#[expect(lint, reason = "...")]`
# on the item. unsafe_code is "forbid": our unsafe code lives only in the small crates UNSAFE.md lists
# (`unsafe = true` in layers.toml), whose own [lints] table is this one with "deny" in its place.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
ambiguous_negative_literals = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
missing_docs = "warn"

# Not the `cargo` group: its multiple_crate_versions walks the whole dependency graph again for every
# crate it lints, minutes per crate in a workspace this size (a gate spent 23 minutes linting one
# proc-macro crate). cargo-deny checks duplicate versions and wildcards once for the workspace
# (deny.toml [bans], run by `cargo xtask check deny`); the crates.io metadata lints do not apply to
# crates that are not published.
[workspace.lints.clippy]
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
too_long_first_doc_paragraph = "warn"
literal_string_with_formatting_args = "allow"
