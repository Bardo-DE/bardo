[profile.release]
strip = "debuginfo"

# The compositor's arithmetic overflows loudly rather than wrapping (casement's release profile).
[profile.release.package.compositor-app]
overflow-checks = true

[profile.release.package.compositor-agent]
overflow-checks = true

[profile.release.package.compositor-backend]
overflow-checks = true

[profile.release.package.compositor-chrome]
overflow-checks = true

[profile.release.package.compositor-core]
overflow-checks = true

[profile.release.package.compositor-ctl]
overflow-checks = true

[profile.release.package.compositor-icons]
overflow-checks = true

[profile.release.package.compositor-ipc]
overflow-checks = true

[profile.release.package.compositor-layout]
overflow-checks = true

[profile.release.package.compositor-motion]
overflow-checks = true

[profile.release.package.compositor-privacy]
overflow-checks = true

[profile.release.package.compositor-render]
overflow-checks = true

[profile.release.package.compositor-wayland]
overflow-checks = true

# What the installer and `cargo xtask dist` build: smaller, faster binaries (anyview's and files'
# release settings). Plain `release` stays quick for gates and development.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1

