[profile.release]
strip = "debuginfo"

# The compositor's arithmetic overflows loudly rather than wrapping (the compositor's release profile).
[profile.release.package.compositor-app]
overflow-checks = true

[profile.release.package.compositor-agent]
overflow-checks = true

[profile.release.package.compositor-backend]
overflow-checks = true

[profile.release.package.compositor-chrome]
overflow-checks = true

[profile.release.package.compositor-core]
overflow-checks = true

[profile.release.package.compositor-ctl]
overflow-checks = true

[profile.release.package.compositor-egl]
