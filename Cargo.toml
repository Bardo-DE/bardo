[profile.dev]
opt-level = 0
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = true

[profile.dev.package."*"]
debug = false

# Build scripts and proc macros (serde, zbus, thiserror derives) run inside the compile of nearly every
# crate; optimised, they make each of those compiles faster. They are built once and kept.
[profile.dev.build-override]
opt-level = 3

# Window-drawing tests (style, layout, text, raster) run unbearably slowly unoptimised.
[profile.dev.package.anyrender]
opt-level = 2

[profile.dev.package.anyrender_svg]
opt-level = 2

[profile.dev.package.anyrender_vello_cpu]
opt-level = 2

[profile.dev.package.anyrender_vello_gpu]
opt-level = 2

[profile.dev.package."blitz-dom"]
opt-level = 2

[profile.dev.package."blitz-html"]
opt-level = 2

[profile.dev.package."blitz-paint"]
opt-level = 2

[profile.dev.package."blitz-shell"]
opt-level = 2

[profile.dev.package."blitz-traits"]
opt-level = 2

[profile.dev.package.fontdb]
opt-level = 2

[profile.dev.package.fontique]
opt-level = 2

[profile.dev.package.harfrust]
opt-level = 2

[profile.dev.package.image]
opt-level = 2

[profile.dev.package."image-webp"]
opt-level = 2

[profile.dev.package.kurbo]
opt-level = 2

[profile.dev.package.parley]
opt-level = 2

[profile.dev.package.peniko]
opt-level = 2

[profile.dev.package.png]
opt-level = 2

[profile.dev.package."read-fonts"]
opt-level = 2

[profile.dev.package.resvg]
opt-level = 2

[profile.dev.package.selectors]
