[package]
name = "sill-settings"
description = "sill's settings file, sill/settings.toml, as data: the shell domains of design/22-SETTINGS.md, their Section and schema."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.91"
repository = "https://github.com/Bardo-DE/sill"
publish = false

[dependencies]
ds-core = {path = "../../../quire/crates/ds-core"}
keycap-protocol = {path = "../../../keycap/crates/keycap-protocol"}
sill-launcher = {path = "../sill-launcher"}
sill-model = {path = "../sill-model"}
ds-settings = {path = "../../../quire/crates/ds-settings", features = ["tokio"]}
serde = {version = "1", features = ["derive"]}
toml = {version = "1"}

[dev-dependencies]
sill-testkit = {path = "../sill-testkit"}
prov = {path = "../../../prov/prov"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
