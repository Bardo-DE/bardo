[package]
name = "sill-launcher-ui"
description = "The launcher: its panel, click catcher, rows, preview pane and actions."

# `media` (on by default) lets the preview pane read a recording's facts and, for audio, its cover
# (pure-Rust header parsers). Off, a recording previews as its type, size and date.
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.91"
repository = "https://github.com/Bardo-DE/sill"
publish = false
[features]
default = ["media"]
media = ["anyview-peek/media"]

[dependencies]
companion-model = {path = "../../../docket/crates/companion-model"}
docket-permissions-core = {path = "../../../docket/crates/docket-permissions-core"}
docket-vocab = {path = "../../../docket/crates/docket-vocab"}
almanac-core = {path = "../../../almanac/crates/almanac-core"}
companion-wire = {path = "../../../docket/crates/companion-wire"}
anyview-core = {path = "../../../anyview/crates/anyview-core"}
anyview-fs = {path = "../../../anyview/crates/anyview-fs"}
anyview-image = {path = "../../../anyview/crates/anyview-image"}
anyview-peek = {path = "../../../anyview/crates/anyview-peek", default-features = false, features = ["pane"]}
anyview-platform = {path = "../../../anyview/crates/anyview-platform", features = ["quire-desktop"]}
chordkit = {path = "../../../chordkit/crates/chordkit"}
dioxus = {version = "0.7", default-features = false, features = ["macro", "html", "hooks", "signals"]}
dirs = {version = "6"}
docket-core = {path = "../../../docket/crates/docket-core"}
ds = {path = "../../../quire/crates/ds"}
ds-behaviour = {path = "../../../quire/crates/ds-behaviour"}
ds-blitz = {path = "../../../quire/crates/ds-blitz", features = ["pdf"]}
jiff = {version = "0.2"}
# The name of a file's thumbnail in the freedesktop cache is the MD5 of its address.
md-5 = {version = "0.10"}
prov = {path = "../../../prov/prov"}
shell-host = {path = "../../../shell-host/crates/shell-host"}
sill-launcher = {path = "../sill-launcher"}
sill-model = {path = "../sill-model"}
sill-search = {path = "../sill-search"}
sill-services = {path = "../sill-services"}
sill-settings = {path = "../sill-settings"}
sill-ui-kit = {path = "../sill-ui-kit"}
sill-shell-kit = {path = "../sill-shell-kit"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util"]}

[dev-dependencies]
serde_json = {version = "1"}
png = {version = "0.18"}
sill-testkit = {path = "../sill-testkit"}
ds-harness = {path = "../../../quire/crates/ds-harness"}
image = {version = "0.25.6", default-features = false, features = ["png", "jpeg", "webp"]}
sill-ui-kit = {path = "../sill-ui-kit", features = ["harness"]}
dioxus-ssr = {version = "0.7"}
ds-lint = {path = "../../../quire/crates/ds-lint"}
shell-host = {path = "../../../shell-host/crates/shell-host", features = ["debug-inject"]}

[[example]]
name = "launcher_demo"

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
