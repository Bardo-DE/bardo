[package]
name = "sill-ui-kit"
description = "What every surface shares: root, links, hooks, menus, status, notification cards, widget providers and the test harness."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.91"
repository = "https://github.com/Bardo-DE/sill"
publish = false

[dependencies]
cua-action = {path = "../../../stoker/crates/cua-action"}
docket-permissions-core = {path = "../../../docket/crates/docket-permissions-core"}
docket-manifest = {path = "../../../docket/crates/docket-manifest"}
docket-vocab = {path = "../../../docket/crates/docket-vocab"}
porter-capability = {path = "../../../porter/crates/porter-capability"}
sill-model = {path = "../sill-model"}
dioxus = {version = "0.7", default-features = false, features = ["macro", "html", "hooks", "signals"]}
ds = {path = "../../../quire/crates/ds"}
ds-behaviour = {path = "../../../quire/crates/ds-behaviour"}
chordkit = {path = "../../../chordkit/crates/chordkit"}
keycap-client = {path = "../../../keycap/crates/keycap-client"}
sill-shell-kit = {path = "../sill-shell-kit"}
ds-blitz = {path = "../../../quire/crates/ds-blitz"}
ds-settings = {path = "../../../quire/crates/ds-settings", features = ["dioxus", "tokio"]}
shell-host = {path = "../../../shell-host/crates/shell-host"}
# The test driver, for the `harness` feature.
ds-harness = {path = "../../../quire/crates/ds-harness", optional = true}
sill-search = {path = "../sill-search"}
sill-services = {path = "../sill-services"}
sill-settings = {path = "../sill-settings"}
sill-launcher = {path = "../sill-launcher"}
# The companion's wire and the types it names, converted to quire's view types in `companion`.
companion-wire = {path = "../../../docket/crates/companion-wire"}
docket-core = {path = "../../../docket/crates/docket-core"}
ds-core = {path = "../../../quire/crates/ds-core"}
porter-core = {path = "../../../porter/crates/porter-core"}
prov = {path = "../../../prov/prov"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util"]}
# App icons in the icon style (`app_icons`): decode and encode rasters, rasterise theme SVGs
# (resvg is the renderer usvg/tiny-skia already in the tree belong to; MIT OR Apache-2.0),
# and find `$XDG_CACHE_HOME`.
image = {version = "0.25.6", default-features = false, features = ["png", "jpeg", "webp"]}
resvg = { version = "0.48", default-features = false }
dirs = {version = "6"}
# Civil dates for the calendar widgets' month grid and the world clock.
jiff = {version = "0.2"}
thiserror = {version = "2"}
# The widgets' entries are serde data (quire's `ds::Widget::Entry`); the desktop widgets' state
# file is JSON.
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}

[features]
# Fake services and the values they start at, for tests and demos (`harness`).
harness = ["dep:ds-harness"]

[dev-dependencies]
sill-testkit = {path = "../sill-testkit"}
# The crate's own tests drive surfaces through `harness`.
sill-ui-kit = {path = ".", features = ["harness"]}
# `lint` is off by default: only test builds need `ds::lint::markup`.
ds-lint = {path = "../../../quire/crates/ds-lint"}
dioxus-ssr = {version = "0.7"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
