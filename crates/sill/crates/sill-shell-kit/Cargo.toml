[package]
name = "sill-shell-kit"
description = "The shell-only parts: lock, switcher, bar, dock, control center, notifications, OSD, batteries, emoji and the notification center's widgets, with the shell's tokens and sheets."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.91"
repository = "https://github.com/Bardo-DE/sill"
publish = false

[dependencies]
dioxus = {version = "0.7", default-features = false, features = ["macro", "html", "hooks", "signals"]}
ds = {path = "../../../quire/crates/ds"}
ds-core = {path = "../../../quire/crates/ds-core"}
ds-shell = {path = "../../../quire/crates/ds-shell"}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
thiserror = {version = "2"}
image = {version = "0.25.6", default-features = false, features = ["png", "jpeg", "webp"]}

[dev-dependencies]
sill-testkit = {path = "../sill-testkit"}
dioxus-ssr = {version = "0.7"}
ds-blitz = {path = "../../../quire/crates/ds-blitz"}
ds-core = {path = "../../../quire/crates/ds-core", features = ["testing"]}
ds-harness = {path = "../../../quire/crates/ds-harness"}
ds-lint = {path = "../../../quire/crates/ds-lint"}
ds-settings = {path = "../../../quire/crates/ds-settings", features = ["dioxus", "tokio"]}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
