[package]
name = "sill-services"
description = "Effectful services behind watch channels: power, network, displays, sessions, notifications, launching and the compositor's windows."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.91"
repository = "https://github.com/Bardo-DE/sill"
publish = false

[features]
# `sill run --dev-callers FILE`: callers named in a person's own rows file are let in at
# `Proof::Dev` (peephole's `dev-rows`). Off by default; only the sill binary's `debug` feature turns
# it on, so no shipped build has it (the desktop gate refuses `dev-rows` in any release shape).
# It also lets `sill run --proc-root DIR` name callers by a stand-in `/proc` (docket's
# `fixture-callers`), as a jail with no systemd must.
dev-callers = ["peephole-bus/dev-rows", "docket-dbus/fixture-callers"]

[dependencies]
cua-action = {path = "../../../stoker/crates/cua-action"}
docket-wire = {path = "../../../docket/crates/docket-wire"}
companion-model = {path = "../../../docket/crates/companion-model"}
docket-permissions-core = {path = "../../../docket/crates/docket-permissions-core"}
docket-manifest = {path = "../../../docket/crates/docket-manifest"}
docket-vocab = {path = "../../../docket/crates/docket-vocab"}
porter-tailscale = {path = "../../../porter/crates/porter-tailscale"}
porter-tailnet = {path = "../../../steward/crates/porter-tailnet"}
porter-sheet = {path = "../../../porter/crates/porter-sheet"}
porter-wire = {path = "../../../porter/crates/porter-wire"}
porter-ids = {path = "../../../porter/crates/porter-ids"}
anyview-core = {path = "../../../anyview/crates/anyview-core"}
anyview-platform = {path = "../../../anyview/crates/anyview-platform", features = ["quire-desktop"]}
sill-model = {path = "../sill-model"}
sill-launcher = {path = "../sill-launcher"}
ds-core = {path = "../../../quire/crates/ds-core"}
ds-helpers = {path = "../../../quire/crates/ds-helpers", default-features = false}
ds-settings = {path = "../../../quire/crates/ds-settings", features = ["tokio"]}
keycap-protocol = {path = "../../../keycap/crates/keycap-protocol"}
docket-core = {path = "../../../docket/crates/docket-core"}
docket-dbus = {path = "../../../docket/crates/docket-dbus"}
docket-client = {path = "../../../docket/crates/docket-client", features = ["dbus"]}
docket-provider = {path = "../../../docket/crates/docket-provider", features = ["dbus"]}
companion-wire = {path = "../../../docket/crates/companion-wire"}
voice-wire = {path = "../../../docket/crates/voice-wire"}
voice-dbus = {path = "../../../docket/crates/voice-dbus"}
cua-bus = {path = "../../../cua/crates/cua-bus"}
cua-dbus = {path = "../../../cua/crates/cua-dbus"}
almanac-core = {path = "../../../almanac/crates/almanac-core"}
almanac-dbus = {path = "../../../almanac/crates/almanac-dbus"}
prov = {path = "../../../prov/prov"}
porter-core = {path = "../../../porter/crates/porter-core"}
porter-infer = {path = "../../../steward/crates/porter-infer"}
casement-protocols = {path = "../../../casement-protocols"}
desktop-client = {path = "../../../casement-protocols/desktop-client", features = ["client"]}
ferry-bus = {path = "../../../ferry/crates/ferry-bus"}
porter-dbus = {path = "../../../porter/crates/porter-dbus"}
inferd-client = {path = "../../../steward/crates/inferd-client", default-features = false, features = ["dbus"]}
porter-client = {path = "../../../porter/crates/porter-client"}
porter-client-dbus = {path = "../../../porter/crates/porter-client-dbus"}
peephole-bus = {default-features = false, features = ["tokio", "desktop"], path = "../../../peephole/peephole-bus"}
toml = {version = "1"}
rustix = {version = "1.1", default-features = false, features = ["std", "event", "fs", "net", "time", "process"]}
nix = {version = "0.31", default-features = false, features = ["user"]}
async-trait = {version = "0.1"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util"]}
zbus = {version = "5.19", default-features = false, features = ["tokio"]}
airwaves-nm = {default-features = false, features = ["tokio"], path = "../../../airwaves/airwaves-nm"}
airwaves-bluez = {default-features = false, features = ["tokio"], path = "../../../airwaves/airwaves-bluez"}
smithay-client-toolkit = {version = "0.20", default-features = false, features = ["calloop", "xkbcommon"]}
wayland-client = {version = "0.31"}
wayland-protocols = {version = "0.32.13", features = ["client", "staging", "unstable"]}
upower_dbus = {git = "https://github.com/pop-os/dbus-settings-bindings", rev = "eed01dd3609e90e3c8cd043656734c500956c793"}
libpulse-binding = {version = "2.30"}
system-tray = {version = "0.8.9"}
freedesktop-icons = {version = "0.4"}
notify = {version = "8.2"}
image = {version = "0.25.6", default-features = false, features = ["png", "jpeg", "webp"]}
logind-zbus = {version = "5"}
dirs = {version = "6"}
jiff = {version = "0.2"}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
thiserror = {version = "2"}
ddc = {version = "0.2"}
ddc-i2c = {version = "0.2.2", default-features = false, features = ["with-linux"]}
nonstick = {version = "0.1.2"}
percent-encoding = {version = "2.3"}

[dev-dependencies]
porter-capability = {path = "../../../porter/crates/porter-capability"}
desktop-client = {path = "../../../casement-protocols/desktop-client", features = ["fake"]}
# A caller that is only a claim (`BusPeers::introduce`): the tests name who their stand-ins are.
peephole-bus = {default-features = false, features = ["desktop", "fake", "tokio"], path = "../../../peephole/peephole-bus"}
# intentd is named from a fixture tree (`<root>/<pid>/cgroup`) in the private-bus tests.
docket-dbus = {path = "../../../docket/crates/docket-dbus", features = ["fixture-callers"]}
sill-testkit = {path = "../sill-testkit"}
docket-router = {path = "../../../docket/crates/docket-router"}
docket-fake = {path = "../../../docket/crates/docket-fake"}
docket-checkpoint = {path = "../../../docket/crates/docket-checkpoint"}
policy-point = {path = "../../../docket/crates/policy-point"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
