[package]
name = "sill-search"
description = "The launcher's search: the result runner, its history and frecency, every provider, and previews."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.91"
repository = "https://github.com/Bardo-DE/sill"
publish = false

[dependencies]
cua-action = {path = "../../../stoker/crates/cua-action"}
companion-model = {path = "../../../docket/crates/companion-model"}
docket-permissions-core = {path = "../../../docket/crates/docket-permissions-core"}
docket-manifest = {path = "../../../docket/crates/docket-manifest"}
docket-vocab = {path = "../../../docket/crates/docket-vocab"}
anyview-core = {path = "../../../anyview/crates/anyview-core"}
anyview-store = {path = "../../../anyview/crates/anyview-store"}
sill-launcher = {path = "../sill-launcher"}
sill-model = {path = "../sill-model"}
sill-services = {path = "../sill-services"}
ds-core = {path = "../../../quire/crates/ds-core"}
docket-core = {path = "../../../docket/crates/docket-core"}
prov = {path = "../../../prov/prov"}
companion-wire = {path = "../../../docket/crates/companion-wire"}
almanac-core = {path = "../../../almanac/crates/almanac-core"}
ds-settings = {path = "../../../quire/crates/ds-settings", features = ["tokio"]}
emojis = {version = "0.9"}
fend-core = {version = "1.5.8"}
jiff = {version = "0.2"}
mime_guess = {version = "2.0"}
nucleo-matcher = {version = "0.3.1"}
percent-encoding = {version = "2.3"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util"]}
zbus = {version = "5.19", default-features = false, features = ["tokio"]}

[dev-dependencies]
cua-bus = {path = "../../../cua/crates/cua-bus"}
sill-testkit = {path = "../sill-testkit"}
serde_json = {version = "1"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
