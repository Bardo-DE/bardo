[package]
name = "slipway"
description = "Updater: daily check, download, verify, atomic install with rollback, session D-Bus service"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/slipway"
publish = false

[[bin]]
name = "slipway"
path = "src/main.rs"

[dependencies]
slipway-core = {path = "../slipway-core"}
slipway-root = {path = "../slipway-root"}
thiserror = {version = "2"}
serde = {version = "1", features = ["derive"]}
toml = {version = "0.9"}
semver = {version = "1", features = ["serde"]}
ureq = {version = "3.4", default-features = false, features = ["rustls", "json"]}
zbus = {version = "5.19", default-features = false, features = ["tokio"]}
peephole-bus = {default-features = false, features = ["tokio", "desktop"], path = "../../../peephole/peephole-bus"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "signal"]}
tracing = {version = "0.1"}
tracing-subscriber = {version = "0.3", default-features = false, features = ["fmt", "std", "env-filter"]}
zbus-ready = { path = "../../../zbus-ready" }

[dev-dependencies]
peephole-bus = {default-features = false, features = ["desktop", "fake", "tokio"], path = "../../../peephole/peephole-bus"}
tempfile = {version = "3"}
tar = {version = "0.4.46"}
zstd = {version = "0.13"}

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
