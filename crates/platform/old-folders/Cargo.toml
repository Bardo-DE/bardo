[package]
name = "old-folders"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
description = "Moves a service's folder from its pre-bardo path to its new one, once, at first start. Temporary: deleted in the release after everyone has started once."
repository = "https://github.com/Bardo-DE/bardo"
publish = false

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
