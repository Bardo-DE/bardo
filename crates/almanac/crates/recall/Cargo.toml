[package]
name = "recall"
description = "A rebuildable search index: FTS5 lexical search, Embedder and VectorIndex traits, exact-scan vectors and reciprocal-rank fusion. Generic: knows nothing of almanac (its seam types live in almanac-store)."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/almanac"
publish = false

[dependencies]
almanac-core = {path = "../almanac-core"}
almanac-store = {path = "../almanac-store"}
rusqlite = {version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"]}
thiserror = {version = "2"}

[dev-dependencies]
recall = { path = ".", features = ["testing"] }
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
tempfile = {version = "3"}

[features]
# `FakeEmbedder`, for tests and almanac-fake.
testing = []

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
