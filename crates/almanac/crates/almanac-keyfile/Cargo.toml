[package]
name = "almanac-keyfile"
description = "FileKeys: a key store in one sealed file, replaced atomically and synced, for a jailed test with no Secret Service. TEST ONLY."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/almanac"
publish = false

[dependencies]
const-hex = {version = "1.19"}
almanac-core = {path = "../almanac-core"}
almanac-seal = {path = "../almanac-seal"}
atomic-write-file = {version = "0.3"}

[dev-dependencies]
tempfile = {version = "3"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
