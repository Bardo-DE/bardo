[package]
name = "almanac-fake"
description = "Test-only: a fake MemoryService over in-memory seams, a stepped clock, a scripted consolidator and fixtures."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/almanac"
publish = false

[dependencies]
almanac-core = {path = "../almanac-core"}
almanac-seal = {path = "../almanac-seal", features = ["testing"]}
eventlog = {path = "../eventlog", features = ["testing"]}
almanac-store = {path = "../almanac-store"}
memfiles = {path = "../memfiles", features = ["testing"]}
recall = {path = "../recall", features = ["testing"]}
almanac-service = {path = "../almanac-service"}
almanac-tidy = {path = "../almanac-tidy"}
memfiles-format = {path = "../memfiles-format"}
chrono = {version = "0.4", default-features = false, features = ["std"]}
rusqlite = {version = "0.43", features = ["bundled-sqlcipher-vendored-openssl"]}
tempfile = {version = "3"}
serde_json = {version = "1"}

[dev-dependencies]
almanac-settings = {path = "../almanac-settings"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
tar = {version = "0.4"}
toml = {version = "1"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
