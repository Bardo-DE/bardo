[package]
name = "memfiles-format"
description = "almanac's agent memory file format: parse and render of topic files and trailers, and the fact store over a vault seam. No file IO."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/almanac"
publish = false

[dependencies]
almanac-core = {path = "../almanac-core"}
almanac-store = {path = "../almanac-store"}
chrono = {version = "0.4", default-features = false, features = ["std"]}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
thiserror = {version = "2"}

[dev-dependencies]
memfiles = {path = "../memfiles", features = ["testing"]}
tempfile = {version = "3"}
proptest = {version = "1"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
