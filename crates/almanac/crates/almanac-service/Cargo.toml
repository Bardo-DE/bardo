[package]
name = "almanac-service"
description = "memoryd's core over seams: authorisation, the Space and forget machines, the run that drives almanac-tidy's fact and consolidation machines over a backend, retention, the readers (search itself is almanac-search's), timeline assembly, export, the per-Space request queue, and MemoryService."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/almanac"
publish = false

[dependencies]
const-hex = {version = "1.19"}
almanac-core = {path = "../almanac-core"}
almanac-seal = {path = "../almanac-seal"}
almanac-search = {path = "../almanac-search"}
almanac-settings = {path = "../almanac-settings"}
almanac-tidy = {path = "../almanac-tidy"}
blake3 = {version = "1"}
chrono = {version = "0.4", default-features = false, features = ["std"]}
almanac-store = {path = "../almanac-store"}
memfiles-format = {path = "../memfiles-format"}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
tar = {version = "0.4"}
thiserror = {version = "2"}
toml = {version = "1"}

[dev-dependencies]
almanac-fake = {path = "../almanac-fake"}
almanac-seal = {path = "../almanac-seal", features = ["testing"]}
eventlog = {path = "../eventlog", features = ["testing"]}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
