[package]
name = "updater-daemon"
description = "Updater: daily check, download, verify, atomic install with rollback, session D-Bus service"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "bardo-updater"
path = "src/main.rs"

[dependencies]
updater-core = {path = "../updater-core"}
updater-root = {path = "../updater-root"}
old-folders = {path = "../../platform/old-folders"}
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }
semver = { workspace = true, features = ["serde"] }
ureq = { workspace = true, features = ["rustls", "json"] }
zbus = {version = "5.19", default-features = false, features = ["tokio"]}
caller-identity-dbus = {default-features = false, features = ["tokio", "desktop"], path = "../../identity/caller-identity-dbus"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "signal"]}
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "std", "env-filter"] }
zbus-ready = { path = "../../zbus-ready" }

[dev-dependencies]
caller-identity-dbus = {default-features = false, features = ["desktop", "fake", "tokio"], path = "../../identity/caller-identity-dbus"}
tempfile = { workspace = true }
tar = {version = "0.4.46"}
zstd = { workspace = true }

[lints]
workspace = true
