[package]
name = "updater-daemon"
description = "Updater: daily check, download, verify, atomic install with rollback, session D-Bus service"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "bardo-updater"
path = "src/main.rs"

[dependencies]
updater-dbus = { path = "../updater-dbus" }
base-fs = { path = "../../base/base-fs" }
base-time = { path = "../../base/base-time" }
base-xdg = { path = "../../base/base-xdg" }
updater-core = {path = "../updater-core"}
updater-root = {path = "../updater-root"}
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }
semver = { workspace = true, features = ["serde"] }
base-url = { path = "../../base/base-url" }
http-core = { path = "../../network/http-core" }
http-reqwest = { path = "../../network/http-reqwest" }
zbus = {workspace = true, features = ["tokio"]}
caller-identity-dbus = {default-features = false, features = ["tokio", "desktop"], path = "../../identity/caller-identity-dbus"}
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "fs", "signal"]}
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "std", "env-filter"] }
dbus-kit = { path = "../../bus/dbus-kit" }

[dev-dependencies]
base-testkit = {path = "../../base/base-testkit", features = ["dbus", "tokio"]}
caller-identity-dbus = {default-features = false, features = ["desktop", "fake", "tokio"], path = "../../identity/caller-identity-dbus"}
tempfile = { workspace = true }
tar = {workspace = true, features = ["default"]}
zstd = { workspace = true }

[lints]
workspace = true
