[package]
name = "updater-root"
description = "The three programs that run as root (install, roll back, health record) and the code only they need"

# These programs run with the administrator's rights, so what they link is kept short and is checked by
# `cargo xtask check layers`: no network client, no bus, no async runtime, no logging framework.
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
[[bin]]
name = "bardo-updater-apply"
path = "src/bin/bardo_updater_apply.rs"

[[bin]]
name = "bardo-updater-rollback"
path = "src/bin/bardo_updater_rollback.rs"

[[bin]]
name = "bardo-updater-health"
path = "src/bin/bardo_updater_health.rs"

[dependencies]
base-fs = { path = "../../base/base-fs" }
updater-core = {path = "../updater-core"}
thiserror = { workspace = true }
semver = { workspace = true, features = ["serde"] }
toml = { workspace = true }
rustix = {workspace = true, features = ["std", "fs", "process"]}
tar = {workspace = true, features = ["default"]}
zstd = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
