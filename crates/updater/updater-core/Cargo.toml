[package]
name = "updater-core"
description = "Pure model of a signed, versioned release: index, digests, signature check, install plan, check schedule"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/slipway"
publish = false

[dependencies]
thiserror = {version = "2"}
serde = {version = "1", features = ["derive"]}
toml = {version = "0.9"}
semver = {version = "1", features = ["serde"]}
minisign-verify = {version = "0.2.5"}
sha2 = {version = "0.11"}
time = {version = "0.3", features = ["serde", "formatting", "parsing", "macros"]}

[dev-dependencies]
proptest = {version = "1"}

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
