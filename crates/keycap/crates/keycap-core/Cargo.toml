[package]
name = "keycap-core"
description = "keycap's pure remap core: key vocabulary, layout tables, profiles, the layered config over strings, and Remapper::step. No device, socket, clock or file I/O, so a compositor can link it"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Bardo-DE/keycap"

[dependencies]
keycap-protocol = { path = "../keycap-protocol" }
thiserror = {version = "2"}
toml = {version = "1"}

[lints.rust]
unsafe_code = "forbid"
