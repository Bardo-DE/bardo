[package]
name = "keycap-sys"
description = "The evdev and uinput calls keycap and its device-test harness share: ioctls through safe handles, and draining a nonblocking event node"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Bardo-DE/keycap"

[dependencies]
thiserror = {version = "2"}
rustix = {version = "1", features = ["event", "fs", "net", "time", "process"]}
input-linux = {version = "0.7", default-features = false}

[lints.rust]
unsafe_code = "forbid"
