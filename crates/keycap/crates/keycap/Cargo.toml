[package]
name = "keycap"
description = "Mac keyboard mapping daemon: grabs keyboards, remaps by profile, writes one virtual keyboard; the desktop picks the profile over a socket"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Bardo-DE/keycap"

[dependencies]
keycap-core = { path = "../keycap-core" }
keycap-protocol = { path = "../keycap-protocol" }
keycap-client = { path = "../keycap-client" }
keycap-sys = { path = "../keycap-sys" }
# The broker that makes the virtual devices, and the device vocabulary its requests are written in.
chordkit = {path = "../../../chordkit/crates/chordkit"}
thiserror = {version = "2"}
notify = {version = "8.2"}
rustix = {version = "1", features = ["event", "fs", "net", "time", "process"]}
peephole = {path = "../../../peephole/peephole"}
latchkey = {features = ["guard"], path = "../../../latchkey"}
peephole-core = {features = ["desktop"], path = "../../../peephole/peephole-core"}
turnstile-client = {path = "../../../turnstile/crates/turnstile-client"}

[dev-dependencies]
turnstile-client = {features = ["fake"], path = "../../../turnstile/crates/turnstile-client"}
keycap-devtest = { path = "../keycap-devtest" }
# A held process that is only a claim, for tests of who the socket's peer is; never in a shipped build.
peephole = {features = ["fake"], path = "../../../peephole/peephole"}

[lints.rust]
unsafe_code = "forbid"
