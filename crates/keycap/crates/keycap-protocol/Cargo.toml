[package]
name = "keycap-protocol"
description = "The socket contract between keycap and the desktop that drives it: messages, their vocabulary, and the packet codec"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Bardo-DE/keycap"

[dependencies]
serde = {version = "1", features = ["derive"]}
thiserror = {version = "2"}
serde_json = {version = "1"}

[lints.rust]
unsafe_code = "forbid"
