[package]
name = "account-family-nextcloud"
description = "The Nextcloud family: Login Flow v2, OCS discovery, WebDAV, CalDAV, CardDAV and the Notes API over one app password. A driver: account-nextcloud-proto builds the requests and reads the answers, account-dav-proto walks the principal, and this crate sends them."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-time = { path = "../../base/base-time" }
account-family-kit = {path = "../account-family-kit"}
account-nextcloud-proto = {path = "../account-nextcloud-proto"}
account-dav-proto = {path = "../account-dav-proto", features = ["discover"]}
account-core = {path = "../account-core"}
account-capability = {path = "../account-capability"}
account-sheet = {path = "../account-sheet"}
account-provider = {path = "../account-provider"}
http-core = {path = "../../network/http-core"}

[lints]
workspace = true
