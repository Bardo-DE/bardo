[package]
name = "account-fake-secret-service"
description = "A fake freedesktop Secret Service (org.freedesktop.secrets) over zbus: in memory, plain algorithm only, no prompts, so a real Secret Service client can be tested where no keyring daemon runs."
version.workspace = true
license.workspace = true
keywords = ["secret-service", "dbus", "zbus", "keyring", "testing"]
categories = ["development-tools::testing"]
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
zbus = {version = "5.19", default-features = false, features = ["tokio"]}
zbus-ready = { path = "../../zbus-ready" }

[dev-dependencies]
# The example waits for Ctrl-C.
tokio = {version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"]}

[lints]
workspace = true
