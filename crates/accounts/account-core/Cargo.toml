[package]
name = "account-core"
description = "porter's pure vocabulary: accounts, the capability vocabulary and matching, consent and secrets' keys."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
account-capability = {path = "../account-capability"}
base-ids = { path = "../../base/base-ids" }
base-time = { path = "../../base/base-time" }
base-url = { path = "../../base/base-url" }
caller-identity-core = {default-features = false, path = "../../identity/caller-identity-core"}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
secrecy = { workspace = true, features = ["serde"] }
subtle = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
account-match = {path = "../account-match"}
account-capability = {path = "../account-capability", features = ["testing"]}

[lints]
workspace = true
