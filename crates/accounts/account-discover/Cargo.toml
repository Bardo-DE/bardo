[package]
name = "account-discover"
description = "Discovery for porter's families: autoconfig, SRV and MX leads and well-known URLs, as pure parsers plus the DNS and HTTP seams."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
account-core = {path = "../account-core"}
account-capability = {path = "../account-capability"}
base-url = { path = "../../base/base-url" }
account-http = {path = "../account-http"}
account-provider = {path = "../account-provider"}
roxmltree = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
hickory-resolver = { workspace = true, optional = true }

[dev-dependencies]
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
toml = { workspace = true }

[features]
# `HickoryDns`, the `Dns` seam over the system resolver. Pulls in the runtime, so it is off by
# default: the parsers and the search reach none.
io = ["dep:hickory-resolver"]

[lints]
workspace = true
