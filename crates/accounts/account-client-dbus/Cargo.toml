[package]
name = "account-client-dbus"
description = "The bus transport of account-client: accountd on the session bus, for an app that lets accountd hold its accounts."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
account-client = {path = "../account-client"}
account-core = {path = "../account-core"}
account-wire = {path = "../account-wire"}
account-capability = {path = "../account-capability"}
account-match = {path = "../account-match"}
account-dbus = {path = "../account-dbus"}
base-ids = { path = "../../base/base-ids" }
base-time = { path = "../../base/base-time" }
tailscale-types = {path = "../../network/tailscale-types"}
futures-util = { workspace = true }
serde_json = { workspace = true }
zbus = {workspace = true, features = ["tokio"]}
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
# `sealed_key` and a memfd: the credential tests hand a key over as the daemon does.
account-secrets = {path = "../account-secrets"}
rustix = {workspace = true, features = ["std", "event", "fs", "net", "time", "process"]}

[lints]
workspace = true
