[package]
name = "account-callers"
description = "Who is calling a daemon: a bus connection's sender to an app and a role (the caller-identity library's judgement of the process, then the caller table), the table read from its files, and which /proc and which system tables a daemon reads them from."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-fs = { path = "../../base/base-fs" }
account-core = {path = "../account-core"}
caller-identity-linux = {path = "../../identity/caller-identity-linux"}
caller-identity-core = {default-features = false, features = ["toml"], path = "../../identity/caller-identity-core"}
caller-identity-dbus = {default-features = false, features = ["tokio"], path = "../../identity/caller-identity-dbus"}
zbus = {workspace = true, features = ["tokio"]}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The table's reader, behind the feature that only the daemons turn on.
toml = { workspace = true, optional = true }
caller-role-types = {path = "../../identity/caller-role-types"}

[features]
# The caller table read from `callers.toml` files (`load_callers`): accountd's and syncd's.
file = ["dep:toml"]
# TEST ONLY, never default and never in dist: `ProcCallers::with_proc_root` and `caller_of_pid` read a
# directory tree standing for /proc (the caller-identity library's `fake` seams: a process that is only a claim). A daemon
# turns it on through its own `test-proc-root` feature; check-boundary.sh checks that no default build
# has it.
test-proc-root = ["caller-identity-linux/fake"]

[dev-dependencies]
# The crate's own tests need its test-only features.
account-callers = {path = ".", features = ["test-proc-root"]}
base-testkit = {path = "../../base/base-testkit", features = ["dbus"]}
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[lints]
workspace = true
