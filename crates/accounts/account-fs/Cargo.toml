[package]
name = "account-fs"
description = "porter's file writer: atomic saves (a staging file, synced, renamed over the target, the directory synced) the one-file backup and (feature `book`) a kept document saved on the blocking pool. Std only by default; the one place porter's blocking file writes live."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"], optional = true}

[features]
# `book::commit`: a document saved off the async runtime's threads. A host that keeps a document
# (the Spaces, the identity uses) names it; the default stays std only.
book = ["dep:serde", "dep:serde_json", "dep:tokio"]

[dev-dependencies]
base-testkit = {path = "../../base/base-testkit"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[lints]
workspace = true
