[package]
name = "account-spaces"
description = "The registry of desktop-wide Spaces: the ids it mints, the per-app limit on making them, and spaces.json, kept with the same atomic save. The Spaces domain of the accounts daemon."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
account-core = {path = "../account-core"}
base-time = { path = "../../base/base-time" }
account-fs = {path = "../account-fs", features = ["book"]}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[dev-dependencies]
base-testkit = {path = "../../base/base-testkit"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[lints]
workspace = true
