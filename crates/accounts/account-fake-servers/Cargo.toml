[package]
name = "account-fake-servers"
description = "Test-only: fake OAuth issuer, IMAP, SMTP, Nextcloud, DAV, autoconfig, DNS and model-list servers on loopback or scratch sockets, built from the shipped provider files. Never a dependency of a non-test crate."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-testkit = {path = "../../base/base-testkit"}
base64 = { workspace = true }
account-dav-proto = {path = "../account-dav-proto"}
account-core = {path = "../account-core"}
account-ids = {path = "../account-ids"}
account-discover = {path = "../account-discover"}
account-fake = {path = "../account-fake"}
account-provider = {path = "../account-provider"}
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
rustls-pki-types = { workspace = true }
serde_json = { workspace = true }
form_urlencoded = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
md-5 = { workspace = true }
sha2 = { workspace = true }
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
tokio-rustls = { workspace = true, features = ["ring", "tls12", "logging"] }

[lints]
workspace = true
