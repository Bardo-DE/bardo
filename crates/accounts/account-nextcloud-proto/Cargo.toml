[package]
name = "account-nextcloud-proto"
description = "Nextcloud's own protocol with no IO: Login Flow v2, the OCS capabilities, the app-password revoke and the paths of a server, as requests (http::Request<Vec<u8>>) and parsers over the replies. The WebDAV walk is dav-proto's."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/porter"
publish = false

[dependencies]
account-core = {path = "../account-core"}
account-capability = {path = "../account-capability"}
account-ids = {path = "../account-ids"}
http = {version = "1"}
serde_json = {version = "1"}
thiserror = {version = "2"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
