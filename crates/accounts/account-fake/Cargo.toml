[package]
name = "account-fake"
description = "Test-only: fake providers, accounts, a scripted consent prompter and a fixed clock, so client and daemon tests run without a network."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
account-core = {path = "../account-core"}
account-capability = {path = "../account-capability"}
account-sheet = {path = "../account-sheet"}
account-wire = {path = "../account-wire"}
base-ids = { path = "../../base/base-ids" }
base-time = { path = "../../base/base-time" }
base-url = { path = "../../base/base-url" }
account-provider = {path = "../account-provider"}
account-secrets = {path = "../account-secrets", features = ["testing"]}
account-service = {path = "../account-service"}
account-service-core = {path = "../account-service-core"}

[dev-dependencies]
account-service-accounts = {path = "../account-service-accounts"}
base-testkit = {path = "../../base/base-testkit"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
account-match = {path = "../account-match"}
serde_json = { workspace = true }

[lints]
workspace = true
