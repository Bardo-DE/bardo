[package]
name = "account-http-reqwest"
description = "porter's one direct-connection HTTP client: reqwest behind the `Http` seam of account-http, with rustls and the platform's trust roots. The only crate in porter that names reqwest."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-url = { path = "../../base/base-url" }
account-http = {path = "../account-http"}
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
tokio = {workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"]}

[dev-dependencies]
account-core = {path = "../account-core"}
account-fake-servers = {path = "../account-fake-servers"}
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[lints]
workspace = true
