account-capability = {path = "../account-capability"}
account-sheet = {path = "../account-sheet"}
account-ids = {path = "../account-ids"}
serde = {version = "1", features = ["derive"]}
thiserror = {version = "2"}
toml = {version = "1"}

[dev-dependencies]

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
