[package]
name = "account-provider"
description = "Provider declarations (TOML files) and the Provider trait each protocol family implements."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/porter"
publish = false

[dependencies]
account-core = {path = "../account-core"}
