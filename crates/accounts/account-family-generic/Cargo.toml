[package]
name = "account-family-generic"
description = "The generic family: a mail server or a DAV server with a password, found by autoconfig, SRV and MX, .well-known or the provider file. A driver: account-generic-proto holds the servers a person typed and the DAV and JMAP lookups, and this crate sends them and tries the password at the mail server."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
account-family-kit = {path = "../account-family-kit"}
account-generic-proto = {path = "../account-generic-proto"}
account-core = {path = "../account-core"}
account-capability = {path = "../account-capability"}
account-sheet = {path = "../account-sheet"}
account-provider = {path = "../account-provider"}
account-http = {path = "../account-http"}
account-discover = {path = "../account-discover"}
account-proxy = {path = "../account-proxy", features = ["tls"]}
tokio = {workspace = true, features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"]}

[lints]
workspace = true
