[package]
name = "account-sheets"
description = "The bus side of the accounts service's sheets, for the daemon that shows one: BusSheets draws a sheet in the sheet host over org.bardo.AccountsSheet1, AppNames says what a person calls an app, and RequestObjects serves the portal-shaped Request object of a sheet method for accountd."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
dbus-kit = { path = "../../bus/dbus-kit" }
account-core = {path = "../account-core"}
account-capability = {path = "../account-capability"}
account-sheet = {path = "../account-sheet"}
account-wire = {path = "../account-wire"}
account-callers = {path = "../account-callers"}
account-dbus = {path = "../account-dbus"}
account-provider = {path = "../account-provider"}
serde_json = { workspace = true }
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
zbus = {workspace = true, features = ["tokio"]}
caller-role-types = {path = "../../identity/caller-role-types"}

[dev-dependencies]
base-testkit = {path = "../../base/base-testkit"}

[lints]
workspace = true
