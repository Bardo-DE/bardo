[package]
name = "account-families"
description = "The registry of the protocol families: DynProvider is account-provider's Provider as a trait object, the family that serves each provider file, and the small families (an API key, a coding agent that signs itself in, Tailscale). The families with a protocol of their own are account-family-oauth, -generic and -nextcloud."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
account-family-kit = {path = "../account-family-kit"}
account-family-nextcloud = {path = "../account-family-nextcloud", optional = true}
account-family-generic = {path = "../account-family-generic", optional = true}
account-family-oauth = {path = "../account-family-oauth", optional = true}
account-core = {path = "../account-core"}
account-capability = {path = "../account-capability"}
account-sheet = {path = "../account-sheet"}
base-ids = { path = "../../base/base-ids" }
base-time = { path = "../../base/base-time" }
base-url = { path = "../../base/base-url" }
account-provider = {path = "../account-provider"}
account-http = {path = "../account-http"}
account-http-reqwest = {path = "../account-http-reqwest", optional = true}
account-discover = {path = "../account-discover", optional = true}
account-tailscale = {path = "../account-tailscale", optional = true}
thiserror = { workspace = true, optional = true }

[dev-dependencies]
base-testkit = {path = "../../base/base-testkit", features = ["tokio"]}
account-fake = {path = "../account-fake"}
account-fake-servers = {path = "../account-fake-servers"}
tokio = {version = "1", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"]}
account-http-reqwest = {path = "../account-http-reqwest"}
account-secrets = {path = "../account-secrets", features = ["testing"]}
account-service = {path = "../account-service"}
account-service-core = {path = "../account-service-core"}
account-service-accounts = {path = "../account-service-accounts"}
account-wire = {path = "../account-wire"}
account-match = {path = "../account-match"}
account-discover = {path = "../account-discover"}
account-oauth = {path = "../account-oauth", features = ["io"]}
account-proxy = {path = "../account-proxy", features = ["tls"]}
account-dav-proto = {path = "../account-dav-proto"}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
base64 = { workspace = true }

[features]
# `set`: which provider files a daemon serves and the family of each (`set::load_specs`,
# `family_of`, `served`, `FamilyIo`), over every family it maps: nextcloud, generic, oauth,
# api_key, agent_login and tailnet, with the system resolver.
set = ["nextcloud", "generic", "oauth", "api_key", "agent_login", "tailnet", "dep:thiserror", "dep:account-discover", "account-discover/io", "dep:account-http-reqwest"]
# Nextcloud (account-family-nextcloud): Login Flow v2, OCS discovery, WebDAV, CalDAV, CardDAV, Notes.
nextcloud = ["dep:account-family-nextcloud"]
# Generic IMAP/SMTP and DAV with a password or app password, found by autoconfig
# (account-family-generic). The password is tried at the incoming mail server before the account is
# added (the relay's own login).
generic = ["dep:account-family-generic"]
# OAuth (account-family-oauth): PKCE through a loopback redirect, one family for every issuer (the
# rules of Google and Microsoft, and any issuer whose data in account-provider's `issuers.toml`
# says who answered). Google: Calendar, People, Tasks, the Drive app folder, Photos, and Gmail
# IMAP/SMTP XOAUTH2 for a client of the person's own. Microsoft: IMAP/SMTP XOAUTH2 and Graph.
oauth = ["dep:account-family-oauth"]
# AI providers with a pasted API key (Anthropic, OpenAI).
api_key = ["dep:account-http-reqwest"]
# Coding agents that sign themselves in (Claude Code, Gemini CLI, Codex): no credential held.
agent_login = []
# Tailscale on this computer: asked over its unix socket, no credential held.
tailnet = ["dep:account-tailscale", "account-tailscale/io"]

[lints]
workspace = true
