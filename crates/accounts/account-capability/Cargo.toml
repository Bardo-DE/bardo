[package]
name = "account-capability"
description = "porter's capability vocabulary (what an account can do for an app), what an account offers with its provenance, and the effective set once the person's switches apply."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/porter"
publish = false

[dependencies]
account-ids = {path = "../account-ids"}
serde = {version = "1", features = ["derive"]}

[dev-dependencies]
serde_json = {version = "1"}

[features]
# `fixtures`: the capabilities and claims the tests of this crate and of porter-match build from.
testing = []

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
