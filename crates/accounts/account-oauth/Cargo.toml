[package]
name = "account-oauth"
description = "OAuth for porter's families: PKCE, the loopback redirect rules, the client registry, renewal, and the token, refresh and revoke exchanges over the `Http` seam; the loopback listener is behind the `io` feature."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
account-core = {path = "../account-core"}
account-ids = {path = "../account-ids"}
account-http = {path = "../account-http"}
account-provider = {path = "../account-provider"}
base64 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
form_urlencoded = { workspace = true }
httparse = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tokio = {version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"], optional = true}

[dev-dependencies]
base-testkit = {path = "../../base/base-testkit"}
account-fake-servers = {path = "../account-fake-servers"}
tokio = {version = "1", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"]}

[features]
# `LoopbackServer`, the 127.0.0.1 listener. Pulls in the runtime, so it is off by default: the
# rules, the registry and the exchanges reach none.
io = ["dep:tokio"]

[lints]
workspace = true
