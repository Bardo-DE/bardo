[package]
name = "account-rig"
description = "Test tooling, never installed and never in dist: the rig a jailed scenario drives porter with. account-rig-servers starts account-fake-servers' fakes on loopback and plants known secrets, account-rig-client acts as an app over the session bus, account-rig-secrets is a fake org.freedesktop.secrets so the real accountd runs with no keyring. Nothing shipped depends on it."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/porter"
publish = false

[[bin]]
name = "account-rig-servers"
path = "src/bin/account-rig-servers.rs"

[[bin]]
name = "account-rig-client"
path = "src/bin/account-rig-client.rs"

[[bin]]
name = "account-rig-secrets"
path = "src/bin/account-rig-secrets.rs"

[dependencies]
base-testkit = {path = "../../base/base-testkit"}
account-fake-secret-service = {path = "../account-fake-secret-service"}
account-core = {path = "../account-core"}
account-capability = {path = "../account-capability"}
account-wire = {path = "../account-wire"}
account-ids = {path = "../account-ids"}
account-client = {path = "../account-client"}
account-client-dbus = {path = "../account-client-dbus"}
account-callers = {path = "../account-callers", features = ["test-proc-root"]}
account-fake = {path = "../account-fake"}
account-fake-servers = {path = "../account-fake-servers"}
clap = {version = "4", features = ["derive"]}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
# `signal` is what this crate adds to the pinned line: SIGTERM ends the servers cleanly.
tokio = {version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"]}
zbus = {version = "5.19", default-features = false, features = ["tokio"]}

[dev-dependencies]
account-daemon = { path = "../account-daemon" }
account-provider = {path = "../account-provider"}
account-secrets = {path = "../account-secrets", features = ["oo7"]}
account-service = {path = "../account-service"}
account-service-core = {path = "../account-service-core"}
rustix = {version = "1.1", default-features = false, features = ["std", "event", "fs", "net", "time", "process"]}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
