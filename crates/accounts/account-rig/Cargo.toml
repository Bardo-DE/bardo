[package]
name = "account-rig"
description = "Test tooling, never installed and never in dist: the rig a jailed scenario drives the accounts service with. account-rig-servers starts account-fake-servers' fakes on loopback and plants known secrets, account-rig-client acts as an app over the session bus, account-rig-secrets is a fake org.freedesktop.secrets so the real accountd runs with no keyring. Nothing shipped depends on it."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "account-rig-servers"
path = "src/bin/account-rig-servers.rs"

[[bin]]
name = "account-rig-client"
path = "src/bin/account-rig-client.rs"

[[bin]]
name = "account-rig-secrets"
path = "src/bin/account-rig-secrets.rs"

[dependencies]
base-testkit = {path = "../../base/base-testkit", features = ["dbus", "tokio"]}
account-fake-secret-service = {path = "../account-fake-secret-service"}
account-core = {path = "../account-core"}
account-capability = {path = "../account-capability"}
account-wire = {path = "../account-wire"}
base-fs = { path = "../../base/base-fs" }
account-client = {path = "../account-client"}
account-client-dbus = {path = "../account-client-dbus"}
account-callers = {path = "../account-callers", features = ["test-proc-root"]}
account-fake = {path = "../account-fake"}
account-fake-servers = {path = "../account-fake-servers"}
clap = {workspace = true, features = ["default", "derive"]}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# `signal` is what this crate adds to the pinned line: SIGTERM ends the servers cleanly.
tokio = {workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"]}
zbus = {workspace = true, features = ["tokio"]}

[dev-dependencies]
futures-util = { workspace = true }
account-daemon = { path = "../account-daemon" }
account-provider = {path = "../account-provider"}
account-secrets = {path = "../account-secrets", features = ["oo7"]}
account-service = {path = "../account-service"}
account-service-core = {path = "../account-service-core"}
rustix = {workspace = true, features = ["std", "event", "fs", "net", "time", "process"]}
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
base-time = { path = "../../base/base-time" }

[lints]
workspace = true
