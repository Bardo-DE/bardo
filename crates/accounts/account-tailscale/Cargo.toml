[package]
name = "account-tailscale"
description = "A client of Tailscale's LocalAPI: HTTP over the unix socket tailscaled serves, read for the status of this computer's tailnet, who a tailnet address belongs to, and Tailscale's own sign-in page. Typed Status and WhoIs; the socket I/O is behind the `io` feature."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-ids = { path = "../../base/base-ids" }
base-time = { path = "../../base/base-time" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
hyper = { workspace = true, optional = true, features = ["client", "http1"] }
hyper-util = { workspace = true, optional = true, features = ["tokio"] }
http-body-util = { workspace = true, optional = true }
tokio = {workspace = true, features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"], optional = true}

[dev-dependencies]
base-testkit = {path = "../../base/base-testkit", features = ["tokio"]}
# The integration tests use the client, which the `io` feature builds.
account-tailscale = {path = ".", features = ["io"]}
account-fake-servers = {path = "../account-fake-servers"}
tokio ={workspace = true, features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"]}

[features]
# `LocalApi`: the requests over tailscaled's unix socket, spoken with hyper's own HTTP/1 client
# (the watch stream is a chunked body that stays open, which http-core's whole-body client
# cannot read). Pulls in the runtime, so it is off by default: the pure build reaches none.
io = ["dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:tokio"]

[lints]
workspace = true
