[package]
name = "account-match"
description = "porter's offer/need matching engine, sans I/O: what an app asks for, and the one function that says whether an offer meets it."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/porter"
publish = false

[dependencies]
account-capability = {path = "../account-capability"}
account-ids = {path = "../account-ids"}
serde = {version = "1", features = ["derive"]}

[dev-dependencies]
account-capability = {path = "../account-capability", features = ["testing"]}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
