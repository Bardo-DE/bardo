[package]
name = "account-sheet"
description = "The add-account and sign-in sheet as values: views, inputs, progress and the pure stage machine, the hand-typed mail server form, and the words the sheet shows."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/porter"
publish = false

[dependencies]
account-core = {path = "../account-core"}
account-tailscale = {path = "../account-tailscale"}
account-capability = {path = "../account-capability"}
account-ids = {path = "../account-ids"}
account-wire = {path = "../account-wire"}
serde = {version = "1", features = ["derive"]}
thiserror = {version = "2"}

[dev-dependencies]
proptest = {version = "1"}
serde_json = {version = "1"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
