[package]
name = "account-wire"
description = "accounts's wire protocol: what an app asks accountd, what it answers, and the framing of a session socket."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
caller-identity-core = {default-features = false, path = "../../identity/caller-identity-core"}
account-core = {path = "../account-core"}
account-match = {path = "../account-match"}
account-capability = {path = "../account-capability"}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The shipped caller table is read by the role test, so the table reader is on.
caller-identity-core = {path = "../../identity/caller-identity-core"}


[lints]
workspace = true
