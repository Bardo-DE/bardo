[package]
name = "account-daemon"
description = "accounts's identity daemon: org.bardo.Accounts1 over account-service, holding the identities signed in on this computer, Spaces and Tailscale. The library serves the bus objects (Manager, Account, Identities1, Spaces1, Tailnet1, the Request objects and the settings module); the binary resolves its paths, builds the service over its seams and serves."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-xdg = { path = "../../base/base-xdg" }
dbus-kit = { path = "../../bus/dbus-kit" }
account-core = {path = "../account-core"}
account-match = {path = "../account-match"}
account-capability = {path = "../account-capability"}
account-sheet = {path = "../account-sheet"}
account-wire = {path = "../account-wire"}
base-ids = { path = "../../base/base-ids" }
base-time = { path = "../../base/base-time" }
account-daemon-support = {path = "../account-daemon-support"}
base-fs = {path = "../../base/base-fs"}
account-callers = {path = "../account-callers", features = ["file"]}
account-dbus = {path = "../account-dbus"}
account-families = {path = "../account-families", features = ["set"]}
account-family-oauth = {path = "../account-family-oauth"}
account-provider = {path = "../account-provider"}
account-proxy = {path = "../account-proxy", features = ["tls"]}
account-secrets = {path = "../account-secrets", features = ["oo7"]}
account-service = {path = "../account-service"}
account-service-accounts = {path = "../account-service-accounts"}
account-service-core = {path = "../account-service-core"}
account-identities = {path = "../account-identities"}
account-spaces = {path = "../account-spaces"}
account-settings = {path = "../account-settings"}
account-sheets = {path = "../account-sheets"}
account-store = {path = "../account-store"}
account-tailscale = {path = "../account-tailscale", features = ["io"]}
settings-dbus = { path = "../../settings/settings-dbus", features = ["tokio"] }
settings-types = { path = "../../settings/settings-types" }
clap = {workspace = true, features = ["default", "derive"]}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
toml = { workspace = true }
zbus = {workspace = true, features = ["tokio"]}
caller-role-types = {path = "../../identity/caller-role-types"}

[dev-dependencies]
# The client crates are tested against this daemon (tests/it/client), not the other way round.
account-client = {path = "../account-client"}
account-client-dbus = {path = "../account-client-dbus"}
base-testkit = {features = ["tokio"], path = "../../base/base-testkit"}
settings-dbus = { path = "../../settings/settings-dbus", features = ["tokio", "testing"] }
account-fake = {path = "../account-fake"}
account-fake-servers = {path = "../account-fake-servers"}
http-core = {path = "../../network/http-core"}
http-reqwest = {path = "../../network/http-reqwest"}
account-oauth = {path = "../account-oauth"}
rustix = {workspace = true, features = ["std", "event", "fs", "net", "time", "process"]}
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[features]
# Test builds only, never default and never in dist: `BARDO_ACCOUNTD_PROC_ROOT=<dir>` makes the binary
# read caller identities from <dir> instead of /proc, because the jailed and acceptance tests run
# processes outside service cgroups, and `BARDO_ACCOUNTD_SYSTEM_CALLERS=<file>` makes it read that file as
# the system caller table, because a jail cannot write /etc/bardo. A release build ignores both
# variables. A test in tests/dist.rs fails if this feature is ever default, and
# check-boundary.sh checks it too.
test-proc-root = ["account-callers/test-proc-root"]
# Test builds only, never default and never in dist: `BARDO_ACCOUNTD_KEYS=file:<absolute path>` keeps
# credentials in one 0600 plain-text JSON file (account-secrets' `FileSecrets`) instead of the
# Secret Service, for private-bus and scratch runs with no keyring. A release build ignores the
# variable and says so once. tests/dist.rs and check-boundary.sh fail if this feature is default.
test-keys = ["account-secrets/test-keys"]

[lints]
workspace = true
[[bin]]
name = "bardo-accountd"
path = "src/main.rs"
