[package]
name = "account-service"
description = "accountd's core over its seams (providers, secrets, the consent prompter, the clock): AccountService, the facade a host holds over the accounts and grants domains. It answers AccountsRequest for any transport, or in process."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/porter"
publish = false

[dependencies]
account-service-core = {path = "../account-service-core"}
account-sheet = {path = "../account-sheet"}
account-service-accounts = {path = "../account-service-accounts"}
account-service-grants = {path = "../account-service-grants"}
account-core = {path = "../account-core"}
account-match = {path = "../account-match"}
account-capability = {path = "../account-capability"}
account-wire = {path = "../account-wire"}
account-ids = {path = "../account-ids"}
account-provider = {path = "../account-provider"}
account-secrets = {path = "../account-secrets"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
