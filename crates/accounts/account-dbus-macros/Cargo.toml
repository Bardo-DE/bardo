[package]
name = "account-dbus-macros"
description = "porter-dbus's one attribute: a bus interface written once, as the client's proxy trait, becomes its proxy, the trait a daemon implements and the zbus object that serves it."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/porter"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = {version = "1"}
quote = {version = "1"}
syn = {version = "2", features = ["full"]}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
