[package]
name = "account-calendar"
description = "One calendar store for every accounts client: list calendars, put an event (as iCalendar for the stores that take it, as its fields for the ones that take JSON), find one by UID and remove one. Backends: CalDAV, Microsoft Graph, the Google Calendar API and JMAP over the HTTP seam, and Evolution Data Server over D-Bus (feature `eds`). Pure but for `eds`: no runtime, no socket."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
jiff = { workspace = true }
account-dav-proto = {path = "../account-dav-proto", features = ["discover"]}
http-core = {path = "../../network/http-core"}
base-url = { path = "../../base/base-url" }
serde_json = { workspace = true }
thiserror = { workspace = true }
zbus = { workspace = true, features = ["tokio"], optional = true }

[features]
# Evolution Data Server, the calendar store of GNOME and of most Linux desktops, over the session
# bus. Off by default: it is the one backend that reaches a bus.
eds = ["dep:zbus"]

[dev-dependencies]
base64 = { workspace = true }
account-fake-servers = {path = "../account-fake-servers"}
http-relay = {path = "../http-relay"}
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"] }

[lints]
workspace = true
