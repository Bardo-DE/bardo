[package]
name = "settings-app"
description = "The desktop's Settings app."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
clap = {workspace = true, features = ["default", "derive"]}
settings-app-callers = {path = "../settings-app-callers", optional = true}
settings-app-client = {path = "../settings-app-client"}
settings-app-files = {path = "../settings-app-files"}
settings-app-intents = {path = "../settings-app-intents"}
settings-app-link = {path = "../settings-app-link"}
settings-app-system = {path = "../settings-app-system"}
settings-app-model = {path = "../settings-app-model"}
settings-app-ui = {path = "../settings-app-ui"}
ui-blitz = {path = "../../ui/ui-blitz"}
base-xdg = { path = "../../base/base-xdg" }
settings-store-fs = { path = "../../settings/settings-store-fs" }
ui-settings = { path = "../../ui/ui-settings", features = ["tokio"] }
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"]}

[features]
# `bardo-settings --dev-callers FILE`: the stand-ins a checkout built, named in the person's own rows file,
# are let in as the desktop's services (accountd, inferd, syncd, the compositor, the shell) at a
# standing below every real proof. Off by default; the desktop's test jail builds with it, a
# release build never does.
dev-callers = ["dep:settings-app-callers", "settings-app-callers/dev-callers"]

[dev-dependencies]
base-testkit = {path = "../../base/base-testkit"}
toml = { workspace = true }

[lints]
workspace = true
[[bin]]
name = "bardo-settings"
path = "src/main.rs"
