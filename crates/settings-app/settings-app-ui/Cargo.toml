[package]
name = "settings-app-ui"
description = "The Settings window: sidebar, pages and controls, drawn only with the UI kit's components."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The compiler is the fence: the window names only the client (its one door to the computer), the
# model (its facts, and the other crates' types they are made of) and bardo. Never settings-app-files,
# settings-app-system, accounts-*, memory-*, actions-* or zbus.
settings-app-client = {path = "../settings-app-client"}
settings-app-model = {path = "../settings-app-model"}
dioxus = { workspace = true, features = ["macro", "html", "hooks", "signals"] }
ui-components = {path = "../../ui/ui-components"}
ui-helpers = {path = "../../ui/ui-helpers", default-features = false}
ui-lint = {path = "../../ui/ui-lint"}
settings-store-fs = { path = "../../settings/settings-store-fs" }
settings-types = { path = "../../settings/settings-types" }
ui-settings = { path = "../../ui/ui-settings", default-features = false, features = ["dioxus"] }
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"]}
ui-host-hooks = {path = "../../ui/ui-host-hooks"}

[dev-dependencies]
# The runtime the coherence test enters (`ui_blitz::enter_runtime`).
ui-blitz = {path = "../../ui/ui-blitz"}
memory-dbus = { path = "../../memory/memory-dbus" }
account-capability = {path = "../../accounts/account-capability"}
# Fixtures: the in-memory links (the daemons' live settings modules among them: `FakeModules`) and
# the test kit, and the UI kit's harness. The tests that stand a service that is no live module up on a
# private bus (the portal, running models, the engines, computers, memory, the sync service, and
# the owner checks) need the commented ones below.
settings-app-link = {path = "../settings-app-link"}
settings-app-system = {path = "../settings-app-system", features = ["testing"]}
settings-app-testkit = {path = "../settings-app-testkit"}
settings-dbus = { path = "../../settings/settings-dbus", features = ["testing"] }
dioxus-ssr = { workspace = true }
ui-harness = {path = "../../ui/ui-harness"}
image = { workspace = true, features = ["png", "jpeg"] }
toml = { workspace = true }
# A stand-in service on a private bus is vouched for by `AnyOwner`, or by the role check over peers
# a test introduces owners to (the squatter tests).
settings-app-callers = {path = "../settings-app-callers", features = ["testing"]}
# Reads and writes the settings files and desktop entries the tests seed and check.
settings-app-files = {path = "../settings-app-files"}
# The stand-in daemons' wire: bus names, paths and the zbus interfaces they serve (accountd's and
# syncd's from the sync service, inferd's from the inference service).
sync-bus = {path = "../../sync/sync-bus"}
account-dbus = {path = "../../accounts/account-dbus"}
account-wire = {path = "../../accounts/account-wire"}
inference-dbus = {path = "../../inference/inference-dbus"}
zbus = {workspace = true, features = ["default", "tokio"]}
# The Intelligence test's stand-in inferd answers with the accounts service's kinds and inference types.
account-core = {path = "../../accounts/account-core"}
inference-core = {path = "../../inference/inference-core"}
# The Assistants test reads the actions service's places file.
action-settings = {path = "../../actions/action-settings"}
# The lending test's service manager implements inferd's `UnitManager`.
inference-client = {path = "../../inference/inference-client", features = ["lending"]}
# The Keyboard test names chords.
keymap = {path = "../../keymap/keymap"}
dbus-kit = { path = "../../bus/dbus-kit" }
# The settle waits on real threads with the one deadline.
base-testkit = {path = "../../base/base-testkit"}

[lints]
workspace = true
