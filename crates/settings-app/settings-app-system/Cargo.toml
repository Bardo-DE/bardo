[package]
name = "settings-app-system"
description = "Every service the Settings app reaches: one Link trait per service, the real zbus implementation, and an in-memory fake for tests."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The in-memory fakes of the links, for tests of the layers above.
testing = ["zbus/p2p"]

[dependencies]
shell-dbus = { path = "../../shell/shell-dbus" }
portal-dbus = { path = "../../portal/portal-dbus" }
memory-dbus = { path = "../../memory/memory-dbus" }
updater-dbus = { path = "../../updater/updater-dbus" }
base-time = { path = "../../base/base-time" }
base-xdg = { path = "../../base/base-xdg" }
base-clock = { path = "../../base/base-clock" }
inference-tailnet = {path = "../../inference/inference-tailnet"}
account-wire = {path = "../../accounts/account-wire"}
bluez-proxy = {default-features = false, features = ["tokio"], path = "../../network/bluez-proxy"}
networkmanager-proxy = {default-features = false, features = ["tokio"], path = "../../network/networkmanager-proxy"}
memory-core = {path = "../../memory/memory-core"}
anyview-core = {path = "../../anyview/crates/anyview-core"}
anyview-fs = {path = "../../anyview/crates/anyview-fs"}
anyview-image = {path = "../../anyview/crates/anyview-image"}
anyview-platform = {path = "../../anyview/crates/anyview-platform"}
desktop-protocols = {path = "../../wayland/desktop-protocols"}
desktop-client = {path = "../../wayland/desktop-client", features = ["client"]}
settings-app-callers = {path = "../settings-app-callers"}
settings-app-link = {path = "../settings-app-link"}
settings-app-files = {path = "../settings-app-files"}
settings-app-model = {path = "../settings-app-model"}
settings-dbus = { path = "../../settings/settings-dbus", features = ["tokio"] }
settings-proto = { path = "../../settings/settings-proto" }
settings-types = { path = "../../settings/settings-types" }
md-5 = { workspace = true }
engine-install = {path = "../../engines/engine-install"}
engine-manifest = {path = "../../engines/engine-manifest"}
engine-fs = {path = "../../engines/engine-fs"}
engine-spec = {path = "../../engines/engine-spec"}
inference-client = {path = "../../inference/inference-client", features = ["dbus", "lending"]}
model-catalog = {path = "../../models/model-catalog"}
account-client = {path = "../../accounts/account-client"}
account-client-dbus = {path = "../../accounts/account-client-dbus"}
account-core = {path = "../../accounts/account-core"}
account-callers = {path = "../../accounts/account-callers"}
sync-bus = {path = "../../sync/sync-bus"}
account-dbus = {path = "../../accounts/account-dbus"}
inference-dbus = {path = "../../inference/inference-dbus"}
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = {workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"]}
toml = { workspace = true }
zbus = {workspace = true, features = ["default", "tokio"]}
dbus-kit = { path = "../../bus/dbus-kit" }

[dev-dependencies]
# The integration tests use the fakes, which the library has behind `testing`.
base-testkit = {path = "../../base/base-testkit", features = ["dbus"]}
settings-app-system = {path = ".", features = ["testing"]}
settings-app-callers = {path = "../settings-app-callers", features = ["testing"]}
settings-dbus = { path = "../../settings/settings-dbus", features = ["testing"] }

[lints]
workspace = true
