[package]
name = "settings-app-model"
description = "Pure model of the Settings app: schema discovery, page and section grouping, controls per key kind, search."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/detent"
publish = false

[dependencies]
action-manifest = {path = "../../actions/action-manifest"}
action-vocab = {path = "../../actions/action-vocab"}
account-tailscale = {path = "../../accounts/account-tailscale"}
inference-tailnet = {path = "../../inference/inference-tailnet"}
account-sheet = {path = "../../accounts/account-sheet"}
account-capability = {path = "../../accounts/account-capability"}
account-ids = {path = "../../accounts/account-ids"}
memory-core = {path = "../../memory/memory-core"}
keymap = {path = "../../keymap/keymap"}
action-core = {path = "../../actions/action-core"}
action-settings = {path = "../../actions/action-settings"}
ui-helpers = {path = "../../ui/ui-helpers", default-features = false}
ui-settings = {path = "../../ui/ui-settings"}
key-remap-client = {path = "../../input/key-remap-client"}
account-core = {path = "../../accounts/account-core"}
inference-core = {path = "../../inference/inference-core"}
regex = {version = "1", default-features = false, features = ["std", "perf", "unicode"]}
toml = {version = "1"}

[dev-dependencies]
settings-app-testkit = {path = "../settings-app-testkit"}
serde_json = {version = "1"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
