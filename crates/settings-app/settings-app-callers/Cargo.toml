[package]
name = "settings-app-callers"
description = "Which program is on the other end of a bus name: the desktop's caller table over the caller-identity library, as the owner check the live client asks and the peers the activation object judges its callers with."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
updater-dbus = { path = "../../updater/updater-dbus" }
sync-bus = { path = "../../sync/sync-bus" }
shell-dbus = { path = "../../shell/shell-dbus" }
portal-dbus = { path = "../../portal/portal-dbus" }
memory-dbus = { path = "../../memory/memory-dbus" }
compositor-dbus = { path = "../../compositor/compositor-dbus" }
account-wire = { path = "../../accounts/account-wire" }
# `OwnerCheck`, `SenderName` and `Verdict`: the check this crate answers.
settings-dbus = { path = "../../settings/settings-dbus" }
caller-identity-dbus = {default-features = false, features = ["desktop", "tokio"], path = "../../identity/caller-identity-dbus"}
rustix = {workspace = true, features = ["std", "process"], optional = true}
thiserror = { workspace = true, optional = true }
zbus = {workspace = true, features = ["default", "tokio"]}

[dev-dependencies]
settings-app-testkit = {path = "../settings-app-testkit"}

[features]
# Test seams: a standing introduced for a bus name's owner, and peers over an empty table. A shipped
# binary never enables it; a dev-dependency does.
testing = ["caller-identity-dbus/fake"]
# `bardo-settings --dev-callers FILE`: callers named in a person's own rows file are let in at `Proof::Dev`
# (the caller-identity library's `dev-rows`). Off by default; only the `bardo-settings` binary's feature of the same name turns it
# on, so no shipped build has it.
dev-callers = ["caller-identity-dbus/dev-rows", "dep:rustix", "dep:thiserror"]

[lints]
workspace = true
