[package]
name = "settings-app-client"
description = "The one door the Settings window uses: a live value per pane, and the commands the person gives it."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
settings-app-files = {path = "../settings-app-files"}
settings-app-model = {path = "../settings-app-model"}
settings-app-system = {path = "../settings-app-system"}
ui-settings = {path = "../../ui/ui-settings", features = ["live", "tokio"]}
inference-core = {path = "../../inference/inference-core"}
account-provider = {path = "../../accounts/account-provider"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros"]}
toml = { workspace = true }

[dev-dependencies]
memory-core = {path = "../../memory/memory-core"}
# The tests of the panes run over the in-memory links.
settings-app-system = {path = "../settings-app-system", features = ["testing"]}
ui-settings = {path = "../../ui/ui-settings", features = ["testing"]}

[lints]
workspace = true
