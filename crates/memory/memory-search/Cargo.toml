[package]
name = "memory-search"
description = "How memory is searched, as pure values: the recall documents that facts and events contribute to the index, and Search and Inject over a narrow reader of a Space's log, index and stored facts (fused lexical and semantic ranking, reciprocal-rank merging, the token budget)."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/almanac"
publish = false

[dependencies]
memory-core = {path = "../memory-core"}
memory-store = {path = "../memory-store"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
