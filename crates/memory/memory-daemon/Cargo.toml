[package]
name = "memory-daemon"
description = "memory's memory daemon: serves org.bardo.Memory1 over memory-service, with the real seams (Secret Service keys, SQLCipher, sealed files, inferd models)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `BARDO_MEMORYD_KEYS=file:<path>` selects a file-backed key store (`memory_keyfile::FileKeys`), for a
# jailed acceptance run with no Secret Service. TEST ONLY: off by default, never in a release or
# dist build; without it the variable is ignored.
test-keys = ["dep:memory-keyfile"]
# `BARDO_MEMORYD_PROC_ROOT=<dir>` makes the daemon read `<dir>/<pid>/cgroup` for its callers instead of
# `/proc/<pid>/cgroup`, so an acceptance run can present its test processes as units. TEST ONLY:
# off by default, never in a release or dist build (check-boundary.sh fails if a default build
# has it); without it the variable is ignored.
test-proc-root = ["account-callers/test-proc-root"]

[dependencies]
base-fs = { path = "../../base/base-fs" }
base-time = { path = "../../base/base-time" }
base-xdg = { path = "../../base/base-xdg" }
memory-core = {path = "../memory-core"}
memory-seal = {path = "../memory-seal", features = ["oo7"]}
memory-keyfile = {path = "../memory-keyfile", optional = true}
memory-eventlog = {path = "../memory-eventlog"}
memory-store = {path = "../memory-store"}
memory-files = {path = "../memory-files"}
memory-recall = {path = "../memory-recall"}
memory-host = {path = "../memory-host"}
memory-service = {path = "../memory-service"}
memory-infer = {path = "../memory-infer"}
memory-tidy = {path = "../memory-tidy"}
memory-settings = {path = "../memory-settings"}
settings-store = { path = "../../settings/settings-store" }
settings-store-fs = { path = "../../settings/settings-store-fs" }
memory-watch = {path = "../memory-watch"}
memory-dbus = {path = "../memory-dbus"}
account-core = {path = "../../accounts/account-core"}
account-callers = {features = ["file"], path = "../../accounts/account-callers"}
account-client-dbus = {path = "../../accounts/account-client-dbus"}
inference-client = {features = ["dbus"], path = "../../inference/inference-client"}
clap = {workspace = true, features = ["default", "derive"]}
getrandom = { workspace = true }
landlock = { workspace = true }
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
zbus = {workspace = true, features = ["tokio"]}
serde_json = { workspace = true }
blake3 = { workspace = true }
caller-role-types = {path = "../../identity/caller-role-types"}

[dev-dependencies]
account-wire = {path = "../../accounts/account-wire"}
account-capability = {path = "../../accounts/account-capability"}
base-ids = { path = "../../base/base-ids" }
inference-core = {path = "../../inference/inference-core"}
account-dbus = {path = "../../accounts/account-dbus"}
inference-dbus = {path = "../../inference/inference-dbus"}
# The tests present their processes as a fixture tree, which porter reads only in a test build.
memory-daemon = { path = ".", features = ["test-proc-root"] }
memory-client = {path = "../memory-client", default-features = false, features = ["dbus"]}
memory-fake = {path = "../memory-fake"}
memory-seal = {path = "../memory-seal", features = ["oo7", "testing"]}
memory-recall = {path = "../memory-recall", features = ["testing"]}
tar = {workspace = true, features = ["default"]}
tempfile = { workspace = true }
dbus-kit = { path = "../../bus/dbus-kit" }

[lints]
workspace = true
[[bin]]
name = "bardo-memoryd"
path = "src/main.rs"
