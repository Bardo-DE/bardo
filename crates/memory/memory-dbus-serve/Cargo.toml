[package]
name = "memory-dbus-serve"
description = "The daemon's half of almanac's D-Bus API: the org.bardo.Memory1 objects served over a handler, the signals, and the introspection."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
memory-core = {path = "../memory-core"}
memory-dbus = {path = "../memory-dbus"}
zbus = {version = "5.19", default-features = false, features = ["tokio"]}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
zbus-ready = { path = "../../zbus-ready" }

[lints]
workspace = true
