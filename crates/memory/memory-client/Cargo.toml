[package]
name = "memory-client"
description = "The app-facing memory API: Memory over a Transport (in process, absent, or D-Bus)."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/almanac"
publish = false

[dependencies]
memory-core = {path = "../memory-core"}
memory-service = {path = "../memory-service", optional = true}
memory-dbus = {path = "../memory-dbus", optional = true}
thiserror = {version = "2"}

[dev-dependencies]
memory-fake = {path = "../memory-fake"}
memory-seal = {path = "../memory-seal"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[features]
# The app-level desktop switch (design/36): on by default, an app on macOS or Windows builds with
# `default-features = false` and `in_process`. It says "this app is on the Quire desktop"; the
# platform feature it implies (`dbus`, what the OS provides) keeps its name.
default = ["quire-desktop"]
quire-desktop = ["dbus"]
# Hosting the service in the app (`InProcess`, tests, single-process embedders). Off by default,
# so a D-Bus client does not link SQLCipher or OpenSSL.
in_process = ["dep:memory-service"]
# The D-Bus transport (Linux, the desktop's memoryd).
dbus = ["dep:memory-dbus"]

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
