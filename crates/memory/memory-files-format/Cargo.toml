[package]
name = "memory-files-format"
description = "almanac's agent memory file format: parse and render of topic files and trailers, and the fact store over a vault seam. No file IO."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
memory-core = {path = "../memory-core"}
memory-store = {path = "../memory-store"}
jiff = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
memory-files = {path = "../memory-files", features = ["testing"]}
tempfile = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
