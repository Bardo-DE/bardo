[package]
name = "memory-fake"
description = "Test-only: a fake MemoryService over in-memory seams, a stepped clock, a scripted consolidator and fixtures."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-time = { path = "../../base/base-time" }
memory-core = {path = "../memory-core"}
memory-seal = {path = "../memory-seal", features = ["testing"]}
memory-eventlog = {path = "../memory-eventlog", features = ["testing"]}
memory-store = {path = "../memory-store"}
memory-files = {path = "../memory-files", features = ["testing"]}
memory-recall = {path = "../memory-recall", features = ["testing"]}
memory-service = {path = "../memory-service"}
memory-tidy = {path = "../memory-tidy"}
memory-files-format = {path = "../memory-files-format"}
chrono = { workspace = true, features = ["std"] }
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }
tempfile = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
memory-settings = {path = "../memory-settings"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
tar = {version = "0.4"}
toml = { workspace = true }

[lints]
workspace = true
