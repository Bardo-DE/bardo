[package]
name = "memory-seal"
description = "memory's per-Space keys, subkey derivation, the sealed-file format and the key store seam."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-random = { path = "../../base/base-random" }
const-hex = { workspace = true }
memory-core = {path = "../memory-core"}
blake3 = { workspace = true }
chacha20poly1305 = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
oo7 = { workspace = true, optional = true }

[dev-dependencies]
memory-seal = { path = ".", features = ["testing", "oo7"] }
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[features]
# `MemoryKeys`, for tests and memory-fake.
testing = []
# `Oo7Keys`, the Secret Service key store.
oo7 = ["dep:oo7"]

# blake3's portable Rust implementation (no C/assembly SIMD), for a cross build with no C
# compiler for the target. Off by default: the desktop keeps blake3's fast paths.
pure-hash = ["blake3/pure"]

[lints]
workspace = true
