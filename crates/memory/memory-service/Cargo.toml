[package]
name = "memory-service"
description = "memoryd's core over seams: authorisation, the Space and forget machines, the run that drives memory-tidy's fact and consolidation machines over a backend, retention, the readers (search itself is memory-search's), timeline assembly, export, the per-Space request queue, and MemoryService."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
const-hex = { workspace = true }
base-time = { path = "../../base/base-time" }
memory-core = {path = "../memory-core"}
memory-seal = {path = "../memory-seal"}
memory-search = {path = "../memory-search"}
memory-settings = {path = "../memory-settings"}
memory-tidy = {path = "../memory-tidy"}
blake3 = { workspace = true }
chrono = { workspace = true, features = ["std"] }
memory-store = {path = "../memory-store"}
memory-files-format = {path = "../memory-files-format"}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tar = {workspace = true, features = ["default"]}
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
memory-fake = {path = "../memory-fake"}
memory-seal = {path = "../memory-seal", features = ["testing"]}
memory-eventlog = {path = "../memory-eventlog", features = ["testing"]}
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[lints]
workspace = true
