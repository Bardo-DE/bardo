[package]
name = "memory-files"
description = "almanac's agent memory files on disk: the plain and sealed directory vaults, and an in-memory vault for tests."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/almanac"
publish = false

[dependencies]
memory-core = {path = "../memory-core"}
memory-seal = {path = "../memory-seal"}
memory-store = {path = "../memory-store"}

[dev-dependencies]
memory-files = { path = ".", features = ["testing"] }
tempfile = {version = "3"}

[features]
# `MemoryVault`, for tests and almanac-fake.
testing = []

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
