[package]
name = "memory-recall"
description = "A rebuildable search index: FTS5 lexical search, Embedder and VectorIndex traits, exact-scan vectors and reciprocal-rank fusion. Generic: knows nothing of almanac (its seam types live in memory-store)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
memory-core = {path = "../memory-core"}
memory-store = {path = "../memory-store"}
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }
thiserror = { workspace = true }

[dev-dependencies]
memory-recall = { path = ".", features = ["testing"] }
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
tempfile = { workspace = true }

[features]
# `FakeEmbedder`, for tests and memory-fake.
testing = []

[lints]
workspace = true
