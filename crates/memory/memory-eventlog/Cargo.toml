[package]
name = "memory-eventlog"
description = "almanac's typed, append-only, hash-chained per-Space event log (also the audit log)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
memory-core = {path = "../memory-core"}
memory-seal = {path = "../memory-seal"}
memory-store = {path = "../memory-store"}
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
const-hex = { workspace = true }
memory-eventlog = { path = ".", features = ["testing"] }
memory-seal = {path = "../memory-seal", features = ["testing"]}
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }
tempfile = { workspace = true }

[features]
# `MemoryLog`, for tests and memory-fake.
testing = []

[lints]
workspace = true
