[package]
name = "memory-infer"
description = "memory's two models through inferd (org.bardo.Inference1, over inference-client's Transport): an embedder for recall and a consolidator that drafts hunks, each with its deadlines. No daemon: an app that is not memoryd can use them over its own transport."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
account-match = {path = "../../accounts/account-match"}
account-capability = {path = "../../accounts/account-capability"}
base-ids = { path = "../../base/base-ids" }
memory-store = {path = "../memory-store"}
memory-tidy = {path = "../memory-tidy"}
inference-client = {path = "../../inference/inference-client"}
account-core = {path = "../../accounts/account-core"}
inference-core = {path = "../../inference/inference-core"}
thiserror = { workspace = true }
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[dev-dependencies]
memory-core = {path = "../memory-core"}
memory-fake = {path = "../memory-fake"}
memory-recall = {path = "../memory-recall", features = ["testing"]}

[lints]
workspace = true
