[package]
name = "memory-dbus"
description = "memory's D-Bus API: org.bardo.Memory1 as zbus proxies, the argument codec, the errors and bus names, and the daemon's half: the served objects, the signals and the introspection."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
caller-identity-core = {default-features = false, path = "../../identity/caller-identity-core"}
memory-core = {path = "../memory-core"}
zbus = {workspace = true, features = ["tokio"]}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
dbus-kit = { path = "../../bus/dbus-kit" }

[dev-dependencies]
# The shipped caller table is read by the role test, so the table reader is on.
caller-identity-core = {path = "../../identity/caller-identity-core"}

[lints]
workspace = true
