[package]
name = "memory-dbus"
description = "almanac's D-Bus API: org.quire.Memory1 as zbus proxies, the argument codec, the errors and bus names. The daemon's half is almanac-dbus-serve."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/almanac"
publish = false

[dependencies]
memory-core = {path = "../memory-core"}
zbus = {version = "5.19", default-features = false, features = ["tokio"]}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
thiserror = {version = "2"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
