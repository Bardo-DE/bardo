[package]
name = "memory-dbus"
description = "almanac's D-Bus API: org.bardo.Memory1 as zbus proxies, the argument codec, the errors and bus names. The daemon's half is memory-dbus-serve."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
memory-core = {path = "../memory-core"}
zbus = {version = "5.19", default-features = false, features = ["tokio"]}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
