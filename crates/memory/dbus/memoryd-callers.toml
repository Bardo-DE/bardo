# Who may call memoryd (org.bardo.Memory1): a caller is the systemd unit behind the bus
# connection (the bus names its process, /proc/<pid>/cgroup names the unit). An app in its own
# app scope (app-<id>-<n>.scope) or Flatpak scope is an app without a row here; any process in
# neither (a terminal's child, an unlisted unit) is refused.
#
# The shell runs as bardo-shell.service and the System Settings app as org.bardo.Settings.service. A scope
# never carries a fixed role (porter's caller table gives a scope row a plain app's standing), so
# neither has a scope row.
#
# Install as /etc/bardo/memoryd-callers.toml; the user's ~/.config/bardo/memoryd/callers.toml is
# laid over it (a user row replaces the system row for the same unit).
#
# The four fixed callers are told apart by role and app together:
#   role "agent"      + app org.bardo.Intents -> the router (bardo-actiond)
#   role "cua"                                -> bardo-computer-use
#   role "sheet_host" + app org.bardo.Shell   -> the shell (bardo-shell)
#   role "settings"   + app org.bardo.Settings -> the Settings app (bardo-settings)
# Every other row is an app with that identity.

[[caller]]
app = "org.bardo.Intents"
unit = "bardo-actiond.service"
role = "agent"

[[caller]]
app = "org.bardo.ComputerUse"
unit = "bardo-computer-use.service"
role = "cua"

[[caller]]
app = "org.bardo.Shell"
unit = "bardo-shell.service"
role = "sheet_host"
exe = ["/usr/bin/bardo-shell", "/usr/local/bin/bardo-shell", "/opt/bardo/releases/*/bin/bardo-shell"]

[[caller]]
app = "org.bardo.Settings"
unit = "org.bardo.Settings.service"
role = "settings"
exe = ["/usr/bin/bardo-settings", "/usr/local/bin/bardo-settings", "/opt/bardo/releases/*/bin/bardo-settings"]

[[caller]]
app = "org.bardo.Companion"
unit = "bardo-companiond.service"
role = "agent"

[[caller]]
app = "org.bardo.Reader"
unit = "bardo-readerd.service"
role = "agent"
