[package]
name = "memory-local"
description = "A portable on-disk Backend for an app that hosts its own memory (mailo on macOS and Windows): SQLCipher log and index, sealed files, provided keys, no daemon."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
memory-core = {path = "../memory-core"}
memory-seal = {path = "../memory-seal"}
memory-host = {path = "../memory-host"}
memory-service = {path = "../memory-service"}
memory-tidy = {path = "../memory-tidy"}
memory-eventlog = {path = "../memory-eventlog"}
memory-store = {path = "../memory-store"}
memory-files = {path = "../memory-files"}
memory-recall = {path = "../memory-recall"}
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }
getrandom = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
memory-settings = {path = "../memory-settings"}
memory-client = {path = "../memory-client", default-features = false, features = ["in_process"]}
memory-fake = {path = "../memory-fake"}
tempfile = { workspace = true }
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[lints]
workspace = true
