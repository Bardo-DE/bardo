[package]
name = "speech-vad"
description = "Voice-activity helpers that need no model: the energy gate, the framer, the level meter and the endpointing machine."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/stoker"
publish = false

[dependencies]
speech-provider = {path = "../speech-provider"}
serde = {version = "1", features = ["derive"]}
thiserror = {version = "2"}

[dev-dependencies]
serde_json = {version = "1"}
proptest = {version = "1"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
