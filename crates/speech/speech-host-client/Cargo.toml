[package]
name = "speech-host-client"
description = "The client of the speech-host engine process: a SpeechToText over its Unix socket."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/stoker"
publish = false

[features]
default = ["net"]
# The socket client: the `SpeechToText` impl and the framing over a Unix stream. Off, the crate
# keeps its plain types (`HostSocket`, `SpeechHostClient`, `FrameBuffer`) and needs no runtime.
net = ["dep:tokio"]

[dependencies]
speech-provider = {path = "../speech-provider"}
model-provider = {path = "../../models/model-provider"}
serde = {version = "1", features = ["derive"]}
tokio = {version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"], optional = true}

[dev-dependencies]
proptest = {version = "1"}
serde_json = {version = "1"}
tokio = {version = "1", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"]}
speech-provider = {path = "../speech-provider", features = ["testing"]}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
