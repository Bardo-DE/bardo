[package]
name = "speech-host-client"
description = "The client of the bardo-speech-host engine process: a SpeechToText over its Unix socket."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["net"]
# The socket client: the `SpeechToText` impl and the framing over a Unix stream. Off, the crate
# keeps its plain types (`HostSocket`, `SpeechHostClient`, `FrameBuffer`) and needs no runtime.
net = ["dep:tokio"]

[dependencies]
speech-core = {path = "../../models/speech-core"}
model-types = {path = "../../models/model-types"}
serde = { workspace = true, features = ["derive"] }
tokio = {workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"], optional = true}

[dev-dependencies]
proptest = { workspace = true }
tokio = {workspace = true, features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"]}

[lints]
workspace = true
