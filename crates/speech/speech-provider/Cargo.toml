[package]
name = "speech-provider"
description = "Speech in and out as traits: audio types, transcript events, the speech-to-text and text-to-speech seams, voice-activity detection, capabilities and the host wire."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/stoker"
publish = false

[dependencies]
model-provider = {path = "../../models/model-provider"}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
thiserror = {version = "2"}
base64 = {version = "0.22"}
zeroize = {version = "1"}

[dev-dependencies]

[features]
# `ScriptedStt`, `ScriptedTts` and `ScriptedVad`: fakes that play scripts and record requests.
testing = []

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
