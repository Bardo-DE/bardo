inference-core = {path = "../../inference/inference-core"}
speech-provider = {path = "../speech-provider"}
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
account-capability = {path = "../../accounts/account-capability"}
serde_json = { workspace = true }

