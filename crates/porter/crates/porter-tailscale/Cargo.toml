[package]
name = "porter-tailscale"
description = "A client of Tailscale's LocalAPI: HTTP over the unix socket tailscaled serves, read for the status of this computer's tailnet, who a tailnet address belongs to, and Tailscale's own sign-in page. Typed Status and WhoIs; the socket I/O is behind the `io` feature."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/porter"
publish = false

[dependencies]
porter-ids = {path = "../porter-ids"}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
thiserror = {version = "2"}
hyper = {version = "1", optional = true, features = ["client", "http1"]}
hyper-util = {version = "0.1.21", optional = true, features = ["tokio"]}
http-body-util = {version = "0.1", optional = true}
tokio = {version = "1", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"], optional = true}

[dev-dependencies]
test-kit = {path = "../test-kit"}
# The integration tests use the client, which the `io` feature builds.
porter-tailscale = {path = ".", features = ["io"]}
porter-fake-servers = {path = "../porter-fake-servers"}
tokio ={version = "1", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"]}

[features]
# `LocalApi`: the requests over tailscaled's unix socket, spoken with hyper's own HTTP/1 client
# (the watch stream is a chunked body that stays open, which porter-http's whole-body client
# cannot read). Pulls in the runtime, so it is off by default: the pure build reaches none.
io = ["dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:tokio"]

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
