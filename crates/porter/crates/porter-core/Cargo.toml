[package]
name = "porter-core"
description = "porter's pure vocabulary: accounts, the capability vocabulary and matching, consent and secrets' keys."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/porter"
publish = false

[dependencies]
porter-capability = {path = "../porter-capability"}
porter-ids = {path = "../porter-ids"}
peephole-core = {default-features = false, path = "../../../peephole/peephole-core"}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
thiserror = {version = "2"}
secrecy = {version = "0.10.3", features = ["serde"]}
subtle = {version = "2.6.1"}
zeroize = {version = "1"}

[dev-dependencies]
porter-match = {path = "../porter-match"}
porter-capability = {path = "../porter-capability", features = ["testing"]}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
