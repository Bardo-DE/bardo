[package]
name = "porter-provider"
description = "Provider declarations (TOML files) and the Provider trait each protocol family implements."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/porter"
publish = false

[dependencies]
porter-core = {path = "../porter-core"}
porter-match = {path = "../porter-match"}
porter-capability = {path = "../porter-capability"}
porter-sheet = {path = "../porter-sheet"}
porter-ids = {path = "../porter-ids"}
serde = {version = "1", features = ["derive"]}
thiserror = {version = "2"}
toml = {version = "1"}

[dev-dependencies]

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
