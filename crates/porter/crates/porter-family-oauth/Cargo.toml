[package]
name = "porter-family-oauth"
description = "OAuth: PKCE through a loopback redirect, one provider, sign-in and session for every issuer, with the rules of Google and Microsoft beside them. A driver: oauth-probe-proto reads what a token shows, porter-oauth does the exchanges, and this crate sends the reads."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/porter"
publish = false

[dependencies]
porter-family-kit = {path = "../porter-family-kit"}
oauth-probe-proto = {path = "../oauth-probe-proto"}
porter-core = {path = "../porter-core"}
porter-capability = {path = "../porter-capability"}
porter-sheet = {path = "../porter-sheet"}
porter-ids = {path = "../porter-ids"}
porter-provider = {path = "../porter-provider"}
porter-http = {path = "../porter-http"}
porter-http-reqwest = {path = "../porter-http-reqwest"}
porter-oauth = {path = "../porter-oauth", features = ["io"]}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
tokio = {version = "1", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"]}

[dev-dependencies]
test-kit = {path = "../test-kit"}
tokio = {version = "1", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"]}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
