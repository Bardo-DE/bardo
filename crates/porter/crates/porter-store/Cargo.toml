[package]
name = "porter-store"
description = "The registry file store an app or a daemon keeps its own account registry in: registry.json in a directory the host chooses, saved atomically with a .bak, behind porter-core's RegistryStore seam."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/porter"
publish = false

[dependencies]
porter-core = {path = "../porter-core"}
porter-capability = {path = "../porter-capability"}
porter-fs = {path = "../porter-fs"}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
sha2 = {version = "0.10"}
thiserror = {version = "2"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[dev-dependencies]
porter-fake = {path = "../porter-fake"}
test-kit = {path = "../test-kit"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
