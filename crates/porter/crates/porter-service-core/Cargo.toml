[package]
name = "porter-service-core"
description = "What the service domains share: the registry and its pure answers, the audit trail, the sheets seam, the reach policy, the per-account turns at an issuer, and the context (the seams and the registry) every domain works on."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/porter"
publish = false

[dependencies]
porter-core = {path = "../porter-core"}
porter-match = {path = "../porter-match"}
porter-capability = {path = "../porter-capability"}
porter-sheet = {path = "../porter-sheet"}
porter-wire = {path = "../porter-wire"}
porter-ids = {path = "../porter-ids"}
porter-provider = {path = "../porter-provider"}
porter-secrets = {path = "../porter-secrets"}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
thiserror = {version = "2"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
