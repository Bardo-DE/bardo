[package]
name = "porter-identities"
description = "The identities domain of the accounts daemon: which apps use each identity (identity-uses.json, kept with the same atomic save), the identity each connection just picked, and the desk that shows the picker and reads a picked identity's password."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/porter"
publish = false

[dependencies]
porter-service-core = {path = "../porter-service-core"}
porter-sheet = {path = "../porter-sheet"}
porter-core = {path = "../porter-core"}
porter-ids = {path = "../porter-ids"}
porter-fs = {path = "../porter-fs", features = ["book"]}
porter-secrets = {path = "../porter-secrets"}
porter-wire = {path = "../porter-wire"}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
thiserror = {version = "2"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[dev-dependencies]
test-kit = {path = "../test-kit"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
