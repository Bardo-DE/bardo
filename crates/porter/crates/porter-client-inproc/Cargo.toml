[package]
name = "porter-client-inproc"
description = "The hosted transport of porter-client: an app that runs the account service itself, with its own providers, secrets and sheet host."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/porter"
publish = false

[dependencies]
porter-capability = {path = "../porter-capability"}
porter-client = {path = "../porter-client"}
porter-core = {path = "../porter-core"}
porter-ids = {path = "../porter-ids"}
porter-match = {path = "../porter-match"}
porter-provider = {path = "../porter-provider"}
porter-secrets = {path = "../porter-secrets"}
porter-service = {path = "../porter-service"}
porter-service-accounts = {path = "../porter-service-accounts"}
porter-service-core = {path = "../porter-service-core"}
porter-service-grants = {path = "../porter-service-grants"}
porter-sheet = {path = "../porter-sheet"}
porter-wire = {path = "../porter-wire"}
# `relays`: `PorterRelays`, the relay host that runs `porter_proxy::relay` over rustls.
porter-proxy = {path = "../porter-proxy", optional = true, features = ["io", "tls"]}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"], optional = true}

[dev-dependencies]
test-kit = {path = "../test-kit"}
porter-fake = {path = "../porter-fake"}
porter-fake-servers = {path = "../porter-fake-servers"}
porter-families = {path = "../porter-families"}
porter-family-generic = {path = "../porter-family-generic"}
porter-http = {path = "../porter-http"}
porter-http-reqwest = {path = "../porter-http-reqwest"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[features]
# No feature is on by default: a consumer names the ones it uses.
default = []
# `PorterRelays`: a `RelayHost` that runs the authenticated relays of an app or daemon hosting its
# own `AccountService`, on its tokio runtime, over rustls. Off by default: it brings porter-proxy
# with TLS and a runtime.
relays = ["dep:porter-proxy", "dep:tokio"]

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
