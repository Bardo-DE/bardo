[package]
name = "porter-discover"
description = "Discovery for porter's families: autoconfig, SRV and MX leads and well-known URLs, as pure parsers plus the DNS and HTTP seams."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/porter"
publish = false

[dependencies]
porter-core = {path = "../porter-core"}
porter-capability = {path = "../porter-capability"}
porter-ids = {path = "../porter-ids"}
porter-http = {path = "../porter-http"}
porter-provider = {path = "../porter-provider"}
roxmltree = {version = "0.21"}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
thiserror = {version = "2"}
hickory-resolver = {version = "0.26", optional = true}

[dev-dependencies]
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
toml = {version = "1"}

[features]
# `HickoryDns`, the `Dns` seam over the system resolver. Pulls in the runtime, so it is off by
# default: the parsers and the search reach none.
io = ["dep:hickory-resolver"]

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
