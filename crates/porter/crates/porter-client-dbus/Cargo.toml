[package]
name = "porter-client-dbus"
description = "The bus transport of porter-client: accountd on the session bus, for an app that lets accountd hold its accounts."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/porter"
publish = false

[dependencies]
porter-client = {path = "../porter-client"}
porter-core = {path = "../porter-core"}
porter-wire = {path = "../porter-wire"}
porter-capability = {path = "../porter-capability"}
porter-match = {path = "../porter-match"}
porter-dbus = {path = "../porter-dbus"}
porter-ids = {path = "../porter-ids"}
porter-tailscale = {path = "../porter-tailscale"}
futures-util = {version = "0.3", default-features = false}
serde_json = {version = "1"}
zbus = {version = "5.19", default-features = false, features = ["tokio"]}
thiserror = {version = "2"}
zeroize = {version = "1"}

[dev-dependencies]
# `sealed_key` and a memfd: the credential tests hand a key over as the daemon does.
porter-secrets = {path = "../porter-secrets"}
rustix = {version = "1.1", default-features = false, features = ["std", "event", "fs", "net", "time", "process"]}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
