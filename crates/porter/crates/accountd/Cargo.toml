[package]
name = "accountd"
description = "porter's identity daemon: org.quire.Accounts1 over porter-service, holding the identities signed in on this computer, Spaces and Tailscale. The library serves the bus objects (Manager, Account, Identities1, Spaces1, Tailnet1, the Request objects and the settings module); the binary resolves its paths, builds the service over its seams and serves."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/porter"
publish = false

[dependencies]
porter-core = {path = "../porter-core"}
porter-match = {path = "../porter-match"}
porter-capability = {path = "../porter-capability"}
porter-sheet = {path = "../porter-sheet"}
porter-wire = {path = "../porter-wire"}
porter-ids = {path = "../porter-ids"}
porter-daemon = {path = "../porter-daemon", default-features = false, features = ["watch"]}
porter-fs = {path = "../porter-fs"}
porter-callers = {path = "../porter-callers", features = ["file"]}
porter-dbus = {path = "../porter-dbus"}
porter-families = {path = "../porter-families", features = ["set"]}
porter-family-oauth = {path = "../porter-family-oauth"}
porter-provider = {path = "../porter-provider"}
porter-proxy = {path = "../porter-proxy", features = ["tls"]}
porter-secrets = {path = "../porter-secrets", features = ["oo7"]}
porter-service = {path = "../porter-service"}
porter-service-accounts = {path = "../porter-service-accounts"}
porter-service-core = {path = "../porter-service-core"}
porter-identities = {path = "../porter-identities"}
porter-spaces = {path = "../porter-spaces"}
porter-settings = {path = "../porter-settings"}
porter-sheets = {path = "../porter-sheets"}
porter-store = {path = "../porter-store"}
porter-tailscale = {path = "../porter-tailscale", features = ["io"]}
ds-settings = {features = ["live", "tokio"], path = "../../../quire/crates/ds-settings"}
clap = {version = "4", features = ["derive"]}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
sha2 = {version = "0.10"}
thiserror = {version = "2"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
toml = {version = "1"}
zbus = {version = "5.19", default-features = false, features = ["tokio"]}

[dev-dependencies]
# The client crates are tested against this daemon (tests/it/client), not the other way round.
porter-client = {path = "../porter-client"}
porter-client-dbus = {path = "../porter-client-dbus"}
test-kit = {path = "../test-kit"}
ds-settings = {features = ["live", "testing", "tokio"], path = "../../../quire/crates/ds-settings"}
porter-fake = {path = "../porter-fake"}
porter-fake-servers = {path = "../porter-fake-servers"}
porter-http = {path = "../porter-http"}
porter-http-reqwest = {path = "../porter-http-reqwest"}
porter-oauth = {path = "../porter-oauth"}
rustix = {version = "1.1", default-features = false, features = ["std", "event", "fs", "net", "time", "process"]}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[features]
# Test builds only, never default and never in dist: `ACCOUNTD_PROC_ROOT=<dir>` makes the binary
# read caller identities from <dir> instead of /proc, because the jailed and acceptance tests run
# processes outside service cgroups, and `PORTER_SYSTEM_CALLERS=<file>` makes it read that file as
# the system caller table, because a jail cannot write /etc/porter. A release build ignores both
# variables. A test in tests/dist.rs fails if this feature is ever default, and
# check-boundary.sh checks it too.
test-proc-root = ["porter-callers/test-proc-root"]
# Test builds only, never default and never in dist: `ACCOUNTD_KEYS=file:<absolute path>` keeps
# credentials in one 0600 plain-text JSON file (porter-secrets' `FileSecrets`) instead of the
# Secret Service, for private-bus and scratch runs with no keyring. A release build ignores the
# variable and says so once. tests/dist.rs and check-boundary.sh fail if this feature is default.
test-keys = ["porter-secrets/test-keys"]

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
