[package]
name = "porter-family-kit"
description = "What the protocol families are written with: the one sign-in conversation every family drives (Flow, Move, Conversation), the seams a password family dials through, and the form and credential helpers the Nextcloud and generic families share."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/porter"
publish = false

[dependencies]
porter-core = {path = "../porter-core"}
porter-provider = {path = "../porter-provider"}
porter-sheet = {path = "../porter-sheet"}
porter-http = {path = "../porter-http"}
base64 = {version = "0.22"}

[dev-dependencies]
test-kit = {path = "../test-kit"}
tokio = {version = "1", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"]}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
