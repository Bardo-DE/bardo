[package]
name = "porter-wire"
description = "porter's wire protocol: what an app asks accountd, what it answers, and the framing of a session socket."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/porter"
publish = false

[dependencies]
porter-core = {path = "../porter-core"}
porter-match = {path = "../porter-match"}
porter-capability = {path = "../porter-capability"}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
thiserror = {version = "2"}

[dev-dependencies]
porter-ids = {path = "../porter-ids"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
