[package]
name = "porter-sheets"
description = "The bus side of porter's sheets, for the daemon that shows one: BusSheets draws a sheet in the sheet host over org.quire.AccountsSheet1, AppNames says what a person calls an app, and RequestObjects serves the portal-shaped Request object of a sheet method for accountd."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/porter"
publish = false

[dependencies]
porter-core = {path = "../porter-core"}
porter-capability = {path = "../porter-capability"}
porter-sheet = {path = "../porter-sheet"}
porter-wire = {path = "../porter-wire"}
porter-callers = {path = "../porter-callers"}
porter-dbus = {path = "../porter-dbus"}
porter-provider = {path = "../porter-provider"}
porter-service-core = {path = "../porter-service-core"}
serde_json = {version = "1"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
zbus = {version = "5.19", default-features = false, features = ["tokio"]}

[dev-dependencies]
test-kit = {path = "../test-kit"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
