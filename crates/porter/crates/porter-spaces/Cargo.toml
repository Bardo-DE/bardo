[package]
name = "porter-spaces"
description = "The registry of desktop-wide Spaces: the ids it mints, the per-app limit on making them, and spaces.json, kept with the same atomic save. The Spaces domain of the accounts daemon."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/porter"
publish = false

[dependencies]
porter-core = {path = "../porter-core"}
porter-ids = {path = "../porter-ids"}
porter-fs = {path = "../porter-fs", features = ["book"]}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
thiserror = {version = "2"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[dev-dependencies]
test-kit = {path = "../test-kit"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
