[package]
name = "porter-sheet"
description = "The add-account and sign-in sheet as values: views, inputs, progress and the pure stage machine, the hand-typed mail server form, and the words the sheet shows."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/porter"
publish = false

[dependencies]
porter-core = {path = "../porter-core"}
porter-tailscale = {path = "../porter-tailscale"}
porter-capability = {path = "../porter-capability"}
porter-ids = {path = "../porter-ids"}
porter-wire = {path = "../porter-wire"}
serde = {version = "1", features = ["derive"]}
thiserror = {version = "2"}

[dev-dependencies]
proptest = {version = "1"}
serde_json = {version = "1"}
test-kit = {path = "../test-kit"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
