[package]
name = "porter-daemon"
description = "What every desktop daemon shares and has no bus for: the choice of the /proc a daemon reads its callers from, a watch on a settings file, and the XDG base directories."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/porter"
publish = false

[features]
default = ["watch"]
# The settings-file watch, the one part that needs a file watcher. porter-dbus takes this crate
# without it for `root_held`, so a bus client never pulls notify in.
watch = ["dep:notify"]

[dependencies]
notify = {version = "8", optional = true}
thiserror = {version = "2"}

[dev-dependencies]
test-kit = {path = "../test-kit"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
