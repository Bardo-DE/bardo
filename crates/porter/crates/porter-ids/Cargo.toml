[package]
name = "porter-ids"
description = "Typed ids, units, web URLs and origins, the clock seam and percent-encoding: values that name nothing of accounts, parsed once where they enter."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/porter"
publish = false

[dependencies]
chrono = {version = "0.4", default-features = false, features = ["alloc"]}
percent-encoding = {version = "2.3"}
serde = {version = "1", features = ["derive"]}
thiserror = {version = "2"}

[dev-dependencies]
serde_json = {version = "1"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
