[package]
name = "porter-http-relay"
description = "porter's HTTP client over an accountd relay: hyper's HTTP/1 connection over the authenticated byte stream accountd opens, with streamed request and response bodies, connection reuse and a new connection when a kept one's credential lapsed."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/porter"
publish = false

[dependencies]
porter-core = {path = "../porter-core"}
porter-wire = {path = "../porter-wire"}
porter-ids = {path = "../porter-ids"}
porter-http = {path = "../porter-http"}
porter-client = {path = "../porter-client"}
hyper = {version = "1", features = ["client", "http1"]}
hyper-util = {version = "0.1.21", features = ["tokio"]}
http-body-util = {version = "0.1"}
tokio = {version = "1", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"]}

[dev-dependencies]
test-kit = {path = "../test-kit"}
tokio = {version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "test-util", "time"]}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
