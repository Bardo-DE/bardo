[package]
name = "porter-dbus"
description = "porter's D-Bus API: accountd's interfaces (org.quire.Accounts1, Identities1, Spaces1, Tailnet1 and the AI keys'), each written once, as the zbus proxy its callers use, the trait a daemon implements and the object that serves it."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/porter"
publish = false

[dependencies]
porter-core = {path = "../porter-core"}
porter-tailscale = {path = "../porter-tailscale"}
porter-wire = {path = "../porter-wire"}
porter-dbus-macros = {path = "../porter-dbus-macros"}
porter-ids = {path = "../porter-ids"}
zbus = {version = "5.19", default-features = false, features = ["tokio"]}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
thiserror = {version = "2"}
# `serve_ready`'s deadline; zbus already runs on tokio here.
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[dev-dependencies]
test-kit = {path = "../test-kit"}
proptest = {version = "1"}
# A paused clock for `serve_ready`'s timing tests.
tokio = {version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "test-util", "time"]}
porter-capability = {path = "../porter-capability"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
