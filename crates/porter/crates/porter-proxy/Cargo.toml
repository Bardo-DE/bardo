[package]
name = "porter-proxy"
description = "The authenticated relay (OpenAuthenticated): per protocol a sans-io state machine (IMAP, SMTP, HTTP/1.1) and a relay over generic async I/O with a TLS connector passed in, so an app speaks its protocol and never holds the password."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/porter"
publish = false

[dependencies]
base64 = {version = "0.22"}
httparse = {version = "1.10"}
porter-core = {path = "../porter-core"}
porter-capability = {path = "../porter-capability"}
porter-ids = {path = "../porter-ids"}
rustls-native-certs = {version = "0.8", optional = true}
rustls-pki-types = {version = "1", optional = true}
tokio = {version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"], optional = true}
tokio-rustls = {version = "0.26", default-features = false, features = ["ring", "tls12", "logging"], optional = true}
webpki-roots = {version = "1", optional = true}

[dev-dependencies]
test-kit = {path = "../test-kit"}
porter-fake-servers = {path = "../porter-fake-servers"}
porter-proxy = {path = ".", features = ["tls"]}
porter-fake = {path = "../porter-fake"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
tokio-rustls = {version = "0.26", default-features = false, features = ["ring", "tls12", "logging"]}

[features]
# `TokioStream`, `ByteStream` over a tokio stream. Pulls in the runtime, so it is off by
# default: the machines and the relay reach none.
io = ["dep:tokio"]
# `RustlsConnect`, the `Connect` over TCP and rustls (ring) with the platform's roots and
# webpki-roots as the fallback. Certificate checks are always on.
tls = [
  "io",
  "dep:tokio-rustls",
  "dep:rustls-pki-types",
  "dep:rustls-native-certs",
  "dep:webpki-roots",
]

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
