[package]
name = "porter-http"
description = "porter's HTTP seam: the `Http` trait over the `http` crate's request and response, which every family, discovery and OAuth call goes through; the clients are porter-http-reqwest (direct) and porter-http-relay (over an accountd relay)."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/porter"
publish = false

[dependencies]
porter-core = {path = "../porter-core"}
porter-ids = {path = "../porter-ids"}
http = {version = "1"}
httpdate = {version = "1"}
thiserror = {version = "2"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
