[package]
name = "shell-launcher-ui"
description = "The launcher: its panel, click catcher, rows, preview pane and actions."

# `media` (on by default) lets the preview pane read a recording's facts and, for audio, its cover
# (pure-Rust header parsers). Off, a recording previews as its type, size and date.
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
[features]
default = ["media"]
media = ["anyview-peek/media"]

[dependencies]
companion-model = {path = "../../actions/companion-model"}
permission-core = {path = "../../actions/permission-core"}
action-vocab = {path = "../../actions/action-vocab"}
memory-core = {path = "../../memory/memory-core"}
companion-wire = {path = "../../actions/companion-wire"}
anyview-core = {path = "../../anyview/crates/anyview-core"}
anyview-fs = {path = "../../anyview/crates/anyview-fs"}
anyview-image = {path = "../../anyview/crates/anyview-image"}
anyview-peek = {path = "../../anyview/crates/anyview-peek", default-features = false, features = ["pane"]}
anyview-platform = {path = "../../anyview/crates/anyview-platform", features = ["quire-desktop"]}
keymap = {path = "../../keymap/keymap"}
dioxus = { workspace = true, features = ["macro", "html", "hooks", "signals"] }
dirs = { workspace = true }
action-core = {path = "../../actions/action-core"}
ui-components = {path = "../../ui/ui-components"}
ui-behaviour = {path = "../../ui/ui-behaviour"}
ui-blitz = {path = "../../ui/ui-blitz", features = ["pdf"]}
jiff = { workspace = true }
# The name of a file's thumbnail in the freedesktop cache is the MD5 of its address.
md-5 = { workspace = true }
provenance = {path = "../../provenance/provenance"}
layer-shell-host = {path = "../../layer-shell/layer-shell-host"}
base-time = { path = "../../base/base-time" }
shell-launcher = {path = "../shell-launcher"}
shell-model = {path = "../shell-model"}
shell-search = {path = "../shell-search"}
shell-services = {path = "../shell-services"}
shell-settings = {path = "../shell-settings"}
shell-ui-kit = {path = "../shell-ui-kit"}
shell-kit = {path = "../shell-kit"}
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util"]}

[dev-dependencies]
serde_json = { workspace = true }
png = { workspace = true }
shell-testkit = {path = "../shell-testkit"}
ui-harness = {path = "../../ui/ui-harness"}
image = { workspace = true, features = ["png", "jpeg", "webp"] }
shell-ui-kit = {path = "../shell-ui-kit", features = ["harness"]}
dioxus-ssr = { workspace = true }
ui-lint = {path = "../../ui/ui-lint"}
layer-shell-host = {path = "../../layer-shell/layer-shell-host", features = ["debug-inject"]}

[[example]]
name = "launcher_demo"

[lints]
workspace = true
