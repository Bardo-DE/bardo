[package]
name = "shell-kit"
description = "The shell-only parts: lock, switcher, bar, dock, control center, notifications, OSD, batteries, emoji and the notification center's widgets, with the shell's tokens and sheets."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
dioxus = { workspace = true, features = ["macro", "html", "hooks", "signals"] }
ui-components = {path = "../../ui/ui-components"}
ui-core = {path = "../../ui/ui-core"}
ui-shell = {path = "../../ui/ui-shell"}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
image = { workspace = true, features = ["png", "jpeg", "webp"] }

[dev-dependencies]
shell-testkit = {path = "../shell-testkit"}
dioxus-ssr = { workspace = true }
ui-blitz = {path = "../../ui/ui-blitz"}
ui-core = {path = "../../ui/ui-core", features = ["testing"]}
ui-harness = {path = "../../ui/ui-harness"}
ui-lint = {path = "../../ui/ui-lint"}
ui-settings = {path = "../../ui/ui-settings", features = ["dioxus", "tokio"]}

[lints]
workspace = true
