[package]
name = "shell-search"
description = "The launcher's search: the result runner, its history and frecency, every provider, and previews."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-fs = { path = "../../base/base-fs" }
computer-use-action = {path = "../../computer-use/computer-use-action"}
companion-model = {path = "../../actions/companion-model"}
permission-core = {path = "../../actions/permission-core"}
action-manifest = {path = "../../actions/action-manifest"}
action-vocab = {path = "../../actions/action-vocab"}
anyview-core = {path = "../../anyview/crates/anyview-core"}
anyview-store = {path = "../../anyview/crates/anyview-store"}
base-time = { path = "../../base/base-time" }
shell-launcher = {path = "../shell-launcher"}
shell-model = {path = "../shell-model"}
shell-services = {path = "../shell-services"}
ui-core = {path = "../../ui/ui-core"}
action-core = {path = "../../actions/action-core"}
provenance = {path = "../../provenance/provenance"}
companion-wire = {path = "../../actions/companion-wire"}
memory-core = {path = "../../memory/memory-core"}
settings-store-fs = { path = "../../settings/settings-store-fs" }
settings-types = { path = "../../settings/settings-types" }
emojis = { workspace = true }
fend-core = { workspace = true }
jiff = { workspace = true }
mime_guess = {workspace = true, features = ["default"]}
nucleo-matcher = { workspace = true }
percent-encoding = { workspace = true }
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util"]}
zbus = {workspace = true, features = ["tokio"]}

[dev-dependencies]
base-testkit = {path = "../../base/base-testkit", features = ["tokio"]}
computer-use-bus = {path = "../../computer-use/computer-use-bus"}
shell-testkit = {path = "../shell-testkit"}
serde_json = { workspace = true }

[lints]
workspace = true
