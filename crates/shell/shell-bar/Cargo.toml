[package]
name = "shell-bar"
description = "The menu bar, its menus and tray, and the control center it hangs."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
dioxus = { workspace = true, features = ["macro", "html", "hooks", "signals"] }
ui-components = {path = "../../ui/ui-components", features = ["icon-classify"]}
shell-kit = {path = "../shell-kit"}
image = { workspace = true, features = ["png", "jpeg", "webp"] }
# The tray icons' art (`bar/tray_icon.rs`): theme lookup and a capped file read.
freedesktop-icons = { workspace = true }
base-fs = { path = "../../base/base-fs" }
shell-launcher = {path = "../shell-launcher"}
shell-model = {path = "../shell-model"}
shell-settings = {path = "../shell-settings"}
shell-ui-kit = {path = "../shell-ui-kit"}
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util"]}
layer-shell-types = {path = "../../layer-shell/layer-shell-types"}
layer-shell-hooks = {path = "../../layer-shell/layer-shell-hooks"}
ui-host-hooks = {path = "../../ui/ui-host-hooks"}

[dev-dependencies]
# A fifo in the tray icon tests.
rustix = {workspace = true, features = ["fs"]}
shell-testkit = {path = "../shell-testkit"}
serde_json = { workspace = true }
ui-harness = {path = "../../ui/ui-harness"}
shell-ui-kit = {path = "../shell-ui-kit", features = ["harness"]}
dioxus-ssr = { workspace = true }
ui-lint = {path = "../../ui/ui-lint"}
layer-shell-host = {path = "../../layer-shell/layer-shell-host", features = ["debug-inject"]}
jiff = { workspace = true }
shell-host-config = {path = "../shell-host-config"}

[[example]]
name = "bar_demo"

[lints]
workspace = true
