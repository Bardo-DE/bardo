[package]
name = "shell-settings"
description = "bardo-shell's settings file, shell/settings.toml, as data: the shell domains of design/22-SETTINGS.md, their Section and schema."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-words = { path = "../../base/base-words" }
key-remap-proto = {path = "../../input/key-remap-proto"}
shell-launcher = {path = "../shell-launcher"}
shell-model = {path = "../shell-model"}
settings-store = { path = "../../settings/settings-store" }
settings-types = { path = "../../settings/settings-types" }
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }

[dev-dependencies]
provenance = {path = "../../provenance/provenance"}
settings-store-fs = { path = "../../settings/settings-store-fs" }

[lints]
workspace = true
