[package]
name = "shell-settings"
description = "bardo-shell's settings file, shell/settings.toml, as data: the shell domains of design/22-SETTINGS.md, their Section and schema."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.91"
repository = "https://github.com/Bardo-DE/sill"
publish = false

[dependencies]
ui-core = {path = "../../ui/ui-core"}
key-remap-proto = {path = "../../input/key-remap-proto"}
shell-launcher = {path = "../shell-launcher"}
shell-model = {path = "../shell-model"}
ui-settings = {path = "../../ui/ui-settings", features = ["tokio"]}
serde = {version = "1", features = ["derive"]}
toml = {version = "1"}

[dev-dependencies]
shell-testkit = {path = "../shell-testkit"}
provenance = {path = "../../provenance/provenance"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
