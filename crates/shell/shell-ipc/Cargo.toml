[package]
name = "shell-ipc"
description = "The bardo-shell IPC protocol: newline-delimited JSON requests and responses, one per connection."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
clap = {workspace = true, features = ["default", "derive"], optional = true}
ui-core = {path = "../../ui/ui-core"}
shell-launcher = {path = "../shell-launcher"}
shell-model = {path = "../shell-model"}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
shell-testkit = {path = "../shell-testkit"}
key-remap-proto = {path = "../../input/key-remap-proto"}

[features]
# The command line parses straight into the request types (`bardo-shell` turns this on).
cli = ["dep:clap"]

[lints]
workspace = true
