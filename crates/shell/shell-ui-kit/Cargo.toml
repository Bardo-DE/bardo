[package]
name = "shell-ui-kit"
description = "What every surface shares: root, links, hooks, menus, status, notification cards, widget providers and the test harness."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-fs = { path = "../../base/base-fs" }
computer-use-action = {path = "../../computer-use/computer-use-action"}
permission-core = {path = "../../actions/permission-core"}
action-manifest = {path = "../../actions/action-manifest"}
action-vocab = {path = "../../actions/action-vocab"}
account-capability = {path = "../../accounts/account-capability"}
shell-model = {path = "../shell-model"}
dioxus = { workspace = true, features = ["macro", "html", "hooks", "signals"] }
ui-components = {path = "../../ui/ui-components"}
ui-behaviour = {path = "../../ui/ui-behaviour"}
keymap = {path = "../../keymap/keymap"}
key-remap-client = {path = "../../input/key-remap-client"}
shell-kit = {path = "../shell-kit"}
ui-blitz = {path = "../../ui/ui-blitz"}
settings-store-fs = { path = "../../settings/settings-store-fs" }
settings-types = { path = "../../settings/settings-types" }
ui-settings = { path = "../../ui/ui-settings", features = ["dioxus", "tokio"] }
layer-shell-host = {path = "../../layer-shell/layer-shell-host"}
# The test driver, for the `harness` feature.
ui-harness = {path = "../../ui/ui-harness", optional = true}
shell-search = {path = "../shell-search"}
shell-services = {path = "../shell-services"}
shell-settings = {path = "../shell-settings"}
shell-launcher = {path = "../shell-launcher"}
# The companion's wire and the types it names, converted to quire's view types in `companion`.
companion-wire = {path = "../../actions/companion-wire"}
action-core = {path = "../../actions/action-core"}
ui-core = {path = "../../ui/ui-core"}
account-core = {path = "../../accounts/account-core"}
provenance = {path = "../../provenance/provenance"}
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util"]}
# App icons in the icon style (`app_icons`): decode and encode rasters, rasterise theme SVGs
# (resvg is the renderer usvg/tiny-skia already in the tree belong to; MIT OR Apache-2.0),
# and find `$XDG_CACHE_HOME`.
image = { workspace = true, features = ["png", "jpeg", "webp"] }
resvg = { workspace = true }
dirs = { workspace = true }
# Civil dates for the calendar widgets' month grid and the world clock.
jiff = { workspace = true }
thiserror = { workspace = true }
# The widgets' entries are serde data (quire's `ds::Widget::Entry`); the desktop widgets' state
# file is JSON.
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[features]
# Fake services and the values they start at, for tests and demos (`harness`).
harness = ["dep:ui-harness"]

[dev-dependencies]
shell-testkit = {path = "../shell-testkit"}
# The crate's own tests drive surfaces through `harness`.
shell-ui-kit = {path = ".", features = ["harness"]}
# `lint` is off by default: only test builds need `ds::lint::markup`.
ui-lint = {path = "../../ui/ui-lint"}
dioxus-ssr = { workspace = true }

[lints]
workspace = true
