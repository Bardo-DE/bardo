[package]
name = "shell-dock"
description = "The dock: tiles, magnification, machines and its context menu."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
dioxus = { workspace = true, features = ["macro", "html", "hooks", "signals"] }
keymap = {path = "../../keymap/keymap"}
ui-components = {path = "../../ui/ui-components"}
shell-kit = {path = "../shell-kit"}
shell-launcher = {path = "../shell-launcher"}
shell-model = {path = "../shell-model"}
shell-desktop-fs = {path = "../shell-desktop-fs"}
shell-settings = {path = "../shell-settings"}
shell-ui-kit = {path = "../shell-ui-kit"}
layer-shell-types = {path = "../../layer-shell/layer-shell-types"}
layer-shell-hooks = {path = "../../layer-shell/layer-shell-hooks"}

[dev-dependencies]
# `desktop_wl::project_*`, which `tests/it/dock_wlr.rs` feeds from a fake compositor.
shell-services = {path = "../shell-services"}
desktop-client = {path = "../../wayland/desktop-client", features = ["fake"]}
shell-testkit = {path = "../shell-testkit"}
ui-harness = {path = "../../ui/ui-harness"}
shell-ui-kit = {path = "../shell-ui-kit", features = ["harness"]}
ui-lint = {path = "../../ui/ui-lint"}
ui-settings = { path = "../../ui/ui-settings", features = ["dioxus", "tokio"] }
layer-shell-host = {path = "../../layer-shell/layer-shell-host", features = ["debug-inject"]}
shell-host-config = {path = "../shell-host-config"}
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util"]}

[[example]]
name = "dock_demo"

[lints]
workspace = true
