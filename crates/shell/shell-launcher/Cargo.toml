[package]
name = "shell-launcher"
description = "Launcher core: providers, queries, ranking and frecency, with no I/O."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.91"
repository = "https://github.com/Bardo-DE/sill"
publish = false

[dependencies]
action-vocab = {path = "../../actions/action-vocab"}
nucleo-matcher = {version = "0.3.1"}
ui-core = {path = "../../ui/ui-core"}
keymap = {features = ["serde"], path = "../../keymap/keymap"}
action-core = {path = "../../actions/action-core"}
memory-core = {path = "../../memory/memory-core"}
provenance = {path = "../../provenance/provenance"}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
