# The key remap daemon: the bardo-shell session's layer. dist/install.sh copies it to ~/.config/bardo/key-remap/key-remap.toml when
# that file is missing (never over yours). bardo-shell forwards that file to the key remap daemon as the seat owner's
# settings, which lie over /etc/bardo/key-remap/key-remap.toml, so the machine file can stay the Plasma one:
# Plasma never forwards a user file and keeps its own mapping.
#
# Only the chords where the Plasma overlay and the bardo-shell session differ are listed. A later layer
# cannot delete a rule of an earlier one, only replace it, so each chord the overlay redirects and
# the bardo-shell session does not bind is restated here as what the built-in mapping would write.

[profile.default]
rules = [
  # Cmd+Space is bardo-shell's launcher: Super+Space (the overlay says Alt+Space, KRunner's key).
  { when = "command+space", then = "super+space" },
  # Cmd+Tab, Shift+Cmd+Tab: the compositor's app switcher (Super+Tab), with Super held while Cmd is held so the panel stays up; the built-in mapping would send Ctrl+Tab to the focused app.
  { when = "command+tab", then = "super+tab", hold = "while_held" },
  { when = "command+shift+tab", then = "super+shift+tab", hold = "while_held" },
  # Shift+Cmd+Q: the power menu (Super+Shift+Q). Plain Cmd+Q stays Ctrl+Q: quit is the app's.
  { when = "command+shift+q", then = "super+shift+q" },
  # Option+Cmd+Esc: the force quit panel (Alt+Super+Esc).
  { when = "option+command+esc", then = "alt+super+esc" },
  # Cmd+Shift+3/4/5 -> Print, which the session binds to the Screenshot action (`bardo-shell screenshot area`).
  { when = "command+shift+3", then = "print" },
  { when = "command+shift+4", then = "print" },
  { when = "command+shift+5", then = "print" },
  # Redirected by the overlay to Plasma shortcuts the bardo-shell session does not have: back to the plain chord.
  { when = "command+control+space", then = "ctrl+super+space" },
  { when = "command+control+f", then = "ctrl+super+f" },
  { when = "command+h", then = "ctrl+h" },
  { when = "command+f3", then = "ctrl+f3" },
  # Works the same in both sessions (Super+Ctrl+Left/Right change workspace).
  { when = "control+left", then = "ctrl+super+left" },
  { when = "control+right", then = "ctrl+super+right" },
  # Caps Lock rules are not here: the key remap daemon's user layer refuses a rule whose trigger has no modifier
  # or only Shift. Both (Caps Lock -> Ctrl+Space, and Shift+Caps Lock -> Caps Lock) live in the
  # desktop's vendor file, /usr/lib/bardo/key-remap/key-remap.toml (packaging/dist/key-remap.toml);
  # bardo-shell ships no machine file.
]

# The overlay's terminal profile restates Cmd+H for Plasma; in a terminal the built-in mapping
# writes it as Ctrl+Shift+H.
[profile.terminal]
rules = [
  { when = "command+h", then = "ctrl+shift+h" },
]

# An app that resolves Command itself through the shared keymap (temor) gets Super, not Ctrl. The
# profile inherits `default` and a rule cannot be deleted down that chain, so Cmd+H, which the
# default above writes as Ctrl+H, is restated as Super+H.
[profile.keymap-aware]
rules = [
  { when = "command+h", then = "super+h" },
]
