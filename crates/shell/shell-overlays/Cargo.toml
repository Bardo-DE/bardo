[package]
name = "shell-overlays"
description = "The overlay surfaces: OSD, power menu, polkit prompt, app switcher, idle dim, hot corners, wallpaper and the lock screen."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
account-sheet = {path = "../../accounts/account-sheet"}
account-capability = {path = "../../accounts/account-capability"}
base-secret = { path = "../../base/base-secret" }
base-url = { path = "../../base/base-url" }
dioxus = { workspace = true, features = ["macro", "html", "hooks", "signals"] }
keymap = {path = "../../keymap/keymap"}
ui-components = {path = "../../ui/ui-components"}
ui-behaviour = {path = "../../ui/ui-behaviour"}
ui-settings = {path = "../../ui/ui-settings", features = ["dioxus", "tokio"]}
shell-kit = {path = "../shell-kit"}
ui-shell = {path = "../../ui/ui-shell"}
jiff = { workspace = true }
account-core = {path = "../../accounts/account-core"}
serde_json = { workspace = true }
layer-shell-host = {path = "../../layer-shell/layer-shell-host"}
shell-launcher = {path = "../shell-launcher"}
shell-model = {path = "../shell-model"}
shell-services = {path = "../shell-services"}
shell-settings = {path = "../shell-settings"}
shell-ui-kit = {path = "../shell-ui-kit"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util"]}

[dev-dependencies]
desktop-client = {path = "../../wayland/desktop-client", features = ["fake"]}
shell-testkit = {path = "../shell-testkit"}
shell-ui-kit = {path = "../shell-ui-kit", features = ["harness"]}
ui-harness = {path = "../../ui/ui-harness"}
image = { workspace = true, features = ["png", "jpeg", "webp"] }
layer-shell-host = {path = "../../layer-shell/layer-shell-host", features = ["debug-inject"]}

[[example]]
name = "wallpaper_demo"

[lints]
workspace = true
