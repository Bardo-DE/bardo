[package]
name = "shell-app"
description = "The bardo-shell daemon and command line."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-xdg = { path = "../../base/base-xdg" }
shell-model = {path = "../shell-model"}
provenance = {path = "../../provenance/provenance"}
clap = {version = "4", features = ["derive"]}
ui-lint = {path = "../../ui/ui-lint"}
ui-blitz = {path = "../../ui/ui-blitz"}
ui-components = {path = "../../ui/ui-components"}
ui-core = {path = "../../ui/ui-core"}
ui-settings = {path = "../../ui/ui-settings", features = ["tokio"]}
ui-extensions = {path = "../../ui/ui-extensions"}
notify = { workspace = true }
shell-kit = {path = "../shell-kit"}
service-locator = {path = "../../platform/service-locator"}
layer-shell-host = {path = "../../layer-shell/layer-shell-host"}
shell-verbs = {path = "../../wayland/shell-verbs"}
shell-ipc = {path = "../shell-ipc", features = ["cli"]}
shell-launcher = {path = "../shell-launcher"}
shell-search = {path = "../shell-search"}
shell-services = {path = "../shell-services"}
shell-settings = {path = "../shell-settings"}
shell-ui-kit = {path = "../shell-ui-kit"}
shell-bar = {path = "../shell-bar"}
shell-launcher-ui = {path = "../shell-launcher-ui", default-features = false}
shell-dock = {path = "../shell-dock"}
shell-notify-ui = {path = "../shell-notify-ui"}
shell-overlays = {path = "../shell-overlays"}
thiserror = { workspace = true }
rustix = {version = "1.1", default-features = false, features = ["std", "event", "fs", "net", "time", "process"]}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util"]}
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
serde_json = { workspace = true }
zbus = {version = "5.19", default-features = false, features = ["tokio"]}
agent-voice-wire = {path = "../../actions/agent-voice-wire"}
zbus-ready = {path = "../../zbus-ready"}
ui-harness = {path = "../../ui/ui-harness"}
shell-testkit = {path = "../shell-testkit"}
# `tests/lint.rs` mounts every surface on the harness and lints its markup and stylesheet.
shell-ui-kit = {path = "../shell-ui-kit", features = ["harness"]}
# The key a `debug key` request parses to (dispatch/debug/inject.rs tests).
keyboard-types = {version = "0.7"}
# A Space's id in the full-screen rows (edge_reveal.rs tests).
account-core = {path = "../../accounts/account-core"}
# The voice bench shared with shell-services' tests names who its stand-in voiced is.
caller-identity-dbus = {default-features = false, features = ["desktop", "fake", "tokio"], path = "../../identity/caller-identity-dbus"}

[features]
default = ["media"]
# The launcher's preview pane reads a recording's facts and an audio cover (anyview-peek's `media`,
# pure-Rust header parsers). `--no-default-features` leaves them out of the daemon.
media = ["shell-launcher-ui/media"]
# `bardo-shell debug pointer|leave|capture|key` act on surfaces (layer-shell-host's per-surface injection).
# Without it those requests answer `Failed(Unsupported)`; `debug stats` always works. It also gives
# `bardo-shell run` the stand-in flags (`--fake-ddc`, `--dev-callers`, ...); a release build has none.
debug = ["layer-shell-host/debug-inject", "shell-services/dev-callers"]

[lints]
workspace = true
[[bin]]
name = "bardo-shell"
path = "src/main.rs"
