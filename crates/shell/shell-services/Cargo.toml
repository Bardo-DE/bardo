[package]
name = "shell-services"
description = "Effectful services behind watch channels: power, network, displays, sessions, notifications, launching and the compositor's windows."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `bardo-shell run --dev-callers FILE`: callers named in a person's own rows file are let in at
# `Proof::Dev` (peephole's `dev-rows`). Off by default; only the bardo-shell binary's `debug` feature turns
# it on, so no shipped build has it (the desktop gate refuses `dev-rows` in any release shape).
# It also lets `bardo-shell run --proc-root DIR` name callers by a stand-in `/proc` (docket's
# `fixture-callers`), as a jail with no systemd must.
dev-callers = ["caller-identity-dbus/dev-rows", "action-dbus/fixture-callers"]

[dependencies]
portal-dbus = { path = "../../portal/portal-dbus" }
shell-dbus = { path = "../../shell/shell-dbus" }
compositor-dbus = { path = "../../compositor/compositor-dbus" }
base-fs = { path = "../../base/base-fs" }
computer-use-action = {path = "../../computer-use/computer-use-action"}
action-wire = {path = "../../actions/action-wire"}
companion-model = {path = "../../actions/companion-model"}
permission-core = {path = "../../actions/permission-core"}
action-manifest = {path = "../../actions/action-manifest"}
action-vocab = {path = "../../actions/action-vocab"}
account-tailscale = {path = "../../accounts/account-tailscale"}
inference-tailnet = {path = "../../inference/inference-tailnet"}
account-sheet = {path = "../../accounts/account-sheet"}
account-wire = {path = "../../accounts/account-wire"}
base-ids = { path = "../../base/base-ids" }
base-secret = { path = "../../base/base-secret" }
base-time = { path = "../../base/base-time" }
base-xdg = { path = "../../base/base-xdg" }
anyview-core = {path = "../../anyview/crates/anyview-core"}
anyview-platform = {path = "../../anyview/crates/anyview-platform", features = ["quire-desktop"]}
shell-model = {path = "../shell-model"}
shell-launcher = {path = "../shell-launcher"}
ui-core = {path = "../../ui/ui-core"}
ui-helpers = {path = "../../ui/ui-helpers", default-features = false}
ui-settings = {path = "../../ui/ui-settings", features = ["tokio"]}
key-remap-proto = {path = "../../input/key-remap-proto"}
action-core = {path = "../../actions/action-core"}
action-dbus = {path = "../../actions/action-dbus"}
action-client = {path = "../../actions/action-client", features = ["dbus"]}
action-provider = {path = "../../actions/action-provider", features = ["dbus"]}
companion-wire = {path = "../../actions/companion-wire"}
speech-wire = {path = "../../speech/speech-wire"}
speech-dbus = {path = "../../speech/speech-dbus"}
computer-use-bus = {path = "../../computer-use/computer-use-bus"}
computer-use-dbus = {path = "../../computer-use/computer-use-dbus"}
memory-core = {path = "../../memory/memory-core"}
memory-dbus = {path = "../../memory/memory-dbus"}
provenance = {path = "../../provenance/provenance"}
account-core = {path = "../../accounts/account-core"}
inference-core = {path = "../../inference/inference-core"}
desktop-protocols = {path = "../../wayland/desktop-protocols"}
desktop-client = {path = "../../wayland/desktop-client", features = ["client"]}
sync-bus = {path = "../../sync/sync-bus"}
account-dbus = {path = "../../accounts/account-dbus"}
inference-client = {path = "../../inference/inference-client", default-features = false, features = ["dbus"]}
account-client = {path = "../../accounts/account-client"}
account-client-dbus = {path = "../../accounts/account-client-dbus"}
caller-identity-dbus = {default-features = false, features = ["tokio", "desktop"], path = "../../identity/caller-identity-dbus"}
toml = { workspace = true }
rustix = {workspace = true, features = ["std", "event", "fs", "net", "time", "process"]}
nix = { workspace = true, features = ["user"] }
async-trait = { workspace = true }
http-core = {path = "../../network/http-core"}
http-reqwest = {path = "../../network/http-reqwest"}
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util"]}
zbus = {workspace = true, features = ["tokio"]}
networkmanager-proxy = {default-features = false, features = ["tokio"], path = "../../network/networkmanager-proxy"}
bluez-proxy = {default-features = false, features = ["tokio"], path = "../../network/bluez-proxy"}
smithay-client-toolkit = { workspace = true, features = ["calloop", "xkbcommon"] }
wayland-client = { workspace = true }
wayland-protocols = { workspace = true, features = ["client", "staging", "unstable"] }
upower_dbus = {workspace = true}
libpulse-binding = { workspace = true }
system-tray = { workspace = true }
freedesktop-icons = { workspace = true }
notify = { workspace = true }
image = { workspace = true, features = ["png", "jpeg", "webp"] }
logind-zbus = { workspace = true }
dirs = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
ddc = { workspace = true }
ddc-i2c = { workspace = true, features = ["with-linux"] }
nonstick = { workspace = true }
percent-encoding = { workspace = true }
dbus-kit = { path = "../../bus/dbus-kit" }

[dev-dependencies]
base-testkit = {path = "../../base/base-testkit", features = ["tokio"]}
account-capability = {path = "../../accounts/account-capability"}
desktop-client = {path = "../../wayland/desktop-client", features = ["fake"]}
# A caller that is only a claim (`BusPeers::introduce`): the tests name who their stand-ins are.
caller-identity-dbus = {default-features = false, features = ["desktop", "fake", "tokio"], path = "../../identity/caller-identity-dbus"}
# intentd is named from a fixture tree (`<root>/<pid>/cgroup`) in the private-bus tests.
action-dbus = {path = "../../actions/action-dbus", features = ["fixture-callers"]}
shell-testkit = {path = "../shell-testkit"}
action-router = {path = "../../actions/action-router"}
action-fake = {path = "../../actions/action-fake"}
action-checkpoint = {path = "../../actions/action-checkpoint"}
permission-policy = {path = "../../actions/permission-policy"}
tracing = { workspace = true }
# `start_paused` and `advance` for the tests of timers.
tokio = {workspace = true, features = ["test-util"]}

[lints]
workspace = true
