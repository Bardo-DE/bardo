[package]
name = "shell-testkit"
description = "Dev only: a private bus, scratch folders, signal listeners and the stand-in programs the tests and dev scripts run against."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.91"
repository = "https://github.com/Bardo-DE/sill"
publish = false

[dependencies]
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util"]}
zbus = {version = "5.19", default-features = false, features = ["tokio"]}

# The stand-ins in `examples/` speak sill's own protocols and reuse its types. Only examples
# name these: the library reaches no sill crate (scripts/check-boundary.sh).
[dev-dependencies]
account-core = {path = "../../accounts/account-core"}
account-dbus = {path = "../../accounts/account-dbus"}
shell-launcher = {path = "../shell-launcher"}
shell-model = {path = "../shell-model"}
shell-search = {path = "../shell-search"}
shell-services = {path = "../shell-services"}
wayland-client = {version = "0.31"}
wayland-protocols = {version = "0.32.13", features = ["client", "staging", "unstable"]}
rustix = {version = "1.1", default-features = false, features = ["std", "event", "fs", "net", "time", "process"]}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}

# Stand-ins the tests and dev scripts start as child processes, each under its own bus name or
# socket; none touches the person's session.
[[example]]
name = "accountd_standin"
[[example]]
name = "badge_emitter"
[[example]]
name = "mpris_player"
[[example]]
name = "notifications_holder"
[[example]]
name = "polkit_authority"
[[example]]
name = "files_probe"
[[example]]
name = "file_manager_stub"
[[example]]
name = "logind_standin"
[[example]]
name = "screensaver_client"

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
