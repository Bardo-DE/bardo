[package]
name = "shell-testkit"
description = "Dev only: a private bus, scratch folders, signal listeners and the stand-in programs the tests and dev scripts run against."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util"]}
zbus = {workspace = true, features = ["tokio"]}

# The stand-ins in `examples/` speak bardo-shell's own protocols and reuse its types. Only examples
# name these: the library reaches no bardo-shell crate (scripts/check-boundary.sh).
[dev-dependencies]
account-dbus = {path = "../../accounts/account-dbus"}
shell-launcher = {path = "../shell-launcher"}
shell-model = {path = "../shell-model"}
shell-search = {path = "../shell-search"}
shell-services = {path = "../shell-services"}
wayland-client = { workspace = true }
wayland-protocols = { workspace = true, features = ["client", "staging", "unstable"] }
rustix = {workspace = true, features = ["std", "event", "fs", "net", "time", "process"]}
serde = { workspace = true, features = ["derive"] }

# Stand-ins the tests and dev scripts start as child processes, each under its own bus name or
# socket; none touches the person's session.
[[example]]
name = "accountd_standin"
[[example]]
name = "badge_emitter"
[[example]]
name = "mpris_player"
[[example]]
name = "notifications_holder"
[[example]]
name = "polkit_authority"
[[example]]
name = "files_probe"
[[example]]
name = "file_manager_stub"
[[example]]
name = "logind_standin"
[[example]]
name = "screensaver_client"

[lints]
workspace = true
