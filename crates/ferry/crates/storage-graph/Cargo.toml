[package]
name = "storage-graph"
description = "The Microsoft Graph replica: ferry-sync's Replica over OneDrive's app folder (`/me/drive/special/approot`) or the whole drive (`/me/drive/root`). Changes by delta query with the delta link as the anchor (a resync is AnchorExpired), writes guarded by If-Match and conflictBehavior=fail, small files by simple upload and large ones by upload session, quota from the drive. Its HTTP goes through the Http it is handed (in syncd, porter-http-relay's RelayHttp over accountd's OpenAuthenticated, which adds the bearer). Pure: no runtime, no socket."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/ferry"
publish = false

[dependencies]
base64 = {version = "0.22"}
hex = {version = "0.4"}
porter-capability = {path = "../../../porter/crates/porter-capability"}
porter-ids = {path = "../../../porter/crates/porter-ids"}
porter-http = {path = "../../../porter/crates/porter-http"}
ferry-sync = {path = "../ferry-sync"}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}

[dev-dependencies]
test-kit = {path = "../../../porter/crates/test-kit"}
ferry-fake-graph = {path = "../ferry-fake-graph"}
porter-fake-servers = {path = "../../../porter/crates/porter-fake-servers"}
porter-http-relay = {path = "../../../porter/crates/porter-http-relay"}
ferry-sync = {path = "../ferry-sync", features = ["testing"]}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
