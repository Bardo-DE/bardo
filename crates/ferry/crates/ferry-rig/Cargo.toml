[package]
name = "ferry-rig"
description = "Test tooling, never installed and never in dist: the rig a jailed scenario drives ferry with. ferry-rig-servers starts the Microsoft Graph fake (the drive and the calendars) behind porter's fake OAuth issuer on loopback, plants known tokens and serves the scenario's levers; ferry-rig-client acts as an app over the session bus and talks to syncd's org.quire.Sync1. Nothing shipped depends on it."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/ferry"
publish = false

[[bin]]
name = "ferry-rig-servers"
path = "src/bin/ferry-rig-servers.rs"

[[bin]]
name = "ferry-rig-client"
path = "src/bin/ferry-rig-client.rs"

[dependencies]
ferry-bus = {path = "../ferry-bus"}
ferry-fake-graph = {path = "../ferry-fake-graph"}
porter-dbus = {path = "../../../porter/crates/porter-dbus"}
porter-fake-servers = {path = "../../../porter/crates/porter-fake-servers"}
# The rig's shared pieces: the identity fixture the daemons read, the planted secrets and the
# shapes of rig.json.
porter-rig = {path = "../../../porter/crates/porter-rig"}
clap = {version = "4", features = ["derive"]}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
# `signal` is what this crate adds to the pinned line: SIGTERM ends the servers cleanly.
tokio = {version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"]}
zbus = {version = "5.19", default-features = false, features = ["tokio"]}

[dev-dependencies]
ferry-sync = {path = "../ferry-sync"}
syncd = {path = "../syncd", features = ["testing"]}
porter-callers = {features = ["test-proc-root"], path = "../../../porter/crates/porter-callers"}
porter-core = {path = "../../../porter/crates/porter-core"}
porter-ids = {path = "../../../porter/crates/porter-ids"}
rustix = {version = "1.1", default-features = false, features = ["std", "event", "fs", "net", "time", "process"]}
test-kit = {path = "../../../porter/crates/test-kit"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
