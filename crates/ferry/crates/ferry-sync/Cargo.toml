[package]
name = "ferry-sync"
description = "The sync engine contract: the Replica trait, anchors, base versions, conflicts and tombstones as values, dataset kinds, and an in-memory reference replica."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/ferry"
publish = false

[dependencies]
porter-capability = {path = "../../../porter/crates/porter-capability"}
porter-ids = {path = "../../../porter/crates/porter-ids"}
porter-http = {path = "../../../porter/crates/porter-http"}
serde = {version = "1", features = ["derive"]}
thiserror = {version = "2"}

[dev-dependencies]
test-kit = {path = "../../../porter/crates/test-kit"}
ferry-sync = { path = ".", features = ["testing"] }
serde_json = {version = "1"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[features]
# `MemoryReplica`, the reference replica the contract tests drive.
testing = []

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
