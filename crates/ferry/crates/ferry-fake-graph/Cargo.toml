[package]
name = "ferry-fake-graph"
description = "Test-only fake of the part of Microsoft Graph that ferry's replicas use: a drive (`/v1.0/me/drive`: items, content with ranges and redirects, simple and session uploads, delta, quota) and the calendars of `/v1.0/me/calendars`, behind a bearer token the fake issuer of porter-fake-servers minted. Never a dependency of a non-test crate."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/ferry"
publish = false

[dependencies]
base64 = {version = "0.22"}
porter-core = {path = "../../../porter/crates/porter-core"}
porter-fake = {path = "../../../porter/crates/porter-fake"}
porter-fake-servers = {path = "../../../porter/crates/porter-fake-servers"}
porter-ids = {path = "../../../porter/crates/porter-ids"}
porter-provider = {path = "../../../porter/crates/porter-provider"}
quickxorhash = {path = "../quickxorhash"}
serde_json = {version = "1"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[dev-dependencies]
test-kit = {path = "../../../porter/crates/test-kit"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
