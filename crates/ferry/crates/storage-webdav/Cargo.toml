[package]
name = "storage-webdav"
description = "The WebDAV replica: ferry-sync's Replica over dav-proto and the HTTP seam. Changes by sync-collection (RFC 6578) with an etag tree walk where the server has none, writes guarded by If-Match and If-None-Match, quota from RFC 4331, and an HTTP/1.1 client over one authenticated byte stream (accountd's OpenAuthenticated). Pure: no runtime, no socket."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/ferry"
publish = false

[dependencies]
dav-proto = {features = ["http"], path = "../../../porter/crates/dav-proto"}
porter-capability = {path = "../../../porter/crates/porter-capability"}
porter-ids = {path = "../../../porter/crates/porter-ids"}
porter-http = {path = "../../../porter/crates/porter-http"}
ferry-sync = {path = "../ferry-sync"}

[dev-dependencies]
test-kit = {path = "../../../porter/crates/test-kit"}
base64 = {version = "0.22"}
porter-fake-servers = {path = "../../../porter/crates/porter-fake-servers"}
porter-http-relay = {path = "../../../porter/crates/porter-http-relay"}
ferry-sync = {path = "../ferry-sync", features = ["testing"]}
roxmltree = {version = "0.21"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
