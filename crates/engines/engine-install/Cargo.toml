[package]
name = "engine-install"
description = "Gets an engine onto this computer from engine-manifest's pinned manifest: a resumable, cancellable download with its hash checked, unpacked and sealed into place; a Python environment filled from a hashed lock; or the distro's package. Also the argument grammar and the report lines of the privileged helper that installs for every user."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "bardo-engine-helper"
path = "src/bin/bardo-engine-helper.rs"

[dependencies]
base-secret = { path = "../../base/base-secret" }
engine-manifest = {path = "../engine-manifest"}
engine-probe = {path = "../engine-probe"}
engine-spec = {path = "../engine-spec"}
model-catalog = {path = "../../models/model-catalog"}
model-http = {path = "../../models/model-http", features = ["client", "tls"]}
# The archives are unpacked in process (`extract`), never by the system's `tar`.
flate2 = {version = "1.1.10"}
tar = {version = "0.4.46", default-features = false}
rustix = {version = "1.1", default-features = false, features = ["std", "fs"]}
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
url = { workspace = true }

[dev-dependencies]
base-testkit = {path = "../../base/base-testkit", features = ["tokio"]}
rcgen = { workspace = true, features = ["ring", "pem"] }
rustls-pki-types = { workspace = true }
tempfile = { workspace = true }
tokio = {version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "test-util", "time"]}
tokio-rustls = { workspace = true, features = ["ring", "logging", "tls12"] }

[lints]
workspace = true
