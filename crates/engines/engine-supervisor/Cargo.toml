[package]
name = "engine-supervisor"
description = "Engine lifecycle as a pure machine: start, readiness, idle unload, crash backoff and the VRAM budget; the seams the daemon fills."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-ids = {path = "../../base/base-ids"}
engine-spec = {path = "../engine-spec"}
model-catalog = {path = "../../models/model-catalog"}
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }

[features]
# Scripted fakes of the three seams, for tests of the daemon and of the accounts service's inferd.
testing = []

[lints]
workspace = true
