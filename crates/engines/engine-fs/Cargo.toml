[package]
name = "engine-fs"
description = "Reads this computer for the engine manifest: the graphics cards and the distro, the record an install leaves, which engine is already here, and the seal check before a person's own install starts. Reads files and never runs what it finds; every path and root is passed in."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-fs = { path = "../../base/base-fs" }
engine-manifest = {path = "../engine-manifest"}
engine-spec = {path = "../engine-spec"}
model-catalog = {path = "../../models/model-catalog"}
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
