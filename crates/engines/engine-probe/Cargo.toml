[package]
name = "engine-probe"
description = "Reads this computer for the engine manifest: the graphics cards and the distro, where installs live and the record each leaves, which engine is already here, and the seal check before a person's own install starts. Reads files and never runs what it finds; every path and root is passed in."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/stoker"
publish = false

[dependencies]
engine-manifest = {path = "../engine-manifest"}
engine-spec = {path = "../engine-spec"}
model-catalog = {path = "../../models/model-catalog"}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
sha2 = {version = "0.10"}
thiserror = {version = "2"}

[dev-dependencies]
tempfile = {version = "3"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
