[package]
name = "caller-identity-linux"
description = "Which program is calling: a pinned process (pidfd), the facts /proc states about it, and the judgement against a root-owned table."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-fs = { path = "../../base/base-fs" }
caller-identity-core = {path = "../caller-identity-core"}
nix = { workspace = true, features = ["socket"] }
rustix = {workspace = true, features = ["std", "event", "net", "process"]}
thiserror = { workspace = true }

[dev-dependencies]
# The crate's own tests need its test-only features.
caller-identity-linux = {path = ".", features = ["dev-rows"]}

[features]
# Test seams: a pinned process that is only a claim (`Pinned::introduced`) and ready-made
# standings. A shipped binary never enables it; the desktop gate greps `cargo tree -e features`.
fake = []
# Forwarded to caller-identity-core.
desktop = ["caller-identity-core/desktop"]
# Forwarded to caller-identity-core (developer rows) and adds `TableFiles::load_dev`. Never shipped.
dev-rows = ["caller-identity-core/dev-rows"]

[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["fake"]

[lints]
workspace = true
