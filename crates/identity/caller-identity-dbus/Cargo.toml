[package]
name = "caller-identity-dbus"
description = "Which program is calling, over the session or system bus: a sender's pinned process, its unit as the unit manager states it, and the check a method makes."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
caller-identity-linux = {path = "../caller-identity-linux"}
caller-identity-core = {path = "../caller-identity-core"}
zbus = {workspace = true}
base-time = { path = "../../base/base-time" }
thiserror = { workspace = true }
tokio = {workspace = true, features = ["rt"], optional = true}

[features]
# zbus runs on its own executor by default. A tokio program turns `default-features` off and
# `tokio` on: zbus then runs on that runtime and `Offload::Tokio` becomes available.
default = ["async-io"]
async-io = ["zbus/async-io"]
tokio = ["dep:tokio", "zbus/tokio"]
# Test seams (`BusPeers::introduce`); a shipped binary never enables it.
fake = ["caller-identity-linux/fake"]
# Forwarded to caller-identity-core (`roles`).
desktop = ["caller-identity-linux/desktop"]
# Forwarded to caller-identity-core (developer rows). Never shipped.
dev-rows = ["caller-identity-linux/dev-rows"]

[dev-dependencies]
caller-identity-linux = {path = "../caller-identity-linux", features = ["fake"]}
tempfile = { workspace = true }
dbus-kit = {path = "../../bus/dbus-kit", features = ["tokio"]}

# One integration binary that needs the `fake` seams (an introduced standing, a fixture tree).
[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["fake"]

[lints]
workspace = true
