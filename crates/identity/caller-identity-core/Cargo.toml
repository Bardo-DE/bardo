[package]
name = "caller-identity-core"
description = "Which program is calling: ids, the caller table, the facts about a process, and the pure judgement over them. No I/O."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
toml = { workspace = true, optional = true }

[features]
# `toml`: `Table::from_toml`, the caller table's text format. On by default; a vocabulary crate that
# only names the types (account-core re-exports `CgroupPath`) turns default features off.
default = ["toml"]
toml = ["dep:toml"]

[lints]
workspace = true
