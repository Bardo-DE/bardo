[package]
name = "zbus-ready"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
description = "Wait until a zbus connection's object server is listening before announcing it."
publish = false

[dependencies]
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["time", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "test-util"] }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
