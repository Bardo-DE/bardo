[package]
name = "files-model"
description = "The pure state machines of files: the browser's history, selection, rename and views, stepped as data."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/files"
publish = false

[dependencies]
files-core = {path = "../files-core"}
thiserror = {version = "2"}

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
