[package]
name = "files-ui"
description = "The window of files: a Finder-like folder view drawn only with quire's components."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `FakeVolumes`, for tests of this crate and of the binary around it.
testing = []

[dependencies]
anyview-core = {path = "../../anyview/crates/anyview-core"}
anyview-fs = {path = "../../anyview/crates/anyview-fs"}
# The picture of a file for the icon view: scaled and encoded here, kept in the shared thumbnail cache below.
anyview-image = {path = "../../anyview/crates/anyview-image"}
# The `pane` feature is the card that draws a peek (mailo's choice); no `media`, so no player.
anyview-peek = {default-features = false, features = ["pane"], path = "../../anyview/crates/anyview-peek"}
# The shared thumbnail cache's trait (and its freedesktop implementation, which the binary builds).
anyview-platform = {path = "../../anyview/crates/anyview-platform"}
keymap = {path = "../../keymap/keymap"}
chrono = { workspace = true, features = ["std", "clock"] }
dioxus = { workspace = true, features = ["macro", "html", "hooks", "signals"] }
ui-components = {path = "../../ui/ui-components"}
ui-blitz = {path = "../../ui/ui-blitz"}
ui-extensions = {path = "../../ui/ui-extensions"}
ui-helpers = {default-features = false, path = "../../ui/ui-helpers"}
ui-settings = {features = ["dioxus"], path = "../../ui/ui-settings"}
files-core = {path = "../files-core"}
files-fs = {path = "../files-fs"}
files-model = {path = "../files-model"}
files-ops = {path = "../files-ops"}
files-trash = {path = "../files-trash"}
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "process"]}

[dev-dependencies]
files-ui = { path = ".", features = ["testing"] }
# `FakeThumbnails`, the cache in memory.
anyview-platform = {features = ["testing"], path = "../../anyview/crates/anyview-platform"}
ui-harness = {path = "../../ui/ui-harness"}
ui-lint = {path = "../../ui/ui-lint"}
files-fs = {path = "../files-fs", features = ["testing"]}
base-testkit = {path = "../../base/base-testkit", features = ["tokio"]}
files-trash = {path = "../files-trash", features = ["testing"]}
tempfile = { workspace = true }
toml = { workspace = true }

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true
