[package]
name = "files-desktop"
description = "How files meets the desktop: the file manager service, its actions for agents, UDisks2 disks, one running instance, and opening files with apps."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `FakeSpawn`, `FakeActivate` and `FakeUsers`, for tests of the crates above.
testing = []

[dependencies]
action-wire = {path = "../../actions/action-wire"}
action-manifest = {path = "../../actions/action-manifest"}
action-vocab = {path = "../../actions/action-vocab"}
base-ids = { path = "../../base/base-ids" }
action-provider = {features = ["dbus"], path = "../../actions/action-provider"}
action-core = {path = "../../actions/action-core"}
action-dbus = {path = "../../actions/action-dbus"}
ui-helpers = {default-features = false, path = "../../ui/ui-helpers"}
files-core = {path = "../files-core"}
files-fs = {path = "../files-fs"}
futures-util = { workspace = true, features = ["std"] }
account-core = {path = "../../accounts/account-core"}
account-dbus = {path = "../../accounts/account-dbus"}
sync-bus = {path = "../../sync/sync-bus"}
provenance = {path = "../../provenance/provenance"}
thiserror = { workspace = true }
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "process"]}
toml = { workspace = true }
zbus = {workspace = true, features = ["tokio"]}
dbus-kit = { path = "../../bus/dbus-kit" }

[dev-dependencies]
files-desktop = { path = ".", features = ["testing"] }
files-fs = {path = "../files-fs", features = ["testing"]}
base-testkit = {path = "../../base/base-testkit", features = ["tokio"]}
# Porter's fake Storage1, served on the tests' private bus (test tooling, never shipped).
sync-fakes = {path = "../../sync/sync-fakes"}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = { workspace = true }

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true
