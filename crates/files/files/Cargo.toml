[package]
name = "files"
description = "Files: the desktop's file manager. Arguments, the environment, and the window."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-xdg = { path = "../../base/base-xdg" }
anyview-platform = {path = "../../anyview/crates/anyview-platform"}
ui-extensions = {path = "../../ui/ui-extensions"}
xdg-core = { path = "../../xdg/xdg-core" }
xdg-fs = { path = "../../xdg/xdg-fs" }
settings-store-fs = { path = "../../settings/settings-store-fs" }
settings-types = { path = "../../settings/settings-types" }
files-core = {path = "../files-core"}
files-desktop = {path = "../files-desktop"}
files-fs = {path = "../files-fs"}
files-model = {path = "../files-model"}
files-trash = {path = "../files-trash"}
files-ui = {path = "../files-ui"}
ui-blitz = {path = "../../ui/ui-blitz"}
tracing = { workspace = true }
freedesktop-icons = { workspace = true }
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "process"]}

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "bardo-files"
path = "src/main.rs"

[lints]
workspace = true
