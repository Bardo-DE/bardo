[package]
name = "files-trash"
description = "The freedesktop.org Trash behind a trait for files: move to the Trash, list it, put back, erase, with a fake for tests."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/files"
publish = false

[features]
# `FakeTrash`, a Trash kept in a scratch folder, for tests of the crates above.
testing = []

[dependencies]
files-core = {path = "../files-core"}
thiserror = {version = "2"}
trash = {version = "5"}

[dev-dependencies]
files-trash = { path = ".", features = ["testing"] }
tempfile = {version = "3"}

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
