[package]
name = "files-fs"
description = "The disk behind traits for files: listing a folder and watching it, with fakes for tests."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `FakeLister` and `FakeWatcher`, for tests of the crates above.
testing = []

[dependencies]
base-fs = { path = "../../base/base-fs" }
files-core = {path = "../files-core"}
notify = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
files-fs = { path = ".", features = ["testing"] }
tempfile = { workspace = true }

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true
