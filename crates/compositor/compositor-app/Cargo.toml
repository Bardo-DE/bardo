[package]
name = "compositor-app"
description = "casement, the desktop's Wayland compositor: the composition root (State, the smithay delegates, the protocol handlers, exec, the clock, the settings document) and the binary."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "bardo-compositor"
path = "src/main.rs"
# The real session needs the device libraries (A2): a build without the default features is the
# headless library only (what the test kit, cua's tests and a harness take).
required-features = ["tty", "libinput"]

[dependencies]
base-fs = { path = "../../base/base-fs" }
compositor-core = {path = "../compositor-core"}
compositor-layout = {path = "../compositor-layout"}
compositor-motion = {path = "../compositor-motion"}
compositor-render = {path = "../compositor-render"}
compositor-icons = {path = "../compositor-icons"}
compositor-chrome = {path = "../compositor-chrome"}
compositor-wayland = {path = "../compositor-wayland", features = ["quire"]}
compositor-backend = {path = "../compositor-backend"}
compositor-agent = {path = "../compositor-agent"}
compositor-ipc = {path = "../compositor-ipc"}
compositor-privacy = {path = "../compositor-privacy"}
desktop-protocols = {path = "../../wayland/desktop-protocols", features = ["server"]}
shell-verbs = {path = "../../wayland/shell-verbs"}
account-core = {path = "../../accounts/account-core"}
ui-core = {path = "../../ui/ui-core", default-features = false}
ui-settings = {path = "../../ui/ui-settings", default-features = false, features = ["quire-desktop"]}
keymap = {path = "../../keymap/keymap"}
key-remap-client = {path = "../../input/key-remap-client"}
# Temporary: moves the pre-bardo folders once at start; delete with the crate.
old-folders = {path = "../../platform/old-folders"}
# A14's feature list, the union the binary links (xwayland off until the Q-C5 gate). The device
# backends (drm, gbm, libinput, udev, libseat) come with the `tty` and `libinput` features below.
smithay = {git = "https://github.com/Bardo-DE/smithay", rev = "919d8dcf7fe0b9ad03f3de53bc178dad30823631", default-features = false, features = ["backend_egl", "backend_libei", "backend_vulkan", "backend_winit", "desktop", "renderer_gl", "renderer_multi", "renderer_pixman", "use_system_lib", "wayland_frontend"]}
calloop = { workspace = true }
jiff = { workspace = true }
x11rb = { workspace = true, features = ["res"] }
nix = { workspace = true, features = ["socket"] }
rustix = {version = "1.1", default-features = false, features = ["std", "event", "fs", "net", "time", "process", "pipe"]}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process", "signal"]}
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "std", "env-filter"] }

[dev-dependencies]
tempfile = { workspace = true }
toml = { workspace = true }

[features]
# The real session (A2): the tty backend's adapters (libseat, udev, DRM, GBM) and libinput. On by
# default so `cargo build -p compositor-app` makes the compositor; a headless consumer takes the
# library with `default-features = false` (the workspace dependency does).
default = ["tty", "libinput"]
tty = ["compositor-backend/tty"]
libinput = ["compositor-backend/libinput"]
# Headless tests only (B10): the test kit builds casement with it. A binary with it refuses
# every backend but headless and refuses to start outside the jail (jail_check.rs). It also reads
# test caller rows from the injected folder (`clients/dev_callers.rs`), hence `dev-rows`.
testing = ["compositor-render/testing", "compositor-backend/testing", "compositor-ipc/dev-rows"]
# bardo-compositorctl's Debug1 on the private bus (B10); the same refusals as `testing`.
debug-inject = ["compositor-ipc/debug-inject", "compositor-backend/debug-inject", "compositor-ipc/dev-rows"]

[lints]
workspace = true
