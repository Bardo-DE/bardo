[package]
name = "compositor-app"
description = "The desktop's Wayland compositor: the composition root (State, the smithay delegates, the protocol handlers, exec, the clock, the settings document) and the binary."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "bardo-compositor"
path = "src/main.rs"
# The real session needs the device libraries (A2): a build without the default features is the
# headless library only (what the test kit, computer use's tests and a harness take).
required-features = ["tty", "libinput"]

[dependencies]
base-ids = { path = "../../base/base-ids" }
base-spawn = { path = "../../base/base-spawn" }
base-words = { path = "../../base/base-words" }
base-time = { path = "../../base/base-time" }
base-xdg = { path = "../../base/base-xdg" }
base-fs = { path = "../../base/base-fs" }
base-clock = { path = "../../base/base-clock" }
compositor-core = {path = "../compositor-core"}
key-types = {path = "../../keymap/key-types"}
compositor-layout = {path = "../compositor-layout"}
compositor-motion = {path = "../compositor-motion"}
compositor-render = {path = "../compositor-render"}
compositor-icons = {path = "../compositor-icons"}
compositor-chrome = {path = "../compositor-chrome"}
compositor-wayland = {path = "../compositor-wayland", features = ["shell-protocols"]}
compositor-backend = {path = "../compositor-backend"}
compositor-agent = {path = "../compositor-agent"}
compositor-ipc = {path = "../compositor-ipc"}
caller-identity-dev = {optional = true, path = "../../identity/caller-identity-dev"}
compositor-privacy = {path = "../compositor-privacy"}
desktop-protocols = {path = "../../wayland/desktop-protocols", features = ["server"]}
shell-verbs = {path = "../../wayland/shell-verbs"}
account-core = {path = "../../accounts/account-core"}
ui-core = {path = "../../ui/ui-core", default-features = false}
settings-store = { path = "../../settings/settings-store" }
settings-store-fs = { path = "../../settings/settings-store-fs" }
settings-types = { path = "../../settings/settings-types" }
appearance-settings = { path = "../../settings/appearance-settings" }
keymap = {path = "../../keymap/keymap"}
key-remap-client = {path = "../../input/key-remap-client"}
# A14's feature list, the union the binary links (xwayland off until the Q-C5 gate). The device
# backends (drm, gbm, libinput, udev, libseat) come with the `tty` and `libinput` features below.
smithay = {workspace = true, features = ["backend_egl", "backend_libei", "backend_vulkan", "backend_winit", "desktop", "renderer_gl", "renderer_multi", "renderer_pixman", "use_system_lib", "wayland_frontend"]}
calloop = { workspace = true }
jiff = { workspace = true }
x11rb = { workspace = true, features = ["res"] }
nix = { workspace = true, features = ["socket"] }
rustix = {workspace = true, features = ["std", "event", "fs", "net", "time", "process", "pipe"]}
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process", "signal"]}
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "std", "env-filter"] }

[dev-dependencies]
base-testkit = { path = "../../base/base-testkit" }
key-remap-core = {path = "../../input/key-remap-core"}
tempfile = { workspace = true }
toml = { workspace = true }

[features]
# The real session (A2): the tty backend's adapters (libseat, udev, DRM, GBM) and libinput. On by
# default so `cargo build -p compositor-app` makes the compositor; a headless consumer takes the
# library with `default-features = false` (the workspace dependency does).
default = ["tty", "libinput"]
tty = ["compositor-backend/tty"]
libinput = ["compositor-backend/libinput"]
# Headless tests only (B10): the test kit builds the compositor with it. A binary with it refuses
# every backend but headless and refuses to start outside the jail (jail_check.rs). It also reads
# test caller rows from the injected folder (`clients/dev_callers.rs`), hence `dev-rows` and `caller-identity-dev`.
testing = ["compositor-render/testing", "compositor-backend/testing", "compositor-ipc/dev-rows", "dep:caller-identity-dev"]
# bardo-compositorctl's Debug1 on the private bus (B10); the same refusals as `testing`.
debug-inject = ["compositor-ipc/debug-inject", "compositor-backend/debug-inject", "compositor-ipc/dev-rows", "dep:caller-identity-dev"]

[lints]
workspace = true

[package.metadata.cargo-shear]
# Modules that hold only a note on why a protocol needs no handler of its own.
ignored-paths = [
    "src/handlers/alpha_modifier.rs",
    "src/handlers/commit_timing.rs",
    "src/handlers/content_type.rs",
    "src/handlers/cursor_shape.rs",
    "src/handlers/fifo.rs",
    "src/handlers/pointer_gestures.rs",
    "src/handlers/presentation.rs",
    "src/handlers/relative_pointer.rs",
    "src/handlers/single_pixel.rs",
    "src/handlers/subcompositor.rs",
    "src/handlers/viewporter.rs",
    "src/handlers/xdg_foreign.rs",
    "src/handlers/xdg_toplevel_icon.rs",
]
