[package]
name = "compositor-agent"
description = "The compositor's agent edge: the privileged-connection hand-out (P2), the agent seat, EIS, masked capture, the trusted surface and the kill chord (P4). A skeleton at P0."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The second-line checks (`portal_may_connect`, `agent_may_lease`, `hand_out`) also let in a developer row's proof
# (`Proof::Dev`), as compositor-ipc's `dev-rows` does on the bus thread. Only compositor-app's `testing` and
# `debug-inject` builds turn it on; a shipped build never has it.
dev-rows = []

[dependencies]
compositor-core = {path = "../compositor-core"}
desktop-protocols = {path = "../../wayland/desktop-protocols"}
smithay = {workspace = true, features = ["wayland_frontend"]}
# The remote EIS server (eis.rs; B14: no other crate names it). Already in the lock through
# smithay; the calloop feature gives the event-loop source.
reis = { workspace = true, features = ["calloop"] }
# Role names only (`SHELL`, `AGENT_TIER`, `PORTAL`): what a caller proved on the bus,
# no bus and no process reading in this crate.
caller-identity-core = {path = "../../identity/caller-identity-core"}
caller-roles = {path = "../../identity/caller-roles"}

# The sealed memory file of a keyboard's keymap (eis_keymap.rs).
rustix = {workspace = true, features = ["std", "event", "fs", "net", "time", "process", "pipe"]}
tracing = { workspace = true }

[lints]
workspace = true
