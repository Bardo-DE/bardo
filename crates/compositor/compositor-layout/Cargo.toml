[package]
name = "compositor-layout"
description = "casement's pure layout seam: SceneLayout, the scene spec, the Arrangement it yields and RustScene, the production layout; taffy only behind taffy_bridge."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
compositor-core = {path = "../compositor-core"}
desktop-protocols = {path = "../../wayland/desktop-protocols"}
account-core = {path = "../../accounts/account-core"}
ui-core = {path = "../../ui/ui-core", default-features = false}
ui-style = {path = "../../ui/ui-style", default-features = false}
taffy = {workspace = true, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout"]}

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
