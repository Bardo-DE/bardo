[package]
name = "compositor-icons"
description = "App icons for the compositor's own drawing (Mission Control): an app id to its desktop entry's Icon, the XDG icon-theme lookup, and PNG or SVG decoded to straight RGBA at a pixel size."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-fs = { path = "../../base/base-fs" }
ui-helpers = {path = "../../ui/ui-helpers", default-features = false}
freedesktop-icons = { workspace = true }
image = { workspace = true, features = ["png", "jpeg"] }
resvg = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
rustix = {workspace = true, features = ["std", "event", "fs", "net", "time", "process", "pipe"]}
tempfile = { workspace = true }

[lints]
workspace = true
