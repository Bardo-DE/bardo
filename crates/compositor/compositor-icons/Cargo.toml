[package]
name = "compositor-icons"
description = "App icons for casement's own drawing (Mission Control): an app id to its desktop entry's Icon, the XDG icon-theme lookup, and PNG or SVG decoded to straight RGBA at a pixel size."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/casement"
publish = false

[dependencies]
ui-helpers = {path = "../../ui/ui-helpers", default-features = false}
freedesktop-icons = {version = "0.4"}
image = {version = "0.25.6", default-features = false, features = ["png", "jpeg"]}
resvg = {version = "0.48.1", default-features = false}
rustix = {version = "1.1", default-features = false, features = ["std", "event", "fs", "net", "time", "process", "pipe"]}
thiserror = {version = "2"}

[dev-dependencies]
tempfile = {version = "3"}

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
