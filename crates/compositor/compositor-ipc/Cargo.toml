[package]
name = "compositor-ipc"
description = "casement's D-Bus servers: org.quire.Compositor1 (P2) and, under feature debug-inject, org.quire.Casement.Debug1 with its inject and wait grammars."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/casement"
publish = false

[dependencies]
compositor-core = {path = "../compositor-core"}
# Only `VirtualOutputSpec` for the Debug1 object: a release build links neither the backend nor
# smithay.
compositor-backend = {path = "../compositor-backend", optional = true}
# `Fraction`, the pinch scale in the inject grammar.
ui-core = {path = "../../ui/ui-core", default-features = false}
account-core = {path = "../../accounts/account-core"}
# `SpacesProxy::register`: the compositor registers the Spaces it mints with accountd.
account-dbus = {path = "../../accounts/account-dbus"}
# `live`: `org.quire.SettingsModule1`, the way Settings reads and changes the Privacy list.
ui-settings = {path = "../../ui/ui-settings", default-features = false, features = ["live", "quire-desktop"]}
ui-style = {path = "../../ui/ui-style", default-features = false}
calloop = {version = "0.14"}
zbus = {version = "5.19", default-features = false, features = ["tokio"]}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process", "signal"]}
thiserror = {version = "2"}
toml = {version = "1"}
# Which program is calling: every Compositor1 call and every Privacy call is checked with it.
caller-identity-dbus = {default-features = false, features = ["desktop", "tokio"], path = "../../identity/caller-identity-dbus"}
# `WireCode::ALL` and `Power`: the section list of the Privacy module (the vocabulary's one home).
desktop-protocols = {path = "../../wayland/desktop-protocols"}
# The refusal of a call is logged once, with the role asked and the standing found.
tracing = {version = "0.1"}
# Keysym names in the inject grammar (`key Return down`).
xkbcommon = {version = "0.9", features = ["wayland"]}
zbus-ready = { path = "../../zbus-ready" }

[dev-dependencies]
# `BusPeers::introduce`, `FixtureProc`: the tests make a sender stand as a chosen caller on a
# private bus and never read the real `/proc` for it.
caller-identity-dbus = {default-features = false, features = ["desktop", "fake", "tokio"], path = "../../identity/caller-identity-dbus"}

[features]
# `test_bus::PrivateBus`: a private dbus-daemon for other crates' tests.
testing = []
# org.quire.Casement.Debug1 on the private bus (B10): never in a release build.
debug-inject = ["dep:compositor-backend", "compositor-backend/debug-inject"]
# Developer rows (peephole's `dev-rows`): a program named in a file the person owns is a desktop
# service at `Proof::Dev`, and `dbus::require` lets exactly that proof in. Only casement's
# `testing` and `debug-inject` turn it on; a shipped build never has it (the desktop gate greps
# `cargo tree -e features` for `dev-rows`).
dev-rows = ["caller-identity-dbus/dev-rows"]

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
