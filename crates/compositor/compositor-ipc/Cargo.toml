[package]
name = "compositor-ipc"
description = "The compositor's D-Bus servers: org.bardo.Compositor1 (P2) and, under feature debug-inject, org.bardo.Compositor.Debug1 with its inject and wait grammars."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
caller-identity-core = {default-features = false, path = "../../identity/caller-identity-core"}
base-ids = { path = "../../base/base-ids" }
base-spawn = { path = "../../base/base-spawn" }
compositor-core = {path = "../compositor-core"}
compositor-dbus = {path = "../compositor-dbus"}
# Only `VirtualOutputSpec` for the Debug1 object: a release build links neither the backend nor
# smithay.
compositor-backend = {path = "../compositor-backend", optional = true}
# `Fraction`, the pinch scale in the inject grammar.
account-core = {path = "../../accounts/account-core"}
# `SpacesProxy::register`: the compositor registers the Spaces it mints with accountd.
account-dbus = {path = "../../accounts/account-dbus"}
# `live`: `org.bardo.SettingsModule1`, the way Settings reads and changes the Privacy list.
settings-dbus = { path = "../../settings/settings-dbus" }
settings-proto = { path = "../../settings/settings-proto" }
settings-types = { path = "../../settings/settings-types" }
# The desktop's colour scheme: the settings portal on the session bus.
settings-portal = { path = "../../settings/settings-portal", default-features = false, features = ["desktop"] }
calloop = { workspace = true }
zbus = {workspace = true, features = ["tokio"]}
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process", "signal"]}
thiserror = { workspace = true }
toml = { workspace = true }
# Which program is calling: every Compositor1 call and every Privacy call is checked with it.
caller-identity-dbus = {default-features = false, features = ["tokio"], path = "../../identity/caller-identity-dbus"}
caller-roles = {path = "../../identity/caller-roles"}
peers-callers = {path = "../../identity/peers-callers"}
# `WireCode::ALL` and `Power`: the section list of the Privacy module (the vocabulary's one home).
desktop-protocols = {path = "../../wayland/desktop-protocols"}
# The refusal of a call is logged once, with the role asked and the standing found.
tracing = { workspace = true }
# Keysym names in the inject grammar (`key Return down`).
xkbcommon = {workspace = true, features = ["wayland"]}
dbus-kit = { path = "../../bus/dbus-kit" }

[dev-dependencies]
# The shipped caller table is read by the role test, so the table reader is on.
caller-identity-core = {path = "../../identity/caller-identity-core"}
base-testkit = {path = "../../base/base-testkit", features = ["dbus", "tokio"]}
# `BusPeers::introduce`, `FixtureProc`: the tests make a sender stand as a chosen caller on a
# private bus and never read the real `/proc` for it.
caller-identity-dbus = {default-features = false, features = ["fake", "tokio"], path = "../../identity/caller-identity-dbus"}

[features]
# org.bardo.Compositor.Debug1 on the private bus (B10): never in a release build.
debug-inject = ["dep:compositor-backend", "compositor-backend/debug-inject"]
# Developer rows: a program named in a file the person owns is a desktop service at `Proof::Dev`
# (`caller-identity-dev`, which the compositor's app reads the file with), and `dbus::require` lets
# exactly that proof in. Only the compositor's `testing` and `debug-inject` turn it on; a shipped
# build never has it (the desktop gate greps `cargo tree -e features` for `dev-rows`).
dev-rows = []

[lints]
workspace = true
