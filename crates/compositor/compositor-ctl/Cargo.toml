[package]
name = "compositor-ctl"
description = "bardo-compositorctl: drive a jailed casement over its private bus (debug inject, wait, clock, output, windows, scene, fault), take screenshots (P1) and print hardware reports (P5)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "bardo-compositorctl"
path = "src/main.rs"

[dependencies]
# The privacy book and the administrator's floor as casement reads them (`privacy list`).
compositor-privacy = {path = "../compositor-privacy"}
desktop-client = {path = "../../wayland/desktop-client", features = ["client"]}
image = { workspace = true, features = ["png", "jpeg"] }
wayland-client = { workspace = true }
zbus = {version = "5.19", default-features = false, features = ["tokio"]}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process", "signal"]}
thiserror = { workspace = true }
rustix = {version = "1.1", default-features = false, features = ["std", "event", "fs", "net", "time", "process", "pipe"]}

[lints]
workspace = true
