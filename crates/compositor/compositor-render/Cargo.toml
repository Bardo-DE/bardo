[package]
name = "compositor-render"
description = "casement's renderer seam: the Compositor trait over smithay's renderers, the CasementElement set, FrameScene to elements, damage-tracked output rendering and (feature testing) golden comparison."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
compositor-core = {path = "../compositor-core"}
compositor-motion = {path = "../compositor-motion"}
desktop-protocols = {path = "../../wayland/desktop-protocols"}
ui-core = {path = "../../ui/ui-core", default-features = false}
smithay = {workspace = true, features = ["backend_egl", "desktop", "renderer_gl", "renderer_pixman", "wayland_frontend"]}
thiserror = { workspace = true }
image = { workspace = true, features = ["png", "jpeg"], optional = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }

[features]
# Headless tests only (B10): smithay's DummyRenderer and the golden helper.
testing = ["smithay/renderer_test", "dep:image"]

[lints]
workspace = true
