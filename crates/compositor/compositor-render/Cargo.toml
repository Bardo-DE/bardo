[package]
name = "compositor-render"
description = "The compositor's renderer seam: the Compositor trait over smithay's renderers, the SceneElement set, FrameScene to elements, and damage-tracked output rendering."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-ids = { path = "../../base/base-ids" }
compositor-core = {path = "../compositor-core"}
compositor-egl = {path = "../compositor-egl"}
compositor-motion = {path = "../compositor-motion"}
desktop-protocols = {path = "../../wayland/desktop-protocols"}
ui-core = {path = "../../ui/ui-core", default-features = false}
smithay = {workspace = true, features = ["backend_egl", "desktop", "renderer_gl", "renderer_pixman", "wayland_frontend"]}
thiserror = { workspace = true }

[dev-dependencies]
image = { workspace = true }
proptest = { workspace = true }

[features]
# Headless tests only (B10): smithay's DummyRenderer.
testing = ["smithay/renderer_test"]

[lints]
workspace = true
