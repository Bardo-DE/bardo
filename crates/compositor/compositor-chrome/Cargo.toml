[package]
name = "compositor-chrome"
description = "casement's window title text: parley lays the title out with fontique's system fonts, vello_cpu rasterises it to premultiplied RGBA at the output's native scale. The only crate that reaches the text stack (boundary row B15)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
compositor-core = {path = "../compositor-core"}
ui-core = {path = "../../ui/ui-core", default-features = false}
ui-style = {path = "../../ui/ui-style", default-features = false}
parley = { workspace = true, features = ["std", "system"] }
thiserror = { workspace = true }
vello_cpu = {git = "https://github.com/Bardo-DE/vello", rev = "5c986661c9e943d26dac8e8ea7812895947722b8"}

[lints]
workspace = true
