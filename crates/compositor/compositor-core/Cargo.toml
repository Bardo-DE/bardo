[package]
name = "compositor-core"
description = "casement's pure model: ids, geometry, time data, apps, windows, Spaces, focus, press routing, input origins and bindings, output policy, settings, Model::step and its invariants."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-ids = { path = "../../base/base-ids" }
base-words = { path = "../../base/base-words" }
base-time = { path = "../../base/base-time" }
desktop-protocols = {path = "../../wayland/desktop-protocols"}
account-core = {path = "../../accounts/account-core"}
ui-core = {path = "../../ui/ui-core", default-features = false}
ui-motion = {path = "../../ui/ui-motion", default-features = false}
ui-style = {path = "../../ui/ui-style", default-features = false}
ui-behaviour = {path = "../../ui/ui-behaviour"}
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
# The Space ids file's codec (A1): text in, text out, no file I/O.
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
