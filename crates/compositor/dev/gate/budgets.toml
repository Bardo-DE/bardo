# Step budgets in seconds per gate tier (20-FREEZE-PLAN §6.4), read by dev/lib/step.sh: a step
# that passes but takes more than twice its budget fails with exit 4. Warm builds; a cold smithay
# build (3-5 min) is excluded, so `archive` is generous. SP6 recalibrates these once on compositor.
#
# Not the compositor's steps, recorded for the desktop gate (21-FREEZE-AMENDMENTS A9): consumer smoke
# 240 s only with at least two parallel jails (else 360 s); full consumer suites 15 min; the wlcs
# CI subset takes about 7 s.

[fast]
preflight = 5
archive = 300
test = 120

[merge]
preflight = 5
doc = 60
archive = 300
test = 180
accept = 180

[phase]
preflight = 5
doc = 60
archive = 300
test = 600
accept = 180
wlcs = 300
