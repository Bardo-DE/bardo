# The perf benches (A30). They read a clock, which boundary row B8 keeps out of crates/, so they
# live here as their own workspace: `dev/perf/run.sh` builds and runs them (outside the jail, on
# the release profile) and compares each p95 with the last green run. Never a member of the
# casement workspace.
[package]
name = "casement-perf"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
compositor-core = { path = "../../compositor-core" }
compositor-layout = { path = "../../compositor-layout" }
compositor-motion = { path = "../../compositor-motion" }
desktop-protocols = { path = "../../../wayland/desktop-protocols" }
account-core = { path = "../../../accounts/account-core" }
ui-core = { path = "../../../ui/ui-core", default-features = false }
ui-motion = { path = "../../../ui/ui-motion", default-features = false }
ui-style = { path = "../../../ui/ui-style", default-features = false }

[[bin]]
name = "layout"
path = "src/bin/layout.rs"

[[bin]]
name = "motion"
path = "src/bin/motion.rs"

[profile.release]
debug = 1
