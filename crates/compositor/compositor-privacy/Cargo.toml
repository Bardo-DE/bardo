[package]
name = "compositor-privacy"
description = "casement's privacy files: the person's book (which program may use which power) and the administrator's floor, read and written safely, and the list of both that bardo-compositorctl prints."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-fs = { path = "../../base/base-fs" }
compositor-core = {path = "../compositor-core"}
desktop-protocols = {path = "../../wayland/desktop-protocols"}
# The safe file reader and writer every quire crate shares (`read_capped`, `write_atomic`,
# `move_aside`); no bus, no UI.
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
rustix = {version = "1.1", default-features = false, features = ["std", "event", "fs", "net", "time", "process", "pipe"]}

[lints]
workspace = true
