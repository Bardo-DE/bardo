[package]
name = "compositor-testkit"
description = "The compositor's one test harness: Fixture over the real State on the headless backend, test origins, fakes (session, udev, logind, the mouse gestures daemon), the soft GPU topology, golden helpers and typed fuzz ops; the fake-logind binary."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "fake-logind"
path = "src/bin/fake_logind.rs"

[[bin]]
name = "writeback-compare"
path = "src/bin/writeback_compare.rs"

[dependencies]
base-testkit = {path = "../../base/base-testkit"}
base-time = { path = "../../base/base-time" }
compositor-app = {path = "../compositor-app", default-features = false, features = ["testing"]}
compositor-core = {path = "../compositor-core"}
compositor-layout = {path = "../compositor-layout"}
compositor-render = {path = "../compositor-render", features = ["testing"]}
compositor-backend = {path = "../compositor-backend", features = ["testing"]}
compositor-wayland = {path = "../compositor-wayland"}
compositor-ipc = {path = "../compositor-ipc", features = ["testing"]}
compositor-testclient = {path = "../compositor-testclient"}
desktop-protocols = {path = "../../wayland/desktop-protocols", features = ["client"]}
account-core = {path = "../../accounts/account-core"}
ui-core = {path = "../../ui/ui-core", default-features = false}
smithay = {workspace = true, features = ["backend_session", "renderer_multi", "renderer_pixman", "wayland_frontend"]}
image = { workspace = true, features = ["png", "jpeg"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
zbus = {workspace = true, features = ["tokio"]}
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process", "signal"]}
rustix = {workspace = true, features = ["std", "event", "fs", "net", "time", "process", "pipe"]}
proptest = { workspace = true }

[dev-dependencies]
base-ids = { path = "../../base/base-ids" }
wayland-client = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
