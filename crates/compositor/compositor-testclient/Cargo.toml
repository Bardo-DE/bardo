[package]
name = "compositor-testclient"
description = "Typed wayland-client helpers per protocol for casement's tests, the Transcript every client keeps, test patterns and shm buffers; the compositor-probe and compositor-shell-exec binaries. Reaches no smithay (B9)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "compositor-probe"
path = "src/bin/probe.rs"

# The X11 client of the XWayland suite (P1-X1).
[[bin]]
name = "compositor-x11probe"
path = "src/bin/x11probe.rs"

# Runs a program as the shell: the socket Compositor1.Connect("shell") hands out, in WAYLAND_SOCKET.
[[bin]]
name = "compositor-shell-exec"
path = "src/bin/shell_exec.rs"

[dependencies]
compositor-dbus = { path = "../compositor-dbus" }
base-xdg = { path = "../../base/base-xdg" }
compositor-core = {path = "../compositor-core"}
desktop-protocols = {path = "../../wayland/desktop-protocols", features = ["client"]}
# The capture helpers fold events with its reducer and read its Frame; no wire layer (a fixture
# cannot answer its blocking round trips).
desktop-client = {path = "../../wayland/desktop-client"}
wayland-client = { workspace = true }
wayland-backend = { workspace = true, features = ["client_system"] }
wayland-protocols = { workspace = true, features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { workspace = true, features = ["client"] }
wayland-protocols-misc = { workspace = true, features = ["client"] }
rustix = {workspace = true, features = ["std", "event", "fs", "net", "time", "process", "pipe"]}
serde_json = { workspace = true }
thiserror = { workspace = true }
x11rb = { workspace = true, features = ["res"] }
# The probe's `shell-connect` and compositor-shell-exec ask org.bardo.Compositor1 for the shell
# connection (bardo/handout.rs).
zbus = {workspace = true, features = ["tokio"]}
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process", "signal"]}

[lints]
workspace = true

[package.metadata.cargo-shear]
# Modules that hold only a note on why a protocol needs no handler of its own.
ignored-paths = [
    "src/misc/syncobj.rs",
    "src/bardo/agent.rs",
    "src/bardo/sensitive.rs",
    "src/bardo/trusted.rs",
]
