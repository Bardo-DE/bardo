[package]
name = "compositor-motion"
description = "The compositor's pure motion: the MotionBook of ui-motion spring legs, retargeting with velocity kept, and sampling into an Eq FrameScene in 1/120 px."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-ids = { path = "../../base/base-ids" }
compositor-core = {path = "../compositor-core"}
compositor-layout = {path = "../compositor-layout"}
desktop-protocols = {path = "../../wayland/desktop-protocols"}
ui-core = {path = "../../ui/ui-core", default-features = false}
ui-style = {path = "../../ui/ui-style", default-features = false}
ui-motion = {path = "../../ui/ui-motion", default-features = false}

[dev-dependencies]
account-core = {path = "../../accounts/account-core"}

[lints]
workspace = true
