[package]
name = "ds-core-derive"
description = "#[derive(Word)] and #[derive(Token)]: a closed vocabulary enum's ALL, slug, label and parse, and a token family's custom property and value."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/quire"
publish = false

[lib]
proc-macro = true

[dependencies]
syn = {version = "2", features = ["full", "extra-traits"]}
quote = {version = "1"}
proc-macro2 = {version = "1"}
proc-macro-crate = {version = "3"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
