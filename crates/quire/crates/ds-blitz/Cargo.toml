[package]
name = "ds-blitz"
description = "Blitz glue for quire: launch, fonts, headless snapshots, PDF output and printing, test harness."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/quire"
publish = false

[dependencies]
ds = {path = "../ds"}
# The shell's work areas as plain data (`Outputs`); its D-Bus reading is the opt-in `desktop-outputs`
# feature, so an app that never asks builds no D-Bus client.
ds-desktop = {path = "../ds-desktop"}
# The colour emoji face's detection, shared with temor's terminal (no renderer, only fontique).
quire-emoji = {path = "../quire-emoji"}
# Portable Blitz repairs shared with shell-host: `data:` decoding, the local file read, hover sync,
# fonts, pixel snap, adapter choice. `adapter`: `AdapterPref`, the GPU ranking.
blitz-kit = {features = ["adapter"], path = "../../../blitz-kit/crates/blitz-kit"}
dioxus = {version = "0.7", default-features = false, features = ["macro", "html", "hooks", "signals"]}
blitz-dom = {git = "https://github.com/Bardo-DE/blitz", rev = "841386a71f17673c211217725e75068774517ba8", default-features = false, features = ["svg", "system-fonts", "custom-widget", "accessibility"]}
blitz-paint = {git = "https://github.com/Bardo-DE/blitz", rev = "841386a71f17673c211217725e75068774517ba8", features = ["custom-widget"]}
blitz-traits = {git = "https://github.com/Bardo-DE/blitz", rev = "841386a71f17673c211217725e75068774517ba8"}
blitz-html = {git = "https://github.com/Bardo-DE/blitz", rev = "841386a71f17673c211217725e75068774517ba8"}
dioxus-native-dom = {git = "https://github.com/Bardo-DE/blitz", rev = "841386a71f17673c211217725e75068774517ba8", default-features = false, features = ["svg", "system-fonts", "accessibility"]}
# `html`: an `<iframe srcdoc>` in the window parses into a real sub-document (G4). `clipboard`:
# copy and paste in every text field, and `ds_blitz::clipboard` (G5).
dioxus-native = {git = "https://github.com/Bardo-DE/blitz", rev = "841386a71f17673c211217725e75068774517ba8", default-features = false, features = ["accessibility", "clipboard", "html", "svg", "system-fonts", "vello-hybrid"]}
# A deadline for each call to the print portal (the `print` feature).
ds-peer = {path = "../ds-peer", optional = true}
# `open_window`: a second window on the same event loop, each with its own VirtualDom
# (`crate::windows`), and the two providers dioxus-native keeps private (`crate::native_providers`).
# `custom-widget`: the shell hands a texture layer's widget the renderer when it resumes and
# unregisters a removed layer's texture from the renderer (`crate::texture_layer`).
blitz-shell = {git = "https://github.com/Bardo-DE/blitz", rev = "841386a71f17673c211217725e75068774517ba8", default-features = false, features = ["custom-widget"]}
dioxus-asset-resolver = {version = "0.7", features = ["native"]}
webbrowser = {version = "1.0"}
# `text/html` from the system clipboard for an edit surface's paste.
arboard = {version = "3.6", default-features = false}
anyrender = {version = "0.13"}
anyrender_vello_hybrid = {version = "0.10"}
# `DeviceHandle`, the renderer's device that a texture layer's widget hands the window's `Gpu`.
wgpu_context = {version = "0.9"}
parley = {version = "0.11.1", default-features = false, features = ["std", "complex-scripts"]}
wgpu = {version = "29"}
image = {version = "0.25.6", default-features = false, features = ["png", "jpeg"]}
keyboard-types = {version = "0.7"}
# The keymap (`AppConfig::with_keymap_source`) and the sources the detected default reads:
# kdeglobals and a GNOME dconf dump. Only this I/O crate links the source crates.
chordkit = {path = "../../../chordkit/crates/chordkit"}
chordkit-kde = {path = "../../../chordkit/crates/chordkit-kde"}
chordkit-gnome = {path = "../../../chordkit/crates/chordkit-gnome"}
peniko = {version = "0.6"}
# PDF output (the `pdf` feature): the painter, which writes through pdfrum.
pdfrum-anyrender = {version = "0.5", optional = true}
thiserror = {version = "2"}
# `menus`: the wire layout derives `Serialize`.
serde = {version = "1", features = ["derive"], optional = true}
# The window's display and surface handles, for the activation token (Linux: `wayland_surface`).
raw-window-handle = {version = "0.6"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros"]}
# PDF thumbnails (part of the `pdf` feature): pdfrum's reader and CPU rasteriser.
pdfrum = {version = "0.5", default-features = false, features = ["vello-cpu"], optional = true}
# A bitmap colour emoji glyph's PNG and bearings, for a printout (the `pdf` feature).
skrifa = {version = "0.44", optional = true}
# Spellchecking (the `spell` feature): the checker, and XDG data for the user dictionary.
spellbook = {version = "0.4", optional = true}
dirs = {version = "6", optional = true}
# The user's learned words and a thumbnail's PDF are read through the capped reader
# (`ds_helpers::read_text_capped`, `read_capped`).
ds-helpers = {path = "../ds-helpers", default-features = false, optional = true}

[target.'cfg(target_os = "linux")'.dependencies]
# The print portal (the `print` feature): zbus with quire's async-io default (no executor is
# forced on the app), and a sealed memfd for the PDF's file descriptor.
zbus = {version = "5.19", optional = true}
memfd = {version = "0.6", optional = true}
# `WindowHandle::focus_with_token`: xdg-activation on the app's own Wayland connection, with the
# window's `wl_surface` borrowed (`wayland_surface`, the one `unsafe`).
wayland-client = {version = "0.31", optional = true}
wayland-backend = {version = "0.3", features = ["client_system"], optional = true}
wayland-protocols = {version = "0.32.13", features = ["client", "staging", "unstable"], optional = true}
# `quire_window`: the client bindings of our own quire_window_v1, generated from `protocols/` by macro.
wayland-scanner = {version = "0.31", optional = true}
# `menus::ShellOnly` (the `peephole` feature): which program is calling, by its pidfd and the unit
# manager's facts. Its own repo, taken by tag; Linux only, because it reads `/proc` and the system
# manager's bus. `desktop` adds the desktop's role names.
peephole-bus = {features = ["desktop"], optional = true, path = "../../../peephole/peephole-bus"}

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The fake compositor `xdg_activation`'s tests talk to.
wayland-server = {version = "0.31"}
wayland-protocols = {version = "0.32.13", features = ["client", "server", "staging", "unstable"]}

[features]
default = ["quire-desktop"]
# Our desktop's integration on Linux (design/36 section 1): xdg-activation on the app's own Wayland
# connection (`WindowHandle::focus_with_token`). Without it a token is ignored and the window is
# raised through winit, the same call with the same result type. `print` and `menus` need it too.
quire-desktop = ["dep:wayland-client", "dep:wayland-backend", "dep:wayland-protocols", "dep:wayland-scanner"]
# `print_dialog`: the system print dialog (the desktop portal on Linux), else the viewer.
# Off by default, so an app that never prints builds no D-Bus client for it.
print = ["quire-desktop", "dep:zbus", "dep:memfd", "dep:ds-peer"]
# `ds_blitz::menus`: the app's menu bar served as `com.canonical.dbusmenu` on its own bus
# connection, so the shell's bar shows the focused app's menus (design/27 section 5.2). Off by
# default, so an app that exports no menu builds no D-Bus client for it.
menus = ["quire-desktop", "dep:zbus", "dep:serde", "dep:ds-peer"]
# `menus::ShellOnly`: the menu permit for our desktop, which lets only the shell press an item
# (peephole's `shell` role at the full proof). Linux only. Off by default; without it an app passes
# its own `MenuPermit` to `MenuExport::start`, because there is no default permit.
peephole = ["menus", "dep:peephole-bus"]
# `AppHandle::follow_desktop_outputs`: the shell's work area and scale from `org.quire.Outputs1`
# (ds-desktop's `Outputs`), fed to `AppHandle::screen_area`. Off by default, so an app that never asks
# builds no D-Bus client for it.
desktop-outputs = ["ds-desktop/dbus"]
# PDF output (`pdf`, `PageSpec`) and `PdfFileThumb`: a PDF's first page rasterised off the UI
# thread and cached, drawn by `ds::PdfThumb`. Off by default, so an app that writes and shows no
# PDF builds no PDF writer or reader.
pdf = ["dep:pdfrum-anyrender", "dep:pdfrum", "dep:ds-helpers", "dep:skrifa"]
# `ds_blitz::spell`: an `EditSurface`'s spellchecker (`ds::HostSpell`), system Hunspell
# dictionaries checked on one worker thread. Off by default, so an app that never checks
# spelling builds no checker.
spell = ["dep:spellbook", "dep:dirs", "dep:ds-helpers"]

# `QUIRE_DEBUG_PROBE=<dir>`: each window writes its controls, by role and name, with their boxes,
# to a file there after every frame (`crate::probe`), so a scenario presses a control by name.
# Off by default and never in a release build: a scenario build turns it on with
# `--features ds-blitz/debug-probe`.
debug-probe = []
# `ds_blitz::seam`: the parts a headless host wires a document from. For `ds-harness` and tests
# only; an app has no use for them, so they are off by default and carry no stability promise.
testing = []

[dev-dependencies]
# The driver every host test in this crate runs through.
ds-harness = {path = "../ds-harness", default-features = false, features = ["pdf"]}
# Reading printouts back: text, fonts, images, and a page rasterised for the visual check.
pdfrum = {version = "0.5", default-features = false, features = ["vello-cpu"]}
# Writing PDFs for the thumbnail tests (a filled page, an encrypted one).
pdfrum-edit = {version = "0.5", features = ["variable-fonts"]}
pdfrum-common = {version = "0.5"}
# Glyph ids from the cmap, for the colour-emoji and font-stack tests.
skrifa = {version = "0.44"}

[[example]]
name = "window"

[[example]]
name = "edit"

[[example]]
name = "second_window"

[[example]]
name = "file_drop"

[[example]]
name = "texture_layer"

[[example]]
name = "pdf"
required-features = ["pdf"]

[[example]]
name = "print"
required-features = ["print"]

[[test]]
name = "pdf_thumb"
required-features = ["pdf"]

[[test]]
name = "spell_worker"
required-features = ["spell"]

[[test]]
name = "spell_edit"
required-features = ["spell"]

[[test]]
name = "pdf_thumb_queue"
required-features = ["pdf"]

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
