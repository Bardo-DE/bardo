[package]
name = "ds-desktop"
description = "Which extras of our desktop are here: a capability probe over D-Bus name ownership, with a Dioxus hook. Everything is Absent without the dbus feature."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/quire"
publish = false

[dependencies]
ds-peer = {path = "../ds-peer"}
dioxus = {version = "0.7", default-features = false, features = ["macro", "html", "hooks", "signals"], optional = true}
zbus = {version = "5.19", optional = true}

[dev-dependencies]
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros"]}

[features]
# `Desktop::probe` and `Desktop::watch` over the session bus (and the system bus for PackageKit).
# Without it every capability is Absent and zbus is not in the dependency tree.
dbus = ["dep:zbus"]
# `use_desktop`, the signal a component gates a desktop extra on.
dioxus = ["dep:dioxus"]

# Its own target: it starts a private D-Bus and needs the `dbus` feature.
[[test]]
name = "private_bus"
required-features = ["dbus"]

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
