[package]
name = "ds-settings-page"
description = "SettingsPage: a settings schema drawn as grouped rows, one control per key kind, with room for an app's own rows."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/quire"
publish = false

[dependencies]
ds = {path = "../ds"}
ds-settings = {path = "../ds-settings", default-features = false}
dioxus = {version = "0.7", default-features = false, features = ["macro", "html", "hooks", "signals"]}
toml = {version = "1"}

[dev-dependencies]
dioxus-ssr = {version = "0.7"}
ds-lint = {path = "../ds-lint"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
