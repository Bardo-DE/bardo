[package]
name = "ds-style"
description = "The design system's appearance: tokens and the Token trait, materials, Space palettes, fonts, icons, the stylesheet's sections and the Kit seam."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/quire"
publish = false

[dependencies]
ds-core = {path = "../ds-core"}
ds-core-derive = {path = "../ds-core-derive"}
dioxus = {version = "0.7", default-features = false, features = ["macro", "html", "hooks", "signals"], optional = true}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
# Decoding a status icon's PNG to decide symbolic or image (design/08-ICONS.md section 1.5), behind
# `icon-classify`.
image = {version = "0.25.6", default-features = false, features = ["png", "jpeg"], optional = true}

[dev-dependencies]
dioxus-ssr = {version = "0.7"}
ds-core = {path = "../ds-core", features = ["testing"]}
# Reading the shipped faces' cmaps in the key-glyph test.
skrifa = {version = "0.44"}
ds-style = {path = ".", default-features = false, features = ["dioxus", "icon-classify"]}

[features]
default = ["icon-classify"]
# `icon::classify::classify_with`: decoding a status icon's PNG to decide symbolic or image. It links
# the `image` decoder, so a crate that only reads settings or Extensions (ds-settings,
# ds-extensions) takes ds-style without it; an app that classifies status icons keeps the default.
icon-classify = ["dep:image"]
# The scope, scale, task and busy hooks and the `Glyph` component. Without it the crate is plain
# data (appearance, tokens, palettes, icons, CSS text), so a crate that only reads settings can
# name the appearance enums without linking Dioxus.
dioxus = ["dep:dioxus"]

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
