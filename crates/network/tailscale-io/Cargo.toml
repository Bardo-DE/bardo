[package]
name = "tailscale-io"
description = "A client of Tailscale's LocalAPI: HTTP/1.1 over the unix socket tailscaled serves, read for the status of this computer's tailnet, who a tailnet address belongs to, the stream of notices, and Tailscale's own sign-in. Speaks with hyper's own client, because the notice stream is a chunked body that stays open."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tailscale-types = { path = "../tailscale-types" }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util = { workspace = true }
tokio = {workspace = true, features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"]}

[dev-dependencies]
base-testkit = {path = "../../base/base-testkit", features = ["tokio"]}
account-fake-servers = {path = "../../accounts/account-fake-servers"}

[lints]
workspace = true
