[package]
name = "http-core"
description = "The one HTTP seam: the `Http` trait (whole bodies) and `HttpStream` (a body pushed to a sink as it arrives) over the `http` crate's request and response, the error with its cause, the single `Retry-After` parser and the sleep seam. Pure: the clients are http-reqwest (direct) and http-relay (over an accountd relay)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-time = { path = "../../base/base-time" }
base-url = { path = "../../base/base-url" }
http = { workspace = true }
httpdate = { workspace = true }
thiserror = { workspace = true }

