[package]
name = "networkmanager-proxy"
description = "Typed zbus proxies for NetworkManager's D-Bus API: the manager, devices, Wi-Fi, access points, active and saved connections."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
zbus = {workspace = true}

[features]
# zbus runs on its own executor by default. A tokio program turns `default-features` off and
# `tokio` on, and zbus then runs on that runtime.
default = ["async-io"]
async-io = ["zbus/async-io"]
tokio = ["zbus/tokio"]

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true
