[package]
name = "casement-core"
description = "casement's pure model: ids, geometry, time data, apps, windows, Spaces, focus, press routing, input origins and bindings, output policy, settings, Model::step and its invariants."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/casement"
publish = false

[dependencies]
casement-protocols = {path = "../../../casement-protocols"}
porter-core = {path = "../../../porter/crates/porter-core"}
ds-core = {path = "../../../quire/crates/ds-core", default-features = false}
ds-motion = {path = "../../../quire/crates/ds-motion", default-features = false}
ds-style = {path = "../../../quire/crates/ds-style", default-features = false}
ds-behaviour = {path = "../../../quire/crates/ds-behaviour"}
serde = {version = "1", features = ["derive"]}
thiserror = {version = "2"}
# The Space ids file's codec (A1): text in, text out, no file I/O.
serde_json = {version = "1"}
toml = {version = "1"}

[dev-dependencies]
proptest = {version = "1"}

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
