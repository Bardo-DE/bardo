[package]
name = "casement-wayland"
description = "casement's protocol edge: one module per Wayland protocol, each a sub-state (Part) plus on_* functions turning requests into core events and apply_* functions carrying effects onto the wire; smithay's bools and loose integers become our types here."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/casement"
publish = false

[dependencies]
casement-core = {path = "../casement-core"}
casement-protocols = {path = "../../../casement-protocols", features = ["server"]}
desktop-client = {path = "../../../casement-protocols/desktop-client"}
porter-core = {path = "../../../porter/crates/porter-core"}
ds-core = {path = "../../../quire/crates/ds-core", default-features = false}
smithay = {git = "https://github.com/Bardo-DE/smithay", rev = "919d8dcf7fe0b9ad03f3de53bc178dad30823631", default-features = false, features = ["desktop", "wayland_frontend"]}
# The seat's keymap as text for the EIS keyboards (`seat_keymap::keymap_text`).
xkbcommon = {version = "0.9", features = ["wayland"]}
thiserror = {version = "2"}
tracing = {version = "0.1"}

[features]
# The private `quire_*` servers (`quire_desktop_manager_v1`, `quire_shell_v1`; A8): a consumer that
# wants the standard protocol set alone takes the crate with `default-features = false`. The
# composition root needs them.
default = ["quire"]
quire = []

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
