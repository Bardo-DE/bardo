[package]
name = "casement-motion"
description = "casement's pure motion: the MotionBook of ds-motion spring legs, retargeting with velocity kept, and sampling into an Eq FrameScene in 1/120 px."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/casement"
publish = false

[dependencies]
casement-core = {path = "../casement-core"}
casement-layout = {path = "../casement-layout"}
casement-protocols = {path = "../../../casement-protocols"}
ds-core = {path = "../../../quire/crates/ds-core", default-features = false}
ds-style = {path = "../../../quire/crates/ds-style", default-features = false}
ds-motion = {path = "../../../quire/crates/ds-motion", default-features = false}

[dev-dependencies]
porter-core = {path = "../../../porter/crates/porter-core"}

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
