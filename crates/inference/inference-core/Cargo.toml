[package]
name = "inference-core"
description = "The AI broker's pure half: typed requests and replies, the local-first routing policy, spend caps, audit entries, and the Model trait wire adapters implement."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
account-core = {path = "../../accounts/account-core"}
account-match = {path = "../../accounts/account-match"}
account-capability = {path = "../../accounts/account-capability"}
base-ids = { path = "../../base/base-ids" }
base-time = { path = "../../base/base-time" }
computer-use-action = {path = "../../models/computer-use-action"}
computer-use-parse = {path = "../../models/computer-use-parse"}
computer-use-session = {path = "../../models/computer-use-session"}
model-vision-prep = {path = "../../models/model-vision-prep"}
model-provider = {path = "../../models/model-provider"}
model-catalog = {path = "../../models/model-catalog"}
rust_decimal = { workspace = true, features = ["std", "serde"] }
base64 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
iso_currency = { workspace = true, features = ["with-serde"] }
# Its own fakes, for tests/it.
inference-core = { path = ".", features = ["testing"] }
proptest = { workspace = true }

[features]
# `testing`: `FakeModel` and `FakeInferSession`, for the tests of code built on the broker.
testing = []

[lints]
workspace = true
