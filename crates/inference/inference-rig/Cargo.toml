[package]
name = "inference-rig"
description = "Test tooling, never installed and never in dist: inference-rig-client acts as an app over the session bus a jailed scenario gives it and opens an inferd session, with one chat turn when asked. The identity fixture is account-rig's, so the same --proc-root tree names it to accountd and inferd alike. Nothing shipped depends on it."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "inference-rig-client"
path = "src/bin/inference-rig-client.rs"

[dependencies]
inference-client = {path = "../inference-client", features = ["dbus"]}
account-capability = {path = "../../accounts/account-capability"}
account-core = {path = "../../accounts/account-core"}
base-ids = { path = "../../base/base-ids" }
inference-core = {path = "../inference-core"}
account-match = {path = "../../accounts/account-match"}
account-rig = {path = "../../accounts/account-rig"}
clap = {version = "4", features = ["derive"]}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
zbus = {version = "5.19", default-features = false, features = ["tokio"]}

[lints]
workspace = true
