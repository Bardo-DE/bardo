[package]
name = "inference-router"
description = "Who answers an inference session and what runs on this computer: the router over a list of models, what loading a model would cost, the catalogue and the local model book, the attached engines the person runs, the session machine and the seams a session server leans on. A library: no bus, no runtime, no daemon."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The helpers inferd's tests and this crate's own share (`testkit`): a scratch directory, the test
# catalog entries and the local models they make. For dev-dependencies only.
testing = []

[dependencies]
account-core = {path = "../../accounts/account-core"}
inference-tailnet = {path = "../inference-tailnet"}
account-tailscale = {path = "../../accounts/account-tailscale"}
account-match = {path = "../../accounts/account-match"}
account-capability = {path = "../../accounts/account-capability"}
base-ids = { path = "../../base/base-ids" }
base-secret = { path = "../../base/base-secret" }
inference-core = {path = "../inference-core"}
computer-use-action = {path = "../../computer-use/computer-use-action"}
# Which program an engine kind runs (`Engine`), and the folder a person pointed at (Strata).
engine-spec = {path = "../../engines/engine-spec"}
engine-probe = {path = "../../engines/engine-probe"}
engine-supervisor = {path = "../../engines/engine-supervisor"}
model-catalog = {path = "../../models/model-catalog"}
# The types of an engine's address and token only: no `client`, no `tls`, so no runtime.
model-http = {path = "../../models/model-http"}
model-openai-compat = {path = "../../models/model-openai-compat"}
model-provider = {path = "../../models/model-provider"}
speech-provider = {path = "../../speech/speech-provider"}
model-vision-prep = {path = "../../models/model-vision-prep"}
rustix = {workspace = true, features = ["std", "event", "fs", "net", "time", "process"]}
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }

[dev-dependencies]
base-testkit = {path = "../../base/base-testkit"}
toml = { workspace = true }

[lints]
workspace = true
