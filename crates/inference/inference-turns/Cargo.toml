[package]
name = "inference-turns"
description = "Running model turns: a routed session on a model of this computer (chat, embeddings, computer-use steps), structured replies validated and repaired, the audit trail of finished turns, and a pipeline's stages. A library over inference-router: no bus, no daemon."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
account-core = {path = "../../accounts/account-core"}
account-match = {path = "../../accounts/account-match"}
account-capability = {path = "../../accounts/account-capability"}
base-ids = { path = "../../base/base-ids" }
base-time = { path = "../../base/base-time" }
inference-core = {path = "../inference-core"}
inference-bridge = {path = "../inference-bridge"}
inference-router = {path = "../inference-router"}
computer-use-action = {path = "../../computer-use/computer-use-action"}
computer-use-parse = {path = "../../computer-use/computer-use-parse"}
computer-use-session = {path = "../../computer-use/computer-use-session"}
computer-use-vendors = {path = "../../computer-use/computer-use-vendors"}
engine-supervisor = {path = "../../engines/engine-supervisor"}
model-extract = {path = "../../models/model-extract"}
# The HTTP client to a local engine (`hyper`); a plain Unix socket or loopback, so no `tls`.
model-http = {features = ["client"], path = "../../models/model-http"}
model-openai-compat = {path = "../../models/model-openai-compat"}
model-provider = {path = "../../models/model-provider"}
# `pixels`: the frame resize of a computer-use step.
model-vision-prep = {features = ["pixels"], path = "../../models/model-vision-prep"}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[dev-dependencies]
model-provider = {features = ["testing"], path = "../../models/model-provider"}
inference-router = {path = "../inference-router", features = ["testing"]}
rustix = {workspace = true, features = ["std", "event", "fs", "net", "time", "process"]}
base-testkit = {path = "../../base/base-testkit"}
tokio = {workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "test-util", "time"]}

[lints]
workspace = true
