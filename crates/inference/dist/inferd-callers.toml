# inferd's caller table: installed as /etc/bardo/inferd-callers.toml, root's to write. inferd
# reads it at start and from nowhere else; a [callers] table in a person's inferd.toml is ignored,
# because these rows give standing (computer use, the settings module, the agent launcher, choosing
# where the assistant runs) that a person's own file must not be able to give a program. A test
# build (test-proc-root) may read another file, named by BARDO_INFERD_CALLERS.
#
# Who may call. A caller is the systemd unit behind a bus connection (the bus names its process,
# /proc/<pid>/cgroup names the unit); an app in its own app scope or Flatpak scope is an App
# without a line here. bardo-computer-use is the only caller that may open a computer-use session; it may also
# list the places (Inference1.Places), to say plainly when no ready model can see the screen.
computer_use = ["bardo-computer-use.service"]
# The Settings app: the only caller of inferd's settings module (the model picker), as the unit the
# desktop runs it in, and only that unit's main process (as accountd's callers.toml). An app name
# here (the old form, "org.bardo.Settings") stands for "<app>.service", never for an app scope of
# that name, which any program can start.
settings = ["org.bardo.Settings.service"]
# The shell (the shell): it may list the places the assistant can run (Inference1.Places) and ask for
# nothing else, as the unit the desktop session starts it in, and only that unit's main process.
shell = ["bardo-shell.service"]
# The units that may choose where the assistant runs (the `places` and `place_models` options of
# Open, Prepare and Availability). Each must also be an app under [apps]. Of these the
# companion alone may also list the places, as Settings and the shell may.
places = ["bardo-companiond.service", "bardo-readerd.service", "bardo-actiond.service"]
# The agent launcher (bardo-agent-acp): the only caller of org.bardo.Inference1.Agents, which opens a
# loopback model endpoint for an external coding agent. Its other interface, org.bardo.Accounts1.
# Launcher (agents signed in and out, an agent's key, the credential of a process it starts), is
# accountd's, and its row is in accountd's callers.toml. Never listed by default: a machine that
# runs the launcher writes its unit here (the app org.bardo.AcpAgent, unit bardo-agent-acp.service,
# role agent_launcher) and turns on ai.agents.endpoint.
# agent_launcher = ["bardo-agent-acp.service"]
#
# An entry here or under [apps] is a unit's name, or the unit and the programs that may run in it:
# a daemon's `<name>.service` runs `libexec/bardo/bardo-<name>` (under /usr, /usr/local or
# /opt/bardo/releases/*) without saying so, but a scope or a dotted service names none, and is
# nobody until its entry lists them, e.g.
#   { unit = "bardo-agent-acp.scope", exe = ["/usr/bin/bardo-agent-acp", "/usr/local/bin/bardo-agent-acp",
#     "/opt/bardo/releases/*/bin/bardo-agent-acp"] }
[apps]
"org.bardo.Memory" = ["bardo-memoryd.service"]
"org.bardo.Intents" = ["bardo-actiond.service"]
# The companion: its daemon, and bardo-agent-acp, the editor-agent launcher, which runs the planner's
# turns in its own scope. A scope's name gives no program, so the entry names bardo-agent-acp's.
"org.bardo.Companion" = [
    "bardo-companiond.service",
    { unit = "bardo-agent-acp.scope", exe = ["/usr/bin/bardo-agent-acp", "/usr/local/bin/bardo-agent-acp", "/opt/bardo/releases/*/bin/bardo-agent-acp"] },
]
"org.bardo.Reader" = ["bardo-readerd.service"]
# voiced holds the microphone and asks for speech to text, which runs on the speech host on this
# computer: the default floor keeps the data class `voice` on_device.
"org.bardo.Voice" = ["bardo-voiced.service"]
