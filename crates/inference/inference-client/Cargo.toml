[package]
name = "inference-client"
description = "The app's client of inferd: inference sessions, warm-ups, places, the person's other computers and the models inferd runs, over D-Bus or hosted in the app."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/steward"
publish = false

[dependencies]
account-core = {path = "../../accounts/account-core"}
inference-tailnet = {path = "../inference-tailnet"}
account-tailscale = {path = "../../accounts/account-tailscale"}
account-match = {path = "../../accounts/account-match"}
account-capability = {path = "../../accounts/account-capability"}
account-wire = {path = "../../accounts/account-wire"}
account-ids = {path = "../../accounts/account-ids"}
inference-core = {path = "../inference-core"}
inference-bridge = {path = "../inference-bridge", optional = true}
# `engines`: the turn the daemon runs (`run_chat`) and the clock its retries wait on.
inference-turns = {path = "../inference-turns", optional = true}
model-http = {optional = true, features = ["client", "tls"], path = "../../models/model-http"}
model-openai-compat = {optional = true, path = "../../models/model-openai-compat"}
model-provider = {optional = true, path = "../../models/model-provider"}
model-wire = {optional = true, path = "../../models/model-wire"}
account-callers = {optional = true, path = "../../accounts/account-callers"}
account-dbus = {optional = true, path = "../../accounts/account-dbus"}
inference-dbus = {path = "../inference-dbus", optional = true}
account-fs = {optional = true, path = "../../accounts/account-fs"}
rustix = {version = "1.1", default-features = false, features = ["std", "event", "fs", "net", "time", "process"], optional = true}
serde = {version = "1", features = ["derive"], optional = true}
serde_json = {version = "1", optional = true}
thiserror = {version = "2"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"], optional = true}
zbus = {version = "5.19", default-features = false, features = ["tokio"], optional = true}

[dev-dependencies]
base-testkit = {path = "../../base/base-testkit"}
ui-settings = {features = ["live", "tokio"], path = "../../ui/ui-settings"}
computer-use-action = {path = "../../computer-use/computer-use-action"}
account-fake-servers = {path = "../../accounts/account-fake-servers"}
# The scripted inference session the session tests play (`porter_infer::testing`).
inference-core = {path = "../inference-core", features = ["testing"]}
account-dbus = {path = "../../accounts/account-dbus"}
inference-dbus = {path = "../inference-dbus"}
rustix = {version = "1.1", default-features = false, features = ["std", "event", "fs", "net", "time", "process"]}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
zbus = {version = "5.19", default-features = false, features = ["tokio"]}
zbus-ready = { path = "../../zbus-ready" }

# The daemon the bus tests start (Linux only, as the transport is).
[target.'cfg(target_os = "linux")'.dev-dependencies]
inference-daemon = { path = "../inference-daemon" }
inference-router = {path = "../inference-router"}
# tailscaled's LocalAPI client, over its Unix socket, for the tailnet bus test.
account-tailscale = {features = ["io"], path = "../../accounts/account-tailscale"}

[features]
# No feature is on by default: a consumer names the ones it uses.
default = []
# Inference with no inferd: `EngineHost`, a `SessionHost` that routes need -> engine over a table
# the app gives and drives the OpenAI-compatible engines it points at (Ollama, llama.cpp, LM
# Studio, vLLM, a company's API), with keys from a `KeySource` the app implements. Off by
# default: it brings stoker's HTTP client with TLS (hyper, rustls) and a runtime, which neither
# an app that talks to inferd needs.
engines = [
  "dep:tokio", "dep:serde_json", "dep:inference-bridge", "dep:inference-turns", "dep:model-http",
  "dep:model-openai-compat", "dep:model-provider", "dep:model-wire",
]
# `TailnetLending`: installs and takes away the drop-in that lets the person's other computers
# reach inferd (the Settings switch "Let my other computers use this computer's models"), with the
# manager of the person's units injected. Off by default: it brings porter-fs (std only). With
# `dbus` it also has `SessionUnits`, the real manager over the session bus.
lending = ["dep:account-fs"]
# The D-Bus transport (Linux, the desktop's inferd). It reads the session `Open` returns as
# frames over a Unix stream socket with descriptors riding on them, so it pulls in the runtime.
dbus = ["dep:rustix", "dep:serde", "dep:tokio", "dep:account-callers", "dep:account-dbus", "dep:inference-dbus", "dep:serde_json", "dep:zbus"]

[[example]]
name = "guests"
required-features = ["dbus"]

# Shows, installs and takes away the tailnet drop-in, for Settings' switch to copy.
[[example]]
name = "lending"
required-features = ["lending", "dbus"]

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
