[package]
name = "inference-client"
description = "The app's client of inferd: inference sessions, warm-ups, places, the person's other computers and the models inferd runs, over D-Bus or hosted in the app."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
account-core = {path = "../../accounts/account-core"}
inference-tailnet = {path = "../inference-tailnet"}
account-tailscale = {path = "../../accounts/account-tailscale"}
account-match = {path = "../../accounts/account-match"}
account-capability = {path = "../../accounts/account-capability"}
account-wire = {path = "../../accounts/account-wire"}
base-ids = { path = "../../base/base-ids" }
base-time = { path = "../../base/base-time" }
base-url = { path = "../../base/base-url" }
inference-core = {path = "../inference-core"}
account-callers = {optional = true, path = "../../accounts/account-callers"}
account-dbus = {optional = true, path = "../../accounts/account-dbus"}
inference-dbus = {path = "../inference-dbus", optional = true}
base-fs = {optional = true, path = "../../base/base-fs"}
base-xdg = {optional = true, path = "../../base/base-xdg"}
rustix = {workspace = true, features = ["std", "event", "fs", "net", "time", "process"], optional = true}
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"], optional = true}
zbus = {workspace = true, features = ["tokio"], optional = true}

[dev-dependencies]
base-testkit = {path = "../../base/base-testkit", features = ["tokio"]}
ui-settings = {features = ["live", "tokio"], path = "../../ui/ui-settings"}
computer-use-action = {path = "../../computer-use/computer-use-action"}
# The scripted inference session the session tests play (`porter_infer::testing`).
inference-core = {path = "../inference-core", features = ["testing"]}
account-dbus = {path = "../../accounts/account-dbus"}
inference-dbus = {path = "../inference-dbus"}
rustix = {workspace = true, features = ["std", "event", "fs", "net", "time", "process"]}
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
zbus = {workspace = true, features = ["tokio"]}
zbus-ready = { path = "../../zbus-ready" }

# The daemon the bus tests start (Linux only, as the transport is).
[target.'cfg(target_os = "linux")'.dev-dependencies]
inference-daemon = { path = "../inference-daemon" }
inference-router = {path = "../inference-router"}
# tailscaled's LocalAPI client, over its Unix socket, for the tailnet bus test.
account-tailscale = {features = ["io"], path = "../../accounts/account-tailscale"}

[features]
# No feature is on by default: a consumer names the ones it uses.
default = []
# `TailnetLending`: installs and takes away the drop-in that lets the person's other computers
# reach inferd (the Settings switch "Let my other computers use this computer's models"), with the
# manager of the person's units injected. Off by default: it brings base-fs (std only). With
# `dbus` it also has `SessionUnits`, the real manager over the session bus.
lending = ["dep:base-fs", "dep:base-xdg"]
# The D-Bus transport (Linux, the desktop's inferd). It reads the session `Open` returns as
# frames over a Unix stream socket with descriptors riding on them, so it pulls in the runtime.
dbus = ["dep:rustix", "dep:serde", "dep:tokio", "dep:account-callers", "dep:account-dbus", "dep:inference-dbus", "dep:serde_json", "dep:zbus"]

[[example]]
name = "guests"
required-features = ["dbus"]

# Shows, installs and takes away the tailnet drop-in, for Settings' switch to copy.
[[example]]
name = "lending"
required-features = ["lending", "dbus"]

[lints]
workspace = true
