[package]
name = "inference-tailnet"
description = "Lending a computer's models to the person's other computers over their Tailscale network, and calling those of another: who may ask (judged from Tailscale's own answer about the caller), the computers the person said yes or no to, the hello a lending computer answers, and with the `io` feature the listeners that follow this computer's addresses, the dial that checks who it reaches, and the relay that gives a local engine a way to a computer on the network."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-time = { path = "../../base/base-time" }
base-fs = {optional = true, path = "../../base/base-fs"}
account-tailscale = {path = "../../accounts/account-tailscale"}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true, optional = true }
hyper = { workspace = true, optional = true, features = ["client", "http1"] }
hyper-util = { workspace = true, optional = true, features = ["tokio"] }
http-body-util = { workspace = true, optional = true }
tokio = {workspace = true, features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"], optional = true}

[dev-dependencies]
base-testkit = {path = "../../base/base-testkit", features = ["tokio"]}
# The integration tests use the listeners, the dial and the relay, which the `io` feature builds.
inference-tailnet = {path = ".", features = ["io", "persist"]}
account-tailscale = {features = ["io"], path = "../../accounts/account-tailscale"}
account-fake-servers = {path = "../../accounts/account-fake-servers"}
tokio = {workspace = true, features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"]}

[features]
# `Guests::open`: the records kept in a file the owner reads, written with base-fs. Off by default,
# so a client that only reads the rows of a lending computer builds no file writer and no toml.
persist = ["dep:base-fs", "dep:toml"]
# The listeners, the dial, the relay and the hello client: sockets, tokio and hyper. Off by
# default, so the judgement of who may ask and the lists of guests reach none of them.
io = [
  "dep:hyper",
  "dep:hyper-util",
  "dep:http-body-util",
  "dep:tokio",
  "account-tailscale/io",
]

[lints]
workspace = true
