# A test-harness client for a nested KWin: it presses keys through `org_kde_kwin_fake_input`
# (`wayland-protocols-plasma`, KDE-specific). It never ships. See scripts/dev/fake-input.sh.
[package]
name = "fake-input"
description = "Developer tool: presses keys in a nested KWin through org_kde_kwin_fake_input, for the layer-shell host's harness."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
wayland-client = { workspace = true }
wayland-protocols-plasma = { workspace = true, features = ["client"] }
xkbcommon = { version = "0.8", default-features = false }

[lints]
workspace = true
