[package]
name = "ui-conformance"
description = "Behaviour tests for every UI kit component, driven through ui-harness on a real Blitz document. Test-only."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dev-dependencies]
base-machine = { path = "../../base/base-machine" }
keymap = {path = "../../keymap/keymap"}
ui-components = {path = "../ui-components"}
ui-shell = {path = "../ui-shell"}
ui-blitz = {path = "../ui-blitz", default-features = false, features = ["testing"]}
ui-host-hooks = {path = "../ui-host-hooks"}
ui-harness = {path = "../ui-harness", default-features = false}
dioxus = { workspace = true, features = ["macro", "html", "hooks", "signals"] }
image = { workspace = true, features = ["png", "jpeg"] }

[features]
default = ["desktop"]
# Desktop integration of UI kit crates this one uses (design/36 section 1).
desktop = ["ui-blitz/desktop"]

[lints]
workspace = true
