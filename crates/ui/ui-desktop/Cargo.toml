[package]
name = "ui-desktop"
description = "Which extras of our desktop are here: a capability probe over D-Bus name ownership, with a Dioxus hook. Everything is Absent without the dbus feature."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
outputs-dbus = { path = "../../wayland/outputs-dbus", optional = true }
base-time = { path = "../../base/base-time" }
dioxus = { workspace = true, features = ["macro", "html", "hooks", "signals"], optional = true }
zbus = {workspace = true, features = ["default"], optional = true}

[dev-dependencies]
base-testkit = {path = "../../base/base-testkit", features = ["dbus"]}
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"]}
dbus-kit = { path = "../../bus/dbus-kit" }
outputs-dbus = { path = "../../wayland/outputs-dbus" }

[features]
# `Desktop::probe` and `Desktop::watch` over the session bus (and the system bus for PackageKit).
# Without it every capability is Absent and zbus is not in the dependency tree.
dbus = ["dep:zbus", "dep:outputs-dbus"]
# `use_desktop`, the signal a component gates a desktop extra on.
dioxus = ["dep:dioxus"]

# The one integration binary: it starts a private D-Bus and needs the `dbus` feature.
[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["dbus"]

[lints]
workspace = true
