[package]
name = "ui-icon-tool"
description = "App-icon post-process (design/08-ICONS.md 2, 3.7): key, fit, squircle plate, size set, contact sheets."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
image = { workspace = true, features = ["png", "jpeg"] }
clap = {version = "4", features = ["derive"]}
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }
# The Space palette derivation, so a Monochrome icon tinted by a Space matches its frame.
ui-components = {path = "../ui-components"}
ui-style = {path = "../ui-style", default-features = false}
# Where an installed app-icon set is looked up (`icons install`, bardo-shell FINDINGS Q71).
ui-settings = {path = "../ui-settings", default-features = false}

[features]
default = ["quire-desktop"]
# Desktop integration of the quire crates this one uses (design/36 section 1).
quire-desktop = ["ui-settings/quire-desktop"]

[lints]
workspace = true
[[bin]]
name = "icons"
path = "src/main.rs"
