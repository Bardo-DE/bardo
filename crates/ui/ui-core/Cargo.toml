[package]
name = "ui-core"
description = "The design system's pure base: vocabulary, geometry units, colour, time, errors, text clip and image encodings."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-words = { path = "../../base/base-words" }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
futures-timer = { workspace = true }
keyboard-types = {workspace = true}
# The keymap nouns (actions, chords, platforms) and the resolver; pure, no source crates.
keymap = {path = "../../keymap/keymap"}
# `testing::word_matches_serde`, for the tests of crates that store a `Word`.
serde_json = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
# The wall-clock sleep test waits for its timer by the one deadline wait.
base-testkit = { path = "../../base/base-testkit" }

[features]
# `ui_core::testing`: checks a stored `Word` against its serde form.
testing = ["dep:serde_json"]

[lints]
workspace = true
