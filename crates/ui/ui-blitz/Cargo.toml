[package]
name = "ui-blitz"
description = "Blitz glue for the UI kit: launch, fonts, headless snapshots, PDF output and printing, test harness."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ui-host-hooks = {path = "../ui-host-hooks"}
blitz-embed-types = {path = "../../blitz-embed/blitz-embed-types"}
base-fs = { path = "../../base/base-fs" }
base-xdg = { path = "../../base/base-xdg" }
ui-components = {path = "../ui-components"}
# The shell's work areas as plain data (`Outputs`); its D-Bus reading is the opt-in `desktop-outputs`
# feature, so an app that never asks builds no D-Bus client.
ui-desktop = {path = "../ui-desktop"}
# The colour emoji face's detection, shared with temor's terminal (no renderer, only fontique).
ui-emoji = {path = "../ui-emoji"}
# Portable Blitz repairs shared with layer-shell-host: `data:` decoding, the local file read, hover sync,
# fonts, pixel snap, adapter choice. `adapter`: `AdapterPref`, the GPU ranking.
blitz-embed = {features = ["adapter"], path = "../../blitz-embed/blitz-embed"}
dioxus = { workspace = true, features = ["macro", "html", "hooks", "signals"] }
blitz-dom = {workspace = true, features = ["svg", "system-fonts", "custom-widget", "accessibility"]}
blitz-paint = {workspace = true, features = ["custom-widget"]}
blitz-traits = {workspace = true}
blitz-html = {workspace = true}
dioxus-native-dom = {workspace = true, features = ["svg", "system-fonts", "accessibility"]}
# `html`: an `<iframe srcdoc>` in the window parses into a real sub-document (G4). `clipboard`:
# copy and paste in every text field, and `ui_blitz::clipboard` (G5).
dioxus-native = {workspace = true, features = ["accessibility", "clipboard", "html", "svg", "system-fonts", "vello-hybrid"]}
# A deadline for each call to the print portal (the `print` feature).
base-time = {path = "../../base/base-time", optional = true}
dbus-kit = {path = "../../bus/dbus-kit", default-features = false, optional = true}
# `open_window`: a second window on the same event loop, each with its own VirtualDom
# (`crate::windows`), and the two providers dioxus-native keeps private (`crate::native_providers`).
# `custom-widget`: the shell hands a texture layer's widget the renderer when it resumes and
# unregisters a removed layer's texture from the renderer (`crate::texture_layer`).
blitz-shell = {workspace = true, features = ["custom-widget"]}
dioxus-asset-resolver = { workspace = true, features = ["native"] }
webbrowser = { workspace = true }
# `text/html` from the system clipboard for an edit surface's paste.
arboard = { workspace = true }
anyrender = { workspace = true }
anyrender_vello_hybrid = { workspace = true }
# `DeviceHandle`, the renderer's device that a texture layer's widget hands the window's `Gpu`.
wgpu_context = { workspace = true }
parley = { workspace = true, features = ["std", "complex-scripts"] }
wgpu = { workspace = true }
image = { workspace = true, features = ["png", "jpeg"] }
keyboard-types = {workspace = true}
# The keymap (`AppConfig::with_keymap_source`) and the sources the detected default reads:
# kdeglobals and a GNOME dconf dump. Only this I/O crate links the source crates.
keymap = {path = "../../keymap/keymap"}
keymap-kde = {path = "../../keymap/keymap-kde"}
keymap-gnome = {path = "../../keymap/keymap-gnome"}
peniko = { workspace = true }
# PDF output (the `pdf` feature): the painter, which writes through pdfrum.
pdfrum-anyrender = { workspace = true, optional = true }
thiserror = { workspace = true }
# `menus`: the wire layout derives `Serialize`.
serde = { workspace = true, features = ["derive"], optional = true }
# The window's display and surface handles, for the activation token (Linux: `wayland_surface`).
raw-window-handle = { workspace = true }
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"]}
# PDF thumbnails (part of the `pdf` feature): pdfrum's reader and CPU rasteriser.
pdfrum = { workspace = true, features = ["vello-cpu"], optional = true }
# A bitmap colour emoji glyph's PNG and bearings, for a printout (the `pdf` feature).
skrifa = { workspace = true, optional = true }
# Spellchecking (the `spell` feature): the checker, and XDG data for the user dictionary.
spellbook = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# The print portal (the `print` feature): zbus with the UI kit's async-io default (no executor is
# forced on the app), and a sealed memfd for the PDF's file descriptor.
zbus = {workspace = true, features = ["default"], optional = true}
memfd = { workspace = true, optional = true }
# `WindowHandle::focus_with_token`: xdg-activation on the app's own Wayland connection, with the
# window's `wl_surface` borrowed (`wayland_surface`, the one `unsafe`).
wayland-client = { workspace = true, optional = true }
wayland-backend = { workspace = true, features = ["client_system"], optional = true }
wayland-protocols = { workspace = true, features = ["client", "staging", "unstable"], optional = true }
# `bardo_window`: the client bindings of our own bardo_window_v1, generated from `protocols/` by macro.
wayland-scanner = { workspace = true, optional = true }
# `menus::ShellOnly` (the `caller_identity` feature): which program is calling, by its pidfd and the unit
# manager's facts. Its own repo, taken by tag; Linux only, because it reads `/proc` and the system
# manager's bus. `desktop` adds the desktop's role names.
caller-identity-dbus = {features = ["desktop"], optional = true, path = "../../identity/caller-identity-dbus"}

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The fake compositor `xdg_activation`'s tests talk to.
wayland-server = { workspace = true }
wayland-protocols = { workspace = true, features = ["client", "server", "staging", "unstable"] }

[features]
default = ["desktop"]
# Our desktop's integration on Linux (design/36 section 1): xdg-activation on the app's own Wayland
# connection (`WindowHandle::focus_with_token`). Without it a token is ignored and the window is
# raised through winit, the same call with the same result type. `print` and `menus` need it too.
desktop = ["dep:wayland-client", "dep:wayland-backend", "dep:wayland-protocols", "dep:wayland-scanner"]
# `print_dialog`: the system print dialog (the desktop portal on Linux), else the viewer.
# Off by default, so an app that never prints builds no D-Bus client for it.
print = ["desktop", "dep:zbus", "dep:memfd", "dep:base-time"]
# `ui_blitz::menus`: the app's menu bar served as `com.canonical.dbusmenu` on its own bus
# connection, so the shell's bar shows the focused app's menus (design/27 section 5.2). Off by
# default, so an app that exports no menu builds no D-Bus client for it.
menus = ["desktop", "dep:zbus", "dep:serde", "dep:dbus-kit"]
# `menus::ShellOnly`: the menu permit for our desktop, which lets only the shell press an item
# (the caller-identity library's `shell` role at the full proof). Linux only. Off by default; without it an app passes
# its own `MenuPermit` to `MenuExport::start`, because there is no default permit.
caller_identity = ["menus", "dep:caller-identity-dbus"]
# `AppHandle::follow_desktop_outputs`: the shell's work area and scale from `org.bardo.Outputs1`
# (ui-desktop's `Outputs`), fed to `AppHandle::screen_area`. Off by default, so an app that never asks
# builds no D-Bus client for it.
desktop-outputs = ["ui-desktop/dbus"]
# PDF output (`pdf`, `PageSpec`) and `PdfFileThumb`: a PDF's first page rasterised off the UI
# thread and cached, drawn by `ds::PdfThumb`. Off by default, so an app that writes and shows no
# PDF builds no PDF writer or reader.
pdf = ["dep:pdfrum-anyrender", "dep:pdfrum", "dep:skrifa"]
# `ui_blitz::spell`: an `EditSurface`'s spellchecker (`ds::HostSpell`), system Hunspell
# dictionaries checked on one worker thread. Off by default, so an app that never checks
# spelling builds no checker.
spell = ["dep:spellbook", "dep:dirs"]

# `BARDO_DEBUG_PROBE=<dir>`: each window writes its controls, by role and name, with their boxes,
# to a file there after every frame (`crate::probe`), so a scenario presses a control by name.
# Off by default and never in a release build: a scenario build turns it on with
# `--features ui-blitz/debug-probe`.
debug-probe = []
# `ui_blitz::seam`: the parts a headless host wires a document from. For `ui-harness` and tests
# only; an app has no use for them, so they are off by default and carry no stability promise.
testing = []

[dev-dependencies]
tempfile = { workspace = true }
# The crate's own tests need its test-only features.
ui-blitz = {path = ".", features = ["debug-probe"]}
# The driver every host test in this crate runs through.
ui-harness = {path = "../ui-harness", default-features = false, features = ["pdf"]}
# Reading printouts back: text, fonts, images, and a page rasterised for the visual check.
pdfrum = { workspace = true, features = ["vello-cpu"] }
# Writing PDFs for the thumbnail tests (a filled page, an encrypted one).
pdfrum-edit = { workspace = true, features = ["variable-fonts"] }
pdfrum-common = { workspace = true }
# Glyph ids from the cmap, for the colour-emoji and font-stack tests.
skrifa = { workspace = true }
# The one deadline wait, for the tests that wait on a thread or a process.
base-testkit = { path = "../../base/base-testkit" }

[[example]]
name = "window"

[[example]]
name = "edit"

[[example]]
name = "second_window"

[[example]]
name = "file_drop"

[[example]]
name = "texture_layer"

[[example]]
name = "pdf"
required-features = ["pdf"]

[[example]]
name = "print"
required-features = ["print"]

[[test]]
name = "pdf_thumb"
required-features = ["pdf"]

[[test]]
name = "spell_worker"
required-features = ["spell"]

[[test]]
name = "spell_edit"
required-features = ["spell"]

[[test]]
name = "pdf_thumb_queue"
required-features = ["pdf"]

[lints]
workspace = true
