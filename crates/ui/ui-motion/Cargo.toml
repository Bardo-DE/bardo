[package]
name = "ui-motion"
description = "The design system's motion: animation data and recipes, keyframes, presence, timelines, rosters, gestures, pulse and the details grammar."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/quire"
publish = false

[dependencies]
ui-core = {path = "../ui-core"}
ui-style = {path = "../ui-style", default-features = false}
dioxus = {version = "0.7", default-features = false, features = ["macro", "html", "hooks", "signals"], optional = true}

[dev-dependencies]
ui-components = {path = "../ui-components"}

[features]
# Hooks, components and event conversions over Dioxus: the `use_*` hooks, timers, pulse, presence
# and timeline playback, gestures, rosters and the details hooks. Without it the crate is data,
# recipes, keyframes and the pure machines, so a compositor can sample motion without linking Dioxus.
dioxus = ["dep:dioxus", "ui-style/dioxus"]

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
