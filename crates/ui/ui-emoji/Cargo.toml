[package]
name = "ui-emoji"
description = "Finds the colour emoji face on this machine and puts it first in a fontique collection. No renderer, no toolkit."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/quire"
publish = false

[dependencies]
fontique = {version = "0.11.1", default-features = false, features = ["std", "system"]}
