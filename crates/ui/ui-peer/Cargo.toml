[package]
name = "ui-peer"
description = "A deadline for a call to another process, and the typed error for a peer that did not answer in time."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
thiserror = { workspace = true }
# The bound itself: a wall-clock delay on its own timer thread, so the deadline works under any
# executor (zbus's own, tokio, a test's block_on).
dbus-kit = { path = "../../bus/dbus-kit" }

[dev-dependencies]
# The tests' runtime; the crate itself names none.
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"]}

[lints]
workspace = true
