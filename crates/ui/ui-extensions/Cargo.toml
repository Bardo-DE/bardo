[package]
name = "ui-extensions"
description = "Extensions: the folder scan, the envelope checks, on and off, and the data capabilities (looks, file icons). No UI, no runtime, no bus."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-words = { path = "../../base/base-words" }
base-fs = { path = "../../base/base-fs" }
base-xdg = { path = "../../base/base-xdg" }
settings-store = { path = "../../settings/settings-store" }
settings-store-fs = { path = "../../settings/settings-store-fs" }
settings-types = { path = "../../settings/settings-types" }
# The kinds, folder kinds, extension label and the type-to-kind table the standard set is.
ui-style = {path = "../ui-style", default-features = false}
# A file's name and type, for the file icon resolver; the type database it asks.
file-types = { path = "../../xdg/file-types" }
xdg-core = { path = "../../xdg/xdg-core" }
# Manifests and the registry (`plugin-core`), and the folder scan that reads them (`plugin-host`).
plugin-core = {path = "../../plugin/plugin-core"}
plugin-host = {path = "../../plugin/plugin-host"}
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }

[dev-dependencies]
base-testkit = {path = "../../base/base-testkit"}
appearance-settings = { path = "../../settings/appearance-settings" }

[lints]
workspace = true
