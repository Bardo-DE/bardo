[package]
name = "ui-components"
description = "Renderer-free design system: tokens, palette, icons, components, motion."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-ids = { path = "../../base/base-ids" }
base-spawn = { path = "../../base/base-spawn" }
base-words = { path = "../../base/base-words" }
base-machine = { path = "../../base/base-machine" }
ui-core = {path = "../ui-core"}
ui-intents = {path = "../ui-intents"}
ui-motion = {path = "../ui-motion", features = ["dioxus"]}
ui-style = {path = "../ui-style", default-features = false, features = ["dioxus"]}
appearance-settings = { path = "../../settings/appearance-settings" }
dioxus = { workspace = true, features = ["macro", "html", "hooks", "signals"] }
# `ds::keys`: the toolkit side of the keymap; sources are injected, none is linked here.
keymap = {path = "../../keymap/keymap"}
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
# `ui_manifest`: the conformance file an app's menu items and shortcuts are written to.
toml = { workspace = true }

[features]
# `style::icon::classify::classify_with`: decoding a status icon's PNG to decide symbolic or image.
# It links the `image` decoder, so only the crate that classifies status icons asks for it.
icon-classify = ["ui-style/icon-classify"]

[dev-dependencies]
dioxus-ssr = { workspace = true }
ui-lint = {path = "../ui-lint"}
ui-core = {path = "../ui-core", features = ["testing"]}
# `menus::export`: the tree's JSON form, round-tripped.
serde_json = { workspace = true }

[lints]
workspace = true
