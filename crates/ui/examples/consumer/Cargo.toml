[package]
name = "consumer"
description = "Minimal consumer of the UI kit: proves the four coherence rules from CONSUMING.md."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Bardo, by path: this is what a consumer's own Cargo.toml looks like today, before the UI kit has
# a published version (CONSUMING.md "Adding Bardo"). It is a member of the root workspace, so the
# gate builds, lints and tests it with everything else.
ui-components = { path = "../../ui-components" }
settings-store-fs = { path = "../../../settings/settings-store-fs" }
settings-types = { path = "../../../settings/settings-types" }
ui-settings = { path = "../../ui-settings", features = ["dioxus"] }
ui-blitz = { path = "../../ui-blitz" }
ui-host-hooks = { path = "../../ui-host-hooks" }

dioxus = { workspace = true, features = ["hooks", "html", "macro", "signals"] }

[dev-dependencies]
base-machine = { path = "../../../base/base-machine" }
settings-store = { path = "../../../settings/settings-store" }
serde = { workspace = true, features = ["derive"] }
dioxus-ssr = { workspace = true }
# The test driver: a real Blitz document on a fast-forwarded clock (CONSUMING.md section 5, rule 4).
ui-harness = { path = "../../ui-harness" }
# The linter: a consumer's own tests call it (CONSUMING.md section 5).
ui-lint = { path = "../../ui-lint" }

[lints]
workspace = true
