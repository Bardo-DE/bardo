[package]
name = "consumer"
description = "Minimal consumer of the UI kit, outside its workspace: proves the four coherence rules from CONSUMING.md."
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.91"
publish = false

# Its own workspace: the UI kit's root Cargo.toml does not (and must not) list this package in
# `members`, so this manifest marks itself a workspace root or cargo treats it as an orphaned
# member of Bardo workspace it happens to sit under.
[workspace]

[dependencies]
# Bardo, by path: this is what a consumer's own Cargo.toml looks like today, before the UI kit has
# a published version (CONSUMING.md "Adding Bardo").
ui-components = { path = "../../ui-components" }
settings-store-fs = { path = "../../../settings/settings-store-fs" }
settings-types = { path = "../../../settings/settings-types" }
ui-settings = { path = "../../ui-settings", features = ["dioxus"] }
ui-blitz = { path = "../../ui-blitz" }
ui-host-hooks = { path = "../../ui-host-hooks" }

# ---- lines copied from bardo/docs/workspace-deps.toml (pinned block) ----
# ds's own dependency tree (dioxus-native, blitz-*, anyrender, ...) resolves against the UI kit's own
# workspace (crates/ds/Cargo.toml has no [workspace] of its own, so it joins whichever ancestor
# has one: the UI kit's root, not this one) — this package only needs to name what it writes rsx!
# and cargo test against itself.
dioxus = { version = "0.8.0-alpha.3", default-features = false, features = ["hooks", "html", "macro", "signals"] }

[dev-dependencies]
base-words = { path = "../../../base/base-words" }
settings-store = { path = "../../../settings/settings-store" }
serde = { version = "1", features = ["derive"] }
dioxus-ssr = { version = "0.8.0-alpha.3" }
# The test driver: a real Blitz document on a fast-forwarded clock (CONSUMING.md section 5, rule 4).
ui-harness = { path = "../../ui-harness" }
# The linter: a consumer's own tests call it (CONSUMING.md section 5).
ui-lint = { path = "../../ui-lint" }

[lints.rust]
unsafe_code = "deny"

# Patches apply only at a workspace root, so this root repeats the root workspace's block (xtask
# workspace-deps checks each entry is the root's). vello and anyrender come from our forks
# (github.com/Bardo-DE/vello and /anyrender, branch bardo-2026-11-25): the colour matrix filter,
# multi-threaded filter layers and CSS filter lists, so every CSS `filter` function paints on both
# backends (blitz-embed docs/blitz-gaps.md tracks the PRs).
[patch.crates-io]
anyrender = {git = "https://github.com/Bardo-DE/anyrender", rev = "a494b4848f971650cd9fb54fe06bec4dda7805a3"}
anyrender_svg = {git = "https://github.com/Bardo-DE/anyrender", rev = "a494b4848f971650cd9fb54fe06bec4dda7805a3"}
anyrender_vello_cpu = {git = "https://github.com/Bardo-DE/anyrender", rev = "a494b4848f971650cd9fb54fe06bec4dda7805a3"}
anyrender_vello_gpu = {git = "https://github.com/Bardo-DE/anyrender", rev = "a494b4848f971650cd9fb54fe06bec4dda7805a3"}
glifo = {git = "https://github.com/Bardo-DE/vello", rev = "b73a8dfa23c4e34eeda7f73c1bb2beb10ead5a6a"}
vello_common = {git = "https://github.com/Bardo-DE/vello", rev = "b73a8dfa23c4e34eeda7f73c1bb2beb10ead5a6a"}
vello_cpu = {git = "https://github.com/Bardo-DE/vello", rev = "b73a8dfa23c4e34eeda7f73c1bb2beb10ead5a6a"}
vello_gpu = {git = "https://github.com/Bardo-DE/vello", rev = "b73a8dfa23c4e34eeda7f73c1bb2beb10ead5a6a"}
vello_gpu_shaders = {git = "https://github.com/Bardo-DE/vello", rev = "b73a8dfa23c4e34eeda7f73c1bb2beb10ead5a6a"}
wgpu_context = {git = "https://github.com/Bardo-DE/anyrender", rev = "a494b4848f971650cd9fb54fe06bec4dda7805a3"}
