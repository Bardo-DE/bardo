[package]
name = "ui-shell"
description = "The design system's app-facing parts above ds: the account sheets and consent alert, the missing-helper sheet and the confirm card, with their sheets."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-words = { path = "../../base/base-words" }
base-secret = { path = "../../base/base-secret" }
ui-components = {path = "../ui-components"}
ui-core = {path = "../ui-core"}
ui-motion = {path = "../ui-motion", features = ["dioxus"]}
ui-style = {path = "../ui-style", default-features = false, features = ["dioxus"]}
dioxus = { workspace = true, features = ["macro", "html", "hooks", "signals"] }

[dev-dependencies]
dioxus-ssr = { workspace = true }
ui-lint = {path = "../ui-lint"}
ui-core = {path = "../ui-core", features = ["testing"]}

[lints]
workspace = true
