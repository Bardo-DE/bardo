[package]
name = "ui-helpers"
description = "Missing helpers: apps declare the distro tools they run, probe for them, and ask PackageKit to install one at the moment of use."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-time = { path = "../../base/base-time" }
xdg-core = { path = "../../xdg/xdg-core" }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
toml = { workspace = true }
zbus = {workspace = true, features = ["default"], optional = true}

[dev-dependencies]
base-testkit = {path = "../../base/base-testkit", features = ["dbus", "tokio"]}
# The tests' runtime; the crate itself names none (zbus brings its own executor).
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"]}
# The tests run zbus on that runtime (the fake PackageKit sleeps with tokio inside a zbus
# handler). Named here so `cargo test -p ui-helpers` alone builds it so, not only when another
# workspace member happens to turn the feature on.
zbus = {workspace = true, features = ["default", "tokio"]}
dbus-kit = { path = "../../bus/dbus-kit" }

[features]
default = ["desktop"]
# The PackageKit backend (`installer/packagekit.rs`), over the system bus. Without it
# `PackageKit::system()` still exists and every install is `Outcome::Unsupported`
# (design/36 section 2); `PackageKit::on` is absent, since it takes a zbus connection.
desktop = ["dep:zbus"]

[lints]
workspace = true
