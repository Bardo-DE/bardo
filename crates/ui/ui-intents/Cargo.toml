[package]
name = "ui-intents"
description = "The companion's presentational context: the marks a quire app reports (a thing, a chip, a summon) and nothing of the agent's wire."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/quire"
publish = false

[dependencies]
ui-core = {path = "../ui-core"}

[dev-dependencies]
ui-core = {path = "../ui-core", features = ["testing"]}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
