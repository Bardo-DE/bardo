[package]
name = "ui-style"
description = "The design system's appearance: tokens and the Token trait, materials, Space palettes, fonts, icons, the stylesheet's sections and the Kit seam."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-ids = { path = "../../base/base-ids" }
base-words = { path = "../../base/base-words" }
base-time = { path = "../../base/base-time" }
ui-core = {path = "../ui-core"}
base-words-macros = { path = "../../base/base-words-macros" }
dioxus = { workspace = true, features = ["macro", "html", "hooks", "signals"], optional = true }
serde = { workspace = true, features = ["derive"] }
settings-store = { path = "../../settings/settings-store" }
serde_json = { workspace = true }
# Decoding a status icon's PNG to decide symbolic or image (design/08-ICONS.md section 1.5), behind
# `icon-classify`.
image = { workspace = true, features = ["png", "jpeg"], optional = true }

[dev-dependencies]
dioxus-ssr = { workspace = true }
ui-core = {path = "../ui-core", features = ["testing"]}
# Reading the shipped faces' cmaps in the key-glyph test.
skrifa = { workspace = true }
ui-style = {path = ".", default-features = false, features = ["dioxus", "icon-classify"]}

[features]
default = ["icon-classify"]
# `icon::classify::classify_with`: decoding a status icon's PNG to decide symbolic or image. It links
# the `image` decoder, so a crate that only reads settings or Extensions (ui-settings,
# ui-extensions) takes ui-style without it; an app that classifies status icons keeps the default.
icon-classify = ["dep:image"]
# The scope, scale, task and busy hooks and the `Glyph` component. Without it the crate is plain
# data (appearance, tokens, palettes, icons, CSS text), so a crate that only reads settings can
# name the appearance enums without linking Dioxus.
dioxus = ["dep:dioxus"]

[lints]
workspace = true
