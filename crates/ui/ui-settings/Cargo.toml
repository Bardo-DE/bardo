[package]
name = "ui-settings"
description = "Settings I/O: SettingsDoc and Store (lenient load, atomic save, directory watch), the appearance file, the settings portal."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/quire"
publish = false

[dependencies]
ui-core = {path = "../ui-core"}
# Temporary: the one-time move of the folders the desktop shares (`pre_bardo`); deleted with it.
old-folders = {path = "../../platform/old-folders"}
# The capped reader and the durable atomic writer every file here goes through (UI-free).
ui-helpers = {path = "../ui-helpers", default-features = false}
ui-peer = {path = "../ui-peer"}
ui-style = {path = "../ui-style", default-features = false}
ui-settings-derive = {path = "../ui-settings-derive"}
dioxus = {version = "0.7", default-features = false, features = ["macro", "html", "hooks", "signals"], optional = true}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
thiserror = {version = "2"}
notify = {version = "8.2"}
futures-timer = {version = "3"}
zbus = {version = "5.19", optional = true}
toml = {version = "1"}
# Save merges into the parsed file, keeping unknown keys and comments.
toml_edit = {version = "0.25"}

[target.'cfg(target_os = "macos")'.dependencies]
# The system's appearance and accessibility preferences (`portal/macos.rs`), read from the user's
# defaults through safe bindings.
objc2-core-foundation = {version = "0.3.2", default-features = false, features = ["std", "CFBase", "CFString", "CFNumber", "CFPreferences", "CFPropertyList"]}

[dev-dependencies]
tempfile = "3"
ui-components = {path = "../ui-components"}
# The tests' runtime and the `Spawner` they hand the watches; the crate itself names no runtime.
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros"]}
zbus-ready = { path = "../../zbus-ready" }

[features]
default = ["quire-desktop"]
# Our desktop's integration: the settings portal client (`portal/bus.rs`) and, with `live`, the live
# settings modules. Without it `SystemPrefsSource::Portal` answers the defaults and the appearance
# file, its watch and `use_environment` work as ever; no D-Bus client is built (design/36 section 1).
quire-desktop = ["dep:zbus"]
# `use_environment`, the signal a surface resolves its look from.
dioxus = ["dep:dioxus", "ui-style/dioxus"]
# Drive zbus on the tokio runtime the shell already runs (see the workspace zbus note).
tokio = ["quire-desktop", "zbus/tokio"]
# `org.bardo.SettingsModule1` (design/22-SETTINGS.md section 9.4): the live settings modules a
# daemon serves (accountd, inferd) and the Settings app reads. Uses the `zbus` above under whatever
# backend the build picked; this feature never selects an executor.
live = ["quire-desktop"]
# `live::AnyOwner`, an owner check that passes every owner. For tests and scenarios only: a shipped
# program supplies a real check, so this stays off in a normal build.
testing = ["live"]

# The live-module tests need `testing` (`AnyOwner`) beside `live`; the gate runs --all-features.
[[test]]
name = "live"
path = "tests/live/main.rs"
required-features = ["live", "testing"]

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
