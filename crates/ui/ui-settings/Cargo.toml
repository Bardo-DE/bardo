[package]
name = "ui-settings"
description = "The look's settings I/O: the appearance file, the settings portal, the icon-theme lookup, the Spaces and style files."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-spawn = { path = "../../base/base-spawn" }
base-fs = { path = "../../base/base-fs" }
settings-store = { path = "../../settings/settings-store" }
settings-store-fs = { path = "../../settings/settings-store-fs" }
settings-types = { path = "../../settings/settings-types" }
# The deadline the portal client runs its calls under (UI-free).
ui-peer = {path = "../ui-peer"}
ui-style = {path = "../ui-style", default-features = false}
dioxus = { workspace = true, features = ["macro", "html", "hooks", "signals"], optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
zbus = {workspace = true, features = ["default"], optional = true}
toml = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# The system's appearance and accessibility preferences (`portal/macos.rs`), read from the user's
# defaults through safe bindings.
objc2-core-foundation = { workspace = true, features = ["std", "CFBase", "CFString", "CFNumber", "CFPreferences", "CFPropertyList"] }

[dev-dependencies]
base-words = { path = "../../base/base-words" }
settings-dbus = { path = "../../settings/settings-dbus" }
tempfile.workspace = true
ui-components = {path = "../ui-components"}
# The tests' runtime and the `Spawner` they hand the watches; the crate itself names no runtime.
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"]}

[features]
default = ["quire-desktop"]
# Our desktop's integration: the settings portal client (`portal/bus.rs`). Without it
# `SystemPrefsSource::Portal` answers the defaults and the appearance file, its watch and
# `use_environment` work as ever; no D-Bus client is built (design/36 section 1).
quire-desktop = ["dep:zbus"]
# `use_environment`, the signal a surface resolves its look from.
dioxus = ["dep:dioxus", "ui-style/dioxus"]
# Drive zbus on the tokio runtime the shell already runs (see the workspace zbus note).
tokio = ["quire-desktop", "zbus/tokio"]

[lints]
workspace = true
