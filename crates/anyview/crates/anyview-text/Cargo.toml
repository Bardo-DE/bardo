[package]
name = "anyview-text"
description = "Text for the viewer: encodings and windowed lines, syntax highlighting into token classes, Markdown to HTML, CSV tables, spreadsheets and JSON trees."
version = "0.1.0-beta.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/anyview"
publish = false

[dependencies]
anyview-core = {path = "../anyview-core"}
# `OpenFile`, the one way a path is opened (core does no I/O).
anyview-fs = {path = "../anyview-fs"}
ui-core = {path = "../../../ui/ui-core"}
calamine = {version = "0.38", default-features = false}
# Reads a zipped workbook's directory before calamine does (calamine already brings it in).
zip = {version = "9", default-features = false, features = ["deflate"]}
chardetng = {version = "1"}
csv = {version = "1"}
encoding_rs = {version = "0.8"}
pulldown-cmark = {version = "0.13.5", default-features = false, features = ["html"]}
serde_json = {version = "1"}
syntect = {version = "5", default-features = false, features = ["parsing", "dump-load", "regex-fancy"]}
thiserror = {version = "2"}
unicode-segmentation = {version = "1"}

[dev-dependencies]
tempfile = {version = "3"}

# Makes the named pipe the image reader must refuse.
[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = {version = "1.1", default-features = false, features = ["std", "event", "fs", "net", "time", "process"]}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
