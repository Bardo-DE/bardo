[package]
name = "anyview-text"
description = "Text for the viewer: encodings and windowed lines, syntax highlighting into token classes, Markdown to HTML, CSV tables, spreadsheets and JSON trees."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-words = { path = "../../../base/base-words" }
anyview-core = {path = "../anyview-core"}
# `OpenFile`, the one way a path is opened (core does no I/O).
anyview-fs = {path = "../anyview-fs"}
ui-core = {path = "../../../ui/ui-core"}
calamine = { workspace = true }
# Reads a zipped workbook's directory before calamine does (calamine already brings it in).
zip = { workspace = true, features = ["deflate"] }
chardetng = { workspace = true }
csv = { workspace = true }
encoding_rs = { workspace = true }
pulldown-cmark = { workspace = true, features = ["html"] }
serde_json = { workspace = true }
syntect = { workspace = true, features = ["parsing", "dump-load", "regex-fancy"] }
thiserror = { workspace = true }
unicode-segmentation = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# Makes the named pipe the image reader must refuse.
[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = {workspace = true, features = ["std", "event", "fs", "net", "time", "process"]}

[lints]
workspace = true

[package.metadata.cargo-shear]
# A Rust file the highlighter tests read as text.
ignored-paths = ["tests/fixtures/*.rs"]
