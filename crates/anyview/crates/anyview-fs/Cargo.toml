[package]
name = "anyview-fs"
description = "A file on disk as what the viewer's readers take: the one place a path is opened, so anyview-core does no I/O."
version = "0.1.0-beta.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/anyview"
publish = false

[dependencies]
anyview-core = {path = "../anyview-core"}
# The capped whole-file read the desktop's apps share (no UI, bus or runtime).
ui-helpers = {default-features = false, path = "../../../ui/ui-helpers"}

[target.'cfg(unix)'.dependencies]
rustix = {version = "1.1", default-features = false, features = ["std", "event", "fs", "net", "time", "process"]}

[dev-dependencies]
tempfile = {version = "3"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
