[package]
name = "anyview-fs"
description = "A file on disk as what the viewer's readers take: the one place a path is opened, so anyview-core does no I/O."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-fs = { path = "../../../base/base-fs" }
anyview-core = {path = "../anyview-core"}
# The capped whole-file read the desktop's apps share (no UI, bus or runtime).

[target.'cfg(unix)'.dependencies]
rustix = {version = "1.1", default-features = false, features = ["std", "event", "fs", "net", "time", "process"]}

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
