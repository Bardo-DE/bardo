[package]
name = "anyview-store"
description = "The viewer's memory on disk: the recently-viewed history and per-file view memory, one format with a read API and a write API."
version = "0.1.0-beta.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/anyview"
publish = false

[dependencies]
anyview-core = {path = "../anyview-core"}
# Capped reads, atomic writes and moving a damaged file aside: quire's, shared by the desktop's apps.
ui-helpers = {default-features = false, path = "../../../ui/ui-helpers"}
log = {version = "0.4"}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
thiserror = {version = "2"}

# Safe wrappers of renameat2 (no-replace renames), extended attributes, ownership, `kill(pid, 0)` and
# the store's `flock`: `src/sys/unix.rs`. Windows takes the standard library's (`src/sys/windows.rs`).
[target.'cfg(unix)'.dependencies]
rustix = {version = "1.1.6", default-features = false, features = ["std", "event", "fs", "net", "time", "process"]}

[dev-dependencies]
tempfile = {version = "3"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
