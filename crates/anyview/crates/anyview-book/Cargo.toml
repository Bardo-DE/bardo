[package]
name = "anyview-book"
description = "Books for the viewer: EPUB packages (metadata, reading order, contents, a chapter as sealed HTML) and comic zips (pages in natural order), and their covers."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyview-archive = {path = "../anyview-archive"}
anyview-core = {path = "../anyview-core"}
roxmltree = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
ui-core = {path = "../../../ui/ui-core"}
# `OnDisk`: the input of a book in the scratch folder (core opens no file).
anyview-fs = {path = "../anyview-fs"}
tempfile = { workspace = true }
zip = { workspace = true, features = ["deflate"] }
# The hostile tests bound CPU time, not the wall clock.
rustix = { workspace = true, features = ["time"] }

[lints]
workspace = true
