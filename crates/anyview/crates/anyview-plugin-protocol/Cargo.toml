[package]
name = "anyview-plugin-protocol"
description = "The plugin protocol, version 1: the messages a viewer and a plugin exchange, over bayonet's framing. Pure, so a plugin author depends on this crate alone."
version = "0.1.0-beta.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/anyview"
publish = false

[dependencies]
plugin-host = {default-features = false, path = "../../../plugin/plugin-host"}
serde = {version = "1", features = ["derive"]}
thiserror = {version = "2"}

[dev-dependencies]
serde_json = {version = "1"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
