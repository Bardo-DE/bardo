[package]
name = "anyview-font"
description = "Fonts for the viewer: facts read with skrifa, the specimen's glyph outlines and the font peek."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyview-core = {path = "../anyview-core"}
miniz_oxide = { workspace = true, features = ["with-alloc"] }
skrifa = { workspace = true }
thiserror = { workspace = true }
file-types = { path = "../../../xdg/file-types" }

[dev-dependencies]
# `OnDisk`: the input of a fixture on disk (core opens no file).
anyview-fs = {path = "../anyview-fs"}
miniz_oxide = { workspace = true, features = ["with-alloc"] }
tempfile = { workspace = true }

[lints]
workspace = true
