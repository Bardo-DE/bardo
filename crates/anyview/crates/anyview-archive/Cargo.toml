[package]
name = "anyview-archive"
description = "Archives for the viewer: zip, tar, 7z and compressed-stream listings, extracting one entry, and the archive peek."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyview-core = {path = "../anyview-core"}
bzip2 = { workspace = true }
ui-core = {path = "../../../ui/ui-core"}
flate2 = {version = "1", default-features = false, features = ["rust_backend"]}
lzma-rust2 = { workspace = true, features = ["std", "xz"] }
quick-xml = { workspace = true }
ruzstd = { workspace = true }
sevenz-rust2 = { workspace = true }
tar = {version = "0.4"}
thiserror = { workspace = true }
zip = { workspace = true, features = ["deflate"] }

[dev-dependencies]
# `OnDisk`: the input of a file in the scratch folder (core opens no file).
anyview-fs = {path = "../anyview-fs"}
# Builds the .xz fixtures the tests read.
lzma-rs = { workspace = true }
sevenz-rust2 = { workspace = true, features = ["compress"] }
tempfile = { workspace = true }

[lints]
workspace = true
