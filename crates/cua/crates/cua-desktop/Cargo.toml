[package]
name = "cua-desktop"
description = "The desktop vocabulary every cua crate shares: windows, leases, backend capabilities, glow, units and the Desktop and LeaseControl seams."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/cua"
publish = false

[dependencies]
porter-ids = {path = "../../../porter/crates/porter-ids"}
cua-action = {path = "../../../stoker/crates/cua-action"}
prov = {path = "../../../prov/prov"}
porter-core = {path = "../../../porter/crates/porter-core"}
serde = {version = "1", features = ["derive"]}
thiserror = {version = "2"}

[dev-dependencies]
serde_json = {version = "1"}
casement-protocols = {features = ["client"], path = "../../../casement-protocols"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
