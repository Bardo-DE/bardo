[package]
name = "maskcap-wayland"
description = "The capture backend of maskcap over a wayland connection: ext-image-copy-capture (the stock toplevel source and the quire masked source over an agent lease), and the pump that drives a connection from async code."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/cua"
publish = false

[dependencies]
maskcap = {path = "../maskcap"}
cua-action = {path = "../../../stoker/crates/cua-action"}
cua-desktop = {path = "../cua-desktop"}
thiserror = {version = "2"}
wayland-client = {version = "0.31"}
wayland-protocols = {version = "0.32.13", features = ["client", "staging", "unstable"]}
casement-protocols = {features = ["client"], path = "../../../casement-protocols"}
rustix = {version = "1.1", default-features = false, features = ["std", "fs"]}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[dev-dependencies]
porter-ids = {path = "../../../porter/crates/porter-ids"}
porter-core = {path = "../../../porter/crates/porter-core"}
wayland-server = {version = "0.31"}
# The compositor side of quire-agent-v1, for the fake compositor in the tests.
casement-protocols = {features = ["server"], path = "../../../casement-protocols"}
wayland-protocols = {version = "0.32.13", features = ["client", "server", "staging", "unstable"]}
rustix = {version = "1.1", default-features = false, features = ["event", "fs", "std"]}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
