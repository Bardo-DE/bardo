[package]
name = "a11y-atspi"
description = "The AT-SPI backend of the accessibility tree: finds the leased window by process and title on the session's accessibility bus and walks it breadth first to the node budget. The model and the seam are in a11y-tree."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/cua"
publish = false

[dependencies]
porter-ids = {path = "../../../porter/crates/porter-ids"}
a11y-tree = {path = "../a11y-tree"}
cua-action = {path = "../../../stoker/crates/cua-action"}
cua-desktop = {path = "../cua-desktop"}
porter-core = {path = "../../../porter/crates/porter-core"}
prov = {path = "../../../prov/prov"}
atspi = {version = "0.30", default-features = false, features = ["connection", "proxies", "tokio"]}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
zbus = {version = "5.19", default-features = false, features = ["tokio"]}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
