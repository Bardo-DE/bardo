[package]
name = "cua-system"
description = "The system adapters of computer use: the real seams of a running desktop (casement's desktop, capture over wayland, input over EIS, the AT-SPI tree), the model over inferd, and the links to the router's gate and memoryd. The daemon in cuad wires them."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/cua"
publish = false

[dependencies]
porter-match = {path = "../../../porter/crates/porter-match"}
porter-capability = {path = "../../../porter/crates/porter-capability"}
porter-ids = {path = "../../../porter/crates/porter-ids"}
cua-desktop = {path = "../cua-desktop"}
desktop-client = {features = ["client"], path = "../../../casement-protocols/desktop-client"}
maskcap = {path = "../maskcap"}
maskcap-wayland = {path = "../maskcap-wayland"}
seat-input = {path = "../seat-input"}
seat-ei = {path = "../seat-ei"}
a11y-tree = {path = "../a11y-tree"}
a11y-atspi = {path = "../a11y-atspi"}
cua-run = {path = "../cua-run"}
cua-host = {path = "../cua-host"}
docket-client = {default-features = false, features = ["dbus"], path = "../../../docket/crates/docket-client"}
porter-core = {path = "../../../porter/crates/porter-core"}
porter-infer = {path = "../../../steward/crates/porter-infer"}
inferd-client = {features = ["dbus"], path = "../../../steward/crates/inferd-client"}
almanac-client = {default-features = false, features = ["dbus"], path = "../../../almanac/crates/almanac-client"}
wayland-client = {version = "0.31"}
rustix = {version = "1.1", default-features = false, features = ["std", "fs"]}
thiserror = {version = "2"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
zbus = {version = "5.19", default-features = false, features = ["tokio"]}

[dev-dependencies]
cua-action = {path = "../../../stoker/crates/cua-action"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
