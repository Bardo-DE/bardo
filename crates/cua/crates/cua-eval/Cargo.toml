[package]
name = "cua-eval"
description = "The computer-use model eval: fake surfaces, a task set, a harness that plays a task against a scripted or a local model, and the report."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/cua"
publish = false

[[bin]]
name = "cua-eval"
path = "src/main.rs"

[dependencies]
docket-gate-wire = {path = "../../../docket/crates/docket-gate-wire"}
docket-wire = {path = "../../../docket/crates/docket-wire"}
porter-capability = {path = "../../../porter/crates/porter-capability"}
porter-ids = {path = "../../../porter/crates/porter-ids"}
cua-action = {path = "../../../stoker/crates/cua-action"}
cua-desktop = {path = "../cua-desktop"}
chordkit = {path = "../../../chordkit/crates/chordkit"}
maskcap = {path = "../maskcap"}
seat-input = {path = "../seat-input"}
a11y-tree = {path = "../a11y-tree"}
cua-bus = {path = "../cua-bus"}
cua-run = {path = "../cua-run"}
cua-fake = {path = "../cua-fake"}
docket-core = {path = "../../../docket/crates/docket-core"}
prov = {path = "../../../prov/prov"}
porter-core = {path = "../../../porter/crates/porter-core"}
porter-infer = {path = "../../../steward/crates/porter-infer"}
cua-session = {path = "../../../stoker/crates/cua-session"}
cua-vendors = {path = "../../../stoker/crates/cua-vendors"}
cua-parse = {path = "../../../stoker/crates/cua-parse"}
model-catalog = {path = "../../../stoker/crates/model-catalog"}
model-http = {features = ["client"], path = "../../../stoker/crates/model-http"}
model-openai-compat = {path = "../../../stoker/crates/model-openai-compat"}
model-provider = {path = "../../../stoker/crates/model-provider"}
rust_decimal = {version = "1", default-features = false, features = ["std", "serde"]}
vision-prep = {features = ["pixels"], path = "../../../stoker/crates/vision-prep"}
keyboard-types = {version = "0.7", features = ["serde"]}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
toml = {version = "1"}
thiserror = {version = "2"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[dev-dependencies]
model-provider = {features = ["testing"], path = "../../../stoker/crates/model-provider"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
