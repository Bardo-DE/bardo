[package]
name = "maskcap"
description = "Masked per-window capture: frames, masks, digests, settling and the capture seams. The ext-image-copy-capture backend is `maskcap-wayland`."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/cua"
publish = false

[dependencies]
cua-action = {path = "../../../stoker/crates/cua-action"}
cua-desktop = {path = "../cua-desktop"}
cua-types = {path = "../cua-types"}
serde = {version = "1", features = ["derive"]}
thiserror = {version = "2"}
base64 = {version = "0.22"}
blake3 = {version = "1"}

[dev-dependencies]
serde_json = {version = "1"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
