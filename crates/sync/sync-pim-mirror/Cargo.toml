[package]
name = "sync-pim-mirror"
description = "Calendars, address books and task lists mirrored read-only into a local vdir: the dataset of one collection, one account's collections kept running (a replica over the relay, a journal and a driver each), and the supervisor over every granted account."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-time = { path = "../../base/base-time" }
account-capability = {path = "../../accounts/account-capability"}
account-client = {path = "../../accounts/account-client"}
account-core = {path = "../../accounts/account-core"}
account-match = {path = "../../accounts/account-match"}
base-ids = { path = "../../base/base-ids" }
sync-core = {path = "../sync-core"}
sync-driver = {path = "../sync-driver"}
sync-engine = {path = "../sync-engine"}
sync-journal-sqlite = {path = "../sync-journal-sqlite"}
sync-pim-feed = {path = "../sync-pim-feed"}
sync-vdir = {path = "../sync-vdir"}
sync-xdg = {path = "../sync-xdg"}
hex = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = {workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"]}

[dev-dependencies]
base-url = { path = "../../base/base-url" }
sync-core = {path = "../sync-core", features = ["testing"]}
sync-engine = {path = "../sync-engine", features = ["testing"]}
tempfile = { workspace = true }

[lints]
workspace = true
