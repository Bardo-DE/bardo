[package]
name = "sync-bus"
description = "sync's D-Bus interfaces, each written once under account-dbus's `#[bus_interface]`: org.bardo.Sync1 (syncd's datasets), org.bardo.Storage1 (the drives shown in Files) and, behind the `photos-picker` feature, org.bardo.Photos1.Picker, with their bus names, object paths, option keys and row codecs."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
caller-identity-core = {default-features = false, path = "../../identity/caller-identity-core"}
account-dbus = {path = "../../accounts/account-dbus"}
dbus-kit = { path = "../../bus/dbus-kit" }
base-ids = { path = "../../base/base-ids" }
serde = { workspace = true, features = ["derive"] }
zbus = {workspace = true, features = ["tokio"]}

[features]
# The Photos Picker's proxy and interface (`org.bardo.Photos1.Picker`). Off by default: no Photos
# app ships in v1, so the default bus surface does not declare it. syncd's feature of the same
# name turns it on for the object it serves.
photos-picker = []

[dev-dependencies]
# The shipped caller table is read by the role test, so the table reader is on.
caller-identity-core = {path = "../../identity/caller-identity-core"}

[lints]
workspace = true
