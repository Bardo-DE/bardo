description = "The replicas as syncd runs them: WebDAV, Google Drive, Graph and CalDAV/CardDAV collection replicas built over the authenticated relays accountd opens, so syncd never holds the account's credential."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

