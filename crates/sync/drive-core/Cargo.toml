[package]
name = "drive-core"
description = "Files on demand over a drive's listing, without a file system: the names a drive's items are shown by, the link files of online documents, the content cache (chunked fetches a read waits on, Keep Downloaded, Remove Download, eviction past a limit) and each item's state. The FUSE adapter (drive-fuse) and syncd's Storage1 are built over it."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
account-capability = {path = "../../accounts/account-capability"}
base-ids = { path = "../../base/base-ids" }
base-time = { path = "../../base/base-time" }
base-url = { path = "../../base/base-url" }
base-fs = {path = "../../base/base-fs"}
sync-core = {path = "../sync-core"}
quickxorhash = {path = "../quickxorhash"}
md-5 = { workspace = true }
rustix = {version = "1.1", default-features = false, features = ["std", "event", "fs", "net", "time", "process"]}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
hex = { workspace = true }
rangemap = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[dev-dependencies]
base-testkit = {path = "../../base/base-testkit", features = ["tokio"]}
drive-core = { path = ".", features = ["testing"] }
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[features]
# `MemoryListing` and `MemorySource`: a drive held in memory, for the tests of this crate, the
# FUSE adapter's and syncd's.
testing = []

[lints]
workspace = true
