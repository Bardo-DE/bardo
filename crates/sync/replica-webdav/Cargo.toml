[package]
name = "replica-webdav"
description = "The WebDAV replica: sync-core's Replica over account-dav-proto and the HTTP seam. Changes by sync-collection (RFC 6578) with an etag tree walk where the server has none, writes guarded by If-Match and If-None-Match, quota from RFC 4331, and an HTTP/1.1 client over one authenticated byte stream (accountd's OpenAuthenticated). Pure: no runtime, no socket."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
account-dav-proto = {features = ["http"], path = "../../accounts/account-dav-proto"}
account-capability = {path = "../../accounts/account-capability"}
base-ids = { path = "../../base/base-ids" }
base-time = { path = "../../base/base-time" }
base-url = { path = "../../base/base-url" }
http-core = {path = "../../network/http-core"}
replica-http = {path = "../replica-http"}
sync-core = {path = "../sync-core"}
tracing = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
account-fake-servers = {path = "../../accounts/account-fake-servers"}
http-relay = {path = "../../accounts/http-relay"}
sync-core-fake = {path = "../sync-core-fake"}
roxmltree = { workspace = true }
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[lints]
workspace = true
