[package]
name = "replica-webdav"
description = "The WebDAV replica: ferry-sync's Replica over dav-proto and the HTTP seam. Changes by sync-collection (RFC 6578) with an etag tree walk where the server has none, writes guarded by If-Match and If-None-Match, quota from RFC 4331, and an HTTP/1.1 client over one authenticated byte stream (accountd's OpenAuthenticated). Pure: no runtime, no socket."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/ferry"
publish = false

[dependencies]
account-dav-proto = {features = ["http"], path = "../../accounts/account-dav-proto"}
account-capability = {path = "../../accounts/account-capability"}
account-ids = {path = "../../accounts/account-ids"}
account-http = {path = "../../accounts/account-http"}
sync-core = {path = "../sync-core"}

[dev-dependencies]
base-testkit = {path = "../../base/base-testkit"}
base64 = {version = "0.22"}
account-fake-servers = {path = "../../accounts/account-fake-servers"}
account-http-relay = {path = "../../accounts/account-http-relay"}
sync-core = {path = "../sync-core", features = ["testing"]}
roxmltree = {version = "0.21"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
