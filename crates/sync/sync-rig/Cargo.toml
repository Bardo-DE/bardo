[package]
name = "sync-rig"
description = "Test tooling, never installed and never in dist: the rig a jailed scenario drives ferry with. sync-rig-servers starts the Microsoft Graph fake (the drive and the calendars) behind porter's fake OAuth issuer on loopback, plants known tokens and serves the scenario's levers; sync-rig-client acts as an app over the session bus and talks to syncd's org.bardo.Sync1. Nothing shipped depends on it."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "sync-rig-servers"
path = "src/bin/sync-rig-servers.rs"

[[bin]]
name = "sync-rig-client"
path = "src/bin/sync-rig-client.rs"

[dependencies]
base-fs = { path = "../../base/base-fs" }
sync-bus = {path = "../sync-bus"}
sync-fake-graph = {path = "../sync-fake-graph"}
account-dbus = {path = "../../accounts/account-dbus"}
account-fake-servers = {path = "../../accounts/account-fake-servers"}
# The rig's shared pieces: the identity fixture the daemons read, the planted secrets and the
# shapes of rig.json.
account-rig = {path = "../../accounts/account-rig"}
clap = {version = "4", features = ["derive"]}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# `signal` is what this crate adds to the pinned line: SIGTERM ends the servers cleanly.
tokio = {version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"]}
zbus = {version = "5.19", default-features = false, features = ["tokio"]}

[dev-dependencies]
sync-core = {path = "../sync-core"}
sync-daemon = {path = "../sync-daemon", features = ["testing"]}
account-callers = {features = ["test-proc-root"], path = "../../accounts/account-callers"}
account-core = {path = "../../accounts/account-core"}
base-time = { path = "../../base/base-time" }
base-url = { path = "../../base/base-url" }
rustix = {version = "1.1", default-features = false, features = ["std", "event", "fs", "net", "time", "process"]}
base-testkit = {path = "../../base/base-testkit", features = ["tokio"]}

[lints]
workspace = true
