[package]
name = "sync-photos"
description = "The Photos datasets: originals stored by the SHA-256 of their bytes and an HLC-stamped metadata manifest merged field by field, over one local library; the Google Photos upload and picker; and the registration of both engines in the hub."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
account-capability = {path = "../../accounts/account-capability"}
account-client = {path = "../../accounts/account-client"}
account-core = {path = "../../accounts/account-core"}
base-fs = {path = "../../base/base-fs"}
base-ids = { path = "../../base/base-ids" }
base-time = { path = "../../base/base-time" }
base-url = { path = "../../base/base-url" }
http-core = {path = "../../network/http-core"}
http-relay = {path = "../../accounts/http-relay"}
sync-core = {path = "../sync-core"}
sync-driver = {path = "../sync-driver"}
sync-engine = {path = "../sync-engine"}
sync-journal-sqlite = {path = "../sync-journal-sqlite"}
sync-relay = {path = "../sync-relay"}
sync-xdg = {path = "../sync-xdg"}
hex = { workspace = true }
mime_guess = {workspace = true}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = {workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"]}

[dev-dependencies]
account-callers = {path = "../../accounts/account-callers"}
caller-role-types = {path = "../../identity/caller-role-types"}
account-fake-servers = {path = "../../accounts/account-fake-servers"}
base-testkit = {path = "../../base/base-testkit", features = ["tokio"]}
replica-webdav = {path = "../replica-webdav"}
sync-core = {path = "../sync-core", features = ["testing"]}
sync-engine = {path = "../sync-engine", features = ["testing"]}
sync-journal-sqlite = {path = "../sync-journal-sqlite", features = ["testing"]}
base64 = { workspace = true }
tempfile = { workspace = true }
tokio = {workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"]}

[lints]
workspace = true
