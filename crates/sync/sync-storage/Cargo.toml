[package]
name = "sync-storage"
description = "The storage datasets of syncd: an account's app folder mirrored two ways, the whole drives shown in Files (listed, then served on demand through FUSE), the supervisor that runs them with Photos and the Google Photos Picker for each granted account, the words Files shows for their reasons, and the [storage] knobs of syncd's settings file."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
account-capability = {path = "../../accounts/account-capability"}
account-client = {path = "../../accounts/account-client"}
account-core = {path = "../../accounts/account-core"}
account-dbus = {path = "../../accounts/account-dbus"}
account-match = {path = "../../accounts/account-match"}
base-fs = {path = "../../base/base-fs"}
base-ids = { path = "../../base/base-ids" }
base-url = { path = "../../base/base-url" }
drive-fs = {path = "../drive-fs"}
drive-fuse = {path = "../drive-fuse"}
http-core = {path = "../../network/http-core"}
replica-gdrive = {path = "../replica-gdrive"}
replica-graph = {path = "../replica-graph"}
sync-bus = {path = "../sync-bus"}
sync-core = {path = "../sync-core"}
sync-driver = {path = "../sync-driver"}
sync-engine = {path = "../sync-engine"}
sync-journal-sqlite = {path = "../sync-journal-sqlite"}
sync-photos = {path = "../sync-photos"}
sync-pim-mirror = {path = "../sync-pim-mirror"}
sync-relay = {path = "../sync-relay"}
sync-xdg = {path = "../sync-xdg"}
hex = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tokio = {workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"]}

[dev-dependencies]
base-testkit = {path = "../../base/base-testkit", features = ["tokio"]}
drive-fs = {path = "../drive-fs", features = ["testing"]}
tempfile = { workspace = true }

[lints]
workspace = true
