[package]
name = "drive-mount-daemon"
description = "The one step syncd's sandbox refuses, done for it: a small user service that runs the system's setuid `fusermount3` to show a drive at ~/Cloud/<name> and hands syncd the open FUSE connection over its unix socket (SCM_RIGHTS). The library is the wire format both sides use, the client syncd calls and the server the binary runs; it owns no state and reaches no network, keyring or account data (std, rustix and listenfd only)."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/ferry"
publish = false

[[bin]]
# The helper keeps the name its unit, its socket and syncd's words call it by.
name = "bardo-drive-mount"
path = "src/main.rs"

[dependencies]
listenfd = {version = "1"}
rustix = {version = "1.1", default-features = false, features = ["std", "event", "fs", "net", "time", "process"]}

[dev-dependencies]
base-testkit = {path = "../../base/base-testkit"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
