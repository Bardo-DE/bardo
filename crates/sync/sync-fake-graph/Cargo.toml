[package]
name = "sync-fake-graph"
description = "Test-only fake of the part of Microsoft Graph that ferry's replicas use: a drive (`/v1.0/me/drive`: items, content with ranges and redirects, simple and session uploads, delta, quota) and the calendars of `/v1.0/me/calendars`, behind a bearer token the fake issuer of account-fake-servers minted. Never a dependency of a non-test crate."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64 = { workspace = true }
account-core = {path = "../../accounts/account-core"}
account-fake = {path = "../../accounts/account-fake"}
account-fake-servers = {path = "../../accounts/account-fake-servers"}
base-url = { path = "../../base/base-url" }
account-provider = {path = "../../accounts/account-provider"}
quickxorhash = {path = "../quickxorhash"}
serde_json = { workspace = true }
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[dev-dependencies]
base-testkit = {path = "../../base/base-testkit"}

[lints]
workspace = true
