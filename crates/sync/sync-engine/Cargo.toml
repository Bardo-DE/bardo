[package]
name = "sync-engine"
description = "The sync engine, sans-IO: one dataset against one replica through a journal contract, a cycle at a time, and the pure scheduler that says when the next cycle runs. No runtime, no database, no bus; the SQLite journal is sync-journal-sqlite and the loop around the engine is sync-driver."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
account-capability = {path = "../../accounts/account-capability"}
base-time = { path = "../../base/base-time" }
sync-core = {path = "../sync-core"}
hex = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
base-ids = { path = "../../base/base-ids" }
base-url = { path = "../../base/base-url" }
sync-core-fake = {path = "../sync-core-fake"}
sync-engine-fake = {path = "../sync-engine-fake"}
sync-journal-sqlite = {path = "../sync-journal-sqlite"}
tempfile = { workspace = true }
tokio = {workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"]}

[lints]
workspace = true
