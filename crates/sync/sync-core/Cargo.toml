[package]
name = "sync-core"
description = "The sync engine contract: the Replica trait, anchors, base versions, conflicts and tombstones as values, dataset kinds, and an in-memory reference replica."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
account-capability = {path = "../../accounts/account-capability"}
base-ids = { path = "../../base/base-ids" }
base-time = { path = "../../base/base-time" }
base-url = { path = "../../base/base-url" }
http-core = {path = "../../network/http-core"}
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }

[dev-dependencies]
base-testkit = {path = "../../base/base-testkit"}
sync-core = { path = ".", features = ["testing"] }
serde_json = { workspace = true }
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[features]
# `MemoryReplica`, the reference replica the contract tests drive.
testing = []

[lints]
workspace = true
