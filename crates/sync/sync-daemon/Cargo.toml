[package]
name = "sync-daemon"
description = "ferry's sync daemon: org.bardo.Sync1 over sync-core replicas. The library holds the SQLite journal, the engine over a Replica and a Dataset, the pure scheduler, the bus objects and the Settings rows over the accounts accountd has (it reaches accounts, grants and relays only through account-client); the binary resolves its paths and serves. Datasets: the calendar, contacts and tasks mirror (CalDAV, CardDAV, Microsoft Graph and Google), the storage folder (WebDAV, OneDrive and Google Drive app folders), the whole drives shown in Files, and Photos for an account whose Photos row is on."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
zbus-ready = { path = "../../zbus-ready" }
sync-bus = {path = "../sync-bus"}
drive-core = {path = "../drive-core"}
drive-fuse = {path = "../drive-fuse"}
old-folders = {path = "../../platform/old-folders"}
sync-core = {path = "../sync-core"}
replica-gdrive = {path = "../replica-gdrive"}
replica-graph = {path = "../replica-graph"}
replica-webdav = {path = "../replica-webdav"}
windows-zones = {path = "../windows-zones"}
# Accounts, grants and relays: accountd's, reached through account-client (the bus transport in
# the daemon). Nothing of porter's account stack is a dependency of syncd; the dev-dependencies
# host one in process for the tests.
account-client = {path = "../../accounts/account-client"}
account-client-dbus = {path = "../../accounts/account-client-dbus"}
# What syncd serves: the callers it judges and the bus objects (`Call`, `Details`, `BusTarget`).
account-callers = {features = ["file"], path = "../../accounts/account-callers"}
account-dbus = {path = "../../accounts/account-dbus"}
# Only `xdg`: the directories a daemon keeps its files under.
account-daemon-support = {default-features = false, path = "../../accounts/account-daemon-support"}
# The vocabulary: needs, grants, ids, the parent window.
account-core = {path = "../../accounts/account-core"}
account-match = {path = "../../accounts/account-match"}
account-capability = {path = "../../accounts/account-capability"}
account-wire = {path = "../../accounts/account-wire"}
account-ids = {path = "../../accounts/account-ids"}
account-fs = {path = "../../accounts/account-fs"}
account-dav-proto = {features = ["discover"], path = "../../accounts/account-dav-proto"}
account-http = {path = "../../accounts/account-http"}
account-http-relay = {path = "../../accounts/account-http-relay"}
ui-settings = {features = ["live", "tokio"], path = "../../ui/ui-settings"}
clap = {version = "4", features = ["derive"]}
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["alloc"] }
hex = { workspace = true }
mime_guess = {version = "2", default-features = false}
nanohtml2text = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
# `signal`: SIGTERM unmounts the drives before the process ends.
tokio = {version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"]}
toml = { workspace = true }
zbus = {version = "5.19", default-features = false, features = ["tokio"]}

[dev-dependencies]
base-testkit = {path = "../../base/base-testkit"}
ui-settings = {features = ["live", "testing", "tokio"], path = "../../ui/ui-settings"}
sync-daemon = { path = ".", features = ["testing"] }
base64 = { workspace = true }
tempfile = { workspace = true }
sync-fake-graph = {path = "../sync-fake-graph"}
# The account service hosted in the test process, as the in-process transport of account-client.
account-client-inproc = {features = ["relays"], path = "../../accounts/account-client-inproc"}
account-fake = {path = "../../accounts/account-fake"}
account-sheet = {path = "../../accounts/account-sheet"}
account-fake-servers = {path = "../../accounts/account-fake-servers"}
account-http-reqwest = {path = "../../accounts/account-http-reqwest"}
account-provider = {path = "../../accounts/account-provider"}
account-secrets = {features = ["testing"], path = "../../accounts/account-secrets"}
account-service = {path = "../../accounts/account-service"}
account-service-core = {path = "../../accounts/account-service-core"}
drive-core = {path = "../drive-core", features = ["testing"]}
sync-core = {path = "../sync-core", features = ["testing"]}
# The words the fake of Storage1 gives are held to the live ones (tests/it/fake_words.rs).
sync-fakes = {path = "../sync-fakes"}
# A paused clock for the stop wait's timing test.
tokio = {version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "test-util", "time"]}

[features]
# Test builds only, never default and never in dist: `BARDO_SYNCD_PROC_ROOT=<dir>` makes the binary
# read caller identities from <dir> instead of /proc, because the jailed and acceptance tests run
# processes outside service cgroups, and `BARDO_ACCOUNTD_SYSTEM_CALLERS=<file>` makes it read that file as
# the system caller table, because a jail cannot write /etc/bardo. A release build ignores both
# variables. A test in tests/dist.rs fails if this feature is ever default, and
# check-boundary.sh checks it too.
test-proc-root = ["account-callers/test-proc-root"]
# `MemoryDataset`, the in-memory local side the engine's tests (and daemon tests) drive.
testing = []
# Serves `org.bardo.Photos1.Picker` beside Sync1 (sync-bus's feature of the same name declares
# it). Off by default: no Photos app ships in v1.
photos-picker = ["sync-bus/photos-picker"]

[lints]
workspace = true
[[bin]]
name = "bardo-syncd"
path = "src/main.rs"
