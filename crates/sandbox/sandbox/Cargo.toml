[package]
name = "sandbox"
description = "Runs a command or an agent process confined by bubblewrap: read-only root, one writable directory, no network unless given, and a kill that takes the whole sandbox. The Linux side of `sandbox-core`: it starts bubblewrap, applies the limits, and serves the endpoint bridge and the filtering egress proxy."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
publish.workspace = true

[[bin]]
name = "bardo-sandbox-forward"
path = "src/bin/bardo-sandbox-forward.rs"

[dependencies]
base-path = { path = "../../base/base-path" }
sandbox-core = { path = "../sandbox-core" }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
