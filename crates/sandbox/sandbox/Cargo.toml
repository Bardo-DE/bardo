[package]
name = "sandbox"
description = "Run a command or an agent process confined by bubblewrap: read-only root, one writable directory, no network unless given, and a kill that takes the whole sandbox."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
publish.workspace = true

[[bin]]
name = "bardo-sandbox-forward"
path = "src/bin/bardo-sandbox-forward.rs"

[[bin]]
name = "bardo-sandbox-enter"
path = "src/bin/bardo-sandbox-enter.rs"
required-features = ["landlock"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock = { workspace = true, optional = true }

[features]
# The exec stage's Landlock calls (`enter::apply`, `enter::enter_main` and the `bardo-sandbox-enter`
# binary). Off by default: a crate that only builds the agent's command line (the plan, the argv,
# the report line) links no sandbox library; the binary that IS the exec stage turns it on.
landlock = ["dep:landlock"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
