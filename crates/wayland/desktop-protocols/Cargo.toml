[package]
name = "desktop-protocols"
description = "The desktop's private Wayland protocols (bardo_*_v1): the XML, the pure wire vocabulary, and wayland-scanner bindings behind the `client` and `server` features."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
wayland-scanner = { workspace = true, optional = true }
wayland-backend = { workspace = true, features = ["client_system"], optional = true }
wayland-client = { workspace = true, optional = true }
wayland-server = { workspace = true, optional = true }
wayland-protocols = { workspace = true, features = ["client", "staging", "unstable"], optional = true }
bitflags = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
quick-xml = { workspace = true }

[features]
default = []
# The clients' side: the shell, layer-shell-host, computer use, the portal, Bardo's ui-blitz.
client = [
  "dep:wayland-client",
  "dep:wayland-backend",
  "dep:wayland-scanner",
  "dep:bitflags",
  "wayland-protocols/client",
]
# The compositor's side: compositor.
server = [
  "dep:wayland-server",
  "dep:wayland-backend",
  "dep:wayland-scanner",
  "dep:bitflags",
  "wayland-protocols/server",
]

[lints]
workspace = true

[package.metadata.cargo-shear]
# The code wayland-scanner generates names these; nothing written by hand does.
ignored = ["bitflags", "wayland-backend"]
