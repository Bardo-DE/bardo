[package]
name = "desktop-protocols"
description = "The desktop's private Wayland protocols (quire_*_v1): the XML, the pure wire vocabulary, and wayland-scanner bindings behind the `client` and `server` features."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/casement-protocols"
publish = false

[dependencies]
serde = {version = "1", features = ["derive"]}
thiserror = {version = "2"}
wayland-scanner = {version = "0.31", optional = true}
wayland-backend = {version = "0.3", features = ["client_system"], optional = true}
wayland-client = {version = "0.31", optional = true}
wayland-server = {version = "0.31", optional = true}
wayland-protocols = {version = "0.32.13", features = ["client", "staging", "unstable"], optional = true}
bitflags = {version = "2", optional = true}

[dev-dependencies]
serde_json = {version = "1"}
quick-xml = {version = "0.41"}

[features]
default = []
# The clients' side: sill, shell-host, cua, transom, quire's ds-blitz.
client = [
  "dep:wayland-client",
  "dep:wayland-backend",
  "dep:wayland-scanner",
  "dep:bitflags",
  "wayland-protocols/client",
]
# The compositor's side: casement.
server = [
  "dep:wayland-server",
  "dep:wayland-backend",
  "dep:wayland-scanner",
  "dep:bitflags",
  "wayland-protocols/server",
]

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
