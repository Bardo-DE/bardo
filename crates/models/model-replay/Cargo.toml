[package]
name = "model-replay"
description = "Record and replay for tests, at two layers: typed turn cassettes (a replaying provider and a recording wrapper) and wire cassettes recorded and replayed at the Transport seam, both over an injected sink."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
http-core = {path = "../../network/http-core"}
model-http = {path = "../model-http"}
model-provider = {path = "../model-provider"}
speech-provider = {path = "../../speech/speech-provider"}
model-vision-prep = {path = "../model-vision-prep"}
blake3 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
model-provider = {path = "../model-provider", features = ["testing"]}
proptest = { workspace = true }


[lints]
workspace = true
