[package]
name = "model-replay"
description = "Record and replay for tests, at two layers: typed turn cassettes (a replaying provider and a recording wrapper) and wire cassettes recorded and replayed at the Transport seam, both over an injected sink."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-ids = {path = "../../base/base-ids"}
http-core = {path = "../../network/http-core"}
model-http = {path = "../model-http"}
model-core = {path = "../model-core"}
model-types = {path = "../model-types"}
speech-core = {path = "../speech-core"}
model-vision-prep = {path = "../model-vision-prep"}
blake3 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
model-fake = {path = "../model-fake"}
proptest = { workspace = true }


