[package]
name = "model-provider"
description = "One trait for chat, tool-calling, vision and computer-use models: requests, streaming events, capabilities and errors."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-ids = { path = "../../base/base-ids" }
computer-use-action = {path = "../computer-use-action"}
model-genai-names = {path = "../model-genai-names"}
model-http = {path = "../model-http"}
model-vision-prep = {path = "../model-vision-prep"}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
rust_decimal = { workspace = true, features = ["std", "serde"] }
iso_currency = { workspace = true, features = ["with-serde"] }

[dev-dependencies]
# The integration tests use ScriptedProvider; before, they built only when another crate turned it on.
model-provider = {path = ".", features = ["testing"]}
proptest = { workspace = true }


[features]
# `ScriptedProvider`: a provider that plays scripted turns and records every request.
testing = []

[lints]
workspace = true
