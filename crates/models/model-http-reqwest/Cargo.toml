[package]
name = "model-http-reqwest"
description = "The connection of a model endpoint: http-reqwest built as an endpoint says (TCP, a Unix socket or TLS, one connection per request, no redirect, no environment proxy) behind model-http's HttpClient."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
http-core = { path = "../../network/http-core" }
http-reqwest = { path = "../../network/http-reqwest" }
model-http = { path = "../model-http" }

[dev-dependencies]
base-secret = { path = "../../base/base-secret" }
base-testkit = { path = "../../base/base-testkit", features = ["tokio"] }
rcgen = { workspace = true, features = ["ring", "pem"] }
tokio-rustls = { workspace = true, features = ["ring", "logging", "tls12"] }
rustls-pki-types = { workspace = true }
proptest = { workspace = true }
tokio = {workspace = true, features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"]}

[lints]
workspace = true
