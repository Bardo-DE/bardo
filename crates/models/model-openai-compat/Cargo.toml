[package]
name = "model-openai-compat"
description = "The OpenAI-compatible chat-completions wire (llama-server, vLLM, LiteLLM, OpenRouter) as a model-wire codec, its quirk table, and the speech wire over model-http."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
model-provider = {path = "../model-provider"}
model-http = {path = "../model-http"}
model-wire = {path = "../model-wire"}
speech-provider = {path = "../../speech/speech-provider"}
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
rust_decimal = { workspace = true, features = ["std", "serde"] }
log = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
model-http = {path = "../model-http", features = ["client"]}
tokio = {version = "1", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"]}
model-replay = {path = "../model-replay"}
proptest = { workspace = true }

[lints]
workspace = true
