[package]
name = "model-openai-compat"
description = "The OpenAI-compatible chat-completions wire (llama-server, vLLM, LiteLLM, OpenRouter) as a model-wire codec, its quirk table, and the speech wire over model-http."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-ids = {path = "../../base/base-ids"}
model-provider = {path = "../model-provider"}
model-http = {path = "../model-http"}
model-wire = {path = "../model-wire"}
speech-provider = {path = "../speech-provider"}
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
rust_decimal = { workspace = true, features = ["std", "serde"] }
log = { workspace = true }

[features]
# Test support: the decode pipeline and its invariants (`testing`), for this crate's own tests
# and the fuzz targets.
testing = []

[dev-dependencies]
model-openai-compat = { path = ".", features = ["testing"] }
base64 = { workspace = true }
model-http-reqwest = {path = "../model-http-reqwest"}
tokio = {workspace = true, features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"]}
model-replay = {path = "../model-replay"}
proptest = { workspace = true }
# The wait for the server to see the close is bounded by the one generous limit.
base-testkit = { path = "../../base/base-testkit" }

[lints]
workspace = true
