[package]
name = "model-http"
description = "HTTP for model endpoints over TCP, Unix sockets and TLS: targets, auth, the request an exchange comes to, pure SSE and NDJSON decoders, and the exchange-level transport seam over http-core. The connection is model-http-reqwest's."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
base-secret = { path = "../../base/base-secret" }
thiserror = { workspace = true }
tracing = { workspace = true }
http-core = { path = "../../network/http-core" }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
