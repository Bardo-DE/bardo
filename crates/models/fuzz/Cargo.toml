# Fuzz targets for the decoders of model, engine and socket bytes. A workspace member so the gate
# compiles it; fuzzing needs nightly and cargo-fuzz and is run by hand with `dev/fuzz.sh` (the
# proptest suites `hostile` in model-http, model-openai-compat, bardo-speech-host and
# speech-host-client are what the gate runs).
[package]
name = "model-fuzz"
description = "Developer tool: libFuzzer targets for the decoders of model, engine and socket bytes."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { workspace = true }
model-http = { path = "../model-http" }
model-openai-compat = { path = "../model-openai-compat", features = ["testing"] }
model-provider = { path = "../model-provider" }
model-wire = { path = "../model-wire" }
speech-provider = { path = "../speech-provider" }
speech-host-client = { path = "../../speech/speech-host-client" }


[[bin]]
name = "sse_stream"
path = "fuzz_targets/sse_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "framers"
path = "fuzz_targets/framers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "whole_bodies"
path = "fuzz_targets/whole_bodies.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pcm"
path = "fuzz_targets/pcm.rs"
test = false
doc = false
bench = false

[[bin]]
name = "host_frames"
path = "fuzz_targets/host_frames.rs"
test = false
doc = false
bench = false

[lints]
workspace = true
