[package]
name = "model-vision-prep"
description = "Image preparation for vision models: resize rules, token estimates, and the FrameMap between window, image and grid coordinates."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/stoker"
publish = false

[dependencies]
computer-use-action = {path = "../../computer-use/computer-use-action"}
serde = {version = "1", features = ["derive"]}
thiserror = {version = "2"}
image = {version = "0.25.6", default-features = false, features = ["png", "jpeg"], optional = true}
fast_image_resize = {version = "6.1.0", optional = true}

[dev-dependencies]
serde_json = {version = "1"}
proptest = {version = "1"}

[features]
# CPU resize and encode. Off by default so the pure crates never reach the image stack.
pixels = ["dep:image", "dep:fast_image_resize"]

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
