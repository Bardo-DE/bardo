# Fuzz targets for computer-use-parse (QUESTIONS P11). A workspace member so the gate compiles it;
# fuzzing needs nightly and cargo-fuzz and is run by hand with `dev/fuzz-computer-use-parse.sh`.
[package]
name = "computer-use-parse-fuzz"
description = "Developer tool: libFuzzer targets for computer-use-parse."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { workspace = true }
computer-use-action = { path = "../../computer-use-action" }
computer-use-parse = { path = ".." }
model-provider = { path = "../../model-provider" }


[[bin]]
name = "parse_text"
path = "fuzz_targets/parse_text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_tool_calls"
path = "fuzz_targets/parse_tool_calls.rs"
test = false
doc = false
bench = false

[[bin]]
name = "read_calls"
path = "fuzz_targets/read_calls.rs"
test = false
doc = false
bench = false

[lints]
workspace = true
