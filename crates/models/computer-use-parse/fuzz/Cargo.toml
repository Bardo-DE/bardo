# Fuzz targets for computer-use-parse (QUESTIONS P11). Not a workspace member and nightly only: it is run
# by hand with `dev/fuzz-cua-parse.sh`, never by CI or the stable gate. Its `[workspace]` table
# keeps cargo from reading it as part of the model layer's.
[package]
name = "cua-parse-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = {workspace = true}
computer-use-action = { path = "../../computer-use-action" }
computer-use-parse = { path = ".." }
model-provider = { path = "../../model-provider" }

[workspace]

[[bin]]
name = "parse_text"
path = "fuzz_targets/parse_text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_tool_calls"
path = "fuzz_targets/parse_tool_calls.rs"
test = false
doc = false
bench = false

[[bin]]
name = "read_calls"
path = "fuzz_targets/read_calls.rs"
test = false
doc = false
bench = false
