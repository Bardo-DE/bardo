[package]
name = "model-provider"
description = "One trait for chat, tool-calling, vision and computer-use models: requests, streaming events, capabilities and errors."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/stoker"
publish = false

[dependencies]
cua-action = {path = "../cua-action"}
genai-names = {path = "../genai-names"}
model-http = {path = "../model-http"}
vision-prep = {path = "../vision-prep"}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
thiserror = {version = "2"}
base64 = {version = "0.22"}
rust_decimal = {version = "1", default-features = false, features = ["std", "serde"]}
iso_currency = {version = "0.7", features = ["with-serde"]}

[dev-dependencies]
# The integration tests use ScriptedProvider; before, they built only when another crate turned it on.
model-provider = {path = ".", features = ["testing"]}
proptest = {version = "1"}


[features]
# `ScriptedProvider`: a provider that plays scripted turns and records every request.
testing = []

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
