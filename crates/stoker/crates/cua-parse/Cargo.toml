[package]
name = "cua-parse"
description = "Strict, total parsers for the action dialects of local computer-use models: text and server-parsed tool calls."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/stoker"
publish = false

[dependencies]
cua-action = {path = "../cua-action"}
model-provider = {path = "../model-provider"}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
keyboard-types = {version = "0.7", features = ["serde"]}
thiserror = {version = "2"}

[dev-dependencies]
proptest = {version = "1"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
