[package]
name = "model-wire"
description = "The wire half of a model endpoint: the codec traits (request encode, reply decode, error classification) and the Driver that joins a codec to a Transport. Pure over a seam: no HTTP stack."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/stoker"
publish = false

[dependencies]
model-http = {path = "../model-http"}
model-provider = {path = "../model-provider"}
thiserror = {version = "2"}

[dev-dependencies]
serde_json = {version = "1"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
