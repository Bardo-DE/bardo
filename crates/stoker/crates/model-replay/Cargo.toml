[package]
name = "model-replay"
description = "Record and replay for tests, at two layers: typed turn cassettes (a replaying provider and a recording wrapper) and wire cassettes recorded and replayed at the Transport seam, both over an injected sink."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/stoker"
publish = false

[dependencies]
model-http = {path = "../model-http"}
model-provider = {path = "../model-provider"}
speech-provider = {path = "../speech-provider"}
vision-prep = {path = "../vision-prep"}
blake3 = {version = "1"}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
thiserror = {version = "2"}

[dev-dependencies]
model-provider = {path = "../model-provider", features = ["testing"]}
proptest = {version = "1"}


[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
