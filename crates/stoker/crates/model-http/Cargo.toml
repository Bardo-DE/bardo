[package]
name = "model-http"
description = "HTTP for model endpoints over TCP, Unix sockets and TLS: targets, auth, pure SSE and NDJSON decoders, the client seam, and a reqwest client behind a feature."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/stoker"
publish = false

[features]
# The reqwest client behind `Transport for HttpClient`. Off by default so that the codecs (which
# depend on this crate for the seam types) reach no HTTP stack and no runtime; a daemon turns it
# on.
client = ["dep:reqwest", "dep:tokio"]
# TLS for `HttpTarget::Tls`: reqwest's rustls on the ring provider (installed here, never
# aws-lc), the platform's roots. Off by default (a consumer opts in); without it a `Tls` target
# answers `HttpError::Tls`.
tls = ["client", "reqwest/rustls-no-provider", "dep:rustls"]

[dependencies]
serde = {version = "1", features = ["derive"]}
zeroize = {version = "1"}
thiserror = {version = "2"}
reqwest = {version = "0.13", default-features = false, optional = true}
rustls = {version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true}
tokio = {version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"], optional = true}

[dev-dependencies]
rcgen = {version = "0.13", default-features = false, features = ["ring", "pem"]}
tokio-rustls = {version = "0.26", default-features = false, features = ["ring", "logging", "tls12"]}
rustls-pki-types = {version = "1"}
proptest = {version = "1"}
tokio = {version = "1", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"]}
serde_json = {version = "1"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
