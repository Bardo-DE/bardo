[package]
name = "engine-manifest"
description = "The engines that run models on this computer (llama.cpp, vLLM, Strata) as data: a pinned manifest of what to download for which hardware, the host value that picks a row, the distro packages, the tree seal's line format and the failure codes of an install. Pure: no disk, no network, no runtime."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/stoker"
publish = false

[dependencies]
engine-spec = {path = "../engine-spec"}
model-catalog = {path = "../model-catalog"}
serde_json = {version = "1"}
sha2 = {version = "0.10"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
