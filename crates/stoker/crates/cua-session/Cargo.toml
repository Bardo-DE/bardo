[package]
name = "cua-session"
description = "The model side of one computer-use step: prompt assembly, parse with one repair, and mapping into window space. Pure."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/stoker"
publish = false

[dependencies]
cua-action = {path = "../cua-action"}
vision-prep = {path = "../vision-prep"}
model-provider = {path = "../model-provider"}
cua-parse = {path = "../cua-parse"}
cua-vendors = {path = "../cua-vendors"}
serde_json = {version = "1"}

[dev-dependencies]
model-provider = {path = "../model-provider", features = ["testing"]}
model-http = {path = "../model-http"}
model-wire = {path = "../model-wire"}
model-replay = {path = "../model-replay"}
model-openai-compat = {path = "../model-openai-compat"}
base64 = {version = "0.22"}
proptest = {version = "1"}


[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
