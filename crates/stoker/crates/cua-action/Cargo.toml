[package]
name = "cua-action"
description = "The provider-neutral computer-use action vocabulary: typed coordinate spaces, CuaAction, keys, bounded text, dialect names."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/stoker"
publish = false

[dependencies]
serde = {version = "1", features = ["derive"]}
thiserror = {version = "2"}
keyboard-types = {version = "0.7", features = ["serde"]}

[dev-dependencies]
serde_json = {version = "1"}


[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
