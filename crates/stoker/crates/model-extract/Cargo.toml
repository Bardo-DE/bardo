[package]
name = "model-extract"
description = "Structured extraction as a pure machine: choose how to ask a model for a typed output, build the request, absorb the reply, repair once, or fail. No I/O."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/stoker"
publish = false

[dependencies]
model-provider = {path = "../model-provider"}
serde_json = {version = "1"}

[dev-dependencies]
cua-action = {path = "../cua-action"}
vision-prep = {path = "../vision-prep"}
proptest = {version = "1"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
