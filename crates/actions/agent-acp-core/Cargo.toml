[package]
name = "agent-acp-core"
description = "Our own rules for the Agent Client Protocol, pure: path confinement, the protocol errors, the gate's ruling on permission requests, taint, strikes, the tool-request mapping, the names of calls, what an agent reports, why a start failed, and the court seam. No connection, no IO, no clock and no wording; the connections are the official agent-client-protocol SDK's, in bardo-agent-acp and agent-acp-host."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-ids = { path = "../../base/base-ids" }
agent-client-protocol = { workspace = true }
base-path = { path = "../../base/base-path" }
companion-model = {path = "../companion-model"}
action-core = {path = "../action-core"}
action-manifest = {path = "../action-manifest"}
permission-core = {path = "../permission-core"}
action-vocab = {path = "../action-vocab"}
agent-session = {path = "../agent-session"}
model-provider = {path = "../../models/model-provider"}
iso_currency = { workspace = true, features = ["with-serde"] }
rust_decimal = { workspace = true, features = ["std", "serde"] }
provenance = {path = "../../provenance/provenance"}
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
