[package]
name = "agent-inapp"
description = "The portable in-app agent: the router, policy point, reviewer and agent loop hosted inside one app over that app's own IntentProvider, with the app's own confirm sheet. No intentd, no bus, no daemon."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
action-review = {path = "../action-review"}
agent-loop = {path = "../agent-loop"}
companion-wire = {path = "../companion-wire"}
memory-core = {path = "../../memory/memory-core"}
action-client = {path = "../action-client", default-features = false, features = ["in_process"]}
permission-core = {path = "../permission-core"}
action-provider = {path = "../action-provider"}
action-core = {path = "../action-core"}
action-wire = {path = "../action-wire"}
action-manifest = {path = "../action-manifest"}
action-vocab = {path = "../action-vocab"}
action-host = {path = "../action-host"}
futures-channel = { workspace = true, features = ["std"] }
futures-util = { workspace = true, features = ["std"] }
companion-memory = {path = "../companion-memory"}
companion-memory-core = {path = "../companion-memory-core"}
agent-models = {path = "../agent-models"}
agent-planner = {path = "../agent-planner"}
agent-reader = {path = "../agent-reader"}
action-context = {path = "../action-context"}
action-router = {path = "../action-router"}
agent-session = {path = "../agent-session"}
agent-skills = {path = "../agent-skills"}
agent-skills-disk = {path = "../agent-skills-disk"}
action-store = {path = "../action-store"}
companion-tasks = {path = "../companion-tasks"}
permission-policy = {path = "../permission-policy"}
inference-client = {path = "../../inference/inference-client"}
account-core = {path = "../../accounts/account-core"}
provenance = {path = "../../provenance/provenance"}
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
account-capability = {path = "../../accounts/account-capability"}
account-match = {path = "../../accounts/account-match"}
account-wire = {path = "../../accounts/account-wire"}
base-ids = { path = "../../base/base-ids" }
sandbox = {path = "../../sandbox/sandbox"}
computer-use-action = {path = "../../computer-use/computer-use-action"}
action-fake = {path = "../action-fake"}
inference-core = {path = "../../inference/inference-core"}
serde_json = { workspace = true }
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
tempfile = { workspace = true }
memory-client = {default-features = false, features = ["in_process"], path = "../../memory/memory-client"}
memory-fake = {path = "../../memory/memory-fake"}
memory-service = {path = "../../memory/memory-service"}

[lints]
workspace = true
