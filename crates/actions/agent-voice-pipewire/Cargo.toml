[package]
name = "agent-voice-pipewire"
description = "The PipeWire backend of the agent-voice-audio device: capture from one physical source node, playback on the default output, and the default-source metadata reader. Needs libpipewire and libclang to build."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
agent-voice-audio = {path = "../agent-voice-audio"}
pipewire = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[lints]
workspace = true
