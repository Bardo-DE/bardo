[package]
name = "action-router"
description = "The pure router: `Router` and the seams the daemon passes in, over action-context (what it remembers) and action-gate (the pure steps of a call)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
account-ids = {path = "../../accounts/account-ids"}
companion-model = {path = "../companion-model"}
action-checkpoint = {path = "../action-checkpoint"}
action-context = {path = "../action-context"}
action-core = {path = "../action-core"}
action-gate = {path = "../action-gate"}
action-wire = {path = "../action-wire"}
action-gate-wire = {path = "../action-gate-wire"}
action-manifest = {path = "../action-manifest", features = ["manifest-file"]}
permission-core = {path = "../permission-core"}
action-vocab = {path = "../action-vocab"}
agent-session = {path = "../agent-session"}
agent-skills = {path = "../agent-skills"}
permission-policy = {path = "../permission-policy"}
action-review = {path = "../action-review"}
provenance = {path = "../../provenance/provenance"}
account-core = {path = "../../accounts/account-core"}
memory-core = {path = "../../memory/memory-core"}
thiserror = { workspace = true }
serde_json = { workspace = true }
futures-util = { workspace = true, features = ["std"] }
tracing = { workspace = true }

[dev-dependencies]
sandbox = {path = "../../sandbox/sandbox"}
model-provider = {path = "../../models/model-provider"}
toml = { workspace = true }
rust_decimal = { workspace = true, features = ["std", "serde"] }
agent-session = {path = "../agent-session", features = ["testing"]}
action-fake = {path = "../action-fake"}
action-provider = {path = "../action-provider"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
proptest = { workspace = true }
computer-use-action = {path = "../../computer-use/computer-use-action"}

[lints]
workspace = true
