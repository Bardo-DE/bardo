[package]
name = "agent-launch"
description = "Starts the external coding agents (Claude Code, Gemini CLI) that agent-acp-host drives: the agents.toml config, the sandboxed process behind the Spawn seam, the model endpoint (inferd, P4) or the key handoff (P2) from the accounts service, the login the agent runs itself, and the duties of a launcher (register, sessions, revocations, give back what was lent). The `dbus` feature adds the real accountd and inferd link."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# The real the accounts link: accountd's launcher interface and inferd's agent endpoints over the bus.
dbus = [
  "dep:account-client", "dep:account-client-dbus", "dep:account-dbus", "dep:account-wire", "dep:inference-dbus",
  "dep:zbus",
]

[lib]
name = "agent_launch"
path = "src/lib.rs"

[dependencies]
account-capability = {path = "../../accounts/account-capability"}
agent-client-protocol = { workspace = true }
agent-registry = {path = "../agent-registry"}
companion-model = {path = "../companion-model"}
agent-acp-server = {path = "../agent-acp-server"}
# `fake` is public (`agent_launch::fake`), and builds on the host's in-memory pipe.
agent-acp-host = {path = "../agent-acp-host", features = ["testing"]}
action-core = {path = "../action-core"}
permission-core = {path = "../permission-core"}
action-store = {path = "../action-store"}
base-path = { path = "../../base/base-path" }
sandbox = {path = "../../sandbox/sandbox"}
fnv = { workspace = true }
account-client = {optional = true, path = "../../accounts/account-client"}
account-client-dbus = {optional = true, path = "../../accounts/account-client-dbus"}
account-core = {path = "../../accounts/account-core"}
account-dbus = {optional = true, path = "../../accounts/account-dbus"}
account-wire = {optional = true, path = "../../accounts/account-wire"}
inference-dbus = {optional = true, path = "../../inference/inference-dbus"}
provenance = {path = "../../provenance/provenance"}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = {workspace = true, features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"]}
toml = { workspace = true }
tracing = { workspace = true }
zbus = {workspace = true, features = ["tokio"], optional = true}

[dev-dependencies]
action-manifest = {path = "../action-manifest"}
action-vocab = {path = "../action-vocab"}
agent-acp-core = {path = "../agent-acp-core"}
serde_json = { workspace = true }
tempfile = { workspace = true }
base-testkit = {path = "../../base/base-testkit", features = ["dbus"]}
action-settings = {path = "../action-settings"}
agent-session = {path = "../agent-session"}

[lints]
workspace = true
