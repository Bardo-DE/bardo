[package]
name = "agent-launch"
description = "Starts the external coding agents (Claude Code, Gemini CLI) that agent-acp-host drives: the agents.toml config, the sandboxed process behind the Spawn seam, the model endpoint (inferd, P4) or the key handoff (P2) from porter, the login the agent runs itself, and the duties of a launcher (register, sessions, revocations, give back what was lent). The `dbus` feature adds the real accountd and inferd link."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/docket"
publish = false

[features]
default = []
# The real porter link: accountd's launcher interface and inferd's agent endpoints over the bus.
dbus = [
  "dep:account-client", "dep:account-client-dbus", "dep:account-dbus", "dep:account-wire", "dep:inference-dbus",
  "dep:zbus",
]

[lib]
name = "agent_launch"
path = "src/lib.rs"

[dependencies]
account-capability = {path = "../../accounts/account-capability"}
agent-client-protocol = {version = "3.5", default-features = false}
agent-registry = {path = "../agent-registry"}
companion-model = {path = "../companion-model"}
agent-acp-server = {path = "../agent-acp-server"}
# `fake` is public (`docket_launch::fake`), and builds on the host's in-memory pipe.
agent-acp-host = {path = "../agent-acp-host", features = ["testing"]}
action-core = {path = "../action-core"}
permission-core = {path = "../permission-core"}
action-store = {path = "../action-store"}
agent-session = {path = "../agent-session"}
action-settings = {path = "../action-settings"}
sandbox = {path = "../../sandbox/sandbox"}
fnv = {version = "1"}
account-client = {optional = true, path = "../../accounts/account-client"}
account-client-dbus = {optional = true, path = "../../accounts/account-client-dbus"}
account-core = {path = "../../accounts/account-core"}
account-dbus = {optional = true, path = "../../accounts/account-dbus"}
account-wire = {optional = true, path = "../../accounts/account-wire"}
inference-dbus = {optional = true, path = "../../inference/inference-dbus"}
provenance = {path = "../../provenance/provenance"}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
thiserror = {version = "2"}
tokio = {version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"]}
toml = {version = "1"}
tracing = {version = "0.1"}
zbus = {version = "5.19", default-features = false, features = ["tokio"], optional = true}

[dev-dependencies]
action-manifest = {path = "../action-manifest"}
action-vocab = {path = "../action-vocab"}
agent-acp-core = {path = "../agent-acp-core"}
action-testbus = {path = "../action-testbus"}
serde_json = {version = "1"}
tempfile = {version = "3"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
