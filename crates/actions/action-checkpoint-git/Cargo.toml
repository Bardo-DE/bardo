[package]
name = "action-checkpoint-git"
description = "The git store of restore points: a hidden commit of the workspace per point, made through a private index and kept under a ref of the actions service's own. git runs as a process behind the GitRun seam; nothing here touches the person's index, branches or stash."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-ids = { path = "../../base/base-ids" }
base-time = { path = "../../base/base-time" }
base-path = { path = "../../base/base-path" }
action-checkpoint = {path = "../action-checkpoint"}
action-core = {path = "../action-core"}
percent-encoding = { workspace = true }
provenance = {path = "../../provenance/provenance"}
thiserror = { workspace = true }
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
tracing = { workspace = true }

[dev-dependencies]
action-checkpoint = {path = "../action-checkpoint", features = ["testing"]}
base-testkit = {path = "../../base/base-testkit"}

[lints]
workspace = true
