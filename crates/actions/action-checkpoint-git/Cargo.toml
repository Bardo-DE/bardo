[package]
name = "action-checkpoint-git"
description = "The git store of restore points: a hidden commit of the workspace per point, made through a private index and kept under a ref of docket's own. git runs as a process behind the GitRun seam; nothing here touches the person's index, branches or stash."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
account-ids = {path = "../../accounts/account-ids"}
sandbox = {path = "../../sandbox/sandbox"}
action-checkpoint = {path = "../action-checkpoint"}
action-core = {path = "../action-core"}
percent-encoding = { workspace = true }
account-core = {path = "../../accounts/account-core"}
provenance = {path = "../../provenance/provenance"}
thiserror = { workspace = true }
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
tracing = { workspace = true }

[dev-dependencies]
action-checkpoint = {path = "../action-checkpoint", features = ["testing"]}
tempfile = { workspace = true }

[lints]
workspace = true
