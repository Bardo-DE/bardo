[package]
name = "agent-acp-host"
description = "The ACP client edge: an external coding agent (Claude Code, Gemini CLI) is a session backend. `AcpBackend` speaks the Agent Client Protocol as the client, on the official agent-client-protocol SDK's client role, over a `Spawn` seam; every call the agent makes is formed, confined and ruled by the router (`Court`, `IntentsCourt` over action-client) before the `Performer` acts. The IO under it: files and the working directory, the agent's tool socket, the sandboxed terminals (the agent sandbox), the agent apps of the helpers. Our own ACP rules are `agent-acp-core`; the server edge (an editor drives us) is `bardo-agent-acp`; the process that starts agents is `agent-launch`. The `testing` feature adds the in-memory pipe, scripted spawner and file map."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `fake`: an in-memory pipe, a scripted `Spawn` and a file system in a map, for tests of this crate
# and of the launcher.
testing = []

[lib]
name = "agent_acp_host"
path = "src/lib.rs"

[dependencies]
agent-acp-core = {path = "../agent-acp-core"}
action-tools = {path = "../action-tools"}
agent-client-protocol = { workspace = true }
base-path = { path = "../../base/base-path" }
base-xdg = { path = "../../base/base-xdg" }
sandbox = {path = "../../sandbox/sandbox"}
companion-model = {path = "../companion-model"}
const-hex = { workspace = true }
action-client = {path = "../action-client", default-features = false}
action-core = {path = "../action-core"}
action-wire = {path = "../action-wire"}
action-manifest = {path = "../action-manifest"}
permission-core = {path = "../permission-core"}
action-vocab = {path = "../action-vocab"}
action-procroot = {path = "../action-procroot"}
agent-session = {path = "../agent-session"}
action-store = {path = "../action-store"}
futures-channel = { workspace = true, features = ["std"] }
futures-util = { workspace = true, features = ["sink", "std"] }
getrandom = { workspace = true, features = ["std"] }
account-core = {path = "../../accounts/account-core"}
provenance = {path = "../../provenance/provenance"}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
tracing = { workspace = true }

[dev-dependencies]
base-ids = { path = "../../base/base-ids" }
action-review = {path = "../action-review"}
agent-acp-host = {path = ".", features = ["testing"]}
action-client = {path = "../action-client", default-features = false, features = ["in_process"]}
action-fake = {path = "../action-fake"}
action-host = {path = "../action-host"}
action-router = {path = "../action-router"}
agent-session = {path = "../agent-session", features = ["testing"]}
action-testbus = {path = "../action-testbus"}
jsonschema = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
