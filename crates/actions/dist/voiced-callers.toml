# Who may call bardo-voiced (org.bardo.Voice1), and as what. A caller is the systemd unit behind the bus
# connection (the bus names its process, /proc/<pid>/cgroup names the unit or app scope, and a
# service's role goes only to the unit's main process). Install as /etc/bardo/voiced-callers.toml;
# the user's ~/.config/bardo/actions/voiced-callers.toml is laid over it, and its fixed-role rows are ignored.
#
#   role "sheet_host" + an app voiced.toml lists as `shell` -> the shell: begins utterances and speech
#
# An app that an utterance is routed to attaches as the app its scope names; it has no row. A scope
# never carries a fixed role, so the shell is bardo-shell.service and nothing else.

[[caller]]
app = "org.bardo.Shell"
unit = "bardo-shell.service"
role = "sheet_host"
exe = ["/usr/bin/bardo-shell", "/usr/local/bin/bardo-shell", "/opt/bardo/releases/*/bin/bardo-shell"]
