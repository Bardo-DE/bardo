# Who may speak for the person to bardo-companiond (org.bardo.Companion1). A caller is the systemd unit
# behind the bus connection (the bus names its process, /proc/<pid>/cgroup names the unit, and a
# service's role goes only to the unit's main process). Install as /etc/bardo/companiond-callers.toml;
# the user's ~/.config/bardo/actions/companiond-callers.toml is laid over it, and its fixed-role rows are
# ignored (a scope never has one).
#
#   role "sheet_host" + app org.bardo.Shell -> the shell: opens, asks, closes, presses a card, tells a subagent
#   role "agent"      + app org.bardo.Acp   -> our editor bridge (bardo-agent-acp): reads the helpers and their
#                                              conversations, nothing else; its scope row names its program
#
# A terminal's child (`bardo-do ask`: a process in a vte-spawn-*, tmux-spawn-* or login session-* scope)
# is not a row: it may open, ask, close, cancel and read, nothing else. Everything else is refused.

[[caller]]
app = "org.bardo.Shell"
unit = "bardo-shell.service"
role = "sheet_host"
exe = ["/usr/bin/bardo-shell", "/usr/local/bin/bardo-shell", "/opt/bardo/releases/*/bin/bardo-shell"]

# Our own editor bridge, started by an editor in a scope of its own (`systemd-run --user --scope
# --unit=bardo-agent-acp`): a scope has no main process, so the row names the program it runs.
[[caller]]
app = "org.bardo.Acp"
unit = "bardo-agent-acp.scope"
role = "agent"
exe = ["/usr/bin/bardo-agent-acp", "/usr/local/bin/bardo-agent-acp", "/opt/bardo/releases/*/bin/bardo-agent-acp"]
