# bardo-actiond's configuration as the package ships it: $XDG_CONFIG_HOME/bardo/actions/actiond.toml (or
# /etc/xdg/bardo/actions/actiond.toml) replaces it whole. Which bus names play which role: the name is a
# well-known name the connection owns, or the app a nameless connection's cgroup scope names.
# `org.bardo.Do` is owned by no process: a nameless connection in a terminal's scope (vte-spawn-*,
# tmux-spawn-*, a login session-*) is named `org.bardo.Do` and plays `cli`. A terminal that runs in
# an app scope (konsole's `app-org.kde.konsole-<n>.scope`) is named after the app: list it under
# `cli` to let its children use bardo-do. the shell owns org.bardo.Shell (and
# org.bardo.Confirm1) and is the launcher, the only Confirm1 server bardo-actiond trusts, and the
# control centre. No reviewer models are named here: until the person chooses a set, a call that
# would be reviewed asks instead.
[roles]
launcher = ["org.bardo.Shell"]
# temor is a terminal that runs in an app scope: it plays `cli` itself (and watches the agents in its panes).
cli = ["org.bardo.Do", "org.bardo.Temor"]
companion = ["org.bardo.Companion1", "org.bardo.Acp"]
# bardo-agent-acp (an editor drives the companion over ACP; off unless agent.acp.expose = true) opens
# sessions and records the editor's turns as an editor, and its planner calls as the companion.
editor = ["org.bardo.Acp"]
# bardo-agent (the host of an external coding agent; off unless agent.acp.agents = true) opens the
# agent's session, records the person's prompts and makes the agent's file, command and permission
# calls, each ruled like any agent's.
acp_agent = ["org.bardo.AcpAgent"]
reader = ["org.bardo.Reader1"]
cua = ["org.bardo.ComputerUse1"]
mcp = ["org.bardo.ActionsMcp"]
confirm = ["org.bardo.Shell"]
control = ["org.bardo.Shell"]

[agent]
start_mode = "auto"
mass_at = 20
confirm_expiry = 120
confirm_proceed = 10000

[agent.budget]
calls = 200
writes = 100
outbound = 10
destructive = 5
per_minute = 30
fan_out = 50
chain = 4
wall = 1800
reviews = 300
spend = { amount = "0", currency = "USD" }

[agent.breaker]
consecutive = 3
recent = 10
window = 50
probing = 3

[agent.assembler]
rules = 2500
profile = 1200
roster = 400
episodes = 1200
recall = 1500
context = 1000
task = 3000
full_steps = 3

[agent.idle]
idle_after = 30
side_close = 120
