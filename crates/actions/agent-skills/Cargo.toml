[package]
name = "agent-skills"
description = "Skills: the instructions the desktop ships for the companion. Parses and validates skill.toml and SKILL.md, discovers installed skills from directories it is handed, checks them against the registered manifests and picks which to show. Pure: directories are read through a folder the caller injects; no authority."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-xdg = { path = "../../base/base-xdg" }
action-core = {path = "../action-core"}
action-manifest = {path = "../action-manifest"}
action-vocab = {path = "../action-vocab"}
account-core = {path = "../../accounts/account-core"}
provenance = {path = "../../provenance/provenance"}
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
