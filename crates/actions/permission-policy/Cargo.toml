[package]
name = "permission-policy"
description = "The policy point: the Cedar schema and default policies, the request shape, and the four rulings a request can get."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/docket"
publish = false

[dependencies]
account-ids = {path = "../../accounts/account-ids"}
action-core = {path = "../action-core"}
action-manifest = {path = "../action-manifest"}
permission-core = {path = "../permission-core"}
action-vocab = {path = "../action-vocab"}
provenance = {path = "../../provenance/provenance"}
account-core = {path = "../../accounts/account-core"}
cedar-policy = {version = "4.13"}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
thiserror = {version = "2"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
