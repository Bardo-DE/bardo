[package]
name = "action-review"
description = "The reviewer that may only tighten: the stripped review request, the cascade and its plan, `tighten`, the denial breaker, and the model-backed reviewer over porter-infer."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/docket"
publish = false

[dependencies]
account-capability = {path = "../../accounts/account-capability"}
account-ids = {path = "../../accounts/account-ids"}
action-core = {path = "../action-core"}
action-manifest = {path = "../action-manifest"}
permission-core = {path = "../permission-core"}
action-vocab = {path = "../action-vocab"}
provenance = {path = "../../provenance/provenance"}
account-core = {path = "../../accounts/account-core"}
inference-core = {path = "../../inference/inference-core"}
model-provider = {path = "../../models/model-provider"}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
thiserror = {version = "2"}

[dev-dependencies]
proptest = {version = "1"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
