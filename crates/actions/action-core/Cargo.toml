[package]
name = "action-core"
description = "docket's vocabulary above action-vocab and action-manifest: context, previews, calls, refusals, undo, confirmation, budgets, the planner and reader contract, the roster, audit records, and the memory and event-log seams (`MemoryLink`, `EventSink`). Ids, units, values and the `Clock` seam are in action-vocab; the manifest, its validation and the JSON argument reader are in action-manifest."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
account-capability = {path = "../../accounts/account-capability"}
base-ids = { path = "../../base/base-ids" }
base-time = { path = "../../base/base-time" }
base-secret = { path = "../../base/base-secret" }
companion-model = {path = "../companion-model"}
action-manifest = {path = "../action-manifest"}
permission-core = {path = "../permission-core"}
action-vocab = {path = "../action-vocab"}
account-core = {path = "../../accounts/account-core"}
inference-core = {path = "../../inference/inference-core"}
provenance = {path = "../../provenance/provenance"}
memory-core = {path = "../../memory/memory-core"}
model-provider = {path = "../../models/model-provider"}
rust_decimal = { workspace = true, features = ["std", "serde"] }
iso_currency = { workspace = true, features = ["with-serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
