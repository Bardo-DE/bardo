[package]
name = "action-core"
description = "docket's vocabulary above docket-vocab and docket-manifest: context, previews, calls, refusals, undo, confirmation, budgets, the planner and reader contract, the roster, audit records, and the memory and event-log seams (`MemoryLink`, `EventSink`). Ids, units, values and the `Clock` seam are in docket-vocab; the manifest, its validation and the JSON argument reader are in docket-manifest."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/docket"
publish = false

[dependencies]
account-capability = {path = "../../accounts/account-capability"}
account-ids = {path = "../../accounts/account-ids"}
companion-model = {path = "../companion-model"}
action-manifest = {path = "../action-manifest"}
permission-core = {path = "../permission-core"}
action-vocab = {path = "../action-vocab"}
account-core = {path = "../../accounts/account-core"}
inference-core = {path = "../../inference/inference-core"}
provenance = {path = "../../provenance/provenance"}
memory-core = {path = "../../memory/memory-core"}
model-provider = {path = "../../models/model-provider"}
rust_decimal = {version = "1", default-features = false, features = ["std", "serde"]}
iso_currency = {version = "0.7", features = ["with-serde"]}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
thiserror = {version = "2"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
