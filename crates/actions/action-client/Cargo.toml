[package]
name = "action-client"
description = "The caller side of org.bardo.Intents1 (Intents over a Transport: D-Bus behind the dbus feature, or the router in process behind in_process)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
companion-model = {path = "../companion-model"}
action-core = {path = "../action-core"}
action-wire = {path = "../action-wire"}
action-gate-wire = {path = "../action-gate-wire"}
action-manifest = {path = "../action-manifest"}
permission-core = {path = "../permission-core"}
action-vocab = {path = "../action-vocab"}
action-router = {path = "../action-router", optional = true}
action-dbus = {path = "../action-dbus", optional = true}
futures-util = { workspace = true, features = ["std"], optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
zbus = {workspace = true, features = ["tokio"], optional = true}
provenance = {path = "../../provenance/provenance"}
thiserror = { workspace = true }

[dev-dependencies]
computer-use-action = {path = "../../models/computer-use-action"}
computer-use-geometry = {path = "../../models/computer-use-geometry"}
action-fake = {path = "../action-fake"}
account-core = {path = "../../accounts/account-core"}
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[features]
# The app-level desktop switch (Bardo design/36): on by default so a consumer outside the
# workspace is unchanged; the workspace declares the crate with `default-features = false` and
# each desktop crate names `dbus`. `desktop` is implied by the crate having a D-Bus client.
default = ["desktop"]
desktop = ["dbus"]
# The D-Bus transport (Linux, the desktop's actiond).
dbus = ["dep:action-dbus", "dep:futures-util", "dep:serde", "dep:serde_json", "dep:zbus"]
# `InProcess`: the router in the caller's own process. Off by default so a client (the computer-use daemon, an app)
# never links the router, and with it cedar and permission-policy.
in_process = ["dep:action-router"]

[lints]
workspace = true
