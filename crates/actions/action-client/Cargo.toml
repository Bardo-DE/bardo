[package]
name = "action-client"
description = "The caller side of org.bardo.Intents1 (Intents over a Transport: D-Bus behind the dbus feature, or the router in process behind in_process)."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/docket"
publish = false

[dependencies]
companion-model = {path = "../companion-model"}
action-core = {path = "../action-core"}
action-wire = {path = "../action-wire"}
action-gate-wire = {path = "../action-gate-wire"}
action-manifest = {path = "../action-manifest"}
permission-core = {path = "../permission-core"}
action-vocab = {path = "../action-vocab"}
action-router = {path = "../action-router", optional = true}
action-dbus = {path = "../action-dbus", optional = true}
futures-util = {version = "0.3", default-features = false, features = ["std"], optional = true}
serde = {version = "1", features = ["derive"], optional = true}
serde_json = {version = "1", optional = true}
zbus = {version = "5.19", default-features = false, features = ["tokio"], optional = true}
provenance = {path = "../../provenance/provenance"}
thiserror = {version = "2"}

[dev-dependencies]
computer-use-action = {path = "../../computer-use/computer-use-action"}
action-fake = {path = "../action-fake"}
account-core = {path = "../../accounts/account-core"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[features]
# The app-level desktop switch (quire design/36): on by default so a consumer outside the
# workspace is unchanged; the workspace declares the crate with `default-features = false` and
# each desktop crate names `dbus`. `quire-desktop` is implied by the crate having a D-Bus client.
default = ["quire-desktop"]
quire-desktop = ["dbus"]
# The D-Bus transport (Linux, the desktop's intentd).
dbus = ["dep:action-dbus", "dep:futures-util", "dep:serde", "dep:serde_json", "dep:zbus"]
# `InProcess`: the router in the caller's own process. Off by default so a client (cuad, an app)
# never links the router, and with it cedar and permission-policy.
in_process = ["dep:action-router"]

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
