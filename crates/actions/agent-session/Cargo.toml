[package]
name = "agent-session"
description = "The durable session, portable and pure: `SessionEntry` (the append-only log of one session), `resume_plan` (entries in, a typed plan out), `fork`, `export`, a reader for the records companiond wrote before, and the `SessionBackend`, `SessionHost` and `SessionLog` seams. No bus, no runtime, no clock read."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/docket"
publish = false

[features]
# Test code: the backend contract suite (`contract`, which asserts by panicking) and the fakes
# (`fake`, `fake_host`). Only the dev-dependencies of crates whose tests use them turn it on.
testing = []

[dependencies]
account-capability = {path = "../../accounts/account-capability"}
account-ids = {path = "../../accounts/account-ids"}
companion-model = {path = "../companion-model"}
companion-wire = {path = "../companion-wire"}
action-core = {path = "../action-core"}
action-wire = {path = "../action-wire"}
permission-core = {path = "../permission-core"}
action-vocab = {path = "../action-vocab"}
account-core = {path = "../../accounts/account-core"}
model-provider = {path = "../../models/model-provider"}
provenance = {path = "../../provenance/provenance"}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
thiserror = {version = "2"}

[dev-dependencies]
agent-session = {path = ".", features = ["testing"]}
memory-core = {path = "../../memory/memory-core"}
proptest = {version = "1"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
