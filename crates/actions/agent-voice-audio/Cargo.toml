[package]
name = "agent-voice-audio"
description = "The audio device seam, pure: the node model, the capture choice (never a monitor), the capture and playback traits, and a scripted fake behind the testing feature."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
futures-util = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }

[features]
# `FakeAudioDevice`, a device that plays scripted frames, for tests.
testing = []

[dev-dependencies]
# The tests play the fake device, so they build the crate with its `testing` feature on.
agent-voice-audio = {path = ".", features = ["testing"]}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[lints]
workspace = true
