[package]
name = "agent-install"
description = "Installs coding agents from the agent registry: fetch a pinned version, check it against its digest, unpack it into a directory the actions service owns, and read and write the records kept there. The values are agent-registry. Nothing here runs an agent, and the network is reached only by the install and update commands."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "agent_install"
path = "src/lib.rs"

[[bin]]
name = "bardo-agents"
path = "src/main.rs"

[dependencies]
agent-registry = {path = "../agent-registry"}
clap = {workspace = true, features = ["derive", "std", "help", "usage", "error-context"]}
action-store = {path = "../action-store"}
base-url = { path = "../../base/base-url" }
http-core = {path = "../../network/http-core"}
http-reqwest = {path = "../../network/http-reqwest"}
flate2 = {workspace = true, features = ["default"]}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tar = {workspace = true, features = ["default"]}
thiserror = { workspace = true }
zip = { workspace = true, features = ["deflate-flate2"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
