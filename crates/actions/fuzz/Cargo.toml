[package]
name = "actions-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

# Not part of the actions workspace and not part of its gate: libFuzzer needs a nightly toolchain
# and `cargo-fuzz`. Run it with `dev/fuzz.sh`.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
toml = "1"
action-review = { path = "../action-review" }
agent-loop = { path = "../agent-loop" }
companion-wire = { path = "../companion-wire" }
action-core = { path = "../action-core" }
action-manifest = { path = "../action-manifest" }
permission-core = { path = "../permission-core" }
action-vocab = { path = "../action-vocab" }
action-eval = { path = "../action-eval" }
action-fake = { path = "../action-fake" }
action-eval-core = { path = "../action-eval-core" }
provenance = { git = "https://github.com/Bardo-DE/prov", rev = "5106c0c2f502711411ba82c72b32c7e543b9cc4d" }
speech-wire = { path = "../../speech/speech-wire" }

[[bin]]
name = "parse_verdict"
path = "fuzz_targets/parse_verdict.rs"
test = false
doc = false

[[bin]]
name = "tool_args"
path = "fuzz_targets/tool_args.rs"
test = false
doc = false

[[bin]]
name = "unframe"
path = "fuzz_targets/unframe.rs"
test = false
doc = false

[[bin]]
name = "companion_wire"
path = "fuzz_targets/companion_wire.rs"
test = false
doc = false

[[bin]]
name = "leaked_call"
path = "fuzz_targets/leaked_call.rs"
test = false
doc = false

[[bin]]
name = "case_files"
path = "fuzz_targets/case_files.rs"
test = false
doc = false
