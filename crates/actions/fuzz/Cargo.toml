[package]
name = "actions-fuzz"
description = "Developer tool: libFuzzer targets for the actions service's parsers of model and peer output."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
action-review = { path = "../action-review" }
agent-loop = { path = "../agent-loop" }
companion-wire = { path = "../companion-wire" }
action-manifest = { path = "../action-manifest" }
permission-core = { path = "../permission-core" }
action-vocab = { path = "../action-vocab" }
action-eval = { path = "../action-eval" }
action-fake = { path = "../action-fake" }
action-eval-core = { path = "../action-eval-core" }
provenance = { path = "../../provenance/provenance" }
speech-wire = { path = "../../speech/speech-wire" }

[[bin]]
name = "parse_verdict"
path = "fuzz_targets/parse_verdict.rs"
test = false
doc = false

[[bin]]
name = "tool_args"
path = "fuzz_targets/tool_args.rs"
test = false
doc = false

[[bin]]
name = "unframe"
path = "fuzz_targets/unframe.rs"
test = false
doc = false

[[bin]]
name = "companion_wire"
path = "fuzz_targets/companion_wire.rs"
test = false
doc = false

[[bin]]
name = "leaked_call"
path = "fuzz_targets/leaked_call.rs"
test = false
doc = false

[[bin]]
name = "case_files"
path = "fuzz_targets/case_files.rs"
test = false
doc = false

[lints]
workspace = true
