[package]
name = "action-eval"
description = "The red-team suite runner: reads the corpus and attack files, plays the cases over action-fake, and checks an app against the conformance rules. The case format, judgement and scores are in action-eval-core."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "agent-eval"
path = "src/main.rs"

[dependencies]
account-ids = {path = "../../accounts/account-ids"}
action-review = {path = "../action-review"}
action-fake = {path = "../action-fake"}
action-core = {path = "../action-core"}
action-wire = {path = "../action-wire"}
action-manifest = {path = "../action-manifest", features = ["manifest-file"]}
permission-core = {path = "../permission-core"}
action-vocab = {path = "../action-vocab"}
agent-skills = {path = "../agent-skills"}
agent-skills-disk = {path = "../agent-skills-disk"}

action-eval-core = {path = "../action-eval-core"}
action-context = {path = "../action-context"}
action-router = {path = "../action-router"}
provenance = {path = "../../provenance/provenance"}
account-core = {path = "../../accounts/account-core"}
clap = {version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"]}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
