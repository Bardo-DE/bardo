[package]
name = "agent-voice-loop"
description = "The voice step machines, pure: one utterance (the mic is open only in three states), speech output with barge-in, the sentencer and the audio buffer."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/docket"
publish = false

[dependencies]
agent-voice-wire = {path = "../agent-voice-wire"}
account-core = {path = "../../accounts/account-core"}
action-wire = {path = "../action-wire"}
inference-core = {path = "../../inference/inference-core"}
speech-provider = {path = "../../speech/speech-provider"}
serde = {version = "1", features = ["derive"]}

[dev-dependencies]
account-capability = {path = "../../accounts/account-capability"}
serde_json = {version = "1"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
