[package]
name = "action-wire"
description = "The wire of the actions service's `org.bardo.Intents1`: every request and reply and the bodies they carry, who is calling and the member a request is, where a conversation was started from, the opening of a session and the ledger of a task, and summoning the companion. Sits above action-core and action-gate-wire."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-ids = { path = "../../base/base-ids" }
memory-core = {path = "../../memory/memory-core"}
companion-model = {path = "../companion-model"}
action-core = {path = "../action-core"}
action-gate-wire = {path = "../action-gate-wire"}
action-manifest = {path = "../action-manifest"}
permission-core = {path = "../permission-core"}
action-vocab = {path = "../action-vocab"}
account-core = {path = "../../accounts/account-core"}
provenance = {path = "../../provenance/provenance"}
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }

[dev-dependencies]
computer-use-action = {path = "../../models/computer-use-action"}
computer-use-geometry = {path = "../../models/computer-use-geometry"}
serde_json = { workspace = true }

[lints]
workspace = true
