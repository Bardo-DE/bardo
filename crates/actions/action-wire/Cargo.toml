[package]
name = "action-wire"
description = "The wire of docket's `org.bardo.Intents1`: every request and reply and the bodies they carry, who is calling and the member a request is, where a conversation was started from, the opening of a session and the ledger of a task, and summoning the companion. Sits above action-core and action-gate-wire."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/docket"
publish = false

[dependencies]
account-ids = {path = "../../accounts/account-ids"}
memory-core = {path = "../../memory/memory-core"}
companion-model = {path = "../companion-model"}
action-core = {path = "../action-core"}
action-gate-wire = {path = "../action-gate-wire"}
action-manifest = {path = "../action-manifest"}
permission-core = {path = "../permission-core"}
action-vocab = {path = "../action-vocab"}
account-core = {path = "../../accounts/account-core"}
provenance = {path = "../../provenance/provenance"}
serde = {version = "1", features = ["derive"]}
thiserror = {version = "2"}

[dev-dependencies]
computer-use-action = {path = "../../computer-use/computer-use-action"}
serde_json = {version = "1"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
