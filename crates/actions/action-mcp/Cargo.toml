[package]
name = "action-mcp"
description = "The MCP edge: an MCP server generated from the registry's offered actions, every call through the router as Actor::Mcp with untrusted arguments. Off by default; the binary serves it over stdio or a Unix socket."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "action_mcp"
path = "src/lib.rs"

[[bin]]
name = "bardo-actions-mcp"
path = "src/main.rs"

[dependencies]
dbus-kit = { path = "../../bus/dbus-kit" }
action-tools = {path = "../action-tools"}
action-core = {path = "../action-core"}
action-client = {path = "../action-client", default-features = false, features = ["dbus"]}
action-dbus = {path = "../action-dbus"}
action-manifest = {path = "../action-manifest"}
action-settings = {path = "../action-settings"}
provenance = {path = "../../provenance/provenance"}
account-core = {path = "../../accounts/account-core"}
rmcp = { workspace = true, features = ["server", "transport-io"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
toml = { workspace = true }
tracing = { workspace = true }
zbus = {workspace = true, features = ["tokio"]}

[dev-dependencies]
permission-core = {path = "../permission-core"}
action-vocab = {path = "../action-vocab"}
action-dbus = {path = "../action-dbus", features = ["fixture-callers"]}
action-testbus = {path = "../action-testbus"}
action-daemon = { path = "../action-daemon" }
tempfile = { workspace = true }
action-client = {path = "../action-client", default-features = false, features = ["in_process"]}
action-fake = {path = "../action-fake"}
action-router = {path = "../action-router"}
rmcp = { workspace = true, features = ["client", "server", "transport-io"] }
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
action-wire = {path = "../action-wire"}

[lints]
workspace = true
