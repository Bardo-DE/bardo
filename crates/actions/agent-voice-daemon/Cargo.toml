[package]
name = "agent-voice-daemon"
description = "The voice daemon: the only process that opens the microphone, serves org.quire.Voice1, and runs the voice machines. The audio device is the voice-audio seam; the PipeWire backend is voice-pipewire."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/docket"
publish = false

[dependencies]
account-match = {path = "../../accounts/account-match"}
account-capability = {path = "../../accounts/account-capability"}
account-ids = {path = "../../accounts/account-ids"}
agent-voice-loop = {path = "../agent-voice-loop"}
agent-voice-audio = {path = "../agent-voice-audio"}
agent-voice-wire = {path = "../agent-voice-wire"}
agent-voice-dbus = {path = "../agent-voice-dbus"}
action-wire = {path = "../action-wire"}
account-core = {path = "../../accounts/account-core"}
inference-core = {path = "../../inference/inference-core"}
inference-client = {features = ["dbus"], path = "../../inference/inference-client"}
action-dbus = {path = "../action-dbus"}
action-procroot = {path = "../action-procroot"}
agent-voice-pipewire = {path = "../agent-voice-pipewire", optional = true}
futures-util = {version = "0.3", default-features = false, features = ["std"]}
speech-vad = {path = "../../speech/speech-vad"}
speech-provider = {path = "../../speech/speech-provider"}
zbus = {version = "5.19", default-features = false, features = ["tokio"]}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
clap = {version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"]}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
toml = {version = "1"}
thiserror = {version = "2"}
tracing = {version = "0.1"}
action-log = {path = "../action-log"}
zbus-ready = { path = "../../zbus-ready" }

[features]
default = ["pipewire"]
# `voice-pipewire`, the shipped audio backend (needs libpipewire and libclang to build). The
# daemon binary and the by-hand example need it; the library without it is the machines and
# `dictate`, so a test or another backend builds with `--no-default-features`.
pipewire = ["dep:agent-voice-pipewire"]

[[bin]]
name = "voiced"
path = "src/main.rs"
required-features = ["pipewire"]

[[example]]
name = "voice_capture_try"
required-features = ["pipewire"]

[dev-dependencies]
action-vocab = {path = "../action-vocab"}
action-dbus = {path = "../action-dbus", features = ["fixture-callers"]}
action-testbus = {path = "../action-testbus"}
inference-core = {features = ["testing"], path = "../../inference/inference-core"}
tempfile = {version = "3"}
futures-util = {version = "0.3", default-features = false, features = ["std"]}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
