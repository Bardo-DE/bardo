[package]
name = "agent-models"
description = "The models docket asks, portable: a porter-infer `Model` over any inferd-client Transport (`TransportModel`), the task-policy writer (`TransportWriter`) and the reviewer cascade's placeholder set. No bus, no runtime: intentd's `InferdModel` and `InferdWriter` are thin adapters over these."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/docket"
publish = false

[dependencies]
account-match = {path = "../../accounts/account-match"}
account-capability = {path = "../../accounts/account-capability"}
account-ids = {path = "../../accounts/account-ids"}
action-review = {path = "../action-review"}
action-core = {path = "../action-core"}
permission-core = {path = "../permission-core"}
action-vocab = {path = "../action-vocab"}
inference-client = {path = "../../inference/inference-client"}
account-core = {path = "../../accounts/account-core"}
inference-core = {path = "../../inference/inference-core"}
provenance = {path = "../../provenance/provenance"}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}

[dev-dependencies]
account-wire = {path = "../../accounts/account-wire"}
model-provider = {path = "../../models/model-provider"}
rust_decimal = {version = "1", default-features = false, features = ["std", "serde"]}
action-fake = {path = "../action-fake"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
# The scripted model transport of companiond's tests is included by path (one file, not a copy).
inference-client = {path = "../../inference/inference-client"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
