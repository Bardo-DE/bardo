[package]
name = "agent-models"
description = "The models docket asks, portable: a inference-core `Model` over any inference-client Transport (`TransportModel`), the task-policy writer (`TransportWriter`) and the reviewer cascade's placeholder set. No bus, no runtime: intentd's `InferdModel` and `InferdWriter` are thin adapters over these."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tracing = { workspace = true }
account-match = {path = "../../accounts/account-match"}
account-capability = {path = "../../accounts/account-capability"}
base-ids = { path = "../../base/base-ids" }
action-review = {path = "../action-review"}
action-core = {path = "../action-core"}
permission-core = {path = "../permission-core"}
action-vocab = {path = "../action-vocab"}
inference-client = {path = "../../inference/inference-client"}
account-core = {path = "../../accounts/account-core"}
inference-core = {path = "../../inference/inference-core"}
provenance = {path = "../../provenance/provenance"}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
account-wire = {path = "../../accounts/account-wire"}
model-provider = {path = "../../models/model-provider"}
rust_decimal = { workspace = true, features = ["std", "serde"] }
action-fake = {path = "../action-fake"}
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
# The scripted model transport of companiond's tests is included by path (one file, not a copy).
inference-client = {path = "../../inference/inference-client"}

[lints]
workspace = true
