[package]
name = "action-settings"
description = "actions's settings file ($XDG_CONFIG_HOME/actions/settings.toml, design/22 section 3.27): the key table, the lenient reader that falls back per key, the schema the Settings app draws, and where the file is found. Pure: reading the file and the agents records beside it is action-settings-fs."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
agent-registry = {path = "../agent-registry"}
action-core = {path = "../action-core"}
permission-core = {path = "../permission-core"}
action-vocab = {path = "../action-vocab"}
settings-store = { path = "../../settings/settings-store" }
model-types = {path = "../../models/model-types"}
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }

[lints]
workspace = true
