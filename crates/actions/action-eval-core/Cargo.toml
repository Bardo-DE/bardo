[package]
name = "action-eval-core"
description = "The red-team suite as values: the case and corpus format, the attack format, the pure judgement of a case, the Wilson interval, the metrics, the attack scores and the per-commit summary. No router, no Cedar, no file or clock reads."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-ids = { path = "../../base/base-ids" }
action-core = {path = "../action-core"}
permission-core = {path = "../permission-core"}
action-vocab = {path = "../action-vocab"}
provenance = {path = "../../provenance/provenance"}
account-core = {path = "../../accounts/account-core"}
model-provider = {path = "../../models/model-provider"}
rust_decimal = { workspace = true, features = ["std", "serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
toml = { workspace = true }

[lints]
workspace = true
