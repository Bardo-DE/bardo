[package]
name = "action-context"
description = "What the router remembers and shows: the session record and its state, the handle table, the task table, the write-ahead log, the undo journal, the manifest registry, the labels, the rebuild of a session from its log, and who is asking."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/docket"
publish = false

[dependencies]
account-ids = {path = "../../accounts/account-ids"}
action-review = {path = "../action-review"}
memory-core = {path = "../../memory/memory-core"}
companion-model = {path = "../companion-model"}
action-core = {path = "../action-core"}
action-wire = {path = "../action-wire"}
action-manifest = {path = "../action-manifest"}
permission-core = {path = "../permission-core"}
action-vocab = {path = "../action-vocab"}
agent-session = {path = "../agent-session"}
agent-skills = {path = "../agent-skills"}
permission-policy = {path = "../permission-policy"}
provenance = {path = "../../provenance/provenance"}
account-core = {path = "../../accounts/account-core"}
thiserror = {version = "2"}
futures-util = {version = "0.3", default-features = false, features = ["std"]}
futures-channel = {version = "0.3", default-features = false, features = ["std"]}

[dev-dependencies]
agent-session = {path = "../agent-session", features = ["testing"]}
action-manifest = {path = "../action-manifest", features = ["manifest-file"]}
serde_json = {version = "1"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
