[package]
name = "action-provider"
description = "The app side of org.bardo.Intents1: the IntentProvider, ContextSource and SummonTarget traits an app implements, and (behind the dbus feature) serve and serve_on, which answer org.bardo.IntentProvider1 on the app's own bus name. The caller side is action-client."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
action-core = {path = "../action-core"}
action-wire = {path = "../action-wire"}
action-manifest = {path = "../action-manifest"}
action-vocab = {path = "../action-vocab"}
action-dbus = {path = "../action-dbus", optional = true}
futures-util = { workspace = true, features = ["std"], optional = true }
provenance = {path = "../../provenance/provenance"}
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }
zbus = {workspace = true, features = ["tokio"], optional = true}
dbus-kit = { path = "../../bus/dbus-kit", optional = true }

[features]
# `serve` and `serve_on`: the provider on the session bus (Linux, the desktop's actiond calls it).
dbus = ["dep:action-dbus", "dep:futures-util", "dep:serde", "dep:serde_json", "dep:zbus", "dep:dbus-kit"]

[lints]
workspace = true
