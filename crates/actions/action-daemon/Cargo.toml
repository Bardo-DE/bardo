[package]
name = "action-daemon"
description = "The daemon: builds the router over its seams (apps over D-Bus, the sheet, inferd, memoryd, the grant file) and serves org.bardo.Intents1; also hosts the built-in org.bardo.Memory and org.bardo.Companion providers. The binary is a skeleton."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "action_daemon"
path = "src/lib.rs"

[[bin]]
name = "bardo-actiond"
path = "src/main.rs"

[dependencies]
base-time = { path = "../../base/base-time" }
base-fs = { path = "../../base/base-fs" }
base-xdg = { path = "../../base/base-xdg" }
base-ids = { path = "../../base/base-ids" }
base-path = { path = "../../base/base-path" }
base-clock = { path = "../../base/base-clock" }
companion-model = {path = "../companion-model"}
action-checkpoint-git = {path = "../action-checkpoint-git"}
permission-core = {path = "../permission-core"}
account-callers = {path = "../../accounts/account-callers"}
action-core = {path = "../action-core"}
action-wire = {path = "../action-wire"}
action-manifest = {path = "../action-manifest", features = ["manifest-file"]}
action-vocab = {path = "../action-vocab"}
action-store = {path = "../action-store"}
action-log = {path = "../action-log"}
action-context = {path = "../action-context"}
action-router = {path = "../action-router"}
agent-skills = {path = "../agent-skills"}
agent-skills-disk = {path = "../agent-skills-disk"}
action-settings = {path = "../action-settings"}
action-settings-fs = {path = "../action-settings-fs"}
settings-store = { path = "../../settings/settings-store" }
settings-store-fs = { path = "../../settings/settings-store-fs" }
action-client = {path = "../action-client", default-features = false, features = ["dbus"]}
action-provider = {path = "../action-provider"}
action-dbus = {path = "../action-dbus", features = ["inferd"]}
action-procroot = {path = "../action-procroot"}
companion-memory = {path = "../companion-memory"}
companion-memory-core = {path = "../companion-memory-core"}
agent-session = {path = "../agent-session"}
agent-models = {path = "../agent-models"}
permission-policy = {path = "../permission-policy"}
action-review = {path = "../action-review"}
provenance = {path = "../../provenance/provenance"}
account-core = {path = "../../accounts/account-core"}
inference-core = {path = "../../inference/inference-core"}
account-client = {path = "../../accounts/account-client"}
account-client-dbus = {path = "../../accounts/account-client-dbus"}
inference-client = {features = ["dbus"], path = "../../inference/inference-client"}
memory-client = {default-features = false, features = ["dbus"], path = "../../memory/memory-client"}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
futures-util = { workspace = true, features = ["std"] }
notify = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
zbus = {workspace = true, features = ["tokio"]}
dbus-kit = { path = "../../bus/dbus-kit" }
caller-role-types = {path = "../../identity/caller-role-types"}

[dev-dependencies]
action-daemon = {path = ".", features = ["test-system-callers"]}
base-testkit = {path = "../../base/base-testkit", features = ["dbus", "tokio"]}
computer-use-action = {path = "../../models/computer-use-action"}
computer-use-geometry = {path = "../../models/computer-use-geometry"}
model-types = {path = "../../models/model-types"}
account-match = {path = "../../accounts/account-match"}
account-capability = {path = "../../accounts/account-capability"}
memory-core = {path = "../../memory/memory-core"}
agent-acp-bin = {path = "../agent-acp-bin"}
action-host = {path = "../action-host"}
action-dbus = {path = "../action-dbus", features = ["fixture-callers"]}
action-fake = {path = "../action-fake"}
inference-core = {features = ["testing"], path = "../../inference/inference-core"}
account-wire = {path = "../../accounts/account-wire"}
memory-dbus = {path = "../../memory/memory-dbus"}
agent-reader-daemon = {path = "../agent-reader-daemon"}
proptest = { workspace = true }
action-client = {path = "../action-client", default-features = false, features = ["dbus", "in_process"]}
action-provider = {path = "../action-provider", features = ["dbus"]}
serde_json = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
action-gate-wire = {path = "../action-gate-wire"}
account-dbus = {path = "../../accounts/account-dbus"}

[features]
# TEST ONLY, off by default and never in dist: `BARDO_ACTIOND_SYSTEM_CALLERS=<file>` makes the daemon read that file as the
# system's callers table, so no test reads this computer's `/etc/bardo`. Without this feature the variable is ignored (with a
# line on standard error). The crate's own tests turn it on (the dev-dependency on itself).
test-system-callers = []
# Span export over OTLP (action-log's `otlp`), switched on at run time by `OTEL_EXPORTER_OTLP_ENDPOINT`.
otlp = ["action-log/otlp"]

[lints]
workspace = true
