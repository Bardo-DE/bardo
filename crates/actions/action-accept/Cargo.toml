[package]
name = "action-accept"
description = "Test only: the first end-to-end acceptance of the agent tier. The real intentd, companiond, readerd, memoryd and inferd run as processes on a private bus (inferd replaying cassettes), beside a mail provider and a Confirm1 server, and SPEC section 5 flows (a) and (c) run through them."
publish.workspace = true

# The daemons run as their own processes from these thin mains: the same daemon the packaged
# binaries run (`run_with`, given the proc root and model tap from the environment), under names that cannot collide with theirs in one target directory. memoryd's
# memoryd and inferd are not here: `build.rs` builds the packaged binaries of the memory service (with its
# `test-keys` feature), porter and the inference service, from their folders of this workspace.
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
[[bin]]
name = "accept-actiond"
path = "src/bin/accept-actiond.rs"

[[bin]]
name = "accept-companiond"
path = "src/bin/accept-companiond.rs"

[[bin]]
name = "accept-acp"
path = "src/bin/accept-acp.rs"

[[bin]]
name = "accept-agent"
path = "src/bin/accept-agent.rs"

[[bin]]
name = "accept-readerd"
path = "src/bin/accept-readerd.rs"

# `bardo-do` itself: the packaged main, built under a name of the acceptance harness (a test of this
# package can only name this package's binaries).
[[bin]]
name = "accept-bardo-do"
path = "../action-cli/src/main.rs"

[[bin]]
name = "accept-actions-mcp"
path = "src/bin/accept-actions-mcp.rs"

[[bin]]
name = "accept-bus-relay"
path = "src/bin/accept-bus-relay.rs"

[[bin]]
name = "accept-fake-agent"
path = "src/bin/accept-fake-agent.rs"

[dependencies]
base-time = { path = "../../base/base-time" }
base-ids = { path = "../../base/base-ids" }
action-mcp = {path = "../action-mcp"}
companion-wire = {path = "../companion-wire"}
companion-daemon = {path = "../companion-daemon"}
agent-acp-bin = {path = "../agent-acp-bin", features = ["testing"]}
action-cli = {path = "../action-cli"}
action-client = {path = "../action-client", default-features = false, features = ["dbus", "in_process"]}
permission-core = {path = "../permission-core"}
action-provider = {path = "../action-provider", features = ["dbus"]}
action-core = {path = "../action-core"}
action-wire = {path = "../action-wire"}
action-manifest = {path = "../action-manifest", features = ["manifest-file"]}
action-vocab = {path = "../action-vocab"}
action-dbus = {path = "../action-dbus", features = ["fixture-callers", "inferd"]}
action-log = {path = "../action-log"}
action-trace = {path = "../action-trace"}
agent-session = {path = "../agent-session"}
action-testbus = {path = "../action-testbus"}
fnv = { workspace = true }
futures-util = { workspace = true, features = ["std"] }
action-daemon = {path = "../action-daemon"}
agent-reader-daemon = {path = "../agent-reader-daemon"}
memory-core = {path = "../../memory/memory-core"}
memory-client = {default-features = false, features = ["dbus"], path = "../../memory/memory-client"}
account-core = {path = "../../accounts/account-core"}
account-callers = {path = "../../accounts/account-callers"}
inference-core = {path = "../../inference/inference-core"}
provenance = {path = "../../provenance/provenance"}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
zbus = {workspace = true, features = ["tokio"]}
dbus-kit = { path = "../../bus/dbus-kit" }

[lints]
workspace = true

[package.metadata.cargo-shear]
# The `action` binary above is built from action-cli's own sources.
ignored-paths = ["../action-cli/src/*.rs"]
