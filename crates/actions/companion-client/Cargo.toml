[package]
name = "companion-client"
description = "The person's side of org.bardo.Companion1: a CompanionTransport seam (open, ask, follow the answer object, close) and DbusCompanion over the session bus. What bardo-do ask is written against. Kept out of action-client so the apps and cuad that use that crate do not take on the companion's wire."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
companion-model = {path = "../companion-model"}
companion-wire = {path = "../companion-wire"}
action-client = {path = "../action-client", default-features = false}
action-wire = {path = "../action-wire"}
action-dbus = {path = "../action-dbus"}
futures-util = { workspace = true, features = ["std"] }
provenance = {path = "../../provenance/provenance"}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
zbus = {workspace = true, features = ["tokio"]}

[lints]
workspace = true
