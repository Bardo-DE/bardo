[package]
name = "agent-registry"
description = "The coding-agent registry as values: a registry snapshot, names and SHA-256 digests, the layout of the agents directory as paths, and the install record and the offered record as values and text. Reads no disk, network or environment; docket-agents installs and reads."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/docket"
publish = false

[dependencies]
const-hex = {version = "1.19"}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
sha2 = {version = "0.11"}
thiserror = {version = "2"}
toml = {version = "1"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
