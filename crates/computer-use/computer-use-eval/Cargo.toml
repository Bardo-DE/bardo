[package]
name = "computer-use-eval"
description = "The computer-use model eval: fake surfaces, a task set, a harness that plays a task against a scripted or a local model, and the report."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "computer-use-eval"
path = "src/main.rs"

[dependencies]
base-secret = { path = "../../base/base-secret" }
action-gate-wire = {path = "../../actions/action-gate-wire"}
action-wire = {path = "../../actions/action-wire"}
account-capability = {path = "../../accounts/account-capability"}
base-ids = { path = "../../base/base-ids" }
base-time = { path = "../../base/base-time" }
computer-use-action = {path = "../computer-use-action"}
computer-use-desktop = {path = "../computer-use-desktop"}
keymap = {path = "../../keymap/keymap"}
computer-use-capture = {path = "../computer-use-capture"}
computer-use-seat-input = {path = "../computer-use-seat-input"}
computer-use-a11y-tree = {path = "../computer-use-a11y-tree"}
computer-use-bus = {path = "../computer-use-bus"}
computer-use-run = {path = "../computer-use-run"}
computer-use-fake = {path = "../computer-use-fake"}
action-core = {path = "../../actions/action-core"}
provenance = {path = "../../provenance/provenance"}
account-core = {path = "../../accounts/account-core"}
inference-core = {path = "../../inference/inference-core"}
computer-use-session = {path = "../computer-use-session"}
computer-use-vendors = {path = "../computer-use-vendors"}
computer-use-parse = {path = "../computer-use-parse"}
model-catalog = {path = "../../models/model-catalog"}
model-http = {features = ["client"], path = "../../models/model-http"}
model-openai-compat = {path = "../../models/model-openai-compat"}
model-provider = {path = "../../models/model-provider"}
rust_decimal = { workspace = true, features = ["std", "serde"] }
model-vision-prep = {features = ["pixels"], path = "../../models/model-vision-prep"}
keyboard-types = {workspace = true, features = ["serde"]}
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[dev-dependencies]
model-provider = {features = ["testing"], path = "../../models/model-provider"}

[lints]
workspace = true
