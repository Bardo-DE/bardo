[package]
name = "computer-use-eval-cloud"
description = "The computer-use eval against a hosted model: a model layer Provider that asks the accounts service's inferd for a chat turn over the bus (the API key stays in accountd and inferd), and the computer-use-eval-cloud binary that plays the task set on it under a spend and step budget."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "computer_use_eval_cloud"
path = "src/lib.rs"

[[bin]]
name = "computer-use-eval-cloud"
path = "src/main.rs"

[dependencies]
account-match = {path = "../../accounts/account-match"}
account-capability = {path = "../../accounts/account-capability"}
base-ids = { path = "../../base/base-ids" }
computer-use-eval = {path = "../computer-use-eval"}
model-catalog = {path = "../../models/model-catalog"}
model-provider = {path = "../../models/model-provider"}
inference-client = {features = ["dbus"], path = "../../inference/inference-client"}
account-core = {path = "../../accounts/account-core"}
inference-core = {path = "../../inference/inference-core"}
thiserror = { workspace = true }
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
toml = { workspace = true }
model-vision-prep = {path = "../../models/model-vision-prep"}
zbus = {workspace = true, features = ["tokio"]}

[dev-dependencies]
rust_decimal = { workspace = true, features = ["std", "serde"] }

[lints]
workspace = true
