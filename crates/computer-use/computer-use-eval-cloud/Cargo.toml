[package]
name = "computer-use-eval-cloud"
description = "The computer-use eval against a hosted model: a stoker Provider that asks porter's inferd for a chat turn over the bus (the API key stays in accountd and inferd), and the cua-eval-cloud binary that plays the task set on it under a spend and step budget."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/cua"
publish = false

[lib]
name = "computer_use_eval_cloud"
path = "src/lib.rs"

[[bin]]
name = "cua-eval-cloud"
path = "src/main.rs"

[dependencies]
account-match = {path = "../../accounts/account-match"}
account-capability = {path = "../../accounts/account-capability"}
account-ids = {path = "../../accounts/account-ids"}
computer-use-eval = {path = "../computer-use-eval"}
model-catalog = {path = "../../models/model-catalog"}
model-provider = {path = "../../models/model-provider"}
inference-client = {features = ["dbus"], path = "../../inference/inference-client"}
account-core = {path = "../../accounts/account-core"}
inference-core = {path = "../../inference/inference-core"}
thiserror = {version = "2"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
toml = {version = "1"}
model-vision-prep = {path = "../../models/model-vision-prep"}
zbus = {version = "5.19", default-features = false, features = ["tokio"]}

[dev-dependencies]
rust_decimal = {version = "1", default-features = false, features = ["std", "serde"]}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
