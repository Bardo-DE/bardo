[package]
name = "computer-use-seat-input"
description = "The agent's input: InputOp, the pure plan from a CuaAction to input operations, the keymap and region maps, and the AgentSeat seam. The reis client is `computer-use-seat-ei`."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/cua"
publish = false

[dependencies]
account-ids = {path = "../../accounts/account-ids"}
computer-use-action = {path = "../computer-use-action"}
computer-use-desktop = {path = "../computer-use-desktop"}
computer-use-types = {path = "../computer-use-types"}
account-core = {path = "../../accounts/account-core"}
keyboard-types = {version = "0.7", features = ["serde"]}
xkbcommon = {version = "0.8", default-features = false}
serde = {version = "1", features = ["derive"]}
thiserror = {version = "2"}

[dev-dependencies]
serde_json = {version = "1"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
