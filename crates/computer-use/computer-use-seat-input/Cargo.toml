[package]
name = "computer-use-seat-input"
description = "The agent's input: InputOp, the pure plan from a CuaAction to input operations, the keymap and region maps, and the AgentSeat seam. The reis client is `computer-use-seat-ei`."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-ids = { path = "../../base/base-ids" }
computer-use-action = {path = "../../models/computer-use-action"}
computer-use-desktop = {path = "../computer-use-desktop"}
computer-use-types = {path = "../computer-use-types"}
keyboard-types = {workspace = true, features = ["serde"]}
xkbcommon = {version = "0.8", default-features = false}
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
