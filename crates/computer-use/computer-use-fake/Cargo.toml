[package]
name = "computer-use-fake"
description = "Test support for computer use: a fake agent seat, an in-process EIS server, scripted capture, desktop, accessibility tree, model, gate and event sinks, and the harness that drives a run over them."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
action-gate-wire = {path = "../../actions/action-gate-wire"}
action-wire = {path = "../../actions/action-wire"}
base-ids = { path = "../../base/base-ids" }
base-time = { path = "../../base/base-time" }
computer-use-action = {path = "../../models/computer-use-action"}
computer-use-desktop = {path = "../computer-use-desktop"}
computer-use-capture = {path = "../computer-use-capture"}
computer-use-seat-input = {path = "../computer-use-seat-input"}
computer-use-a11y-tree = {path = "../computer-use-a11y-tree"}
computer-use-bus = {path = "../computer-use-bus"}
computer-use-run = {path = "../computer-use-run"}
action-core = {path = "../../actions/action-core"}
provenance = {path = "../../provenance/provenance"}
account-core = {path = "../../accounts/account-core"}
inference-core = {path = "../../inference/inference-core"}
model-replay = {path = "../../models/model-replay"}
model-provider = {path = "../../models/model-provider"}
computer-use-parse = {path = "../../models/computer-use-parse"}
reis = { workspace = true }
rustix = {workspace = true, features = ["std", "fs"]}
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
permission-core = {path = "../../actions/permission-core"}
account-capability = {path = "../../accounts/account-capability"}

[lints]
workspace = true
