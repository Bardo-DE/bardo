[package]
name = "computer-use-seat-ei"
description = "The EI client of the agent's seat: an AgentSeat over reis, to the compositor's stock GetSenderSocket socket or the fork's lease socket. It does the input that computer-use-seat-input plans."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-ids = { path = "../../base/base-ids" }
computer-use-seat-input = {path = "../computer-use-seat-input"}
computer-use-action = {path = "../computer-use-action"}
computer-use-desktop = {path = "../computer-use-desktop"}
account-core = {path = "../../accounts/account-core"}
reis = { workspace = true, features = ["tokio"] }
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
futures-util = { workspace = true, features = ["std"] }

[dev-dependencies]
# The in-process EIS server the seat is tested against.
computer-use-fake = {path = "../computer-use-fake"}

[lints]
workspace = true
