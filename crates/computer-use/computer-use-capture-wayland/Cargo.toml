[package]
name = "computer-use-capture-wayland"
description = "The capture backend of computer-use-capture over a wayland connection: ext-image-copy-capture (the stock toplevel source and the bardo masked source over an agent lease), and the pump that drives a connection from async code."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base-clock = { path = "../../base/base-clock" }
base-time = { path = "../../base/base-time" }
computer-use-capture = {path = "../computer-use-capture"}
computer-use-action = {path = "../../models/computer-use-action"}
computer-use-desktop = {path = "../computer-use-desktop"}
thiserror = { workspace = true }
wayland-client = { workspace = true }
wayland-protocols = { workspace = true, features = ["client", "staging", "unstable"] }
desktop-protocols = {features = ["client"], path = "../../wayland/desktop-protocols"}
rustix = {workspace = true, features = ["std", "fs"]}
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[dev-dependencies]
base-ids = { path = "../../base/base-ids" }
account-core = {path = "../../accounts/account-core"}
wayland-server = { workspace = true }
# The compositor side of bardo-agent-v1, for the fake compositor in the tests.
desktop-protocols = {features = ["server"], path = "../../wayland/desktop-protocols"}
wayland-protocols = { workspace = true, features = ["client", "server", "staging", "unstable"] }
rustix = {workspace = true, features = ["event", "fs", "std"]}

[lints]
workspace = true
