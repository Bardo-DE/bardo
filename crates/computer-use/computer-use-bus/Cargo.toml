[package]
name = "computer-use-bus"
description = "What crosses cuad's bus and its event log: the Cua1 bodies, the Start task, run states and outcomes, CuaRecord, the control refusals and who may call which member. Serde bodies over the vocabulary of memory-core, action-core, account-core, inference-core, prov and computer-use-action; no capability crate (accessibility, input, capture) is linked; results are prov Report messages."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/cua"
publish = false

[dependencies]
action-gate-wire = {path = "../../actions/action-gate-wire"}
action-vocab = {path = "../../actions/action-vocab"}
account-ids = {path = "../../accounts/account-ids"}
computer-use-action = {path = "../computer-use-action"}
computer-use-desktop = {path = "../computer-use-desktop"}
computer-use-types = {path = "../computer-use-types"}
action-core = {path = "../../actions/action-core"}
memory-core = {path = "../../memory/memory-core"}
provenance = {path = "../../provenance/provenance"}
account-core = {path = "../../accounts/account-core"}
inference-core = {path = "../../inference/inference-core"}
model-provider = {path = "../../models/model-provider"}
rust_decimal = {version = "1", default-features = false, features = ["std", "serde"]}
iso_currency = {version = "0.7", features = ["with-serde"]}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}

[dev-dependencies]
account-capability = {path = "../../accounts/account-capability"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
