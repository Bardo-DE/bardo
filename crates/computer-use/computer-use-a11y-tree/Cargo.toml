[package]
name = "computer-use-a11y-tree"
description = "The accessibility tree of a leased window: snapshot model, prune, render to model text, diff, secret rectangles, selectors and the A11ySource seam. The AT-SPI backend is `computer-use-a11y-atspi`."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/cua"
publish = false

[dependencies]
account-ids = {path = "../../accounts/account-ids"}
computer-use-action = {path = "../computer-use-action"}
computer-use-desktop = {path = "../computer-use-desktop"}
computer-use-types = {path = "../computer-use-types"}
provenance = {path = "../../provenance/provenance"}
account-core = {path = "../../accounts/account-core"}
serde = {version = "1", features = ["derive"]}
thiserror = {version = "2"}

[dev-dependencies]
serde_json = {version = "1"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
