[package]
name = "computer-use-run"
description = "The pure run machine of a computer-use run: observations, the phase table, inputs and effects, effect classification, mode support, the lease book, stall detection, the configuration and the seams cuad plugs in."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
action-gate-wire = {path = "../../actions/action-gate-wire"}
action-wire = {path = "../../actions/action-wire"}
permission-core = {path = "../../actions/permission-core"}
account-capability = {path = "../../accounts/account-capability"}
base-ids = { path = "../../base/base-ids" }
base-time = { path = "../../base/base-time" }
computer-use-action = {path = "../computer-use-action"}
computer-use-desktop = {path = "../computer-use-desktop"}
keymap = {path = "../../keymap/keymap"}
computer-use-capture = {path = "../computer-use-capture"}
computer-use-seat-input = {path = "../computer-use-seat-input"}
computer-use-a11y-tree = {path = "../computer-use-a11y-tree"}
computer-use-bus = {path = "../computer-use-bus"}
action-core = {path = "../../actions/action-core"}
provenance = {path = "../../provenance/provenance"}
account-core = {path = "../../accounts/account-core"}
inference-core = {path = "../../inference/inference-core"}
model-provider = {path = "../../models/model-provider"}
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }

keyboard-types = {workspace = true, features = ["serde"]}
blake3 = { workspace = true }

[dev-dependencies]
rust_decimal = { workspace = true, features = ["std", "serde"] }
action-vocab = {path = "../../actions/action-vocab"}
computer-use-fake = {path = "../computer-use-fake"}
serde_json = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
