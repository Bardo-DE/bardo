[package]
name = "key-remap-devtest"
publish.workspace = true
description = "Test-only harness for keycap: fake keyboards on /dev/uinput, the daemon as a child process, its output device and its socket. Creates input devices; run only through the gated device tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
key-remap-proto = { path = "../key-remap-proto" }
key-remap-client = { path = "../key-remap-client" }
key-remap-evdev = { path = "../key-remap-evdev" }
rustix = {workspace = true, features = ["default", "event", "fs", "net", "pipe", "process", "time"]}

[dev-dependencies]
base-testkit = { path = "../../base/base-testkit" }

[lints]
workspace = true
