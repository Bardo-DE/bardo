[package]
name = "input-broker-daemon"
description = "The input broker: the root service that makes the mouse gestures daemon's and the key remap daemon's virtual input devices, and no others"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "input_broker_daemon"
path = "src/lib.rs"

[[bin]]
name = "bardo-input-broker"
path = "src/main.rs"

[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["fake"]

[features]
# The fake kernel and the fake identity, for tests only; a shipped build never enables it.
fake = []

[dependencies]
base-fs = { path = "../../base/base-fs" }
base-time = { path = "../../base/base-time" }
rustix = {workspace = true, features = ["event", "fs", "net", "std"]}
input-broker-wire = {path = "../input-broker-wire"}
thiserror = { workspace = true }
input-linux = { workspace = true }
uinput-ioctl = {path = "../uinput-ioctl"}
listenfd = { workspace = true }
libc = { workspace = true }
caller-identity-linux = {path = "../../identity/caller-identity-linux"}
caller-identity-core = {features = ["desktop"], path = "../../identity/caller-identity-core"}

[dev-dependencies]
base-testkit = {path = "../../base/base-testkit"}
# Test seams (a fixture file tree standing for /proc and the table files); never in a shipped build.
caller-identity-linux = {features = ["fake"], path = "../../identity/caller-identity-linux"}
input-broker-client = {path = "../input-broker-client"}
tempfile = { workspace = true }

[lints]
workspace = true
