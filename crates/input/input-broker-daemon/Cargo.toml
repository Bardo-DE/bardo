[package]
name = "input-broker-daemon"
description = "turnstile: the root service that makes palmrest's and keycap's virtual input devices, and no others"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/turnstile"
publish = false

[lib]
name = "input_broker_daemon"
path = "src/lib.rs"

[[bin]]
name = "bardo-input-broker"
path = "src/main.rs"

[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["fake"]

[features]
# The fake kernel and the fake identity, for tests only; a shipped build never enables it.
fake = []

[dependencies]
rustix = {version = "1.1", default-features = false, features = ["event", "fs", "net", "std"]}
input-broker-wire = {path = "../input-broker-wire"}
thiserror = {version = "2"}
input-linux = {version = "0.7", default-features = false}
listenfd = {version = "1.0"}
libc = {version = "0.2"}
caller-identity-linux = {path = "../../identity/caller-identity-linux"}
caller-identity-core = {features = ["desktop"], path = "../../identity/caller-identity-core"}

[dev-dependencies]
# Test seams (a fixture file tree standing for /proc and the table files); never in a shipped build.
caller-identity-linux = {features = ["fake"], path = "../../identity/caller-identity-linux"}
input-broker-client = {path = "../input-broker-client"}
tempfile = {version = "3"}

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
