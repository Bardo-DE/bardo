[package]
publish.workspace = true
name = "mouse-gestures-daemon"
description = "Magic Mouse gesture daemon: hidraw reader, evdev and uinput devices, a socket for layer-shell-host and a virtual touchpad for everyone else (the decisions are mouse-gestures-core)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base-xdg = { path = "../../base/base-xdg" }
base-fs = { path = "../../base/base-fs" }
mouse-gestures-core = { path = "../mouse-gestures-core" }
mouse-gestures-proto = { path = "../mouse-gestures-proto" }
thiserror = { workspace = true }
notify = { workspace = true }
settings-store-fs = { path = "../../settings/settings-store-fs" }
rustix = {workspace = true, features = ["default", "event", "fs", "net", "time", "process"]}
input-linux = { workspace = true }
hidraw-ioctl = {path = "../hidraw-ioctl"}
input-broker-client = {path = "../input-broker-client"}
caller-identity-linux = {path = "../../identity/caller-identity-linux"}
seat-guard = {path = "../../identity/seat-guard"}
seat-guard-core = {path = "../../identity/seat-guard-core"}
caller-roles = {path = "../../identity/caller-roles"}
caller-identity-core = {path = "../../identity/caller-identity-core"}

[dev-dependencies]
input-broker-client = {features = ["fake"], path = "../input-broker-client"}
# A held process that is only a claim, for tests of who the socket's peer is; never in a shipped build.
caller-identity-linux = {features = ["fake"], path = "../../identity/caller-identity-linux"}

[lints]
workspace = true
[[bin]]
name = "bardo-mouse-gestures"
path = "src/main.rs"
