[package]
name = "hidraw-ioctl"
description = "The hidraw feature-report ioctl (HIDIOCSFEATURE) behind a safe call."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rustix = {workspace = true, features = ["std"]}

# The workspace lint table with `unsafe_code = "deny"` in place of "forbid", so the modules that hold
# this crate's unsafe code can `expect` it (Cargo cannot override one entry of an inherited table);
# `cargo xtask check lints` keeps it equal to the workspace table otherwise.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
ambiguous_negative_literals = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
missing_docs = "warn"

[lints.clippy]
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
too_long_first_doc_paragraph = "warn"
literal_string_with_formatting_args = "allow"
# Its fix is `assert_eq!(x, [] as [T; 0])` at most sites (a typed empty array), which reads worse than
# `assert!(x.is_empty())`; clippy does not apply it on its own for that reason.
assert_is_empty = "allow"
