# bardo-key-remap: the standalone install opens /dev/uinput itself (no bardo-input-broker service). Install to
# /etc/systemd/system/bardo-key-remap.service.d/10-uinput.conf (install.sh does it). The desktop does not
# ship this file: there the root service owns the node and bardo-key-remap is handed each device.
[Service]
DeviceAllow=/dev/uinput rw
