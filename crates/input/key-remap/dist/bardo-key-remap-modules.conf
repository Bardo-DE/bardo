# bardo-key-remap: load uinput at boot. bardo-key-remap writes its virtual keyboard through /dev/uinput, and the
# udev rule (70-bardo-key-remap.rules) only sets the node's mode; nothing else loads the module on
# Ubuntu, Arch or a minimal Fedora. Install to /etc/modules-load.d/bardo-key-remap.conf.
uinput
