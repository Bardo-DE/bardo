# bardo-mouse-gestures: load uinput at boot. The input service (bardo-input-broker) makes bardo-mouse-gestures's virtual touchpad
# and key devices through /dev/uinput, and nothing else loads the module on Ubuntu, Arch or a
# minimal Fedora. bardo-input-broker ships the same line; this file is for a machine that runs bardo-mouse-gestures
# alone. Install to /etc/modules-load.d/bardo-mouse-gestures.conf.
uinput
