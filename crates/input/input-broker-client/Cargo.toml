[package]
name = "input-broker-client"
description = "The input broker: what the mouse gestures daemon and the key remap daemon link to ask the input-device service for a device"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The stand-in for the service, for the callers' tests; a shipped build never enables it.
fake = ["dep:input-broker-core"]

[dependencies]
rustix = {workspace = true, features = ["event", "net", "std"]}
input-broker-core = {optional = true, path = "../input-broker-core"}
input-broker-wire = {path = "../input-broker-wire"}
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
