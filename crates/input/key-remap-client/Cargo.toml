[package]
publish.workspace = true
name = "key-remap-client"
description = "A program's end of the key remap daemon: the socket client, and KeyRemapSource, this desktop's chord keymap source (conventions, the desktop's own bindings and the person's keymap file)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
key-remap-proto = { path = "../key-remap-proto" }
# std has no SOCK_SEQPACKET sockets, which the protocol uses; rustix has them without unsafe.
keymap = {path = "../../keymap/keymap"}
base-fs = { path = "../../base/base-fs" }
base-xdg = { path = "../../base/base-xdg" }
rustix = {workspace = true, features = ["default", "event", "fs", "net", "time", "process"]}

[dev-dependencies]
base-testkit = {path = "../../base/base-testkit"}
tempfile = { workspace = true }

[lints]
workspace = true
