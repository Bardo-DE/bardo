[package]
publish.workspace = true
name = "key-remap-client"
description = "A program's end of keycap: the socket client, and KeycapSource, this desktop's chordkit keymap source (conventions, the desktop's own bindings and the person's keymap file)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
key-remap-proto = { path = "../key-remap-proto" }
# std has no SOCK_SEQPACKET sockets, which the protocol uses; rustix has them without unsafe.
keymap = {path = "../../keymap/keymap"}
base-fs = { path = "../../base/base-fs" }
base-xdg = { path = "../../base/base-xdg" }
rustix = {version = "1", features = ["event", "fs", "net", "time", "process"]}
shell-verbs = {path = "../../wayland/shell-verbs"}

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
