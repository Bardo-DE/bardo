[package]
name = "docket-reader"
description = "The quarantined reader, portable: what the reader model is asked (`reader_request`), its reply read back as a typed value under the ask's schema (`answer_of`), and `read` / `TransportReader` over any inferd-client Transport. readerd is the desktop's process around it; an app-hosted agent uses `TransportReader` in its own process."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/docket"
publish = false

[dependencies]
porter-match = {path = "../../../porter/crates/porter-match"}
porter-capability = {path = "../../../porter/crates/porter-capability"}
porter-ids = {path = "../../../porter/crates/porter-ids"}
docket-core = {path = "../docket-core"}
docket-vocab = {path = "../docket-vocab"}
docket-models = {path = "../docket-models"}
inferd-client = {path = "../../../steward/crates/inferd-client"}
porter-core = {path = "../../../porter/crates/porter-core"}
porter-infer = {path = "../../../steward/crates/porter-infer"}
prov = {path = "../../../prov/prov"}
serde_json = {version = "1"}

[dev-dependencies]
porter-wire = {path = "../../../porter/crates/porter-wire"}
docket-fake = {path = "../docket-fake"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
# The scripted model transport of companiond's tests is included by path (one file, not a copy).
inferd-client = {path = "../../../steward/crates/inferd-client"}
proptest = {version = "1"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
