[package]
name = "eval-core"
description = "The red-team suite as values: the case and corpus format, the attack format, the pure judgement of a case, the Wilson interval, the metrics, the attack scores and the per-commit summary. No router, no Cedar, no file or clock reads."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/docket"
publish = false

[dependencies]
porter-ids = {path = "../../../porter/crates/porter-ids"}
docket-core = {path = "../docket-core"}
docket-permissions-core = {path = "../docket-permissions-core"}
docket-vocab = {path = "../docket-vocab"}
prov = {path = "../../../prov/prov"}
porter-core = {path = "../../../porter/crates/porter-core"}
model-provider = {path = "../../../stoker/crates/model-provider"}
rust_decimal = {version = "1", default-features = false, features = ["std", "serde"]}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
thiserror = {version = "2"}

[dev-dependencies]
toml = {version = "1"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
