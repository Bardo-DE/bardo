[package]
name = "voice-dbus"
description = "The caller's side of org.quire.Voice1: zbus proxies for the voice service, its utterance and speech objects, and the bus names and object paths. No daemon, no audio stack."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/docket"
publish = false

[dependencies]
zbus = {version = "5.19", default-features = false, features = ["tokio"]}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
