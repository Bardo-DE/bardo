[package]
name = "docket-procroot"
description = "What the daemons read from a /proc tree: whether a process runs in a terminal's scope, and which user the daemon itself runs as. The tree is a parameter, so a test hands in a scratch one."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/docket"
publish = false

[dependencies]
docket-wire = {path = "../docket-wire"}
porter-core = {path = "../../../porter/crates/porter-core"}

[dev-dependencies]
tempfile = {version = "3"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
