[package]
name = "docket-inapp"
description = "The portable in-app agent: the router, policy point, reviewer and agent loop hosted inside one app over that app's own IntentProvider, with the app's own confirm sheet. No intentd, no bus, no daemon."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/docket"
publish = false

[dependencies]
action-review = {path = "../action-review"}
agent-loop = {path = "../agent-loop"}
companion-wire = {path = "../companion-wire"}
almanac-core = {path = "../../../almanac/crates/almanac-core"}
docket-client = {path = "../docket-client", default-features = false, features = ["in_process"]}
docket-permissions-core = {path = "../docket-permissions-core"}
docket-provider = {path = "../docket-provider"}
docket-core = {path = "../docket-core"}
docket-wire = {path = "../docket-wire"}
docket-manifest = {path = "../docket-manifest"}
docket-vocab = {path = "../docket-vocab"}
docket-host = {path = "../docket-host"}
futures-channel = {version = "0.3", default-features = false, features = ["std"]}
futures-util = {version = "0.3", default-features = false, features = ["std"]}
docket-memory = {path = "../docket-memory"}
docket-memory-core = {path = "../docket-memory-core"}
docket-models = {path = "../docket-models"}
docket-planner = {path = "../docket-planner"}
docket-reader = {path = "../docket-reader"}
docket-context = {path = "../docket-context"}
docket-router = {path = "../docket-router"}
docket-session = {path = "../docket-session"}
docket-skills = {path = "../docket-skills"}
docket-skills-disk = {path = "../docket-skills-disk"}
docket-store = {path = "../docket-store"}
docket-tasks = {path = "../docket-tasks"}
policy-point = {path = "../policy-point"}
inferd-client = {path = "../../../steward/crates/inferd-client"}
porter-core = {path = "../../../porter/crates/porter-core"}
prov = {path = "../../../prov/prov"}
serde_json = {version = "1"}
thiserror = {version = "2"}

[dev-dependencies]
porter-capability = {path = "../../../porter/crates/porter-capability"}
porter-match = {path = "../../../porter/crates/porter-match"}
porter-wire = {path = "../../../porter/crates/porter-wire"}
porter-ids = {path = "../../../porter/crates/porter-ids"}
bulkhead = {path = "../../../bulkhead"}
cua-action = {path = "../../../stoker/crates/cua-action"}
docket-fake = {path = "../docket-fake"}
porter-infer = {path = "../../../steward/crates/porter-infer"}
serde_json = {version = "1"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
tempfile = {version = "3"}
almanac-client = {default-features = false, features = ["in_process"], path = "../../../almanac/crates/almanac-client"}
almanac-fake = {path = "../../../almanac/crates/almanac-fake"}
almanac-service = {path = "../../../almanac/crates/almanac-service"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
