[package]
name = "voice-loop"
description = "The voice step machines, pure: one utterance (the mic is open only in three states), speech output with barge-in, the sentencer and the audio buffer."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/docket"
publish = false

[dependencies]
voice-wire = {path = "../voice-wire"}
porter-core = {path = "../../../porter/crates/porter-core"}
docket-wire = {path = "../docket-wire"}
porter-infer = {path = "../../../steward/crates/porter-infer"}
speech-provider = {path = "../../../stoker/crates/speech-provider"}
serde = {version = "1", features = ["derive"]}

[dev-dependencies]
porter-capability = {path = "../../../porter/crates/porter-capability"}
serde_json = {version = "1"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
