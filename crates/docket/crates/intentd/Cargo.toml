[package]
name = "intentd"
description = "The daemon: builds the router over its seams (apps over D-Bus, the sheet, inferd, memoryd, the grant file) and serves org.quire.Intents1; also hosts the built-in org.quire.Memory and org.quire.Companion providers. The binary is a skeleton."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/docket"
publish = false

[lib]
name = "intentd"
path = "src/lib.rs"

[[bin]]
name = "intentd"
path = "src/main.rs"

[dependencies]
porter-ids = {path = "../../../porter/crates/porter-ids"}
bulkhead = {path = "../../../bulkhead"}
companion-model = {path = "../companion-model"}
docket-checkpoint-git = {path = "../docket-checkpoint-git"}
docket-permissions-core = {path = "../docket-permissions-core"}
porter-dbus = {path = "../../../porter/crates/porter-dbus"}
porter-callers = {path = "../../../porter/crates/porter-callers"}
porter-daemon = {default-features = false, features = ["watch"], path = "../../../porter/crates/porter-daemon"}
docket-core = {path = "../docket-core"}
docket-wire = {path = "../docket-wire"}
docket-manifest = {path = "../docket-manifest", features = ["manifest-file"]}
docket-vocab = {path = "../docket-vocab"}
docket-store = {path = "../docket-store"}
docket-log = {path = "../docket-log"}
docket-context = {path = "../docket-context"}
docket-router = {path = "../docket-router"}
docket-skills = {path = "../docket-skills"}
docket-skills-disk = {path = "../docket-skills-disk"}
docket-settings = {path = "../docket-settings"}
docket-client = {path = "../docket-client", default-features = false, features = ["dbus"]}
docket-provider = {path = "../docket-provider"}
docket-dbus = {path = "../docket-dbus", features = ["inferd"]}
docket-procroot = {path = "../docket-procroot"}
docket-memory = {path = "../docket-memory"}
docket-memory-core = {path = "../docket-memory-core"}
docket-session = {path = "../docket-session"}
docket-models = {path = "../docket-models"}
policy-point = {path = "../policy-point"}
action-review = {path = "../action-review"}
prov = {path = "../../../prov/prov"}
porter-core = {path = "../../../porter/crates/porter-core"}
porter-infer = {path = "../../../steward/crates/porter-infer"}
porter-client = {path = "../../../porter/crates/porter-client"}
porter-client-dbus = {path = "../../../porter/crates/porter-client-dbus"}
inferd-client = {features = ["dbus"], path = "../../../steward/crates/inferd-client"}
almanac-client = {default-features = false, features = ["dbus"], path = "../../../almanac/crates/almanac-client"}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
futures-util = {version = "0.3", default-features = false, features = ["std"]}
notify = {version = "8.2"}
toml = {version = "1"}
thiserror = {version = "2"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
zbus = {version = "5.19", default-features = false, features = ["tokio"]}

[dev-dependencies]
model-provider = {path = "../../../stoker/crates/model-provider"}
rust_decimal = {version = "1", default-features = false, features = ["std", "serde"]}
porter-match = {path = "../../../porter/crates/porter-match"}
porter-capability = {path = "../../../porter/crates/porter-capability"}
almanac-core = {path = "../../../almanac/crates/almanac-core"}
docket-acp-bin = {path = "../docket-acp-bin"}
docket-host = {path = "../docket-host"}
docket-dbus = {path = "../docket-dbus", features = ["fixture-callers"]}
docket-testbus = {path = "../docket-testbus"}
docket-fake = {path = "../docket-fake"}
porter-infer = {features = ["testing"], path = "../../../steward/crates/porter-infer"}
porter-wire = {path = "../../../porter/crates/porter-wire"}
almanac-dbus = {path = "../../../almanac/crates/almanac-dbus"}
almanac-dbus-serve = {path = "../../../almanac/crates/almanac-dbus-serve"}
readerd = {path = "../readerd"}
proptest = {version = "1"}
docket-client = {path = "../docket-client", default-features = false, features = ["dbus", "in_process"]}
docket-provider = {path = "../docket-provider", features = ["dbus"]}
cua-action = {path = "../../../stoker/crates/cua-action"}
serde_json = {version = "1"}
tempfile = {version = "3"}
toml = {version = "1"}
docket-gate-wire = {path = "../docket-gate-wire"}

[features]
# Span export over OTLP (docket-log's `otlp`), switched on at run time by `OTEL_EXPORTER_OTLP_ENDPOINT`.
otlp = ["docket-log/otlp"]

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
