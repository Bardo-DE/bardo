[package]
name = "voiced"
description = "The voice daemon: the only process that opens the microphone, serves org.quire.Voice1, and runs the voice machines. The audio device is the voice-audio seam; the PipeWire backend is voice-pipewire."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/docket"
publish = false

[dependencies]
porter-match = {path = "../../../porter/crates/porter-match"}
porter-capability = {path = "../../../porter/crates/porter-capability"}
porter-ids = {path = "../../../porter/crates/porter-ids"}
voice-loop = {path = "../voice-loop"}
voice-audio = {path = "../voice-audio"}
voice-wire = {path = "../voice-wire"}
voice-dbus = {path = "../voice-dbus"}
docket-wire = {path = "../docket-wire"}
porter-core = {path = "../../../porter/crates/porter-core"}
porter-infer = {path = "../../../steward/crates/porter-infer"}
inferd-client = {features = ["dbus"], path = "../../../steward/crates/inferd-client"}
docket-dbus = {path = "../docket-dbus"}
docket-procroot = {path = "../docket-procroot"}
voice-pipewire = {path = "../voice-pipewire", optional = true}
futures-util = {version = "0.3", default-features = false, features = ["std"]}
speech-vad = {path = "../../../stoker/crates/speech-vad"}
speech-provider = {path = "../../../stoker/crates/speech-provider"}
zbus = {version = "5.19", default-features = false, features = ["tokio"]}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
clap = {version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"]}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
toml = {version = "1"}
thiserror = {version = "2"}
tracing = {version = "0.1"}
docket-log = {path = "../docket-log"}

[features]
default = ["pipewire"]
# `voice-pipewire`, the shipped audio backend (needs libpipewire and libclang to build). The
# daemon binary and the by-hand example need it; the library without it is the machines and
# `dictate`, so a test or another backend builds with `--no-default-features`.
pipewire = ["dep:voice-pipewire"]

[[bin]]
name = "voiced"
path = "src/main.rs"
required-features = ["pipewire"]

[[example]]
name = "voice_capture_try"
required-features = ["pipewire"]

[dev-dependencies]
docket-vocab = {path = "../docket-vocab"}
docket-dbus = {path = "../docket-dbus", features = ["fixture-callers"]}
docket-testbus = {path = "../docket-testbus"}
porter-infer = {features = ["testing"], path = "../../../steward/crates/porter-infer"}
tempfile = {version = "3"}
futures-util = {version = "0.3", default-features = false, features = ["std"]}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
