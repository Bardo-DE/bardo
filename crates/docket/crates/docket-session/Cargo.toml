[package]
name = "docket-session"
description = "The durable session, portable and pure: `SessionEntry` (the append-only log of one session), `resume_plan` (entries in, a typed plan out), `fork`, `export`, a reader for the records companiond wrote before, and the `SessionBackend`, `SessionHost` and `SessionLog` seams. No bus, no runtime, no clock read."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/docket"
publish = false

[features]
# Test code: the backend contract suite (`contract`, which asserts by panicking) and the fakes
# (`fake`, `fake_host`). Only the dev-dependencies of crates whose tests use them turn it on.
testing = []

[dependencies]
porter-capability = {path = "../../../porter/crates/porter-capability"}
porter-ids = {path = "../../../porter/crates/porter-ids"}
companion-model = {path = "../companion-model"}
companion-wire = {path = "../companion-wire"}
docket-core = {path = "../docket-core"}
docket-wire = {path = "../docket-wire"}
docket-permissions-core = {path = "../docket-permissions-core"}
docket-vocab = {path = "../docket-vocab"}
porter-core = {path = "../../../porter/crates/porter-core"}
model-provider = {path = "../../../stoker/crates/model-provider"}
prov = {path = "../../../prov/prov"}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
thiserror = {version = "2"}

[dev-dependencies]
docket-session = {path = ".", features = ["testing"]}
almanac-core = {path = "../../../almanac/crates/almanac-core"}
proptest = {version = "1"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
