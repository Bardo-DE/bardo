[package]
name = "docket-host"
description = "What a host that shows no interface of its own needs to ask its person: the confirm sheet seam (`ConfirmSheet`), `SheetConfirmer`, which turns a sheet's answer into the router's `ConfirmAnswer` and mints the receipt, and `EditorDesk`, the sheets waiting for an editor's choice. Used by the editor host (docket-acp-bin) and by the in-app agent (docket-inapp)."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/docket"
publish = false

[dependencies]
porter-ids = {path = "../../../porter/crates/porter-ids"}
docket-core = {path = "../docket-core"}
docket-permissions-core = {path = "../docket-permissions-core"}
docket-vocab = {path = "../docket-vocab"}
docket-session = {path = "../docket-session"}
futures-channel = {version = "0.3", default-features = false, features = ["std"]}
prov = {path = "../../../prov/prov"}

[dev-dependencies]
futures-util = {version = "0.3", default-features = false, features = ["std"]}
porter-core = {path = "../../../porter/crates/porter-core"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
