[package]
name = "docket-cli"
description = "quire-do: every app we ship, driven from a command line generated from its intents manifest. A thin client over docket-client with caller role cli; every call goes through intentd's full gate."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/docket"
publish = false

[[bin]]
name = "quire-do"
path = "src/main.rs"

[dependencies]
porter-capability = {path = "../../../porter/crates/porter-capability"}
porter-ids = {path = "../../../porter/crates/porter-ids"}
companion-client = {path = "../companion-client"}
companion-wire = {path = "../companion-wire"}
docket-core = {path = "../docket-core"}
docket-wire = {path = "../docket-wire"}
docket-manifest = {path = "../docket-manifest"}
docket-vocab = {path = "../docket-vocab"}
docket-session = {path = "../docket-session"}
docket-skills = {path = "../docket-skills"}
docket-skills-disk = {path = "../docket-skills-disk"}
docket-client = {path = "../docket-client", default-features = false, features = ["dbus"]}
prov = {path = "../../../prov/prov"}
porter-core = {path = "../../../porter/crates/porter-core"}
model-provider = {path = "../../../stoker/crates/model-provider"}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
thiserror = {version = "2"}
url = {version = "2.5"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[dev-dependencies]
docket-dbus = {path = "../docket-dbus", features = ["fixture-callers"]}
docket-permissions-core = {path = "../docket-permissions-core"}
porter-infer = {path = "../../../steward/crates/porter-infer"}
zbus-ready = {path = "../../../zbus-ready"}
docket-testbus = {path = "../docket-testbus"}
intentd = { path = "../intentd" }
zbus = {version = "5.19", default-features = false, features = ["tokio"]}
docket-client = {path = "../docket-client", default-features = false, features = ["dbus", "in_process"]}
docket-provider = {path = "../docket-provider", features = ["dbus"]}
docket-fake = {path = "../docket-fake"}
docket-router = {path = "../docket-router"}
almanac-dbus = {path = "../../../almanac/crates/almanac-dbus"}
almanac-dbus-serve = {path = "../../../almanac/crates/almanac-dbus-serve"}
futures-util = {version = "0.3", default-features = false, features = ["std"]}
almanac-core = {path = "../../../almanac/crates/almanac-core"}
porter-core = {path = "../../../porter/crates/porter-core"}
prov = {path = "../../../prov/prov"}
tempfile = {version = "3"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
