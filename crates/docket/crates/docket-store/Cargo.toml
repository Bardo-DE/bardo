[package]
name = "docket-store"
description = "docket's disk and timers: the durable file write and read, the grant file's disk rules and write lock, the waits on peers with a deadline and a cancel, and the system clock."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/docket"
publish = false

[dependencies]
docket-vocab = {path = "../docket-vocab"}
prov = {path = "../../../prov/prov"}
atomic-write-file = {version = "0.3"}
futures-util = {version = "0.3", default-features = false, features = ["std"]}
thiserror = {version = "2"}

[dev-dependencies]
tempfile = {version = "3"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
