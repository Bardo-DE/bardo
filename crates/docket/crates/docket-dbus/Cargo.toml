[package]
name = "docket-dbus"
description = "org.quire.Intents1, IntentProvider1, Confirm1, Companion1 and Reader1 as zbus proxies and skeletons, their introspection, bus names and the error mapping."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/docket"
publish = false

[dependencies]
porter-match = {path = "../../../porter/crates/porter-match"}
porter-capability = {path = "../../../porter/crates/porter-capability"}
docket-core = {path = "../docket-core"}
docket-wire = {path = "../docket-wire"}
docket-manifest = {path = "../docket-manifest"}
docket-vocab = {path = "../docket-vocab"}
prov = {path = "../../../prov/prov"}
porter-callers = {features = ["file"], path = "../../../porter/crates/porter-callers"}
porter-dbus = {path = "../../../porter/crates/porter-dbus"}
inferd-client = {features = ["dbus"], optional = true, path = "../../../steward/crates/inferd-client"}
steward-dbus = {path = "../../../steward/crates/steward-dbus"}
porter-core = {path = "../../../porter/crates/porter-core"}
porter-infer = {optional = true, path = "../../../steward/crates/porter-infer"}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
zbus = {version = "5.19", default-features = false, features = ["tokio"]}
thiserror = {version = "2"}

[features]
# `inferd_transport`: the one place a daemon makes its inferd link (intentd, companiond, readerd),
# and the watch on it that a live run turns on (`watch`; docket-trace is the watcher).
inferd = ["dep:inferd-client", "dep:porter-infer"]
# Callers read from a fixture tree standing for /proc and the unit manager (`Identity::on_fixture`):
# porter reads one only in a test build. Turned on by docket-accept and by tests' dev-dependencies,
# never by a shipped crate (check-boundary.sh checks every shipped package's feature tree).
fixture-callers = ["porter-callers/test-proc-root"]

[dev-dependencies]
docket-dbus = { path = ".", features = ["fixture-callers"] }
tempfile = {version = "3"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
