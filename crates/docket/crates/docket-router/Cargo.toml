[package]
name = "docket-router"
description = "The pure router: `Router` and the seams the daemon passes in, over docket-context (what it remembers) and docket-gate (the pure steps of a call)."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/docket"
publish = false

[dependencies]
porter-ids = {path = "../../../porter/crates/porter-ids"}
companion-model = {path = "../companion-model"}
docket-checkpoint = {path = "../docket-checkpoint"}
docket-context = {path = "../docket-context"}
docket-core = {path = "../docket-core"}
docket-gate = {path = "../docket-gate"}
docket-wire = {path = "../docket-wire"}
docket-gate-wire = {path = "../docket-gate-wire"}
docket-manifest = {path = "../docket-manifest", features = ["manifest-file"]}
docket-permissions-core = {path = "../docket-permissions-core"}
docket-vocab = {path = "../docket-vocab"}
docket-session = {path = "../docket-session"}
docket-skills = {path = "../docket-skills"}
policy-point = {path = "../policy-point"}
action-review = {path = "../action-review"}
prov = {path = "../../../prov/prov"}
porter-core = {path = "../../../porter/crates/porter-core"}
almanac-core = {path = "../../../almanac/crates/almanac-core"}
thiserror = {version = "2"}
serde_json = {version = "1"}
futures-util = {version = "0.3", default-features = false, features = ["std"]}
tracing = {version = "0.1"}

[dev-dependencies]
bulkhead = {path = "../../../bulkhead"}
model-provider = {path = "../../../stoker/crates/model-provider"}
toml = {version = "1"}
rust_decimal = {version = "1", default-features = false, features = ["std", "serde"]}
docket-session = {path = "../docket-session", features = ["testing"]}
docket-fake = {path = "../docket-fake"}
docket-provider = {path = "../docket-provider"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
proptest = {version = "1"}
cua-action = {path = "../../../stoker/crates/cua-action"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
