[package]
name = "docket-eval"
description = "The red-team suite runner: reads the corpus and attack files, plays the cases over docket-fake, and checks an app against the conformance rules. The case format, judgement and scores are in eval-core."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/docket"
publish = false

[[bin]]
name = "docket-eval"
path = "src/main.rs"

[dependencies]
porter-ids = {path = "../../../porter/crates/porter-ids"}
action-review = {path = "../action-review"}
docket-fake = {path = "../docket-fake"}
docket-core = {path = "../docket-core"}
docket-wire = {path = "../docket-wire"}
docket-manifest = {path = "../docket-manifest", features = ["manifest-file"]}
docket-permissions-core = {path = "../docket-permissions-core"}
docket-vocab = {path = "../docket-vocab"}
docket-skills = {path = "../docket-skills"}
docket-skills-disk = {path = "../docket-skills-disk"}

eval-core = {path = "../eval-core"}
docket-context = {path = "../docket-context"}
docket-router = {path = "../docket-router"}
prov = {path = "../../../prov/prov"}
porter-core = {path = "../../../porter/crates/porter-core"}
clap = {version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"]}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
toml = {version = "1"}
thiserror = {version = "2"}

[dev-dependencies]
proptest = {version = "1"}
tempfile = {version = "3"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
