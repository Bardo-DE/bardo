[package]
name = "docket-client"
description = "The caller side of org.quire.Intents1 (Intents over a Transport: D-Bus behind the dbus feature, or the router in process behind in_process)."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/docket"
publish = false

[dependencies]
companion-model = {path = "../companion-model"}
docket-core = {path = "../docket-core"}
docket-wire = {path = "../docket-wire"}
docket-gate-wire = {path = "../docket-gate-wire"}
docket-manifest = {path = "../docket-manifest"}
docket-permissions-core = {path = "../docket-permissions-core"}
docket-vocab = {path = "../docket-vocab"}
docket-router = {path = "../docket-router", optional = true}
docket-dbus = {path = "../docket-dbus", optional = true}
futures-util = {version = "0.3", default-features = false, features = ["std"], optional = true}
serde = {version = "1", features = ["derive"], optional = true}
serde_json = {version = "1", optional = true}
zbus = {version = "5.19", default-features = false, features = ["tokio"], optional = true}
prov = {path = "../../../prov/prov"}
thiserror = {version = "2"}

[dev-dependencies]
cua-action = {path = "../../../stoker/crates/cua-action"}
docket-fake = {path = "../docket-fake"}
porter-core = {path = "../../../porter/crates/porter-core"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[features]
# The app-level desktop switch (quire design/36): on by default so a consumer outside the
# workspace is unchanged; the workspace declares the crate with `default-features = false` and
# each desktop crate names `dbus`. `quire-desktop` is implied by the crate having a D-Bus client.
default = ["quire-desktop"]
quire-desktop = ["dbus"]
# The D-Bus transport (Linux, the desktop's intentd).
dbus = ["dep:docket-dbus", "dep:futures-util", "dep:serde", "dep:serde_json", "dep:zbus"]
# `InProcess`: the router in the caller's own process. Off by default so a client (cuad, an app)
# never links the router, and with it cedar and policy-point.
in_process = ["dep:docket-router"]

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
