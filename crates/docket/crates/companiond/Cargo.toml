[package]
name = "companiond"
description = "The companion daemon: one identity over many tasks, each its own docket session. Serves org.quire.Companion1; the binary serves it on the session bus. It is the bus adapter and the daemon over docket-helpers (the helpers' hub and the routine timer); the decisions over values are companion-core's."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/docket"
publish = false

[lib]
name = "companiond"
path = "src/lib.rs"

[[bin]]
name = "companiond"
path = "src/main.rs"

[dependencies]
companion-core = {path = "../companion-core"}
companion-model = {path = "../companion-model"}
companion-wire = {path = "../companion-wire"}
docket-core = {path = "../docket-core"}
docket-wire = {path = "../docket-wire"}
docket-vocab = {path = "../docket-vocab"}
docket-helpers = {path = "../docket-helpers", features = ["tokio"]}
docket-store = {path = "../docket-store"}
docket-log = {path = "../docket-log"}
docket-planner = {path = "../docket-planner"}
docket-skills = {path = "../docket-skills"}
docket-skills-disk = {path = "../docket-skills-disk"}
docket-tasks = {path = "../docket-tasks"}
docket-client = {path = "../docket-client", default-features = false, features = ["dbus"]}
docket-dbus = {path = "../docket-dbus", features = ["inferd"]}
docket-procroot = {path = "../docket-procroot"}
docket-settings = {path = "../docket-settings"}
futures-util = {version = "0.3", default-features = false, features = ["std"]}
prov = {path = "../../../prov/prov"}
porter-core = {path = "../../../porter/crates/porter-core"}
porter-callers = {path = "../../../porter/crates/porter-callers"}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
thiserror = {version = "2"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
toml = {version = "1"}
tracing = {version = "0.1"}
zbus = {version = "5.19", default-features = false, features = ["tokio"]}
zbus-ready = { path = "../../../zbus-ready" }

[features]
# Span export over OTLP (docket-log's `otlp`), switched on at run time by `OTEL_EXPORTER_OTLP_ENDPOINT`.
otlp = ["docket-log/otlp"]

[dev-dependencies]
porter-match = {path = "../../../porter/crates/porter-match"}
porter-capability = {path = "../../../porter/crates/porter-capability"}
porter-ids = {path = "../../../porter/crates/porter-ids"}
almanac-core = {path = "../../../almanac/crates/almanac-core"}
docket-dbus = {path = "../docket-dbus", features = ["fixture-callers"]}
agent-loop = {path = "../agent-loop"}
docket-manifest = {path = "../docket-manifest"}
docket-permissions-core = {path = "../docket-permissions-core"}
inferd-client = {path = "../../../steward/crates/inferd-client"}
porter-infer = {path = "../../../steward/crates/porter-infer"}
docket-testbus = {path = "../docket-testbus"}
docket-client = {path = "../docket-client", default-features = false, features = ["in_process"]}
docket-fake = {path = "../docket-fake"}
docket-router = {path = "../docket-router"}
tempfile = {version = "3"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
