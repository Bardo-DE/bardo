[package]
name = "docket-acp-bin"
description = "The docket-acp process: the ACP server edge on stdio, hosting its own companion (docket-native NativeHost) over the session bus. Refuses to serve unless agent.acp.expose is on. The lib is what the acceptance harness runs under its own name."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/docket"
publish = false

[lib]
name = "docket_acp_bin"

[[bin]]
name = "docket-acp"
path = "src/main.rs"

[[bin]]
name = "docket-agent"
path = "src/bin/docket-agent.rs"

[[bin]]
name = "docket-net-forward"
path = "src/bin/docket-net-forward.rs"

[[bin]]
name = "docket-net-enter"
path = "src/bin/docket-net-enter.rs"

[dependencies]
porter-capability = {path = "../../../porter/crates/porter-capability"}
porter-ids = {path = "../../../porter/crates/porter-ids"}
companion-client = {path = "../companion-client"}
companion-model = {path = "../companion-model"}
companion-wire = {path = "../companion-wire"}
acp-core = {path = "../acp-core"}
docket-acp = {path = "../docket-acp"}
docket-acp-host = {path = "../docket-acp-host"}
agents-core = {path = "../agents-core"}
docket-agents = {path = "../docket-agents"}
docket-client = {path = "../docket-client", default-features = false, features = ["dbus"]}
docket-permissions-core = {path = "../docket-permissions-core"}
docket-provider = {path = "../docket-provider", features = ["dbus"]}
docket-core = {path = "../docket-core"}
docket-wire = {path = "../docket-wire"}
docket-manifest = {path = "../docket-manifest", features = ["manifest-file"]}
docket-vocab = {path = "../docket-vocab"}
docket-dbus = {path = "../docket-dbus", features = ["inferd"]}
docket-host = {path = "../docket-host"}
docket-store = {path = "../docket-store"}
docket-launch = {path = "../docket-launch", features = ["dbus"]}
docket-log = {path = "../docket-log"}
docket-native = {path = "../docket-native"}
docket-planner = {path = "../docket-planner"}
docket-session = {path = "../docket-session"}
docket-settings = {path = "../docket-settings"}
clap = {version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"]}
bulkhead = {features = ["landlock"], path = "../../../bulkhead"}
docket-tasks = {path = "../docket-tasks"}
futures-util = {version = "0.3", default-features = false, features = ["std"]}
porter-core = {path = "../../../porter/crates/porter-core"}
porter-callers = {path = "../../../porter/crates/porter-callers"}
serde_json = {version = "1"}
prov = {path = "../../../prov/prov"}
thiserror = {version = "2"}
tokio = {version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"]}
zbus = {version = "5.19", default-features = false, features = ["tokio"]}

[dev-dependencies]
docket-fake = {path = "../docket-fake"}
tempfile = {version = "3"}

[features]
# What the acceptance harness needs to host an agent in its own process (`harness`). Only dev-dependencies
# and the harness crates turn it on; no packaged binary does.
testing = []

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
