[package]
name = "policy-point"
description = "The policy point: the Cedar schema and default policies, the request shape, and the four rulings a request can get."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/docket"
publish = false

[dependencies]
porter-ids = {path = "../../../porter/crates/porter-ids"}
docket-core = {path = "../docket-core"}
docket-manifest = {path = "../docket-manifest"}
docket-permissions-core = {path = "../docket-permissions-core"}
docket-session = {path = "../docket-session"}
docket-vocab = {path = "../docket-vocab"}
prov = {path = "../../../prov/prov"}
porter-core = {path = "../../../porter/crates/porter-core"}
cedar-policy = {version = "4.13"}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
thiserror = {version = "2"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
