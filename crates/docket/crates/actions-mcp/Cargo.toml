[package]
name = "actions-mcp"
description = "The MCP edge: an MCP server generated from the registry's offered actions, every call through the router as Actor::Mcp with untrusted arguments. Off by default; the binary serves it over stdio or a Unix socket."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/docket"
publish = false

[lib]
name = "actions_mcp"
path = "src/lib.rs"

[[bin]]
name = "actions-mcp"
path = "src/main.rs"

[dependencies]
actions-tools = {path = "../actions-tools"}
docket-core = {path = "../docket-core"}
docket-client = {path = "../docket-client", default-features = false, features = ["dbus"]}
docket-dbus = {path = "../docket-dbus"}
docket-manifest = {path = "../docket-manifest"}
docket-settings = {path = "../docket-settings"}
prov = {path = "../../../prov/prov"}
porter-core = {path = "../../../porter/crates/porter-core"}
rmcp = {version = "3.5", default-features = false, features = ["server", "transport-io"]}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
thiserror = {version = "2"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
toml = {version = "1"}
zbus = {version = "5.19", default-features = false, features = ["tokio"]}

[dev-dependencies]
docket-permissions-core = {path = "../docket-permissions-core"}
docket-vocab = {path = "../docket-vocab"}
docket-dbus = {path = "../docket-dbus", features = ["fixture-callers"]}
docket-testbus = {path = "../docket-testbus"}
intentd = { path = "../intentd" }
tempfile = {version = "3"}
docket-client = {path = "../docket-client", default-features = false, features = ["in_process"]}
docket-fake = {path = "../docket-fake"}
docket-router = {path = "../docket-router"}
rmcp = {version = "3.5", default-features = false, features = ["client", "server", "transport-io"]}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
docket-wire = {path = "../docket-wire"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
