[package]
name = "docket-permissions-core"
description = "docket's permission model: review rulings and strictness, modes and their rows, grants per action and per Space, standing grants and the rule for offering one, limits, rule files and the admin floor, the agent's own actions and the commands it runs, and the per-task policy with its trusted patterns and reach menu."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/docket"
publish = false

[dependencies]
porter-capability = {path = "../../../porter/crates/porter-capability"}
porter-ids = {path = "../../../porter/crates/porter-ids"}
bulkhead = {path = "../../../bulkhead"}
docket-manifest = {path = "../docket-manifest"}
docket-vocab = {path = "../docket-vocab"}
porter-core = {path = "../../../porter/crates/porter-core"}
prov = {path = "../../../prov/prov"}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
thiserror = {version = "2"}
url = {version = "2.5"}

[dev-dependencies]
proptest = {version = "1"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
