[package]
name = "agent-loop"
description = "The companion's pure machines: the working-set assembler, the planner step, the tier rule, side-conversation capture, the idle pass, completion notes and the restart rebuild."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/docket"
publish = false

[dependencies]
porter-ids = {path = "../../../porter/crates/porter-ids"}
docket-core = {path = "../docket-core"}
docket-wire = {path = "../docket-wire"}
docket-permissions-core = {path = "../docket-permissions-core"}
docket-vocab = {path = "../docket-vocab"}
companion-wire = {path = "../companion-wire"}
prov = {path = "../../../prov/prov"}
porter-core = {path = "../../../porter/crates/porter-core"}
almanac-core = {path = "../../../almanac/crates/almanac-core"}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}

[dev-dependencies]
docket-manifest = {path = "../docket-manifest"}
proptest = {version = "1"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
