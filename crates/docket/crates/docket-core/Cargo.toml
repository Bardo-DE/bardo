[package]
name = "docket-core"
description = "docket's vocabulary above docket-vocab and docket-manifest: context, previews, calls, refusals, undo, confirmation, budgets, the planner and reader contract, the roster, audit records, and the memory and event-log seams (`MemoryLink`, `EventSink`). Ids, units, values and the `Clock` seam are in docket-vocab; the manifest, its validation and the JSON argument reader are in docket-manifest."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/docket"
publish = false

[dependencies]
porter-capability = {path = "../../../porter/crates/porter-capability"}
porter-ids = {path = "../../../porter/crates/porter-ids"}
companion-model = {path = "../companion-model"}
docket-manifest = {path = "../docket-manifest"}
docket-permissions-core = {path = "../docket-permissions-core"}
docket-vocab = {path = "../docket-vocab"}
porter-core = {path = "../../../porter/crates/porter-core"}
porter-infer = {path = "../../../steward/crates/porter-infer"}
prov = {path = "../../../prov/prov"}
almanac-core = {path = "../../../almanac/crates/almanac-core"}
model-provider = {path = "../../../stoker/crates/model-provider"}
rust_decimal = {version = "1", default-features = false, features = ["std", "serde"]}
iso_currency = {version = "0.7", features = ["with-serde"]}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
thiserror = {version = "2"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
