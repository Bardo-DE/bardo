[package]
name = "docket-skills"
description = "Skills: the instructions the desktop ships for the companion. Parses and validates skill.toml and SKILL.md, discovers installed skills from directories it is handed, checks them against the registered manifests and picks which to show. Pure: directories are read through a folder the caller injects; no authority."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/docket"
publish = false

[dependencies]
docket-core = {path = "../docket-core"}
docket-manifest = {path = "../docket-manifest"}
docket-vocab = {path = "../docket-vocab"}
porter-core = {path = "../../../porter/crates/porter-core"}
prov = {path = "../../../prov/prov"}
serde = {version = "1", features = ["derive"]}
toml = {version = "1"}
thiserror = {version = "2"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
