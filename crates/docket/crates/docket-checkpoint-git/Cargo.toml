[package]
name = "docket-checkpoint-git"
description = "The git store of restore points: a hidden commit of the workspace per point, made through a private index and kept under a ref of docket's own. git runs as a process behind the GitRun seam; nothing here touches the person's index, branches or stash."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/docket"
publish = false

[dependencies]
porter-ids = {path = "../../../porter/crates/porter-ids"}
bulkhead = {path = "../../../bulkhead"}
docket-checkpoint = {path = "../docket-checkpoint"}
docket-core = {path = "../docket-core"}
percent-encoding = {version = "2.3"}
porter-core = {path = "../../../porter/crates/porter-core"}
prov = {path = "../../../prov/prov"}
thiserror = {version = "2"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
tracing = {version = "0.1"}

[dev-dependencies]
docket-checkpoint = {path = "../docket-checkpoint", features = ["testing"]}
tempfile = {version = "3"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
