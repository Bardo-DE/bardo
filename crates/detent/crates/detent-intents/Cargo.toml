[package]
name = "detent-intents"
description = "What an agent or a command line may do in Settings: detent's intents manifest and its IntentProvider1 provider."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/detent"
publish = false

[dependencies]
docket-wire = {path = "../../../docket/crates/docket-wire"}
docket-manifest = {path = "../../../docket/crates/docket-manifest"}
docket-vocab = {path = "../../../docket/crates/docket-vocab"}
porter-ids = {path = "../../../porter/crates/porter-ids"}
detent-callers = {path = "../detent-callers"}
detent-client = {path = "../detent-client"}
detent-files = {path = "../detent-files"}
detent-model = {path = "../detent-model"}
docket-provider = {path = "../../../docket/crates/docket-provider", features = ["dbus"]}
docket-core = {path = "../../../docket/crates/docket-core"}
docket-dbus = {path = "../../../docket/crates/docket-dbus"}
ds-peer = {path = "../../../quire/crates/ds-peer"}
ds-settings = {path = "../../../quire/crates/ds-settings"}
porter-core = {path = "../../../porter/crates/porter-core"}
prov = {path = "../../../prov/prov"}
thiserror = {version = "2"}
toml = {version = "1"}
zbus = {version = "5.19", features = ["tokio"]}

[dev-dependencies]
porter-sheet = {path = "../../../porter/crates/porter-sheet"}
detent-callers = {path = "../detent-callers", features = ["testing"]}
docket-dbus = {path = "../../../docket/crates/docket-dbus", features = ["fixture-callers"]}
detent-testkit = {path = "../detent-testkit"}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros"]}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
