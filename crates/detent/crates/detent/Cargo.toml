[package]
name = "detent"
description = "The desktop's Settings app."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/detent"
publish = false

[dependencies]
clap = {version = "4", features = ["derive"]}
detent-callers = {path = "../detent-callers", optional = true}
detent-client = {path = "../detent-client"}
detent-files = {path = "../detent-files"}
detent-intents = {path = "../detent-intents"}
detent-model = {path = "../detent-model"}
detent-ui = {path = "../detent-ui"}
ds-blitz = {path = "../../../quire/crates/ds-blitz"}
ds-settings = {path = "../../../quire/crates/ds-settings"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros"]}

[features]
# `detent --dev-callers FILE`: the stand-ins a checkout built, named in the person's own rows file,
# are let in as the desktop's services (accountd, inferd, syncd, the compositor, the shell) at a
# standing below every real proof. Off by default; the desktop's test jail builds with it, a
# release build never does.
dev-callers = ["dep:detent-callers", "detent-callers/dev-callers"]

[dev-dependencies]
detent-testkit = {path = "../detent-testkit"}
toml = {version = "1"}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
