[package]
name = "detent-ui"
description = "The Settings window: sidebar, pages and controls, drawn only with quire's components."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/detent"
publish = false

[dependencies]
# The compiler is the fence: the window names only the client (its one door to the computer), the
# model (its facts, and the other crates' types they are made of) and quire. Never detent-files,
# detent-system, porter-*, almanac-*, docket-* or zbus.
detent-client = {path = "../detent-client"}
detent-model = {path = "../detent-model"}
dioxus = {version = "0.7", default-features = false, features = ["macro", "html", "hooks", "signals"]}
ds = {path = "../../../quire/crates/ds"}
ds-blitz = {path = "../../../quire/crates/ds-blitz"}
ds-helpers = {path = "../../../quire/crates/ds-helpers", default-features = false}
ds-lint = {path = "../../../quire/crates/ds-lint"}
ds-settings = {path = "../../../quire/crates/ds-settings", features = ["dioxus", "live", "tokio"]}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros"]}

[dev-dependencies]
porter-capability = {path = "../../../porter/crates/porter-capability"}
# Fixtures: the in-memory links (the daemons' live settings modules among them: `FakeModules`) and
# the test kit, and quire's harness. The tests that stand a service that is no live module up on a
# private bus (the portal, running models, the engines, computers, memory, the sync service, and
# the owner checks) need the commented ones below.
detent-system = {path = "../detent-system", features = ["testing"]}
detent-testkit = {path = "../detent-testkit"}
ds-settings = {path = "../../../quire/crates/ds-settings", features = ["testing"]}
dioxus-ssr = {version = "0.7"}
ds-harness = {path = "../../../quire/crates/ds-harness"}
image = {version = "0.25.6", default-features = false, features = ["png", "jpeg"]}
toml = {version = "1"}
# A stand-in service on a private bus is vouched for by `AnyOwner`, or by the role check over peers
# a test introduces owners to (the squatter tests).
detent-callers = {path = "../detent-callers", features = ["testing"]}
# Reads and writes the settings files and desktop entries the tests seed and check.
detent-files = {path = "../detent-files"}
# The stand-in daemons' wire: bus names, paths and the zbus interfaces they serve (accountd's and
# syncd's from ferry, inferd's from steward).
ferry-bus = {path = "../../../ferry/crates/ferry-bus"}
porter-dbus = {path = "../../../porter/crates/porter-dbus"}
porter-wire = {path = "../../../porter/crates/porter-wire"}
steward-dbus = {path = "../../../steward/crates/steward-dbus"}
zbus = {version = "5.19", features = ["tokio"]}
# The Intelligence test's stand-in inferd answers with porter's kinds and inference types.
porter-core = {path = "../../../porter/crates/porter-core"}
porter-infer = {path = "../../../steward/crates/porter-infer"}
# The Assistants test reads docket's places file.
docket-settings = {path = "../../../docket/crates/docket-settings"}
# The lending test's service manager implements inferd's `UnitManager`.
inferd-client = {path = "../../../steward/crates/inferd-client", features = ["lending"]}
# The Keyboard test names chords.
chordkit = {path = "../../../chordkit/crates/chordkit"}
zbus-ready = { path = "../../../zbus-ready" }

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
