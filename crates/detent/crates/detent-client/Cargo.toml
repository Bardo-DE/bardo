[package]
name = "detent-client"
description = "The one door the Settings window uses: a live value per pane, and the commands the person gives it."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/detent"
publish = false

[dependencies]
detent-files = {path = "../detent-files"}
detent-model = {path = "../detent-model"}
detent-system = {path = "../detent-system"}
ds-settings = {path = "../../../quire/crates/ds-settings", features = ["live", "tokio"]}
porter-infer = {path = "../../../steward/crates/porter-infer"}
porter-provider = {path = "../../../porter/crates/porter-provider"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros"]}
toml = {version = "1"}

[dev-dependencies]
almanac-core = {path = "../../../almanac/crates/almanac-core"}
# The tests of the panes run over the in-memory links.
detent-system = {path = "../detent-system", features = ["testing"]}
ds-settings = {path = "../../../quire/crates/ds-settings", features = ["testing"]}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
