[package]
name = "detent-system"
description = "Every service the Settings app reaches: one Link trait per service, the real zbus implementation, and an in-memory fake for tests."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/detent"
publish = false

[features]
# The in-memory fakes of the links, for tests of the layers above.
testing = ["zbus/p2p"]

[dependencies]
porter-tailscale = {path = "../../../porter/crates/porter-tailscale"}
porter-tailnet = {path = "../../../steward/crates/porter-tailnet"}
porter-wire = {path = "../../../porter/crates/porter-wire"}
airwaves-bluez = {default-features = false, features = ["tokio"], path = "../../../airwaves/airwaves-bluez"}
airwaves-nm = {default-features = false, features = ["tokio"], path = "../../../airwaves/airwaves-nm"}
almanac-core = {path = "../../../almanac/crates/almanac-core"}
anyview-core = {path = "../../../anyview/crates/anyview-core"}
anyview-fs = {path = "../../../anyview/crates/anyview-fs"}
anyview-image = {path = "../../../anyview/crates/anyview-image"}
anyview-platform = {path = "../../../anyview/crates/anyview-platform"}
casement-protocols = {path = "../../../casement-protocols"}
desktop-client = {path = "../../../casement-protocols/desktop-client", features = ["client"]}
detent-callers = {path = "../detent-callers"}
detent-files = {path = "../detent-files"}
detent-model = {path = "../detent-model"}
ds-peer = {path = "../../../quire/crates/ds-peer"}
ds-settings = {path = "../../../quire/crates/ds-settings", features = ["live", "tokio"]}
md-5 = {version = "0.10"}
engine-install = {path = "../../../stoker/crates/engine-install"}
engine-manifest = {path = "../../../stoker/crates/engine-manifest"}
engine-probe = {path = "../../../stoker/crates/engine-probe"}
engine-spec = {path = "../../../stoker/crates/engine-spec"}
inferd-client = {path = "../../../steward/crates/inferd-client", features = ["dbus", "lending"]}
model-catalog = {path = "../../../stoker/crates/model-catalog"}
porter-client = {path = "../../../porter/crates/porter-client"}
porter-client-dbus = {path = "../../../porter/crates/porter-client-dbus"}
porter-core = {path = "../../../porter/crates/porter-core"}
porter-callers = {path = "../../../porter/crates/porter-callers"}
ferry-bus = {path = "../../../ferry/crates/ferry-bus"}
porter-dbus = {path = "../../../porter/crates/porter-dbus"}
steward-dbus = {path = "../../../steward/crates/steward-dbus"}
serde_json = {version = "1"}
thiserror = {version = "2"}
tokio = {version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"]}
toml = {version = "1"}
zbus = {version = "5.19", features = ["tokio"]}
zbus-ready = { path = "../../../zbus-ready" }

[dev-dependencies]
# The integration tests use the fakes, which the library has behind `testing`.
detent-system = {path = ".", features = ["testing"]}
detent-callers = {path = "../detent-callers", features = ["testing"]}
ds-settings = {path = "../../../quire/crates/ds-settings", features = ["testing"]}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
