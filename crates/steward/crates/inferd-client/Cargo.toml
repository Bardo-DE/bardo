[package]
name = "inferd-client"
description = "The app's client of inferd: inference sessions, warm-ups, places, the person's other computers and the models inferd runs, over D-Bus or hosted in the app."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/steward"
publish = false

[dependencies]
porter-core = {path = "../../../porter/crates/porter-core"}
porter-tailnet = {path = "../porter-tailnet"}
porter-tailscale = {path = "../../../porter/crates/porter-tailscale"}
porter-match = {path = "../../../porter/crates/porter-match"}
porter-capability = {path = "../../../porter/crates/porter-capability"}
porter-wire = {path = "../../../porter/crates/porter-wire"}
porter-ids = {path = "../../../porter/crates/porter-ids"}
porter-infer = {path = "../porter-infer"}
porter-bridge = {path = "../porter-bridge", optional = true}
# `engines`: the turn the daemon runs (`run_chat`) and the clock its retries wait on.
porter-turns = {path = "../porter-turns", optional = true}
model-http = {optional = true, features = ["client", "tls"], path = "../../../stoker/crates/model-http"}
model-openai-compat = {optional = true, path = "../../../stoker/crates/model-openai-compat"}
model-provider = {optional = true, path = "../../../stoker/crates/model-provider"}
model-wire = {optional = true, path = "../../../stoker/crates/model-wire"}
porter-callers = {optional = true, path = "../../../porter/crates/porter-callers"}
porter-dbus = {optional = true, path = "../../../porter/crates/porter-dbus"}
steward-dbus = {path = "../steward-dbus", optional = true}
porter-fs = {optional = true, path = "../../../porter/crates/porter-fs"}
rustix = {version = "1.1", default-features = false, features = ["std", "event", "fs", "net", "time", "process"], optional = true}
serde = {version = "1", features = ["derive"], optional = true}
serde_json = {version = "1", optional = true}
thiserror = {version = "2"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"], optional = true}
zbus = {version = "5.19", default-features = false, features = ["tokio"], optional = true}

[dev-dependencies]
test-kit = {path = "../../../porter/crates/test-kit"}
ds-settings = {features = ["live", "tokio"], path = "../../../quire/crates/ds-settings"}
cua-action = {path = "../../../stoker/crates/cua-action"}
porter-fake-servers = {path = "../../../porter/crates/porter-fake-servers"}
# The scripted inference session the session tests play (`porter_infer::testing`).
porter-infer = {path = "../porter-infer", features = ["testing"]}
porter-dbus = {path = "../../../porter/crates/porter-dbus"}
steward-dbus = {path = "../steward-dbus"}
rustix = {version = "1.1", default-features = false, features = ["std", "event", "fs", "net", "time", "process"]}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
zbus = {version = "5.19", default-features = false, features = ["tokio"]}

# The daemon the bus tests start (Linux only, as the transport is).
[target.'cfg(target_os = "linux")'.dev-dependencies]
inferd = { path = "../inferd" }
porter-router = {path = "../porter-router"}
# tailscaled's LocalAPI client, over its Unix socket, for the tailnet bus test.
porter-tailscale = {features = ["io"], path = "../../../porter/crates/porter-tailscale"}

[features]
# No feature is on by default: a consumer names the ones it uses.
default = []
# Inference with no inferd: `EngineHost`, a `SessionHost` that routes need -> engine over a table
# the app gives and drives the OpenAI-compatible engines it points at (Ollama, llama.cpp, LM
# Studio, vLLM, a company's API), with keys from a `KeySource` the app implements. Off by
# default: it brings stoker's HTTP client with TLS (hyper, rustls) and a runtime, which neither
# an app that talks to inferd needs.
engines = [
  "dep:tokio", "dep:serde_json", "dep:porter-bridge", "dep:porter-turns", "dep:model-http",
  "dep:model-openai-compat", "dep:model-provider", "dep:model-wire",
]
# `TailnetLending`: installs and takes away the drop-in that lets the person's other computers
# reach inferd (the Settings switch "Let my other computers use this computer's models"), with the
# manager of the person's units injected. Off by default: it brings porter-fs (std only). With
# `dbus` it also has `SessionUnits`, the real manager over the session bus.
lending = ["dep:porter-fs"]
# The D-Bus transport (Linux, the desktop's inferd). It reads the session `Open` returns as
# frames over a Unix stream socket with descriptors riding on them, so it pulls in the runtime.
dbus = ["dep:rustix", "dep:serde", "dep:tokio", "dep:porter-callers", "dep:porter-dbus", "dep:steward-dbus", "dep:serde_json", "dep:zbus"]

[[example]]
name = "guests"
required-features = ["dbus"]

# Shows, installs and takes away the tailnet drop-in, for Settings' switch to copy.
[[example]]
name = "lending"
required-features = ["lending", "dbus"]

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
