[package]
name = "porter-infer"
description = "The AI broker's pure half: typed requests and replies, the local-first routing policy, spend caps, audit entries, and the Model trait wire adapters implement."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/steward"
publish = false

[dependencies]
porter-core = {path = "../../../porter/crates/porter-core"}
porter-match = {path = "../../../porter/crates/porter-match"}
porter-capability = {path = "../../../porter/crates/porter-capability"}
porter-ids = {path = "../../../porter/crates/porter-ids"}
cua-action = {path = "../../../stoker/crates/cua-action"}
cua-parse = {path = "../../../stoker/crates/cua-parse"}
cua-session = {path = "../../../stoker/crates/cua-session"}
vision-prep = {path = "../../../stoker/crates/vision-prep"}
model-provider = {path = "../../../stoker/crates/model-provider"}
model-catalog = {path = "../../../stoker/crates/model-catalog"}
rust_decimal = {version = "1", default-features = false, features = ["std", "serde"]}
base64 = {version = "0.22"}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
thiserror = {version = "2"}

[dev-dependencies]
iso_currency = {version = "0.7", features = ["with-serde"]}
test-kit = {path = "../../../porter/crates/test-kit"}
# Its own fakes, for tests/it.
porter-infer = { path = ".", features = ["testing"] }
# `llm_account` for the fake model test (tests/it/fake_model.rs).
porter-fake = {path = "../../../porter/crates/porter-fake"}
proptest = {version = "1"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[features]
# `testing`: `FakeModel` and `FakeInferSession`, for the tests of code built on the broker.
testing = []

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
