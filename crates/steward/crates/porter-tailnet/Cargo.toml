[package]
name = "porter-tailnet"
description = "Lending a computer's models to the person's other computers over their Tailscale network, and calling those of another: who may ask (judged from Tailscale's own answer about the caller), the computers the person said yes or no to, the hello a lending computer answers, and with the `io` feature the listeners that follow this computer's addresses, the dial that checks who it reaches, and the relay that gives a local engine a way to a computer on the network."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/steward"
publish = false

[dependencies]
porter-ids = {path = "../../../porter/crates/porter-ids"}
porter-fs = {optional = true, path = "../../../porter/crates/porter-fs"}
porter-tailscale = {path = "../../../porter/crates/porter-tailscale"}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
thiserror = {version = "2"}
toml = {version = "1", optional = true}
hyper = {version = "1", optional = true, features = ["client", "http1"]}
hyper-util = {version = "0.1.21", optional = true, features = ["tokio"]}
http-body-util = {version = "0.1", optional = true}
tokio = {version = "1", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"], optional = true}

[dev-dependencies]
test-kit = {path = "../../../porter/crates/test-kit"}
# The integration tests use the listeners, the dial and the relay, which the `io` feature builds.
porter-tailnet = {path = ".", features = ["io", "persist"]}
porter-tailscale = {features = ["io"], path = "../../../porter/crates/porter-tailscale"}
porter-fake-servers = {path = "../../../porter/crates/porter-fake-servers"}
tokio = {version = "1", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"]}

[features]
# `Guests::open`: the records kept in a file the owner reads, written with porter-fs. Off by default,
# so a client that only reads the rows of a lending computer builds no file writer and no toml.
persist = ["dep:porter-fs", "dep:toml"]
# The listeners, the dial, the relay and the hello client: sockets, tokio and hyper. Off by
# default, so the judgement of who may ask and the lists of guests reach none of them.
io = [
  "dep:hyper",
  "dep:hyper-util",
  "dep:http-body-util",
  "dep:tokio",
  "porter-tailscale/io",
]

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
