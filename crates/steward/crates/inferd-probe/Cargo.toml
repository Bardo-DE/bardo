[package]
name = "inferd-probe"
description = "The port probe inferd's local-engine discovery uses: which runtime (Ollama, llama.cpp, LM Studio, another OpenAI-compatible server) answers on a loopback port, and what models it offers. Pure over the Http seam."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/steward"
publish = false

[dependencies]
porter-capability = {path = "../../../porter/crates/porter-capability"}
porter-http = {path = "../../../porter/crates/porter-http"}
porter-ids = {path = "../../../porter/crates/porter-ids"}
porter-provider = {path = "../../../porter/crates/porter-provider"}
serde_json = {version = "1"}

[dev-dependencies]
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
