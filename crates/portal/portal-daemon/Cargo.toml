[package]
name = "portal-daemon"
description = "The Bardo desktop portal backend: Screenshot, ScreenCast, RemoteDesktop, Settings and Inhibit served on the session bus for xdg-desktop-portal."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "portal_daemon"

[[bin]]
name = "bardo-portal"
path = "src/main.rs"

[features]
# `BARDO_PORTAL_DEV_CALLERS=FILE`: callers named in a person's own rows file are let in as the portal
# frontend or the shell at `Proof::Dev` (`caller-identity-dev`). Off by default; the desktop's test
# jail and the dev scripts build with it. A release build has neither the variable nor `caller-identity-dev`.
debug = ["dep:caller-identity-dev"]

[dependencies]
shell-dbus = { path = "../../shell/shell-dbus" }
portal-dbus = { path = "../portal-dbus" }
compositor-dbus = { path = "../../compositor/compositor-dbus" }
dbus-kit = { path = "../../bus/dbus-kit" }
base-clock = { path = "../../base/base-clock" }
base-fs = { path = "../../base/base-fs" }
base-time = { path = "../../base/base-time" }
base-xdg = { path = "../../base/base-xdg" }
portal-core = {path = "../portal-core"}
portal-pipewire = { path = "../portal-pipewire" }
portal-store = { path = "../portal-store" }
portal-wayland = { path = "../portal-wayland" }
thiserror = { workspace = true }
zbus = {workspace = true, features = ["tokio"]}
caller-identity-dbus = {default-features = false, features = ["tokio"], path = "../../identity/caller-identity-dbus"}
caller-identity-dev = {optional = true, path = "../../identity/caller-identity-dev"}
caller-roles = {path = "../../identity/caller-roles"}
peers-callers = {path = "../../identity/peers-callers"}
tokio = {workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "std", "env-filter"] }
rustix = {workspace = true, features = ["std", "process"]}
image = { workspace = true, features = ["png"] }

[dev-dependencies]
base-testkit = {path = "../../base/base-testkit", features = ["dbus", "tokio"]}
# `introduce` makes a test's connection stand as the frontend or the shell without looking at it.
caller-identity-dbus = {default-features = false, features = ["fake", "tokio"], path = "../../identity/caller-identity-dbus"}
tempfile = { workspace = true }

[lints]
workspace = true
