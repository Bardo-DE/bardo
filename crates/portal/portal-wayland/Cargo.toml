[package]
name = "portal-wayland"
description = "The Wayland side of the Bardo desktop portal backend: capture of a display or a window through the image-capture protocols, the connection the compositor hands the portal, and fakes for tests."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
portal-core = { path = "../portal-core" }
rustix = { workspace = true, features = ["std", "event", "fs"] }
thiserror = { workspace = true }
tracing = { workspace = true }
wayland-client = { workspace = true }
wayland-protocols = { workspace = true, features = ["client", "staging"] }

[dev-dependencies]
base-testkit = { path = "../../base/base-testkit" }

[lints]
workspace = true
