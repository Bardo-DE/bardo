# Which portal implementation answers which interface when the desktop is "bardo".
# An example: the Bardo desktop's own installer ships the file it uses (desktop/session/bardo-portals.conf,
# the same choices). Installed as share/xdg-desktop-portal/bardo-portals.conf.
[preferred]
default=bardo;gtk
org.freedesktop.impl.portal.ScreenCast=bardo
org.freedesktop.impl.portal.Screenshot=bardo
org.freedesktop.impl.portal.RemoteDesktop=bardo
org.freedesktop.impl.portal.Settings=bardo
org.freedesktop.impl.portal.Inhibit=bardo
# Screenshot and colour picking ask this first; without an Access backend the frontend does not offer them.
org.freedesktop.impl.portal.Access=bardo
# bardo-portal does not serve the file chooser; the GTK implementation does.
org.freedesktop.impl.portal.FileChooser=gtk
