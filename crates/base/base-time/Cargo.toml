[package]
name = "base-time"
description = "The time as a seam: the Clock and Monotonic traits, the system and test clocks, and UnixSeconds."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
jiff = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
# `within`'s bound: a wall-clock delay on its own timer thread, so it works under any executor.
futures-timer = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
