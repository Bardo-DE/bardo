[package]
name = "base-fs"
description = "Files a reader or a crash never sees half written: AtomicWrite replaces a file whole, AtomicFile keeps one small file with its backup; with the book feature, a document saved off the async runtime."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"], optional = true}

[features]
# `book::commit`: a document saved off the async runtime's threads. A host that keeps a document
# (the Spaces, the identity uses) names it; the default stays std only.
book = ["dep:serde", "dep:serde_json", "dep:tokio"]

[dev-dependencies]
base-testkit = {path = "../../base/base-testkit"}
tokio = {version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"]}

[lints]
workspace = true
