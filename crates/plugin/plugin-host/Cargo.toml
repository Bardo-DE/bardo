[package]
publish.workspace = true
name = "plugin-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Run plugins as separate programs: find manifests on disk, check the programs they name, and start them with process handling that contains crashes and hangs. Generic over the host's capability type."
repository.workspace = true
readme = "README.md"
keywords = ["plugin", "ipc", "subprocess", "manifest"]
categories = ["development-tools", "os"]

[dependencies]
plugin-core = { path = "../plugin-core" }
serde.workspace = true
thiserror.workspace = true

# Process groups and polling are Unix; discovery builds everywhere.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["std", "event", "process", "time"] }

[dev-dependencies]
base-testkit = { path = "../../base/base-testkit" }
plugin-fake = { path = "../plugin-fake" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
