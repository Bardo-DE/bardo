[package]
name = "chordkit"
description = "A portable keymap core: actions, chords, a resolver and display, per platform."
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Bardo-DE/chordkit"

[features]
serde = ["dep:serde"]

[dependencies]
keyboard-types = {version = "0.8", default-features = false, features = ["std"]}
serde = {version = "1", optional = true}
thiserror = {version = "2"}

[dev-dependencies]
serde_json = {version = "1"}

[lints.rust]
unsafe_code = "forbid"
