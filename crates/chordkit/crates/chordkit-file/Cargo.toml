[package]
name = "chordkit-file"
description = "A bounded reader for the foreign settings files a chordkit source reads."
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Bardo-DE/chordkit"

[dependencies]
thiserror = {version = "2"}

[target.'cfg(unix)'.dependencies]
libc = {version = "0.2"}

[lints.rust]
unsafe_code = "forbid"
