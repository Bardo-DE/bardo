[package]
name = "transom-core"
description = "The pure part of the quire desktop portal backend: the screen-cast session machine, restore tokens, the source choice, the inhibit book and the settings values. No D-Bus, no PipeWire, no Wayland."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/transom"
publish = false

[dependencies]
thiserror = {version = "2"}

[dev-dependencies]
proptest = {version = "1"}

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
